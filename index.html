are-specific control at all, so recommending it as the strongest available protection misses the actual anti-tampering purpose behind the requirement. This item is left flagged rather than corrected because it is an unscored, picture-only answer-area item with no text key a correction could change."],"source":{"title":"Security features to help protect against ransomware - Azure Backup","url":"https://learn.microsoft.com/en-us/azure/backup/backup-azure-security-feature"}},"ansimg":[{"img":"img/p049_x912.webp","w":1000,"h":252}],"e":[{"img":"img/p049_x917.webp","w":1000,"h":110}]},
{"n":55,"sec":"std","num":36,"c":"Design security solutions for infrastructure","q":"What should you include in the solution?","body":[{"p":"You have an Azure AD tenant that contains 10 Windows 11 devices and two groups named Group1 and Group2. The Windows 11 devices are joined to the Azure AD tenant and are managed by using Microsoft Intune."},{"p":"You are designing a privileged access strategy based on the rapid modernization plan (RaMP). The strategy will include the following configurations:"},{"p":"• Each user in Group1 will be assigned a Windows 11 device that will be configured as a privileged access"},{"p":"device."},{"p":"• The Security Administrator role will be mapped to the privileged access security level."},{"p":"• The users in Group1 will be assigned the Security Administrator role."},{"p":"• The users in Group2 will manage the privileged access devices."},{"p":"You need to configure the local Administrators group for each privileged access device. The solution must follow the principle of least privilege."},{"p":"What should you include in the solution?"}],"o":["Only add Group2 to the local Administrators group.","Configure Windows Local Administrator Password Solution (Windows LAPS) in legacy Microsoft LAPS emulation mode.","Add Group2 to the local Administrators group. Add the user that is assigned the Security Administrator role to the local Administrators group of the user ' s assigned privileged access device."],"a":"A","srcA":"B","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe question asks what to put in the local Administrators group of a privileged access device, and the keyed answer does not answer that question — configuring LAPS in an emulation mode sets how a password is stored, not who is a member of the group. It is also the wrong direction: Microsoft deprecated the legacy LAPS product as of Windows 11 23H2, and emulation mode exists only to ease migration from an existing legacy deployment. Under least privilege, only Group2 — the team that manages the devices — belongs in the group. The Group1 user who is assigned the device must not be a local administrator on it: that is the whole point of a privileged access device.","whyWrong":["B. Legacy Microsoft LAPS is deprecated, emulation mode is a migration aid, and neither configures group membership — which is what the question asks for.","C. Adding the assigned user to the local Administrators group of their own privileged access device breaks least privilege and defeats the purpose of the device tier."],"source":{"title":"Windows LAPS overview","url":"https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview"},"corrected":true,"originalAnswer":"B"}},
{"n":56,"sec":"std","num":37,"c":"Design security solutions for infrastructure","q":"You have a Microsoft 365 subscription that contains 1,000 users and two groups named Group1 and Group2. All the users have devices that are onboarded to Microsoft Intune and Microsoft Defender for Endpoint Group1 manages Microsoft Entra and Microsoft 365 services. Group2 manages Intune and Defender for Endpoint.","body":[{"p":"You have a Microsoft 365 subscription that contains 1,000 users and two groups named Group1 and Group2. All the users have devices that are onboarded to Microsoft Intune and Microsoft Defender for Endpoint Group1 manages Microsoft Entra and Microsoft 365 services. Group2 manages Intune and Defender for Endpoint."},{"p":"You need to recommend a solution to prevent users from connecting to Microsoft 365 services from devices that have encryption disabled."},{"p":"What should you recommend implementing for each group? To answer, select the options in the answer area."},{"p":"NOTE: Each correct answer is worth one point."},{"img":"img/p051_x954.webp","w":930,"h":295}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"A Conditional Access policy with the \"require device to be marked as compliant\" grant control is what Group1, which manages Microsoft Entra and Microsoft 365 services, would configure to actually block sign-ins from noncompliant devices; Conditional Access lives in Microsoft Entra ID, matching Group1's area of responsibility. Microsoft's own documentation for that control is explicit that it depends on a compliance policy already existing in Microsoft Intune, which is Group2's area (they manage Intune and Defender for Endpoint): a compliance policy configured to require device encryption is what actually evaluates each device and reports a noncompliant, unencrypted device's status back to Microsoft Entra ID for Conditional Access to act on.","whyWrong":["A configuration profile, an attack surface reduction rule, and an endpoint security policy in Intune can configure or harden a device, but none of them evaluates and reports a compliance verdict the way a compliance policy does, and Conditional Access’s device-compliance grant control has nothing to check without one. A sign-in or user risk policy in Identity Protection targets risk signals unrelated to device encryption state."],"source":{"title":"Conditional Access: Require compliant devices","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-all-users-device-compliance"}},"ansimg":[{"img":"img/p051_x960.webp","w":930,"h":295}],"e":[{"img":"img/p051_x948.webp","w":930,"h":156}]},
{"n":57,"sec":"std","num":38,"c":"Design security operations, identity, and compliance capabilities","q":"Which service should you recommend to complete the design?","body":[{"p":"A customer uses Azure to develop a mobile app that will be consumed by external users as shown in the following exhibit."},{"img":"img/p052_x972.webp","w":733,"h":424},{"p":"You need to design an identity strategy for the app. The solution must meet the following requirements:"},{"p":"• Enable the usage of external IDs such as Google, Facebook, and Microsoft accounts."},{"p":"• Be managed separately from the identity store of the customer."},{"p":"• Support fully customizable branding for each app."},{"p":"Which service should you recommend to complete the design?"}],"o":["Azure Active Directory (Azure AD) B2C","Azure Active Directory (Azure AD) B2B","Azure AD Connect","Azure Active Directory Domain Services (Azure AD DS)"],"a":"A","review":{"status":"OUTDATED","confidence":"HIGH","explanation":"The scenario, requirements and options all still make sense, and Azure AD B2C is still the best fit among the four choices, so the key is left as the source has it. But the product itself has a closing door: \"Effective May 1, 2025, Azure AD B2C is no longer available for purchase by new customers... Microsoft Entra External ID is the next-generation CIAM solution from Microsoft.\" A design for a brand-new customer-facing app today would specify Microsoft Entra External ID for customers, which offers the same external-identity federation, separate customer directory and per-app branding B2C did. Existing B2C tenants keep working, so this is a product-availability change rather than a feature gap, and it is exactly the kind of detail the exam may not yet reflect.","whyWrong":["B. Azure AD B2B is for inviting known partner-organization users into your own tenant, not for anonymous consumers using Google or Facebook identities.","C. Azure AD Connect synchronizes an on-premises AD DS directory to Entra ID. It has nothing to do with external consumer identities.","D. Azure AD Domain Services provides a managed, domain-joinable directory for legacy workloads; it does not support social identity providers or per-app branding."],"source":{"title":"External tenant overview - Microsoft Entra External ID (retirement of Azure AD B2C)","url":"https://learn.microsoft.com/en-us/entra/external-id/customers/overview-customers-ciam"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/active-directory-b2c/identity-provider-facebook?pivots=b2c-user-flow"},{"p":"https://docs.microsoft.com/en-us/azure/active-directory-b2c/customize-ui-with-html?pivots=b2c-user-flow"}]},
{"n":58,"sec":"std","num":39,"c":"Design security solutions for applications and data","q":"You have an Azure subscription.","body":[{"p":"You have an Azure subscription."},{"p":"You plan to deploy an Azure App Service web app named App1 that will access an external web service by using a username and password."},{"p":"You need to recommend a password storage solution for App1 that meets the following requirements:"},{"p":"• Ensures that the password is stored securely"},{"p":"• Ensures that App1 can authenticate to the service that will store the password"},{"p":"Which service should you use to store the password, and which authentication method should App1 use to access the service? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p053_x982.webp","w":875,"h":348}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Azure Key Vault is Microsoft's purpose-built secret store, meeting \"the password is stored securely.\" For \"App1 can authenticate to the service that will store the password\" with no credential of its own to manage, Microsoft's own tutorial for connecting an App Service app to Key Vault has the app authenticate using a managed identity, which needs no secret, certificate or password of its own and cannot be exfiltrated from App1's configuration the way an embedded credential could.","whyWrong":["A certificate and a group managed service account both still require a credential-like artifact to be provisioned and rotated, which a managed identity avoids entirely. A guest account is an Entra ID object for external human users, not an authentication method a web app can use to reach a secret store."],"source":{"title":"Tutorial: Use a managed identity to connect App Service to Key Vault","url":"https://learn.microsoft.com/en-us/azure/app-service/tutorial-connect-msi-key-vault"}},"ansimg":[{"img":"img/p054_x991.webp","w":875,"h":348}],"e":[{"img":"img/p054_x996.webp","w":1000,"h":143}]},
{"n":59,"sec":"std","num":40,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the strategy?","body":[{"p":"Your company is moving all on-premises workloads to Azure and Microsoft 365. You need to design a security orchestration, automation, and response (SOAR) strategy in Microsoft Sentinel that meets the following requirements:"},{"p":"• Minimizes manual intervention by security operation analysts"},{"p":"• Supports Waging alerts within Microsoft Teams channels"},{"p":"What should you include in the strategy?"}],"o":["data connectors","playbooks","workbooks","KQL"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Playbooks are Sentinel's SOAR component: automated workflows, built on Logic Apps, that run against an alert or incident. Both requirements land on them. “Respond to threats right away with minimal human involvement” is the response use case, and Microsoft's orchestration example is exactly the Teams requirement — “send a message to your security operations channel in Microsoft Teams or Slack so your security analysts know about the incident.”","whyWrong":["A. Data connectors bring data in. They are the SIEM plumbing, not the automated response.","C. Workbooks visualise data in dashboards; they take no action.","D. KQL is the query language the detections are written in, not an automation mechanism."],"source":{"title":"Automate threat response with playbooks in Microsoft Sentinel","url":"https://learn.microsoft.com/en-us/azure/sentinel/automate-responses-with-playbooks"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/sentinel/tutorial-respond-threats-playbook?tabs=LAC"}]},
{"n":60,"sec":"std","num":41,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription. The subscription contains Windows 11 devices that are protected by using Microsoft Defender XDR You need to block access to file sharing sites from the devices. The solution must meet the following requirements:","body":[{"p":"You have a Microsoft 365 subscription. The subscription contains Windows 11 devices that are protected by using Microsoft Defender XDR You need to block access to file sharing sites from the devices. The solution must meet the following requirements:"},{"p":"• Identify file sharing sites to which users have connected during the last 90 days."},{"p":"• Prevent the users from connecting to the identified file sharing sites."},{"p":"• Minimize administrative effort."},{"p":"What should you use to identify the file sharing sites, and which Microsoft Defender service should you use to prevent the users from connecting to the sites? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p055_x1009.webp","w":967,"h":317}],"review":{"status":"MANUAL_REVIEW","confidence":"HIGH","explanation":"The recorded answer for blocking the sites, Microsoft Defender for Endpoint, checks out: once Defender for Cloud Apps marks the discovered file-sharing sites as Unsanctioned, their domains sync to Defender for Endpoint as network-protection indicators, and Defender for Endpoint is the component that actually enforces the block on each device. The recorded answer for identifying the sites, also Microsoft Defender for Endpoint, does not check out: identifying which cloud and file-sharing sites users have connected to over a trailing window is Cloud Discovery, a Microsoft Defender for Cloud Apps capability. Cloud Discovery natively consumes the network traffic signal that already flows from Defender for Endpoint-onboarded devices, so it needs no separate log collector, which is exactly what \"minimize administrative effort\" is pointing to, but the product surfacing that 90-day usage report and scoring the discovered apps is Defender for Cloud Apps, not Defender for Endpoint itself.","whyWrong":["Microsoft Defender for Cloud and Microsoft Defender Vulnerability Management have no cloud-app-discovery or web-content-filtering capability at all, so neither fits either box. This item is left flagged rather than corrected because it is an unscored, picture-only answer-area item with no text key a correction could change."],"source":{"title":"Discover and manage Shadow IT","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/tutorial-shadow-it"}},"ansimg":[{"img":"img/p055_x1011.webp","w":967,"h":317}],"e":[{"img":"img/p056_x1023.webp","w":965,"h":124}]},
{"n":61,"sec":"std","num":42,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"You plan to deploy 20 Azure Kubernetes Service (AKS) clusters. The cluster configuration will be managed declaratively by using Kubernetes manifest files stored in Azure Repos."},{"p":"You need to recommend a solution to ensure that the configuration of all the clusters remains consistent by using the manifest files stored in Azure Repos."},{"p":"What should you include in the recommendation?"}],"o":["Gatekeeper","Dependency Tracker","Dependency","Flux"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Declarative configuration held in a repository and continuously reconciled onto clusters is the definition of GitOps, and in Azure the GitOps agent is Flux v2, deployed as a cluster extension on AKS and Arc-enabled Kubernetes. The Flux controllers pull the manifests from the repository and keep the cluster matching them, which is what keeps twenty clusters consistent without anyone applying anything by hand.","whyWrong":["A. Gatekeeper (used by Azure Policy for Kubernetes) admits or rejects resources against policy. It enforces rules about configuration; it does not deliver the configuration.","B and C. Dependency Tracker and Dependency are not the mechanism here; dependency scanning is about vulnerable packages in code."],"source":{"title":"GitOps with Flux v2 in Azure Arc-enabled Kubernetes and AKS","url":"https://learn.microsoft.com/en-us/azure/azure-arc/kubernetes/conceptual-gitops-flux2"}}},
{"n":62,"sec":"std","num":43,"c":"Design security solutions for infrastructure","q":"Your company has an office in Seattle.","body":[{"p":"Your company has an office in Seattle."},{"p":"The company has two Azure virtual machine scale sets hosted on different virtual networks."},{"p":"The company plans to contract developers in India."},{"p":"You need to recommend a solution provide the developers with the ability to connect to the virtual machines over SSL from the Azure portal. The solution must meet the following requirements:"},{"p":"• Prevent exposing the public IP addresses of the virtual machines."},{"p":"• Provide the ability to connect without using a VPN."},{"p":"• Minimize costs."},{"p":"Which two actions should you perform? Each correct answer presents part of the solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["Deploy Azure Bastion to one virtual network.","Deploy Azure Bastion to each virtual network.","Enable just-in-time VM access on the virtual machines.","Create a hub and spoke network by using virtual network peering.","Create NAT rules and network rules in Azure Firewall."],"a":"A D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Connecting \"over SSL from the Azure portal\" without exposing a public IP and without a VPN is Azure Bastion's whole design: it is a browser-based, TLS-tunnelled client built into the portal, and \"a public IP isn't required on the Azure VM.\" The two scale sets sit on different, presumably unpeered virtual networks, so a single Bastion instance can't reach both directly, but peering the two networks in a hub-and-spoke topology lets one Bastion deployment, in the hub, reach both, which is what keeps the cost to one Bastion host instead of two.","whyWrong":["B. Deploying Bastion to each virtual network works, but it doubles the cost of the one-Bastion-plus-peering design, which fails the requirement to minimize costs.","C. Just-in-time VM access narrows when a management port is open; it doesn't provide the portal-based SSL connection method or remove the public IP requirement by itself.","E. Azure Firewall NAT rules translate a public IP to a private one, which is the opposite of preventing public IP exposure, and does not provide a browser-based portal connection."],"source":{"title":"VNet peering and Azure Bastion architecture","url":"https://learn.microsoft.com/en-us/azure/bastion/vnet-peering"}},"e":[{"p":"https://docs.microsoft.com/en-us/learn/modules/connect-vm-with-azure-bastion/2-what-is-azure-bastion"}]},
{"n":63,"sec":"std","num":44,"c":"Design security solutions for applications and data","q":"You plan to deploy an Azure API Management solution that will enable different groups of developers to access different sets of APIs at random times and rates.","body":[{"p":"You plan to deploy an Azure API Management solution that will enable different groups of developers to access different sets of APIs at random times and rates."},{"p":"You need to recommend the pricing tier that should be purchased and the scope at which the rate limit policies should be applied. The solution must meet the following requirements:"},{"p":"• Ensure that each group of developers can access only specific sets of APIs."},{"p":"• Ensure that each set of APIs can be configured with specific rate limits."},{"p":"• Minimize development and administrative effort and costs."},{"p":"What should you recommend? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p057_x1039.webp","w":881,"h":336}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Microsoft's own tier-comparison table rules out the Consumption tier here: the developer portal, along with its \"related functionality such as users, groups, issues, applications,\" is unavailable on Consumption, and that portal (with its Groups feature controlling which developers see which Products) is how \"different groups of developers can access only specific sets of APIs\" is actually administered day to day. Standard v2 keeps that portal along with everything else the scenario needs. For the scope, the rate-limit policy's documented scopes are product, API, and operation; scoping it to a Product, the construct that bundles a specific set of APIs behind one subscription, is what lets \"each set of APIs be configured with specific rate limits\" per developer group, rather than repeating the same limit on every API individually.","whyWrong":["Consumption would minimize cost but, lacking the developer portal and its groups/applications management, would raise the exact administrative effort the requirement asks to minimize. Scoping the policy to an individual API rather than a Product would need the limit repeated per API instead of once per bundled set, and Workspace is an organizational container for APIM itself, not a rate-limit scope tied to a set of APIs."],"source":{"title":"Feature-based comparison of the Azure API Management tiers","url":"https://learn.microsoft.com/en-us/azure/api-management/api-management-features"}},"ansimg":[{"img":"img/p058_x1048.webp","w":881,"h":336}],"e":[{"img":"img/p058_x1053.webp","w":751,"h":146}]},
{"n":64,"sec":"std","num":45,"c":"Design security solutions for applications and data","q":"You have an Azure subscription.","body":[{"p":"You have an Azure subscription."},{"p":"You plan to implement Azure Synapse Analytics SQL dedicated pools and SQL serverless pools."},{"p":"You need to recommend a solution to provide additional encryption-at-rest security for each type of pool. The solution must use customer-managed keys, whenever possible."},{"p":"What should you recommend for each pool type? To answer, drag the appropriate recommendations to the correct pool types. Each recommendation may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p059_x1072.webp","w":674,"h":222}],"boxes":[{"label":"Serverless SQL pool","value":"Azure Storage infrastructure encryption and Microsoft-managed keys"},{"label":"Dedicated SQL pool","value":"Transparent Data Encryption (TDE) and customer-managed keys"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The two pool types sit on genuinely different storage engines, which is why the requirement's \"customer-managed keys whenever possible\" resolves differently for each. Serverless SQL pool queries data directly in Azure Data Lake Storage or Blob Storage and \"relies on Azure Storage encryption technologies for data protection,\" with no TDE layer of its own; that storage-level infrastructure encryption is Microsoft-managed, so a Microsoft-managed key is what's actually available, not a shortfall in the design. Dedicated SQL pool has its own database engine, and there \"transparent data encryption (TDE) with customer-managed key enables a Bring Your Own Key (BYOK) scenario,\" so a customer-managed key genuinely is possible and therefore required by the stated policy.","whyWrong":["Recommending TDE for the serverless pool would be recommending a layer that pool doesn’t have; it has no database engine of its own to apply TDE to.","Recommending Microsoft-managed keys for the dedicated pool would violate “customer-managed whenever possible,” since customer-managed TDE keys are exactly what’s documented as available there."],"source":{"title":"Azure Synapse Analytics encryption (serverless vs. dedicated SQL pool)","url":"https://learn.microsoft.com/en-us/azure/synapse-analytics/security/workspaces-encryption"}},"ansimg":[{"img":"img/p059_x1074.webp","w":674,"h":222}],"e":[{"img":"img/p059_x1066.webp","w":670,"h":130}]},
{"n":65,"sec":"std","num":46,"c":"Design solutions that align with security best practices and priorities","q":"What should you recommend doing first?","body":[{"p":"You design cloud-based software as a service (SaaS) solutions."},{"p":"You need to recommend ransomware attacks. The solution must follow Microsoft Security Best Practices."},{"p":"What should you recommend doing first?"}],"o":["Implement data protection.","Develop a privileged access strategy.","Prepare a recovery plan.","Develop a privileged identity strategy."],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Microsoft's ransomware series is explicitly ordered, and the first article states its purpose in its opening line: \"Always prepare a ransomware attack recovery plan, starting with an alternative to ransom payment.\" The three-part list that follows confirms the order: \"Have a recovery plan\", then \"A plan to limit the harm done\", then \"Make it hard to get in\". A recovery plan is priority one precisely so an organization is never forced to pay because it has no other way back to its data.","whyWrong":["A. Data protection controls like Protected Folders belong to the recovery-plan phase's supporting detail, but the plan itself, and specifically immutable, tested backups, is what phase 1 leads with.","B. A privileged access strategy is phase 2 work, limiting how far an attacker can move once they are in.","D. A privileged identity strategy is also phase 2 territory, after the recovery plan is in place."],"source":{"title":"Prepare for ransomware attacks with a backup and recovery plan (Phase 1)","url":"https://learn.microsoft.com/en-us/security/ransomware/protect-against-ransomware-phase1"}}},
{"n":66,"sec":"std","num":47,"c":"Design security operations, identity, and compliance capabilities","q":"Does this meet the goal?","body":[{"p":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem."},{"p":"After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen."},{"p":"You have a Microsoft 365 subscription that uses Microsoft Defender XDR. The subscription contains 500 devices that are enrolled in Microsoft Intune. The subscription contains 500 users that connect to external software as a service (SaaS) apps by using the devices."},{"p":"You need to implement a solution that meets the following requirements:"},{"p":"• Allows user access to SaaS apps that Microsoft has identified as low risk."},{"p":"• Blocks user access to Saas apps that Microsoft has identified as high risk."},{"p":"Solution: From Microsoft Defender for Cloud Apps, you configure a cloud discovery policy and unsanction risky apps."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Yes. Cloud Discovery is the half of Defender for Cloud Apps that scores apps, ranking more than 31,000 catalogued cloud apps against roughly 90 risk factors, which is where \"Microsoft has identified as high risk\" comes from. A cloud discovery policy can flag apps by risk score, and tagging an app Unsanctioned is what enforces the block: with the Defender for Endpoint integration turned on, network protection stops users on those devices from reaching unsanctioned apps, while apps left sanctioned or untagged stay reachable. Discovery supplies the risk score, the tag supplies the decision, and Defender for Endpoint supplies the enforcement.","source":{"title":"Govern discovered apps using Microsoft Defender for Endpoint","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/mde-govern"}}},
{"n":67,"sec":"std","num":48,"c":"Design security solutions for infrastructure","q":"You have two on-premises servers named Server! and Server2 that run Windows Server. Server1 contains an app named App1 and is isolated from the internet.","body":[{"p":"You have two on-premises servers named Server! and Server2 that run Windows Server. Server1 contains an app named App1 and is isolated from the internet."},{"p":"You have a Microsoft Entra tenant"},{"p":"You plan to deploy Global Secure Access to provide remote access to App1."},{"p":"You need to configure the tenant and Server2 to support the planned deployment. The solution must ensure that when users attempt to access App1, they must authenticate by using their Microsoft Entra credentials."},{"p":"What should you create in the tenant, and what should you install on Server2? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p061_x1096.webp","w":805,"h":313}],"boxes":[{"label":"Tenant","value":"An enterprise application"},{"label":"Server2","value":"Microsoft Entra private network connector"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Publishing App1 through Global Secure Access Private Access creates an object in the tenant that functions as an enterprise application, the container that Conditional Access and the connector group attach to, and it is what makes \"users must authenticate by using their Microsoft Entra credentials\" enforceable before the session ever reaches App1. Server1 hosts App1 and is isolated from the internet, so it cannot make the outbound connection to the Global Secure Access service itself; that job falls to Server2, which needs the Microsoft Entra private network connector installed so it can broker the outbound connection between the service and App1 on Server1's behalf.","whyWrong":["An access package, an app registration, and a managed identity are all real Entra objects, but none of them is what a Global Secure Access Private Access application manifests as, or what Conditional Access attaches to for this scenario.","The Azure Connected Machine agent onboards a server to Azure Arc, an unrelated hybrid-management scenario. Microsoft Entra Connect Sync synchronizes on-premises AD DS to Entra ID, which has nothing to do with brokering Global Secure Access traffic to an isolated server."],"source":{"title":"Configure per-app access for Microsoft Entra Private Access","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-per-app-access"}},"ansimg":[{"img":"img/p061_x1098.webp","w":805,"h":313}],"e":[{"img":"img/p062_x1107.webp","w":790,"h":155}]},
{"n":68,"sec":"std","num":49,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription.","body":[{"p":"You have a Microsoft 365 subscription."},{"p":"You configure Microsoft Purview Information Protection to apply sensitivity labels automatically."},{"p":"You need to recommend a solution that will prevent users from uploading unlabeled files to Microsoft SharePoint Online if the files contain content defined by Microsoft Purview classifiers as sensitive."},{"p":"What should you include in the recommendation? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p062_x1113.webp","w":938,"h":345}],"review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"This item's own exhibit does not correspond to its question. Both the question's exhibit and its answer exhibit show a \"Policy type\" drop-down of App control policy / App protection policy / Compliance policy and a \"Microsoft 365 service\" drop-down of Endpoint DLP / Defender for Cloud Apps / Defender for Endpoint / Purview insider risk management, all Intune device-management and endpoint-monitoring concepts with no connection to \"prevent users from uploading unlabeled files to SharePoint Online if the files contain sensitive content.\" This looks like a mismatched exhibit in the source dump itself, most likely paired with the wrong question during the PDF's own production, so there is no key here that can be checked against the question as written. For what it is worth, Microsoft's own Defender for Cloud Apps documentation describes exactly the scenario this question actually asks about: \"Defender for Cloud Apps can ensure that the upload of unlabeled files that have sensitive content is blocked until the user classifies the content,\" enforced through a Conditional Access App Control session policy, which is a different pairing of concepts entirely than what this item's own broken exhibit offers as choices.","whyWrong":["None of this item’s own recorded options (App control/App protection/Compliance policy; Endpoint DLP/Defender for Cloud Apps/Defender for Endpoint/Purview insider risk management) can be scored as right or wrong against the actual question, since the exhibit itself appears to belong to a different item."],"source":{"title":"Commonly used information protection policies","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/policies-information-protection"}},"ansimg":[{"img":"img/p063_x1122.webp","w":938,"h":345}],"e":[{"img":"img/p063_x1127.webp","w":911,"h":161}]},
{"n":69,"sec":"std","num":50,"c":"Design security solutions for infrastructure","q":"You have a Microsoft 365 tenant.","body":[{"p":"You have a Microsoft 365 tenant."},{"p":"You need to recommend a Microsoft 365 Defender solution to enhance security for the tenant. The solution must meet the following requirements:"},{"p":"• Identify users that are downloading an unusually high number of files from Microsoft SharePoint Online"},{"p":"sites and are possibly involved in a data exfiltration attempt."},{"p":"• Block Microsoft Teams messages that contain potentially malicious content by using zero-hour auto purge"},{"p":"(ZAP)."},{"p":"What should you recommend for each requirement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p064_x1146.webp","w":822,"h":274}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Microsoft Defender for Cloud Apps' built-in anomaly detection policies include unusual multiple file-download activity, which is exactly what flags \"users downloading an unusually high number of files from SharePoint Online... possibly involved in a data exfiltration attempt.\" For blocking malicious Teams messages using zero-hour auto purge, Microsoft's own documentation places ZAP for Microsoft Teams within Defender for Office 365, which retroactively detects and purges malicious chat messages after delivery, matching the requirement precisely.","whyWrong":["Defender for Endpoint and Defender for Identity have no SharePoint file-activity anomaly detection or Teams message-purging capability; those are, respectively, a Cloud Apps and an Office 365 capability."],"source":{"title":"Built-in anomaly detection policies - Microsoft Defender for Cloud Apps","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy"}},"ansimg":[{"img":"img/p064_x1148.webp","w":822,"h":274}],"e":[{"img":"img/p064_x1140.webp","w":805,"h":141}]},
{"n":70,"sec":"std","num":51,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"You have an on-premises server that runs Windows Server and contains a Microsoft SQL Server database named DB1."},{"p":"You plan to migrate DB1 to Azure."},{"p":"You need to recommend an encrypted Azure database solution that meets the following requirements:"},{"p":"• Minimizes the risks of malware that uses elevated privileges to access sensitive data"},{"p":"• Prevents database administrators from accessing sensitive data"},{"p":"• Enables pattern matching for server-side database operations"},{"p":"• Supports Microsoft Azure Attestation"},{"p":"• Uses hardware-based encryption"},{"p":"What should you include in the recommendation?"}],"o":["SQL Server on Azure Virtual Machines with virtualization-based security (VBS) enclaves","Azure SQL Database with virtualization-based security (VBS) enclaves","Azure SQL Managed Instance that has Always Encrypted configured","Azure SQL Database with Intel Software Guard Extensions (Intel SGX) enclaves"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Work through the requirements and only one option survives. Pattern matching on encrypted columns server-side needs Always Encrypted with secure enclaves, which rules out plain Always Encrypted. Of the two enclave technologies, Intel SGX is the hardware-based one and is the type used by Azure SQL Database with attestation through Microsoft Azure Attestation; VBS enclaves are virtualization-based, that is, software. Hardware-based encryption plus Azure Attestation therefore points at SGX. The enclave is also what keeps the DBA and privileged malware out: the plaintext only ever exists inside it.","whyWrong":["A. SQL Server on Azure VMs with VBS enclaves is IaaS and the enclave is software-based, failing the hardware requirement.","B. Azure SQL Database with VBS enclaves meets most requirements but again is not hardware-based.","C. Azure SQL Managed Instance with Always Encrypted but no enclave cannot do the server-side pattern matching."],"source":{"title":"Always Encrypted with secure enclaves","url":"https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves"}}},
{"n":71,"sec":"std","num":52,"c":"Design security solutions for infrastructure","q":"You need to recommend a solution to discover which virtual machines are internet-facing. What should you include in the recommendation?","body":[{"p":"You have an Azure subscription that contains 100 virtual machines. The virtual machines run either Linux or Windows Server."},{"p":"You need to recommend a solution to discover which virtual machines are internet-facing. What should you include in the recommendation?"}],"o":["Azure Network Watcher","Microsoft Defender for Cloud","Microsoft Defender for Cloud Apps","Microsoft Sentinel"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Defender for Cloud already knows which of your machines face the internet: it evaluates network exposure as part of its posture assessment and raises recommendations such as internet-facing virtual machines should be protected with network security groups, and surfaces internet exposure as a risk factor in attack paths and the cloud security explorer. That inventory arrives with no agent work beyond onboarding, across Linux and Windows alike.","whyWrong":["A. Network Watcher diagnoses connectivity and captures traffic for a resource you already suspect. It does not inventory exposure across a subscription.","C. Defender for Cloud Apps covers SaaS usage, not Azure virtual machines.","D. Sentinel could be queried for this, but it is a SIEM you would first have to feed and write queries against. The posture tool already answers it."],"source":{"title":"Secure score in Microsoft Defender for Cloud (security controls table)","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls"}}},
{"n":72,"sec":"std","num":53,"c":"Design security operations, identity, and compliance capabilities","q":"Your company has two offices named Office1 and Office2. The offices contain 1,000 on-premises Windows 11 devices that are Microsoft Entra joined.","body":[{"p":"Your company has two offices named Office1 and Office2. The offices contain 1,000 on-premises Windows 11 devices that are Microsoft Entra joined."},{"p":"You have a Microsoft 365 subscription and use Microsoft Intune."},{"p":"You plan to deploy Microsoft Entra Internet Access from the offices to Microsoft 365."},{"p":"You enable the Microsoft 365 profile and configure the following:"},{"p":"• A traffic policy for all Microsoft 365 traffic"},{"p":"• A linked Conditional Access policy that has the following configurations:"},{"p":"° Applies to all users"},{"p":"° Performs compliant network checks"},{"p":"o Allows Microsoft 365 traffic from compliant devices"},{"p":"• An assignment to all devices"},{"p":"• An assignment to the remote network associated with Office1"},{"p":"You deploy the Global Secure Access client to all the devices in Office2 and establish connections."},{"p":"Which users can access Microsoft 365 services from compliant devices, and which users are blocket1 from accessing Microsoft 365 services when using noncompliar devices? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p066_x1170.webp","w":817,"h":251}],"review":{"status":"MANUAL_REVIEW","confidence":"HIGH","explanation":"The recorded answer for compliant devices, Office1 and Office2, checks out, but not for the reason it might appear to: Microsoft's own documented known limitation states that \"Microsoft traffic is accessible through remote network connectivity without the Global Secure Access Client; however, the Conditional Access policy isn't enforced—Conditional Access policies... are only enforced when a user has the Global Secure Access client.\" Office1 only has the remote-network assignment (no client), so its Microsoft 365 traffic passes through Global Secure Access but the linked Conditional Access compliant-network policy is never actually enforced there, meaning nothing blocks any device, compliant or not. Office2 has the client, where Conditional Access is enforced, so a compliant device there is correctly granted access by the policy. Both offices' compliant devices reach Microsoft 365 either way, which is why that box is right. The recorded answer for noncompliant devices, Office1 only, is backwards given that same documented limitation: since Conditional Access is not enforced at Office1 at all, a noncompliant device there is not blocked by this policy either; it is Office2, where the policy is actually enforced, that blocks a noncompliant device from accessing Microsoft 365.","whyWrong":["Assuming the office with only remote-network connectivity (Office1) is where noncompliant devices get blocked has it backwards: Microsoft’s documented limitation is that Conditional Access enforcement for Global Secure Access Microsoft traffic requires the client, which only Office2 has. This item is left flagged rather than corrected because it is an unscored, picture-only answer-area item with no text key a correction could change."],"source":{"title":"Known limitations for Global Secure Access","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/reference-current-known-limitations"}},"ansimg":[{"img":"img/p067_x1180.webp","w":817,"h":251}],"e":[{"img":"img/p067_x1185.webp","w":892,"h":177}]},
{"n":73,"sec":"std","num":54,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription."},{"p":"You have a DNS domain named contoso.com that is hosted by a third-party DNS registrar."},{"p":"Developers use Azure DevOps to deploy web apps to App Service Environments- When a new app is deployed, a CNAME record for the app is registered in contoso.com."},{"p":"You need to recommend a solution to secure the DNS record tor each web app. The solution must meet the following requirements:"},{"p":"• Ensure that when an app is deleted, the CNAME record for the app is removed also"},{"p":"• Minimize administrative effort."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Defender for DevOps","Microsoft Defender foe App Service","Microsoft Defender for Cloud Apps","Microsoft Defender for DNS"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Dangling DNS detection is a named capability of Microsoft Defender for App Service: it alerts when an App Service site is decommissioned and its custom domain (the CNAME) is left behind, which is exactly the subdomain-takeover risk the question describes. The trap here is matching the word 'DNS' in the question to the product with 'DNS' in its name.","whyWrong":["A. Defender for DevOps covers the pipeline and repositories, not published DNS records.","C. Defender for Cloud Apps is a CASB for SaaS usage.","D. Defender for DNS watches Azure resources for malicious DNS resolution — command-and-control, data exfiltration by DNS — not the lifecycle of a web app's CNAME record."],"source":{"title":"Microsoft Defender for App Service — Dangling DNS detection","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-app-service-introduction"}}},
{"n":74,"sec":"std","num":55,"c":"Design solutions that align with security best practices and priorities","q":"Does this meet the goal?","body":[{"p":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem."},{"p":"After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen."},{"p":"You have a Microsoft 365 subscription that uses Microsoft Defender XDR. The subscription contains 500 devices that are enrolled in Microsoft Intune. The subscription contains 500 users that connect to external software as a service (SaaS) apps by using the devices."},{"p":"You need to implement a solution that meets the following requirements:"},{"p":"• Allows user access to SaaS apps that Microsoft has identified as low risk."},{"p":"• Blocks user access to Saas apps that Microsoft has identified as high risk."},{"p":"Solution: From Microsoft Defender for Cloud Apps, you configure SaaS security posture management (SSPM) and create an access policy."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","srcA":"A","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nNo. SSPM answers a different question from the one in the stem. It \"offers detailed visibility into the security state of your software as a service (SaaS) applications\" by assessing their configuration against benchmarks, and Microsoft states the precondition plainly: those recommendations appear only \"after you connect the SaaS application by using an app connector\". So SSPM looks at apps you have already adopted and wired up, tells you their settings are weak, and recommends fixes. It does not enumerate the shadow-IT apps users have found for themselves, it does not carry Microsoft's catalogue risk score, and it blocks nothing. Access policies are also the wrong lever: they run through Conditional Access App Control, which you configure per app for apps you sanction, not as a sweep against every high-risk app on the internet. The solution that does meet the goal is the one in Standalone 47.","whyWrong":["A. Yes is not defensible: SSPM assesses connected apps and produces recommendations, and neither half of the stated requirement, identifying high-risk apps or blocking them, is something it does."],"source":{"title":"SaaS Security Posture Management (SSPM) in Microsoft Defender for Cloud Apps","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/posture-overview"},"corrected":true,"originalAnswer":"A"}},
{"n":75,"sec":"std","num":56,"c":"Design security solutions for applications and data","q":"Your company is developing a modern application that will run as an Azure App Service web app. You plan to perform threat modeling to identify potential security issues by using the Microsoft Threat Modeling Tool. Which type of diagram should you create?","body":[{"p":"Your company is developing a modern application that will run as an Azure App Service web app. You plan to perform threat modeling to identify potential security issues by using the Microsoft Threat Modeling Tool. Which type of diagram should you create?"}],"o":["data flow","system flow","process flow","network flow"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The Threat Modeling Tool works from a data flow diagram, and Microsoft's walkthrough says so in as many words: a user drawn as an outside entity, a web server as a process, a database as two parallel lines, and then \"what Ricardo just showed Cristina is a DFD, short for Data Flow Diagram\". The tool adds trust boundaries as red dotted lines and generates threats from where data crosses them, using STRIDE. Data flows and trust boundaries are what produce threats, which is why this diagram type and no other.","whyWrong":["B, C and D. System flow, process flow and network flow diagrams are not what the tool builds. Its stencils, its trust boundaries and its STRIDE analysis are all defined in terms of data flow diagram elements."],"source":{"title":"Getting started with the Microsoft Threat Modeling Tool","url":"https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-getting-started"}},"e":[{"p":"https://docs.microsoft.com/en-us/learn/modules/tm-create-a-threat-model-using-foundational-data-flow- diagram- el ements/1b-elements"},{"p":"https://docs.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-getting-started?source=rec ommendations"}]},
{"n":76,"sec":"std","num":57,"c":"Design security solutions for infrastructure","q":"You have a Microsoft 365 E5 subscription and an Azure subscripts You need to evaluate the existing environment to increase the overall security posture for the following components:","body":[{"p":"You have a Microsoft 365 E5 subscription and an Azure subscripts You need to evaluate the existing environment to increase the overall security posture for the following components:"},{"p":"• Windows 11 devices managed by Microsoft Intune"},{"p":"• Azure Storage accounts"},{"p":"• Azure virtual machines"},{"p":"What should you use to evaluate the components? To answer, select the appropriate options in the answer area."},{"img":"img/p069_x1208.webp","w":532,"h":448}],"boxes":[{"label":"Windows 11 devices","value":"Microsoft 365 Defender (Microsoft Defender for Endpoint)"},{"label":"Azure virtual machines","value":"Microsoft Defender for Cloud"},{"label":"Azure Storage accounts","value":"Microsoft Defender for Cloud"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Each component has one Microsoft product built to evaluate its posture. Windows 11 devices managed by Intune are endpoint posture, which is Microsoft Defender for Endpoint, delivered and reported through Microsoft 365 Defender. Azure virtual machines and Azure Storage accounts are both Azure resources, and Defender for Cloud's cloud security posture management is what assesses resource configuration and workload protection for both compute and storage in Azure, regardless of resource type, which is why the same answer, Microsoft Defender for Cloud, correctly applies to both boxes.","whyWrong":["Microsoft 365 compliance center covers information protection and compliance workflows, not device or Azure-resource security posture.","Microsoft Sentinel is a SIEM for analyzing collected events; it is not the posture-assessment tool for any of these three components on its own."],"source":{"title":"What is Microsoft Defender for Endpoint?","url":"https://learn.microsoft.com/en-us/defender-endpoint/microsoft-defender-endpoint"}},"ansimg":[{"img":"img/p070_x1221.webp","w":532,"h":448}],"e":[{"p":"Selection 1: Microsoft 365 Defender (Microsoft Defender for Endpoint is part of it)."},{"p":"Selection 2: Microsoft Defender for Cloud."},{"p":"Selection 3: Microsoft Defender for Cloud."},{"p":"https://docs.microsoft.com/en-us/learn/modules/design-strategy-for-secure-paas-iaas-saas-services/8-specify- securi ty-requirements-for-storage-workloads"}]},
{"n":77,"sec":"std","num":58,"c":"Design security solutions for infrastructure","q":"You have a Microsoft 365 E5 subscription. The subscription contains 1,000 devices that run Windows 11 Pro and are enrolled in Microsoft Intune. You need to recommend a Microsoft Defender for Cloud Apps solution that meets the following requirements:","body":[{"p":"You have a Microsoft 365 E5 subscription. The subscription contains 1,000 devices that run Windows 11 Pro and are enrolled in Microsoft Intune. You need to recommend a Microsoft Defender for Cloud Apps solution that meets the following requirements:"},{"p":"• When a user downloads a file from Microsoft SharePoint Online, a label must be applied to the file in real"},{"p":"time based on the file ' s contents."},{"p":"• Only users that use Intune-compliant devices must be able to sign in to Dropbox."},{"p":"Which type of policy should you recommend for each requirement? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p071_x1239.webp","w":842,"h":249}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"A file policy in Defender for Cloud Apps scans file content in a connected app and can trigger a governance action, including applying a sensitivity label, based on what the content is found to contain, matching \"a label must be applied to the file in real time based on the file's contents.\" Whether a user is let in to Dropbox in the first place based on their device's Intune-compliance state is a sign-in-time gate, which is what an access policy governs; a session policy, by contrast, controls what an already-signed-in user is allowed to do inside the session (block a download, apply a watermark), not whether the sign-in itself succeeds.","whyWrong":["An activity policy alerts on or acts on things a user already did inside a session; it does not label files based on content as they are downloaded, and it does not gate sign-in. An OAuth app policy governs third-party app permissions granted via consent, unrelated to gating human sign-in by device compliance."],"source":{"title":"Information protection policies - Microsoft Defender for Cloud Apps","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/data-protection-policies"}},"ansimg":[{"img":"img/p071_x1245.webp","w":842,"h":249}],"e":[{"img":"img/p071_x1233.webp","w":842,"h":137}]},
{"n":78,"sec":"std","num":59,"c":"Design solutions that align with security best practices and priorities","q":"You need to recommend a security methodology for a DevOps development process based on the Microsoft Cloud Adoption Framework for Azure.","body":[{"p":"You need to recommend a security methodology for a DevOps development process based on the Microsoft Cloud Adoption Framework for Azure."},{"p":"During which stage of a continuous integration and continuous deployment (CI/CD) DevOps process should each security-related task be performed? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point"},{"img":"img/p072_x1257.webp","w":1000,"h":467}],"boxes":[{"label":"Threat modeling","value":"Plan and develop"},{"label":"Actionable intelligence","value":"Operate"},{"label":"Dynamic application security testing (DAST)","value":"Build and test"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Threat modeling identifies design-time risks before code is written, which places it in Plan and develop; it is the same design-phase placement this project has already confirmed for Microsoft's SDL. Dynamic application security testing exercises a running, deployed build to find runtime issues, which is Build and test, the same phase DAST occupies in Microsoft's own SDL guidance. Actionable intelligence, threat and telemetry data that feeds back from a live environment to inform ongoing defense, belongs to Operate, the phase where a shipped system is running and being monitored.","whyWrong":["Placing any of these three in Commit the code or Go to production would separate them from the activity they actually describe: threat modeling has no code to commit yet, DAST needs a deployed target to test rather than a production release, and actionable intelligence has no meaning before something is live to generate telemetry from."],"source":{"title":"DevOps security considerations overview - Cloud Adoption Framework","url":"https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/considerations/security-considerations-overview"}},"ansimg":[{"img":"img/p072_x1263.webp","w":1000,"h":467}],"e":[{"img":"img/p073_x1272.webp","w":1000,"h":180}]},
{"n":79,"sec":"std","num":60,"c":"Design security operations, identity, and compliance capabilities","q":"What should you recommend?","body":[{"p":"Your on-premises network contains an Active Directory Domain Services (AD DS) domain. The domain contains 500 Windows 11 devices."},{"p":"You have a Microsoft 365 subscription and an Azure subscription."},{"p":"You have a Microsoft Entra tenant that syncs with the domain and is linked to the subscriptions. The devices are Microsoft Entra hybrid joined."},{"p":"You plan to deploy a solution to mitigate attacks against privileged accounts. The solution will include Microsoft Sentinel rules that will detect attempts to use fake cached credentials."},{"p":"You need to recommend a solution to create the fake cached credentials on client computers."},{"p":"What should you recommend?"}],"o":["User and Entity Behavior Analytics (UEBA) in Microsoft Sentinel","a deception rule in Microsoft Defender for Endpoint","a Honeytoken tag in Microsoft Defender for Identity","a user risk policy in Microsoft Entra ID Protection"],"a":"C","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged: the key looks wrong but the documentation that would settle it has been retired. The requirement is to plant fake cached credentials on client computers. That is the deception capability, whose lures are fake content — documents, configuration files, cached credentials — planted on specific devices, and which is delivered through Defender for Endpoint (option B). A Defender for Identity honeytoken tag does something different: it marks an existing account as a decoy so any authentication to it alerts, and it plants nothing on any endpoint. That distinction is what Standalone 143 tests correctly. Microsoft's deception articles now redirect to the attack-disruption page, so no citable source establishes it and the source's key is left alone."}},
{"n":80,"sec":"std","num":61,"c":"Design solutions that align with security best practices and priorities","q":"Does this meet the goal?","body":[{"p":"Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution."},{"p":"After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen."},{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled."},{"p":"You are evaluating the Azure Security Benchmark V3 report."},{"p":"In the Secure management ports controls, you discover that you have 0 out of a potential 8 points."},{"p":"You need to recommend configurations to increase the score of the Secure management ports controls."},{"p":"Solution: You recommend enabling the VMAccess extension on all virtual machines."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"No. The VMAccess extension is an operations tool: it resets a local administrator password, resets the SSH key or configuration, and can add a user to a VM that has become unreachable. It opens nothing, closes nothing, and appears in no recommendation under Secure management ports. The recommendations in that control are about closing management ports, protecting internet-facing VMs with network security groups, and gating RDP and SSH with just-in-time access, which opens the port only for an approved user, from an approved source IP, for a limited time.","source":{"title":"Just-in-time machine access in Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3-privileged-access#pa-2- avoid-standin g-access-for-user-ac counts-and-permissions"},{"p":"Adaptive Network Hardening: https://docs.microsoft.com /en-us/security/benchmark/ azure/security-controls- v3-network-security#ns-7-simplify-network-security-configuration"}]},
{"n":81,"sec":"std","num":62,"c":"Design security solutions for applications and data","q":"You have a Microsoft Entra tenant named contoso.com. You have 30 Azure subscriptions that are linked to contoso.com. The tenant contains the management groups shown in the following table.","body":[{"p":"You have a Microsoft Entra tenant named contoso.com. You have 30 Azure subscriptions that are linked to contoso.com. The tenant contains the management groups shown in the following table."},{"img":"img/p074_x1288.webp","w":280,"h":82},{"p":"You need to design a governance solution to manage access to all the Azure Storage accounts across the subscriptions. The solution must meet the following requirements:"},{"p":"• Use custom role-based access control (RBAQ to provide granular access to control plane and data plane"},{"p":"operations."},{"p":"• Minimize administrative effort."},{"p":"At which scope should you assign the roles, and what is the minimum number of assignments per role? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p075_x1307.webp","w":1000,"h":255}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"With all 30 subscriptions split exactly between two management groups (Mgmt1 and Mgmt2, 15 subscriptions each, per the exhibit's own table), assigning the custom role once at each of those two management groups reaches every Storage account in scope with only two assignments. Assigning once at the tenant root management group would technically also reach every subscription with a single assignment, but Microsoft's own Azure RBAC best practices explicitly warn to \"avoid assigning broader roles at broader scopes even if it initially seems more convenient,\" since a root-scope assignment propagates to everything under it, including any subscription or management group added later outside of Mgmt1 and Mgmt2 -- the opposite of the \"granular access\" the requirement calls for. Two assignments, one at each of the two management groups that actually contain the target subscriptions, is the minimum that stays within that granularity.","whyWrong":["A single assignment at the tenant root minimizes the assignment count, but only by trading away the granularity the requirement explicitly asks for, since it would also grant the role over any future management group or subscription created directly under root."],"source":{"title":"Best practices for Azure RBAC","url":"https://learn.microsoft.com/en-us/azure/role-based-access-control/best-practices"}},"ansimg":[{"img":"img/p075_x1309.webp","w":1000,"h":255}],"e":[{"img":"img/p075_x1301.webp","w":1000,"h":174}]},
{"n":82,"sec":"std","num":63,"c":"Design security operations, identity, and compliance capabilities","q":"Solution: From the Microsoft Defender portal, you set Web content filtering to On and create a web content filtering policy. Does this meet the goal?","body":[{"p":"You have a Microsoft 365 subscription that uses Microsoft Defender XDR. The subscription contains 500 devices that are enrolled in Microsoft Intune. The subscription contains 500 users that connect to external software as a service (SaaS) apps by using the devices."},{"p":"You need to implement a solution that meets the following requirements:"},{"p":"• Allows user access to SaaS apps that Microsoft has identified as low risk"},{"p":"• Blocks user access to Saas apps that Microsoft has identified as high risk"},{"p":"Solution: From the Microsoft Defender portal, you set Web content filtering to On and create a web content filtering policy. Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"No, and it is a close-looking miss. Web content filtering in Defender for Endpoint does block sites on managed devices, but it decides what to block by content category (adult content, gambling, and so on), which is what Standalone 83 tests. The requirement here is to allow or block by Microsoft's risk assessment of the app, and there is no category called \"high risk\". The mechanism that does read the risk score is unsanctioning an app in Defender for Cloud Apps, which then blocks it through the same Defender for Endpoint network protection plumbing. Same enforcement engine, different decision input.","whyWrong":["A. Yes would require a category-based policy to know Microsoft’s app risk score, and it does not."],"source":{"title":"Govern discovered apps using Microsoft Defender for Endpoint","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/mde-govern"}}},
{"n":83,"sec":"std","num":64,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include m the recommendation?","body":[{"p":"You have an Azure subscription that contains a Microsoft Sentinel workspace."},{"p":"Your on-premises network contains firewalls that support forwarding event logs m the Common Event Format (CEF). There is no built-in Microsoft Sentinel connector for the firewalls"},{"p":"You need to recommend a solution to ingest events from the firewalls into Microsoft Sentinel."},{"p":"What should you include m the recommendation?"}],"o":["an Azure logic app","an on-premises Syslog server","an on-premises data gateway","Azure Data Factory"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"There is no direct path from an arbitrary firewall into Sentinel, so you put a collector in between. Microsoft's documented pattern is a Linux machine running a syslog daemon (rsyslog or syslog-ng) that the appliances forward CEF messages to; the Azure Monitor Agent on that machine parses them and sends them to the workspace as CommonSecurityLog. The absence of a built-in connector for this particular firewall is exactly why the generic CEF-over-Syslog path exists.","whyWrong":["A. A logic app automates a response to an incident. It is not a log ingestion path for on-premises appliances.","C. The on-premises data gateway bridges Power BI, Logic Apps and Power Automate to on-premises data sources. It does not collect syslog.","D. Data Factory moves data for analytics pipelines, not security event streams into a SIEM."],"source":{"title":"Ingest syslog and CEF messages to Microsoft Sentinel with the Azure Monitor Agent","url":"https://learn.microsoft.com/en-us/azure/sentinel/connect-cef-syslog-ama"}}},
{"n":84,"sec":"std","num":65,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"Your company is designing an application architecture for Azure App Service Environment (ASE) web apps as shown in the exhibit. (Click the Exhibit tab.)"},{"img":"img/p076_x1321.webp","w":964,"h":425},{"p":"Communication between the on-premises network and Azure uses an ExpressRoute connection."},{"p":"You need to recommend a solution to ensure that the web apps can communicate with the on-premises application server. The solution must minimize the number of public IP addresses that are allowed to access the on-premises network."},{"p":"What should you include in the recommendation?"}],"o":["Azure Traffic Manager with priority traffic-routing methods","Azure Application Gateway v2 with user-defined routes (UDRs).","Azure Front Door with Azure Web Application Firewall (WAF)","Azure Firewall with policy rule sets"],"a":"D","srcA":"C","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe exhibit's flows are outbound, not inbound: the diagram labels the path from the appAPI subnet back through the boundary box and the on-premises firewall to the on-premises app server as \"outbound traffic,\" and it is that path, the App Service Environment's own web apps calling out to an on-premises system, that the on-premises firewall administrator has to open a rule for. The requirement is to minimize how many public IP addresses are allowed through that on-premises firewall. Azure Firewall is the component that collapses many possible egress sources down to a small, fixed set of its own public IP addresses: route the ASE's outbound traffic through it, and the on-premises firewall only ever needs to allow that Firewall's IP addresses, regardless of how many app instances or IP addresses exist on the Azure side. Front Door with a WAF, by contrast, is an inbound accelerator and web firewall for traffic arriving from users on the public internet; it has no role in, and does nothing to reduce, the number of public IP addresses the ASE's own outbound connections present to the on-premises network. Standalone 257 poses the identical scenario and options and keys Azure Firewall, which is the internally consistent answer between the two.","whyWrong":["A. Traffic Manager is DNS-based routing between endpoints; it doesn't touch outbound connectivity to an on-premises network at all.","B. Application Gateway v2 with UDRs is an inbound reverse proxy; user-defined routes here would steer its own traffic, not consolidate the ASE's outbound IP footprint toward on-premises.","C. Front Door with WAF filters and accelerates inbound web traffic. It has no outbound path to on-premises and does not reduce the public IP addresses the on-premises firewall must allow."],"source":{"title":"Manage a public IP address by using Azure Firewall","url":"https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/configure-public-ip-firewall"},"corrected":true,"originalAnswer":"C"},"e":[{"p":"https://docs.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview"}]},
{"n":85,"sec":"std","num":66,"c":"Design security operations, identity, and compliance capabilities","q":"Your on-premises network contains an Active Directory Domain Services (AD DS) domain. The domain contains a group named Group1 and five servers that run Windows Server. Each server contains a standalone app. Each app is used by the members of Group1.","body":[{"p":"Your on-premises network contains an Active Directory Domain Services (AD DS) domain. The domain contains a group named Group1 and five servers that run Windows Server. Each server contains a standalone app. Each app is used by the members of Group1."},{"p":"You have a Microsoft Entra tenant that syncs with the domain."},{"p":"You plan to manage access to the apps by deploying Global Secure Access. You will use a Conditional Access policy to enforce security controls for all connections to the apps."},{"p":"You need to recommend a Global Secure Access app and Microsoft Entra private network connector configuration for the planned deployment. The solution must minimize administrative effort and be highly available."},{"p":"What is the minimum number of Global Secure Access apps and private network connectors you should recommend? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p078_x1350.webp","w":733,"h":255}],"review":{"status":"MANUAL_REVIEW","confidence":"HIGH","explanation":"Neither recorded answer holds up against how Microsoft documents these two constructs. A single Global Secure Access enterprise application can hold multiple application segments (the FQDNs or IP addresses to tunnel), and Conditional Access for per-app access is \"configured at the application level for each app,\" not per segment. Since all five standalone apps are used by the same group with no stated need to treat any of them differently, adding all five servers as segments under one enterprise application lets a single Conditional Access policy enforce security controls for all of them at once, which is the minimum administrative effort this scenario calls for -- not five separate application objects each needing their own assignment. For private network connectors, Microsoft's own connector documentation states plainly to \"use at least two connectors in each group for high availability\"; connectors serve an entire connector group's traffic regardless of how many app segments sit behind it, so two, not five, is the minimum that satisfies \"highly available.\"","whyWrong":["Creating five separate enterprise applications, one per server, multiplies the Conditional Access assignments needed for identical protection requirements with no benefit, and deploying five connectors ties connector count to server count rather than to the documented two-per-group floor for redundancy. This item is left flagged rather than corrected because it is an unscored, picture-only answer-area item with no text key a correction could change."],"source":{"title":"Configure per-app access using Global Secure Access applications","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-per-app-access"}},"ansimg":[{"img":"img/p078_x1356.webp","w":733,"h":255}],"e":[{"img":"img/p078_x1344.webp","w":733,"h":127}]},
{"n":86,"sec":"std","num":67,"c":"Design security solutions for infrastructure","q":"What should you do first in each branch office?","body":[{"p":"Your company has a main office and 10 branch offices. Each branch office contains an on-premises file server that runs Windows Server and multiple devices that run either Windows 11 or macOS. The devices are enrolled in Microsoft Intune."},{"p":"You have a Microsoft Entra tenant."},{"p":"You need to deploy Global Secure Access to implement web filtering for device traffic to the internet The solution must ensure that all the web traffic from the devices in the branch offices is controlled by using Global Secure Access."},{"p":"What should you do first in each branch office?"}],"o":["Configure an Intune policy to deploy the Global Secure Access client to each device.","Configure an IPsec tunnel on the router.","Install the Microsoft Entra private network connector on the file server.","Configure an Intune policy to onboard Microsoft Defender for Endpoint to each device."],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The phrase \"in each branch office\" points at a site-level action, and the requirement that all web traffic from the branch is controlled rules out a per-device answer. Global Secure Access offers exactly two connectivity models, and the site-level one is remote network connectivity: \"set up an Internet Protocol Security (IPsec) tunnel between your on-premises equipment and the Global Secure Access endpoint\". Microsoft describes the case in the stem directly, connecting an entire branch by creating an IPsec tunnel between the branch's core router and the Global Secure Access endpoint, which also covers devices that cannot run the client. The Internet Access traffic forwarding profile is supported on remote networks, so web filtering works.","whyWrong":["A. Deploying the client to each device is the other connectivity model, and it leaves out anything that cannot run the client. It is also not something you do “in each branch office”.","C. The private network connector is for Private Access, publishing internal resources outward. This requirement is internet traffic going the other way.","D. Onboarding to Defender for Endpoint gives you web content filtering, but that is a different product from Global Secure Access, and the stem names the service to use."],"source":{"title":"Global Secure Access remote network connectivity","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/concept-remote-network-connectivity"}}},
