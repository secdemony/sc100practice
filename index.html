{"n":87,"sec":"std","num":68,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft Entra tenant and an Azure subscription.","body":[{"p":"You have a Microsoft Entra tenant and an Azure subscription."},{"p":"You are evaluating the use of a risk-based Conditional Access policy to control the access of workload identities to resources."},{"p":"To which type of identity should you apply the policy, and which signal source can you use as part of the policy? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p079_x1368.webp","w":725,"h":259}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Microsoft's own documentation for Conditional Access for workload identities states plainly that \"managed identities aren't covered by policy\"; only service principals (applications registered and owned by the organization) can be targeted by a workload-identity Conditional Access policy, matching the recorded answer. For the signal source, risk-based Conditional Access for workload identities evaluates workload identity risk detections, which Microsoft Entra ID Protection is what surfaces (leaked credentials, unusual sign-in properties for a service principal); client app and device platform are conditions used for user sign-in policies, not workload identity risk.","whyWrong":["System-assigned and user-assigned managed identities are both explicitly excluded from workload identity Conditional Access coverage per Microsoft’s own documentation, and client app/device platform are user-centric sign-in conditions with no bearing on a service principal’s risk."],"source":{"title":"Microsoft Entra Conditional Access for workload identities","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/workload-identity"}},"ansimg":[{"img":"img/p080_x1381.webp","w":725,"h":259}],"e":[{"img":"img/p080_x1386.webp","w":752,"h":157}]},
{"n":88,"sec":"std","num":69,"c":"Design security solutions for infrastructure","q":"What should you do?","body":[{"p":"You have an Azure AD tenant that syncs with an Active Directory Domain Services (AD DS) domain."},{"p":"You have an on-premises datacenter that contains 100 servers. The servers run Windows Server and are backed up by using Microsoft Azure Backup Server (MABS)."},{"p":"You are designing a recovery solution for ransomware attacks. The solution follows Microsoft Security Best Practices."},{"p":"You need to ensure that a compromised administrator account cannot be used to delete the backups"},{"p":"What should you do?"}],"o":["From a Recovery Services vault generate a security PIN for critical operations.","From Azure Backup, configure multi-user authorization by using Resource Guard.","From Microsoft Azure Backup Setup, register MABS with a Recovery Services vault","From Azure AD Privileged Identity Management (PIM), create a role assignment for the Backup Contributor role."],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"This is the rogue-admin scenario, and multi-user authorization with a Resource Guard is the control built for it. The Resource Guard sits in a different subscription or tenant, and Microsoft requires that the backup admin have no Contributor or Backup MUA Operator rights on it — so a compromised backup admin cannot approve their own destructive action. Deleting backups, disabling soft delete and removing MUA protection are all protected operations, and the last two cannot even be exempted.","whyWrong":["A. A security PIN gates critical operations for MARS and MABS agents. It is the on-premises analogue, not the control for a Recovery Services vault in this scenario.","C. Registering MABS with a vault is a setup step; it protects nothing by itself.","D. A PIM role assignment for Backup Contributor grants the destructive permission rather than requiring a second party to approve its use."],"source":{"title":"Configure multi-user authorization using Resource Guard","url":"https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization"}}},
{"n":89,"sec":"std","num":70,"c":"Design solutions that align with security best practices and priorities","q":"You have a Microsoft 365 subscription.","body":[{"p":"You have a Microsoft 365 subscription."},{"p":"You are designing a user access solution that follows the Zero Trust principles of the Microsoft Cybersecurity Reference Architectures (MCRA)."},{"p":"You need to recommend a solution that automatically restricts access to Microsoft Exchange Online. SharePoint Online, and Teams m near-real-lime (NRT) in response to the following Azure AD events:"},{"p":"• A user account is disabled or deleted"},{"p":"• The password of a user is changed or reset."},{"p":"• All the refresh tokens for a user are revoked"},{"p":"• Multi-factor authentication (MFA) is enabled for a user"},{"p":"Which two features should you include in the recommendation? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point."}],"o":["continuous access evaluation","a sign-in risk policy","Azure AD Privileged Identity Management (PIM)","Conditional Access","Azure AD Application Proxy"],"a":"A D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"All four listed triggers, account disabled or deleted, password changed or reset, all refresh tokens revoked, and MFA enabled for a user, are exactly Microsoft's documented critical events for continuous access evaluation: services that support CAE receive these signals in near real time and terminate the session immediately rather than waiting for the access token to expire, which is what \"restricts access… in near-real-time\" means here. CAE is the mechanism that reacts to the event; Conditional Access is what makes that reaction apply broadly and consistently across Exchange Online, SharePoint Online and Teams, since CAE-aware enforcement for these workloads is delivered through the Conditional Access-integrated session model rather than being a switch you flip on its own.","whyWrong":["B. A sign-in risk policy reacts to Identity Protection's calculated risk score at sign-in. It is not what enforces the four specific account-state events named in the stem.","C. PIM governs eligible-to-active role activation. It has no role in revoking an existing session in response to a password reset or MFA change.","D. Application Proxy publishes on-premises web apps. It has no relationship to CAE or to Exchange Online, SharePoint Online and Teams sessions."],"source":{"title":"Continuous access evaluation in Microsoft Entra","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-continuous-access-evaluation"}}},
{"n":90,"sec":"std","num":71,"c":"Design security solutions for applications and data","q":"After remediating the threat which policy definition should you assign to prevent the threat from reoccurring?","body":[{"p":"You receive a security alert in Microsoft Defender for Cloud as shown in the exhibit. (Click the Exhibit tab.)"},{"img":"img/p082_x1409.webp","w":1000,"h":474},{"p":"After remediating the threat which policy definition should you assign to prevent the threat from reoccurring?"}],"o":["Storage account public access should be disallowed","Azure Key Vault Managed HSM should have purge protection enabled","Storage accounts should prevent shared key access","Storage account keys should not be expired"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The alert names the exact mechanism being abused: MicroBurst's Get-AZStorageKeysREST module extracts storage account access keys, which are the shared-key credential Azure Storage accepts by default alongside Entra ID. The policy that removes this attack path going forward is \"Storage accounts should prevent shared key access\": once shared key authorization is disallowed, \"clients must use Azure AD or a user delegation SAS to authorize requests,\" so an attacker who extracts or already holds an account key has nothing left to authenticate with.","whyWrong":["A. Disallowing public network access closes anonymous/public access paths, but it does nothing about an attacker who already holds a valid account key and can reach the account through allowed networks.","B. Managed HSM purge protection guards key vault keys from permanent deletion; it is unrelated to a storage account key extraction attack.","D. Storage account keys not being expired is about key rotation hygiene. A key that hasn't expired yet is exactly what MicroBurst is extracting and using; expiration alone doesn't stop shared-key abuse the way disallowing shared keys entirely does."],"source":{"title":"Prevent Shared Key authorization for an Azure Storage account","url":"https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-prevent"}]},
{"n":91,"sec":"std","num":72,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"Your on-premises network contains an Active Directory Domain Services (AD DS) domain and a hybrid deployment between a Microsoft Exchange Server 2019 organization and an Exchange Online tenant. The AD DS domain contains a group named Group1. Group1 is a member of the Organization Management role group for the Exchange deployment."},{"p":"You have a Microsoft 365 E5 subscription that uses Microsoft Defender."},{"p":"You have an Azure subscription that uses Microsoft Sentinel."},{"p":"You need to recommend a solution to ensure that Group1 is marked as a sensitive group and that any changes made to Group1 raises an alert in Microsoft Sentinel. The solution must minimize administrative effort."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Entra ID Protection","Microsoft Defender for Identity","Microsoft Defender for Office 365","Microsoft Entra Privileged Identity Management (PIM)"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Both halves of the requirement are one Defender for Identity feature. The Sensitive entity tag supports users, devices and groups, and Microsoft notes that some detections, like sensitive group changes, rely on this tag. Tag Group1 as sensitive and any modification to it raises a Defender for Identity alert, which reaches Sentinel through the connector with no rule to write. That is what minimises administrative effort. Worth remembering: Defender for Identity marks a fixed list of groups (Domain Admins, Enterprise Admins, Backup Operators and so on) sensitive automatically, but Exchange Organization Management is not on it, so this one has to be tagged by hand.","whyWrong":["A. ID Protection scores risky sign-ins and users. It says nothing about group membership changes in AD DS.","C. Defender for Office 365 protects mail and collaboration content, not directory objects.","D. PIM governs eligibility and activation for Entra roles and Azure resources. Group1 is an on-premises AD DS group in an Exchange role group, which is outside its scope."],"source":{"title":"Entity tags in Microsoft Defender for Identity","url":"https://learn.microsoft.com/en-us/defender-for-identity/entity-tags"}}},
{"n":92,"sec":"std","num":73,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"Your company has an on-premises network and an Azure subscription."},{"p":"The company does NOT have a Site-to-Site VPN or an ExpressRoute connection to Azure."},{"p":"You are designing the security standards for Azure App Service web apps. The web apps will access Microsoft SQL Server databases on the network."},{"p":"You need to recommend security standards that will allow the web apps to access the databases. The solution must minimize the number of open internet-accessible endpoints to the on-premises network."},{"p":"What should you include in the recommendation?"}],"o":["a private endpoint","hybrid connections","virtual network NAT gateway integration","virtual network integration"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Hybrid Connections is the one option here that opens nothing to the internet at all. Microsoft's description is direct: it \"can be used to access application resources in any network that can make outbound calls to Azure over port 443\", through a relay agent that itself only calls outward to Azure Relay. With no Site-to-Site VPN or ExpressRoute in place, and the requirement to minimize internet-accessible endpoints on-premises, an outbound-only relay is the only one of the four that adds zero inbound exposure.","whyWrong":["A. A private endpoint brings an Azure PaaS resource into your virtual network; it does nothing to connect an App Service instance outward to an on-premises SQL Server with no existing network path.","C. A NAT gateway provides outbound internet connectivity for resources inside a virtual network. It does not create a reachable path back to on-premises SQL Server at all.","D. Virtual network integration gives the web app a presence in a virtual network, but without a VPN or ExpressRoute from that network to on-premises, there is still no route to the database, and building one would add the very endpoints the requirement seeks to avoid."],"source":{"title":"Hybrid Connections in Azure App Service","url":"https://learn.microsoft.com/en-us/azure/app-service/app-service-hybrid-connections"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/app-service/app-service-hybrid-connections"}]},
{"n":93,"sec":"std","num":74,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"You are designing the encryption standards for data at rest for an Azure resource"},{"p":"You need to provide recommendations to ensure that the data at rest is encrypted by using AES-256 keys. The solution must support rotating the encryption keys monthly."},{"p":"Solution: For blob containers in Azure Storage, you recommend encryption that uses Microsoft-managed keys within an encryption scope."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"No, and this is the companion to Standalone 9. An encryption scope is a real feature and it can indeed be protected by either a Microsoft-managed key or a customer-managed key, so the mechanism in the stem exists. The problem is the key type. Microsoft manages the rotation of its own keys on its own schedule, and you cannot drive it. Only the customer-managed key option lets you choose to \"update the key version either automatically or manually\", which is what a monthly rotation requirement demands.","source":{"title":"Encryption scopes for Blob storage","url":"https://learn.microsoft.com/en-us/azure/storage/blobs/encryption-scope-overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-key-rotation"}]},
{"n":94,"sec":"std","num":75,"c":"Design security operations, identity, and compliance capabilities","q":"You have four Azure subscriptions named Sub1, Sub2, Sub3, and Sub4. Each subscription has a unique Microsoft Entra tenant that is linked to a Microsoft 365 subscription. Sub1 contains a user named User1.","body":[{"p":"You have four Azure subscriptions named Sub1, Sub2, Sub3, and Sub4. Each subscription has a unique Microsoft Entra tenant that is linked to a Microsoft 365 subscription. Sub1 contains a user named User1."},{"p":"You plan to implement Microsoft Sentinel."},{"p":"You need to ensure that User1 can monitor Microsoft Entra ID events and Microsoft 365 events for Sub2, Sub3, and Sub4 by using Microsoft Sentinel. The solution must minimize administrative effort."},{"p":"What is the minimum number of Microsoft Sentinel workspaces you should create, and which Azure service should you use? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p084_x1432.webp","w":507,"h":305}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Since Sub2, Sub3, and Sub4 each have their own unique Microsoft Entra tenant, each tenant's own Entra ID and Microsoft 365 diagnostic logs can only be collected into a Log Analytics workspace inside that same tenant, so monitoring all three requires one Sentinel workspace per tenant: three workspaces at minimum. For User1, who sits in Sub1's own tenant, to monitor those three separate workspaces without being invited as a guest into each of the other tenants individually, Azure Lighthouse is Microsoft's documented mechanism for exactly this: delegated, cross-tenant access to resources including Log Analytics/Sentinel workspaces, viewed directly from the user's own home tenant, which is what \"minimize administrative effort\" calls for over maintaining three sets of guest accounts.","whyWrong":["Azure Bastion, Azure Private Link, and Azure Arc solve unrelated problems (secure VM access, private connectivity to a PaaS resource, and hybrid server management, respectively); none of them grants a user in one tenant delegated access to resources living in other tenants the way Azure Lighthouse does."],"source":{"title":"Extend Microsoft Sentinel across workspaces and tenants","url":"https://learn.microsoft.com/en-us/azure/sentinel/extend-sentinel-across-workspaces-tenants"}},"ansimg":[{"img":"img/p085_x1445.webp","w":507,"h":305}],"e":[{"img":"img/p085_x1450.webp","w":600,"h":100}]},
{"n":95,"sec":"std","num":76,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription that contains 15 custom apps. The source files for the apps are stored in Git repositories. The apps are deployed by using Azure DevOps."},{"p":"You need to recommend a DevSecOps solution to implement static application security testing (SAST) of the app code to identify hard-coded secrets."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Defender for Key Vault","GitHub Advanced Security","Microsoft Defender for Cloud DevOps security","Microsoft Dev Box"],"a":"B","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"GitHub Advanced Security is the bundle that adds code scanning and secret scanning to repositories, and secret scanning is the capability that finds credentials committed into source. The stem says the source is in Git repositories and the pipeline is Azure DevOps, which GitHub Advanced Security covers in both homes: GitHub Enterprise for GitHub-hosted repositories, and GitHub Advanced Security for Azure DevOps for Azure Repos.","whyWrong":["A. Defender for Key Vault detects unusual access to a vault at runtime. It never sees your code.","C. DevOps security in Defender for Cloud gives security teams a single view of findings across pipelines, but the scanning itself is done by GitHub Advanced Security. The question asks what to implement to do the scanning.","D. Dev Box provisions developer workstations."],"source":{"title":"Set up secret scanning for GitHub Advanced Security","url":"https://learn.microsoft.com/en-us/azure/devops/repos/security/github-advanced-security-secret-scanning"}}},
{"n":96,"sec":"std","num":77,"c":"Design solutions that align with security best practices and priorities","q":"You need to design a solution to accelerate a Zero Trust security implementation. The solution must be based on the Zero Trust Rapid Modernization Plan (RaMP).","body":[{"p":"You need to design a solution to accelerate a Zero Trust security implementation. The solution must be based on the Zero Trust Rapid Modernization Plan (RaMP)."},{"p":"Which three initiatives should you include in the solution, and in which order should you implement the initiatives? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p086_x1472.webp","w":922,"h":260}],"review":{"status":"OUTDATED","confidence":"MEDIUM","explanation":"This item tests the classic Zero Trust Rapid Modernization Plan structure: five named initiatives (Explicitly validate trust for all access requests, Discover and protect IoT devices, Classify and protect data, Apply provisions for ransomware recovery readiness, Implement DevOps integration) presented with a specific top-three priority ordering. Some of the individual checklist articles the source's key draws on, including \"Explicitly validate trust for all access requests\" and \"Ransomware recovery readiness,\" still exist on Microsoft Learn as standalone content, but the RaMP overview page that once presented this specific initiative list with a prioritized ordering has been restructured: Microsoft's current Zero Trust guidance is organized around the newer Zero Trust adoption framework and Security Exposure Management rather than the classic RaMP checklist-with-priority-order model this item was built on. Because there is no longer a current, single authoritative page presenting these five initiatives with a definitive recommended order to check the source's specific 3-item sequence against, the key is left as the source recorded it and the item is flagged as outdated rather than re-ordered without current backing.","whyWrong":["None established with confidence -- this item is flagged because the framework structure it depends on has moved on, not because a specific alternative ordering has been confirmed against current documentation."],"source":{"title":"RaMP Checklist - Explicitly validate trust for all access requests","url":"https://learn.microsoft.com/en-us/security/zero-trust/user-access-productivity-validate-trust"}},"ansimg":[{"img":"img/p086_x1474.webp","w":922,"h":260}],"e":[{"img":"img/p086_x1466.webp","w":935,"h":190}]},
{"n":97,"sec":"std","num":78,"c":"Design security solutions for infrastructure","q":"What should you include in the solution?","body":[{"p":"Your on-premises network contains an Active Directory Domain Services (AD DS) domain. The domain contains a server named Server! that runs Windows Server."},{"p":"You have an Azure subscription that is linked to a hybrid Microsoft Entra tenant and contains a user named User1. User1 works remotely."},{"p":"You need to ensure that User1 can establish RDP connections to Server1 via the internet. The solution must ensure that User1 authenticates by using multifactor authentication (MFA)."},{"p":"What should you include in the solution?"}],"o":["Microsoft Entra Internet Access","Windows Admin Center","Azure Bastion","Microsoft Entra Private Access"],"a":"D","srcA":"C","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nServer1 is on-premises, and that is what decides it. Microsoft Entra Private Access is the Global Secure Access capability built for this: you specify \"the fully qualified domain names (FQDNs) and IP addresses that you consider private or internal\", a private network connector inside your network brokers the connection outbound, and \"remote workers don't need to use a VPN to access these resources if they have the Global Secure Access Client installed\". Because the resource is published as an enterprise application, you assign User1 and apply a Conditional Access policy requiring MFA, which is the second half of the requirement. RDP is just a port and an IP address to Private Access. One honest caveat: Azure Bastion's IP-based connection can reach a machine outside the virtual network, but only one your Bastion virtual network can already route to over ExpressRoute or a site-to-site VPN. The stem offers no such link and says the connection is over the internet, so Bastion would need infrastructure the question does not give you.","whyWrong":["A. Entra Internet Access secures outbound traffic to internet and SaaS destinations. It is the other half of Global Secure Access and points the wrong way.","B. Windows Admin Center is a management console. It does not publish RDP to the internet or enforce MFA.","C. Azure Bastion is a service you deploy into an Azure virtual network to reach machines it can route to. It is not a remote access gateway for an on-premises server reached over the internet."],"source":{"title":"Learn about Microsoft Entra Private Access","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/concept-private-access"},"corrected":true,"originalAnswer":"C"}},
{"n":98,"sec":"std","num":79,"c":"Design security solutions for applications and data","q":"You have an Azure subscription. The subscription contains an Azure application gateway that use Azure Web Application Firewall (WAF).","body":[{"p":"You have an Azure subscription. The subscription contains an Azure application gateway that use Azure Web Application Firewall (WAF)."},{"p":"You deploy new Azure App Services web apps. Each app is registered automatically in the DNS domain of your company and accessible from the Internet."},{"p":"You need to recommend a security solution that meets the following requirements:"},{"p":"• Detects vulnerability scans of the apps"},{"p":"• Detects whether newly deployed apps are vulnerable to attack"},{"p":"What should you recommend using? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p087_x1486.webp","w":914,"h":208}],"review":{"status":"MANUAL_REVIEW","confidence":"HIGH","explanation":"The recorded answer for detecting vulnerability scans of the apps, Microsoft Defender for App Service, checks out: it is the Defender for Cloud plan that watches an already-onboarded App Service resource's own runtime activity and raises alerts (including a vulnerability-scanner-detected alert) when it is being probed. The recorded answer for detecting whether newly deployed apps are vulnerable to attack, also Microsoft Defender for App Service, does not check out: that plan protects resources that are already known to and onboarded in Defender for Cloud. Discovering and assessing newly deployed, internet-facing apps that a security team may not even know about yet is what Microsoft Defender External Attack Surface Management (Defender EASM) is documented to do, using \"recursive discovery to find unknown internet-facing assets\" and giving organizations \"visibility over newly deployed assets\" so vulnerabilities on them can be identified quickly -- exactly \"newly deployed apps\" registered automatically in the company's DNS domain.","whyWrong":["Azure WAF inspects and filters HTTP(S) traffic to a published application; it does not discover unknown or newly deployed internet-facing assets. Defender for Cloud Apps governs SaaS usage and session activity, not an organization’s own external attack surface. This item is left flagged rather than corrected because it is an unscored, picture-only answer-area item with no text key a correction could change."],"source":{"title":"What is Microsoft Defender External Attack Surface Management?","url":"https://learn.microsoft.com/en-us/azure/external-attack-surface-management/overview"}},"ansimg":[{"img":"img/p088_x1499.webp","w":914,"h":208}],"e":[{"img":"img/p088_x1504.webp","w":914,"h":100}]},
{"n":99,"sec":"std","num":80,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"You are designing a security strategy for providing access to Azure App Service web apps through an Azure Front Door instance."},{"p":"You need to recommend a solution to ensure that the web apps only allow access through the Front Door instance."},{"p":"Solution: You recommend configuring gateway-required virtual network integration."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"No, because virtual network integration governs the wrong direction. It gives the app outbound access into a virtual network so it can reach private resources such as a database or a storage account behind a private endpoint. It does not filter who may call the app. Restricting inbound callers to Front Door is what access restrictions are for, which is the subject of Standalone 97 and 129.","whyWrong":["A. Yes confuses outbound integration with inbound access control. The app’s public endpoint stays open to the internet."],"source":{"title":"Set up Azure App Service access restrictions","url":"https://learn.microsoft.com/en-us/azure/app-service/app-service-ip-restrictions"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/app-service/app-service-ip-restrictions#restrict-access-to-a-specific- azure- front-door-instance"}]},
{"n":100,"sec":"std","num":81,"c":"Design solutions that align with security best practices and priorities","q":"What should you recommend?","body":[{"p":"You have an Azure subscription."},{"p":"You plan to deploy enterprise-scale landing zones based on the Microsoft Cloud Adoption Framework for Azure. The deployment will include a single-platform landing zone for all shared services and three application landing zones that will each host a different Azure application."},{"p":"You need to recommend which resource to deploy to each landing zone. The solution must meet the Cloud Adoption Framework best-practice recommendations for enterprise-scale landing zones."},{"p":"What should you recommend?"}],"o":["an Azure Private DNS zone","an Azure key vault","an Azure firewall","an Azure virtual network gateway"],"a":"B","srcA":"A","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe question asks what belongs in every landing zone, platform and application alike, and Cloud Adoption Framework answers it for key vaults directly: \"Don't use centralized instances of Key Vault for application keys or secrets\", and \"to avoid secret sharing across environments, don't share Key Vault instances between applications.\" Microsoft gives the reasons: multiple vaults reduce the blast radius of a compromise, avoid throttling from noisy neighbours, and align key management to application boundaries. The other three options are all platform resources. The landing zone architecture puts them in the connectivity subscription, which \"hosts the Azure networking resources, like Azure Virtual WAN, Azure Firewall, and Azure DNS private zones, that the platform requires\" - deployed once and shared, not repeated per landing zone.","whyWrong":["A. Private DNS zones are centralised in the connectivity subscription so that name resolution is consistent across the estate.","C. Azure Firewall is a shared platform service in the connectivity subscription. One per landing zone would be expensive and would fragment egress policy.","D. Virtual network gateways are hub resources in the connectivity subscription."],"source":{"title":"Encryption and key management in Azure - Cloud Adoption Framework","url":"https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/encryption-and-keys"},"corrected":true,"originalAnswer":"A"}},
{"n":101,"sec":"std","num":82,"c":"Design security solutions for infrastructure","q":"What should you recommend?","body":[{"p":"You have an Azure Kubernetes Service (AKS) cluster that hosts Linux nodes."},{"p":"You need to recommend a solution to ensure that deployed worker nodes have the latest kernel updates. The solution must minimize administrative effort."},{"p":"What should you recommend?"}],"o":["The AKS cluster version must be upgraded.","The updates must first be applied to the image used to provision the nodes.","The nodes must restart after the updates are applied."],"a":"C","srcA":"B","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe word that decides this is \"deployed\". Microsoft states that on AKS \"security updates are automatically applied to Linux nodes\", including kernel updates, and that the nodes check for and install them every day without you doing anything. What does not happen automatically is the restart: \"Some security updates, such as kernel updates, require a node reboot to finalize the process. AKS doesn't automatically reboot these Linux nodes.\" A node that needs one writes /var/run/reboot-required, and the minimal-effort way to act on that is to deploy kured, which watches for the file, cordons and drains the node, and reboots it. So on already-deployed nodes the missing piece is the reboot, not the patch. The keyed answer describes node image upgrade, which is a real and useful mechanism, but Microsoft is explicit that it affects the image used to create nodes: an existing node keeps running its current image and gets its kernel updates in place. Node image upgrade is the answer to a differently worded question about newly provisioned nodes.","whyWrong":["A. Upgrading the cluster version moves you to a new Kubernetes release and replaces nodes. It is a much larger change than applying kernel updates, and Microsoft notes you cannot stay on the same version during an upgrade.","B. Updates do not have to be applied to the image first. Unattended upgrades patch the running Linux node directly; the image only governs nodes created later."],"source":{"title":"Apply security and kernel updates to Linux nodes in AKS (kured)","url":"https://learn.microsoft.com/en-us/azure/aks/upgrade-node-image-kured"},"corrected":true,"originalAnswer":"B"}},
{"n":102,"sec":"std","num":83,"c":"Design security solutions for infrastructure","q":"You need to recommend a solution to prevent users from accessing websites that contain adult content such as gambling sites. What should you include in the recommendation?","body":[{"p":"You have Windows 11 devices and Microsoft 365 E5 licenses."},{"p":"You need to recommend a solution to prevent users from accessing websites that contain adult content such as gambling sites. What should you include in the recommendation?"}],"o":["Microsoft Endpoint Manager","Compliance Manager","Microsoft Defender for Cloud Apps","Microsoft Defender for Endpoint"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Web content filtering in Defender for Endpoint “enables your organization to track and regulate access to websites based on their content categories”, and the question names the categories almost verbatim: **Adult content** is a parent category and **Gambling** one of its children. Blocks are enforced by SmartScreen in Edge and by network protection in other browsers, on-premises or away from the network.","whyWrong":["A. Endpoint Manager (Intune) deploys the policy in some designs but is not the filtering capability itself, and the categories live in Defender.","B. Compliance Manager scores regulatory posture.","C. Defender for Cloud Apps governs SaaS app usage and can block unsanctioned apps, but category-based web filtering on the device is a Defender for Endpoint web protection feature."],"source":{"title":"Web content filtering in Microsoft Defender for Endpoint","url":"https://learn.microsoft.com/en-us/defender-endpoint/web-content-filtering"}},"e":[{"p":"https://docs.microsoft.com/en-us/microsoft-365/security/defender-endpoint/web-content-filtering? view=o365-worldwide#configure-web-content-filtering-policies"}]},
{"n":103,"sec":"std","num":84,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include the recommendation?","body":[{"p":"You have a Microsoft Entra tenant. The tenant contains 500 Windows devices that have the Global Secure Access client deployed."},{"p":"You have a third-party software as a service (SaaS) app named App1."},{"p":"You plan to implement Global Secure Access to manage access to App1."},{"p":"You need to recommend a solution to manage connections to App1. The solution must ensure that users authenticate by using their Microsoft Entra credentials before they can connect to App1."},{"p":"What should you include the recommendation?"}],"o":["a Global Secure Access app","a private access traffic forwarding profile","an internet access traffic forwarding profile","a Quick Access app"],"a":"C","srcA":"A","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nApp1 is a third-party SaaS app reachable over the public internet, and Microsoft is explicit about which Global Secure Access profile that belongs to: \"With the internet access profile, you can route traffic to the public internet, including traffic to SaaS apps.\" The same page states that \"both the Microsoft and Internet access forwarding profiles use Microsoft Entra ID Conditional Access policies to authorize access to their tunnels,\" which is exactly how the requirement, users must authenticate with their Entra credentials before connecting, gets enforced. A Global Secure Access app is a Private Access construct: it publishes an internal resource, reached by FQDN or IP through a private network connector inside your own network. App1 has no presence on your network for a connector to reach, so Private Access has nothing to publish here.","whyWrong":["A. A Global Secure Access app requires a private network connector reaching the target resource. App1 is external SaaS with no such internal presence.","B. The private access traffic forwarding profile is the client-side counterpart to Private Access apps and is equally scoped to internal, connector-reachable resources, not public SaaS.","D. A Quick Access app is the primary group of private FQDNs and IPs to always tunnel through Private Access. It is the same internal-resource model as option A, one level up."],"source":{"title":"Global Secure Access traffic forwarding profiles","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/concept-traffic-forwarding"},"corrected":true,"originalAnswer":"A"}},
{"n":104,"sec":"std","num":85,"c":"Design security operations, identity, and compliance capabilities","q":"Your company has an Azure subscription that uses Microsoft Defender for Cloud. The company signs a contract with the United States government. You need to review the current subscription for NIST 800-53 compliance. What should you do first?","body":[{"p":"Your company has an Azure subscription that uses Microsoft Defender for Cloud. The company signs a contract with the United States government. You need to review the current subscription for NIST 800-53 compliance. What should you do first?"}],"o":["From Azure Policy, assign a built-in policy definition that has a scope of the subscription.","From Microsoft Defender for Cloud Apps, create an access policy for cloud applications.","From Microsoft Defender for Cloud, turn on a security standard.","From Microsoft Defender for Cloud, review the secure score recommendations."],"a":"C","srcA":"A","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nRegulatory standards such as NIST SP 800-53 are turned on as security standards in Defender for Cloud — Regulatory compliance > Manage compliance policies > Security policies, then toggle the standard On. Only then does the subscription get assessed and appear on the regulatory compliance dashboard. The original key, assigning a single built-in policy definition from Azure Policy, is wrong twice over: a regulatory standard is an initiative rather than one definition, and assessing it is driven from Defender for Cloud.","whyWrong":["A. A built-in policy definition is a single rule. NIST SP 800-53 is a whole initiative, and assigning one definition would not produce a compliance assessment.","B. Defender for Cloud Apps access policies govern SaaS sessions and have nothing to do with regulatory assessment.","D. Secure score recommendations measure general posture against the Microsoft Cloud Security Benchmark, not compliance with a named regulatory standard."],"source":{"title":"Assign regulatory compliance standards in Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages"},"corrected":true,"originalAnswer":"A"}},
{"n":105,"sec":"std","num":86,"c":"Design security solutions for applications and data","q":"You are designing security for an Azure landing zone. Your company identifies the following compliance and privacy requirements:","body":[{"p":"You are designing security for an Azure landing zone. Your company identifies the following compliance and privacy requirements:"},{"p":"• Encrypt cardholder data by using encryption keys managed by the company."},{"p":"• Encrypt insurance claim files by using encryption keys hosted on-premises."},{"p":"Which two configurations meet the compliance and privacy requirements? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point."}],"o":["Store the insurance claim data in Azure Blob storage encrypted by using customer-provided keys.","Store the cardholder data in an Azure SQL database that is encrypted by using keys stored in Azure Key Vault Managed HSM","Store the insurance claim data in Azure Files encrypted by using Azure Key Vault Managed HSM.","Store the cardholder data in an Azure SQL database that is encrypted by using Microsoft-managed Keys."],"a":"A B","srcA":"A C","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe two compliance requirements are different from each other, and pairing them needs one answer for each, not two answers to the same one. Insurance claim files must be encrypted with keys hosted on-premises: customer-provided keys are Azure's mechanism for exactly that, since the key is supplied by the caller on each request and Azure never stores it at rest, which is the closest a native Azure storage encryption feature gets to \"the key never lives in Azure.\" Cardholder data must be encrypted with keys the company manages: keys in Key Vault Managed HSM are single-tenant, customer-controlled and FIPS 140-3 Level 3 HSM-protected, satisfying company-managed key control for a regulated workload like cardholder data. The source's key pairs the customer-provided-keys answer with a second option that also describes the insurance claim data, in Azure Files instead of Blob storage, which leaves the cardholder-data requirement completely unaddressed by either selected answer.","whyWrong":["C. Azure Files encrypted with Managed HSM keys is a second description of protecting the insurance claim data, not the cardholder data. Selecting it alongside A leaves the cardholder-data requirement with no answer at all.","D. Encrypting cardholder data with Microsoft-managed keys fails the requirement outright: the company does not control a Microsoft-managed key, which is the opposite of what \"managed by the company\" asks for."],"source":{"title":"Customer-managed keys for account encryption - Azure Storage","url":"https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview"},"corrected":true,"originalAnswer":"A C"},"e":[{"p":"https://azure.microsoft.com/en-us/blog/customer-provided-keys-with-azure-storage-service-encryption/"}]},
{"n":106,"sec":"std","num":87,"c":"Design security operations, identity, and compliance capabilities","q":"What will necessitate an upgrade from the Azure AD Free edition to the Premium edition?","body":[{"p":"You have a customer that has a Microsoft 365 subscription and uses the Free edition of Azure Active Directory (Azure AD)"},{"p":"The customer plans to obtain an Azure subscription and provision several Azure resources."},{"p":"You need to evaluate the customer ' s security environment."},{"p":"What will necessitate an upgrade from the Azure AD Free edition to the Premium edition?"}],"o":["role-based authorization","Azure AD Privileged Identity Management (PIM)","resource-based authorization","Azure AD Multi-Factor Authentication"],"a":"D","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged: the key looks wrong and the source seems to know it. The question asks what forces an upgrade from Microsoft Entra ID Free to Premium; the key says multifactor authentication, but the source’s own explanation links to the Privileged Identity Management documentation, which points at option B instead. That fits the licensing: some MFA is available on the Free tier through security defaults, whereas PIM has always required Entra ID P2. Treat B as the more defensible answer. The key is left as the source has it pending a licensing page check."},"e":[{"p":"( ht tps://docs.microsoft.com/en-us/azure/active-directory/privileged-identity-management/pim-configure )"},{"p":"https://www.microsoft.com/en-us/security/business/identity-access/azure-active-directory-pricing?rtc=1"}]},
{"n":107,"sec":"std","num":88,"c":"Design security operations, identity, and compliance capabilities","q":"Users use Microsoft Teams, Exchange Online, SharePoint Online, and OneDrive for sharing and collaborating. The company identifies protected health information (PHI) within stored documents and communications. What should you recommend using to prevent the PHI from being shared outside the company?","body":[{"p":"Your company has a Microsoft 365 E5 subscription."},{"p":"Users use Microsoft Teams, Exchange Online, SharePoint Online, and OneDrive for sharing and collaborating. The company identifies protected health information (PHI) within stored documents and communications. What should you recommend using to prevent the PHI from being shared outside the company?"}],"o":["insider risk management policies","data loss prevention (DLP) policies","sensitivity label policies","retention policies"],"a":"C","review":{"status":"AMBIGUOUS","confidence":"MEDIUM","explanation":"Flagged as genuinely contestable rather than wrong. The source keys sensitivity label policies, and that defends well: a label applies encryption whose usage rights follow the file, so an external recipient cannot open it wherever it ends up. But DLP policies are the control literally designed to prevent sharing outside the organisation, and the near-identical Standalone 235 keys the two together as a pair. Either is defensible as written. On the exam, read for the verb: “classify and protect” points at labels, “prevent from being shared” points at DLP, and where both appear the intended answer is usually both.","source":{"title":"Learn about sensitivity labels","url":"https://learn.microsoft.com/en-us/purview/sensitivity-labels"}}},
{"n":108,"sec":"std","num":89,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"You have the following on-premises servers that run Windows Server:"},{"p":"• Two domain controllers in an Active Directory Domain Services (AD DS) domain"},{"p":"• Two application servers named Server1 and Server2 that run ASP.NET web apps"},{"p":"• A VPN server named Server3 that authenticates by using RADIUS and AD DS"},{"p":"End users use a VPN to access the web apps over the internet."},{"p":"You need to redesign a user access solution to increase the security of the connections to the web apps. The solution must minimize the attack surface and follow the Zero Trust principles of the Microsoft Cybersecurity Reference Architectures (MCRA)."},{"p":"What should you include in the recommendation?"}],"o":["Configure connectors and rules in Microsoft Defender for Cloud Apps.","Configure web protection in Microsoft Defender for Endpoint.","Publish the web apps by using Azure AD Application Proxy.","Configure the VPN to use Azure AD authentication."],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The VPN is the attack surface the question wants removed. Application Proxy publishes an internal web app through Microsoft Entra ID without opening any inbound port: a lightweight connector inside the network makes an outbound connection to the service, and every request is authenticated by Entra ID first, so Conditional Access, MFA and device state all apply before a packet reaches Server1 or Server2. That is explicit verification in front of the app rather than network-level trust behind a tunnel, which is the MCRA Zero Trust position.","whyWrong":["A. Defender for Cloud Apps is a CASB for SaaS sessions, not a publishing mechanism for on-premises web apps.","B. Web protection in Defender for Endpoint governs which sites the device may reach outbound. It does not secure inbound access to your apps.","D. Adding Entra authentication to the VPN improves the tunnel but keeps the tunnel, and with it broad network access. Zero Trust wants access to the application, not to the network."],"source":{"title":"What is Microsoft Entra application proxy?","url":"https://learn.microsoft.com/en-us/entra/identity/app-proxy/overview-what-is-app-proxy"}}},
{"n":109,"sec":"std","num":90,"c":"Design security solutions for applications and data","q":"You have an Azure subscription that contains multiple Azure Storage blobs and Azure Files shares.","body":[{"p":"You have an Azure subscription that contains multiple Azure Storage blobs and Azure Files shares."},{"p":"You need to recommend a security solution for authorizing access to the blobs and shares. The solution must meet the following requirements:"},{"p":"• Support access to the shares by using the SMB protocol."},{"p":"• Limit access to the blobs to specific periods of time."},{"p":"• Include authentication support when possible."},{"p":"What should you recommend for each resource? To answer, select the options in the answer area."},{"p":"NOTE: Each correct answer is worth one point."},{"img":"img/p093_x1560.webp","w":1000,"h":396}],"review":{"status":"MANUAL_REVIEW","confidence":"HIGH","explanation":"Neither recorded answer holds up. For the blobs, Microsoft's own SAS documentation is direct: \"Microsoft recommends using a user delegation SAS when possible for superior security... secured with Microsoft Entra credentials,\" language that maps onto \"include authentication support when possible\" almost exactly, and a user delegation SAS still supports time-boxed access the way an account SAS does. An account SAS is signed with the storage account key alone, with no Entra identity behind it, so it is the account SAS, not the user delegation SAS, that the requirement is steering away from. For the shares, the requirement is access over the SMB protocol specifically, and shared access signatures are an HTTPS/REST construct that ordinary SMB clients do not present at all; Microsoft's own guidance for Azure Files SMB access is to \"use identity-based authentication to access SMB file shares instead of the storage account key,\" naming Microsoft Entra Domain Services as one of the supported identity sources, which is also one of this item's own listed options.","whyWrong":["An account SAS for the blobs is signed with the account key rather than an Entra identity, missing the \"authentication support when possible\" half of the requirement that a user delegation SAS satisfies. A service SAS for the shares fails a harder constraint: SAS tokens are not a credential an SMB client can present at all, so no SAS variant can satisfy \"support access to the shares by using the SMB protocol.\" This item is left flagged rather than corrected because it is an unscored, picture-only answer-area item with no text key a correction could change."],"source":{"title":"Grant limited access to Azure Storage resources using shared access signatures (SAS)","url":"https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview"}},"ansimg":[{"img":"img/p094_x1569.webp","w":1000,"h":396}],"e":[{"img":"img/p094_x1574.webp","w":841,"h":141}]},
{"n":110,"sec":"std","num":91,"c":"Design solutions that align with security best practices and priorities","q":"What should you recommend?","body":[{"p":"Your company plans to evaluate the security of its Azure environment based on the principles of the Microsoft Cloud Adoption Framework for Azure."},{"p":"You need to recommend a cloud-based service to evaluate whether the Azure resources comply with the National Institute of Standards and Technology (NIST) Cybersecurity Framework (CSF)."},{"p":"What should you recommend?"}],"o":["Compliance Manager in Microsoft Purview","Microsoft Defender for Cloud","Microsoft Sentinel","Microsoft Defender for Cloud Apps"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The regulatory compliance dashboard in Defender for Cloud is the service that assesses Azure resources against published frameworks, and NIST is among the standards you can add to a subscription alongside the Microsoft cloud security benchmark that is applied by default. The assessments underneath are Azure Policy definitions, which is why Defender for Cloud can report a per-control pass or fail for your actual resources.","whyWrong":["A. Compliance Manager scores your Microsoft 365 and organisational posture, largely through assessments you complete. It is not the tool that evaluates Azure resource configuration.","C. Sentinel is a SIEM. Compliance posture is not what it measures.","D. Defender for Cloud Apps assesses SaaS apps, not Azure resources."],"source":{"title":"Regulatory compliance standards in Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance-standards"}}},
{"n":111,"sec":"std","num":92,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"You have a Microsoft Entra tenant named contoso.com."},{"p":"You have an external partner that has a Microsoft Entra tenant named fabrikam.com."},{"p":"You need to recommend an identity governance solution for contoso.com that meets the following requirements:"},{"p":"Enables the users in contoso.com and fabrikam.com to communicate by using shared Microsoft Teams channels."},{"p":"Manages access to shared Teams channels in contoso.com by using groups in fabrikam.com."},{"p":"Supports single sign-on (SSO)."},{"p":"Minimizes administrative effort."},{"p":"Maximizes security."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Entra B2B collaboration","Microsoft Entra Connect Sync","Cross-tenant synchronization","B2B direct connect"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"B2B direct connect is the one feature built for Teams shared channels, and it satisfies every requirement in the stem: users collaborate with their home credentials so no guest object is created in contoso.com, inbound cross-tenant access settings can be scoped to a group in fabrikam.com, and the trust gives single sign-on. Microsoft's own wording: users 'work together using their home credentials and a shared channel in Teams, without having to be added to each other's organizations as guests.'","whyWrong":["A. B2B collaboration invites the external user as a guest object in your tenant — the opposite of the stated requirement — and guests cannot participate in shared channels.","B. Connect Sync synchronises on-premises AD DS to Entra ID; it is not a cross-tenant feature.","C. Cross-tenant synchronisation provisions external users as B2B collaboration users in your tenant, so it also creates the accounts the question forbids."],"source":{"title":"B2B direct connect overview","url":"https://learn.microsoft.com/en-us/entra/external-id/b2b-direct-connect-overview"}}},
{"n":112,"sec":"std","num":93,"c":"Design security solutions for infrastructure","q":"You have on-premises servers and virtual machines that run Windows Server or Red Hat Enterprise Linux (RHEL).","body":[{"p":"You have on-premises servers and virtual machines that run Windows Server or Red Hat Enterprise Linux (RHEL)."},{"p":"You have an Azure subscription The subscription contains virtual machines that run Windows Server Datacentet: Azure Edition."},{"p":"You need to recommend a solution to manage operating system updates for the on-premises servers and the virtual machines. The solution must meet the following requirements:"},{"p":"• Enable hotpatching for the Azure virtual machines."},{"p":"• Enable the on demand inventory and deployment of updates."},{"p":"• Enable the deployment of Extended Security Update (ESU) patches to the on-premises servers."},{"p":"What should you include in the recommendation? To answer, select the options in the answer area."},{"p":"NOTE: Each correct answer is worth one point."},{"img":"img/p096_x1608.webp","w":913,"h":293}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Azure Update Manager is Microsoft's unified update-management service, and it is what supports hotpatching for Azure Edition virtual machines, on-demand update inventory and deployment, and delivering Extended Security Update (ESU) patches, all from one place. On-premises servers need the Azure Connected Machine agent to become Azure Arc-enabled servers first, which is what makes them visible to and manageable by Update Manager (and eligible for Arc-delivered ESU) in the first place.","whyWrong":["Azure Automanage and System Center Updates Publisher are both real products, but neither is the single service documented to cover hotpatching, on-demand inventory/deployment, and ESU delivery together the way Update Manager does. Azure Monitor Agent and the Azure VPN client are unrelated to bringing an on-premises server under Arc-based update management."],"source":{"title":"Azure Update Manager overview","url":"https://learn.microsoft.com/en-us/azure/update-manager/overview"}},"ansimg":[{"img":"img/p096_x1610.webp","w":913,"h":293}],"e":[{"img":"img/p096_x1602.webp","w":902,"h":134}]},
{"n":113,"sec":"std","num":94,"c":"Design solutions that align with security best practices and priorities","q":"You have an Azure environment that contains multiple workloads deployed across multiple subscriptions.","body":[{"p":"You have an Azure environment that contains multiple workloads deployed across multiple subscriptions."},{"p":"You need to recommend a solution to assess and improve the security posture of the workloads. The solution must meet the following requirements:"},{"p":"• Use the Microsoft Cloud Adoption Framework for Azure to evaluate compliance with cloud governance"},{"p":"policies."},{"p":"• Use the Azure Well-Architected Framework to secure individual workloads."},{"p":"What should you include in the recommendation for each requirement? To answer, drag the appropriate recommendations to the correct requirements. Each recommendation may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content"},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p097_x1628.webp","w":1000,"h":286}],"review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"The Cloud Adoption Framework's own governance guidance names Microsoft Defender for Cloud as one of the tools (alongside Azure Policy) that enforces and evaluates compliance with an organization's cloud governance policies across the estate, matching \"evaluate compliance with cloud governance policies.\" The Well-Architected Framework's security pillar is scoped to reviewing and hardening one workload at a time, and Microsoft Defender Vulnerability Management's per-resource, per-device vulnerability assessment fits that individual-workload granularity, distinct from Defender for Cloud's broader, estate-wide governance role in the first box.","whyWrong":["Azure Advisor gives general optimization recommendations rather than governance-policy compliance evaluation or workload-specific vulnerability assessment. Microsoft Intune and Microsoft Sentinel are device management and SIEM tools respectively, neither of which is the documented tool for either half of this pairing."],"source":{"title":"Enforce cloud governance policies - Cloud Adoption Framework","url":"https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/govern/enforce-cloud-governance-policies"}},"ansimg":[{"img":"img/p097_x1630.webp","w":1000,"h":286}],"e":[{"img":"img/p097_x1622.webp","w":1000,"h":286}]},
{"n":114,"sec":"std","num":95,"c":"Design security solutions for infrastructure","q":"You have an on-premises app named App1. Remote users access App1 by using VPN connections. You have a third-party software as a service (SaaS) app named App2. You need to deploy Global Secure Access to manage access to App1 and App2. What should you use for each app?","body":[{"p":"You have an on-premises app named App1. Remote users access App1 by using VPN connections. You have a third-party software as a service (SaaS) app named App2. You need to deploy Global Secure Access to manage access to App1 and App2. What should you use for each app?"}],"o":["Microsoft Entra Private Access for App1 and Microsoft Entra Internet Access for App2","Microsoft Entra Private Access for App1 and App2","Microsoft Entra Internet Access for App1 and App2","Microsoft Entra Private Access for App2 and Microsoft Entra Internet Access for App1"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"This is the core Global Secure Access split. Microsoft Entra Private Access is the ZTNA service for private, corporate resources — the on-premises App1 — and replaces VPN with per-app access. Microsoft Entra Internet Access is the identity-aware secure web gateway for internet and SaaS destinations, which is what App2 is. Map 'private/on-premises' to Private Access and 'internet/SaaS' to Internet Access and these questions become mechanical.","source":{"title":"What is Global Secure Access?","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access"}}},
{"n":115,"sec":"std","num":96,"c":"Design security solutions for infrastructure","q":"What should you use?","body":[{"p":"You have a multicloud environment that contains Azure, Amazon Web Services (AWS), and Google Cloud Platform (GCP) subscriptions."},{"p":"You need to discover and review role assignments across the subscriptions."},{"p":"What should you use?"}],"o":["Microsoft Entra Permissions Management","Microsoft Defender for Identity","Azure Lighthouse","Microsoft Entra ID Governance"],"a":"A","review":{"status":"OUTDATED","confidence":"HIGH","explanation":"The product this question keys no longer exists. Microsoft Entra Permissions Management stopped being available for purchase on 1 April 2025 and was retired on 1 November 2025; its documentation is archived. The key was right when written — Permissions Management was the CIEM tool giving “cross-cloud permissions discovery… for AWS, Azure, and GCP” — so it stands, but do not carry it to the exam as a live answer. Multicloud permission visibility now comes through Defender for Cloud's CIEM capabilities in Defender CSPM.","source":{"title":"What's Microsoft Entra Permissions Management? (archived — retired 1 November 2025)","url":"https://learn.microsoft.com/en-us/previous-versions/entra/permissions-management/overview"}}},
{"n":116,"sec":"std","num":97,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"You are designing a security strategy for providing access to Azure App Service web apps through an Azure Front Door instance."},{"p":"You need to recommend a solution to ensure that the web apps only allow access through the Front Door instance."},{"p":"Solution: You recommend access restrictions to allow traffic from the backend IP address of the Front Door instance."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"No, and the reason is practical rather than conceptual. Filtering by IP address is a legitimate technique, but Front Door does not call your origin from one stable backend address. It is a globally distributed service whose egress addresses change as the platform scales, so a rule pinned to today's address is a future outage. That is exactly why Azure publishes the AzureFrontDoor.Backend service tag, which resolves to the whole current set and is maintained for you. Standalone 129 is the version of this question that uses it.","whyWrong":["A. Yes would require Front Door to have a fixed backend IP address, which it does not."],"source":{"title":"Set up Azure App Service access restrictions","url":"https://learn.microsoft.com/en-us/azure/app-service/app-service-ip-restrictions"}}},
{"n":117,"sec":"std","num":98,"c":"Design security operations, identity, and compliance capabilities","q":"What should you create first in Microsoft Entra?","body":[{"p":"You have a Microsoft 365 subscription that contains a group named Group!. The subscription is linked to a Microsoft Entra ID P1 tenant."},{"p":"You have an external software as a service (SaaS) application named Appl. App1 is managed by using a web- based admin portal and supports the use of Microsoft Entra credentials."},{"p":"You need to ensure that only the members of Group1 who sign in from Microsoft Entra joined devices can access the admin portal of App1"},{"p":"What should you create first in Microsoft Entra?"}],"o":["a Conditional Access policy","an enterprise application","a Microsoft Entra application proxy connector group","an access package"],"a":"A","review":{"status":"AMBIGUOUS","confidence":"MEDIUM","explanation":"Flagged because the word \"first\" pulls against the keyed answer, and the stem does not say which reading is intended. The control that enforces the requirement is certainly a Conditional Access policy: target App1, scope it to Group1, and require a Microsoft Entra joined device. But a Conditional Access policy can only target an application that already exists in the tenant as an enterprise application, and the stem describes App1 as an external SaaS app that supports Microsoft Entra credentials, which reads as capable of single sign-on rather than already integrated. On that reading the enterprise application is what you create first and the policy second, which is the only reading in which the word \"first\" does any work. If App1 is already registered, the keyed answer stands and nothing else is needed. Both readings are defensible, so the key is left alone.","whyWrong":["C. An application proxy connector group publishes on-premises apps. App1 is external SaaS.","D. An access package governs who may request access over time. It does not restrict the device a user signs in from."],"source":{"title":"Add an enterprise application to your Microsoft Entra tenant","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/add-application-portal"}}},
{"n":118,"sec":"std","num":99,"c":"Design security solutions for infrastructure","q":"Your company has an on-premise network in Seattle and an Azure subscription. The on-premises network contains a Remote Desktop server.","body":[{"p":"Your company has an on-premise network in Seattle and an Azure subscription. The on-premises network contains a Remote Desktop server."},{"p":"The company contracts a third-party development firm from France to develop and deploy resources to the virtual machines hosted in the Azure subscription."},{"p":"Currently, the firm establishes an RDP connection to the Remote Desktop server. From the Remote Desktop connection, the firm can access the virtual machines hosted in Azure by using custom administrative tools installed on the Remote Desktop server. All the traffic to the Remote Desktop server is captured by a firewall, and the firewall only allows specific connections from France to the server."},{"p":"You need to recommend a modern security solution based on the Zero Trust model. The solution must minimize latency tor developers."},{"p":"Which three actions should you recommend? Each correct answer presents part of the solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["Configure network security groups (NSGs) to allow access from only specific logical groupings of IP address ranges.","Implement Azure Firewall to restrict host pool outbound access.","Configure Azure Active Directory (Azure AD) Conditional Access with multi-factor authentication (MFA) and named locations.","Migrate from the Remote Desktop server to Azure Virtual Desktop.","Deploy a Remote Desktop server to an Azure region located in France."],"a":"B C D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"The three keyed actions replace a single choke-point RDP server with a Zero Trust access path built for a remote, latency-sensitive contractor team. Migrating from the Remote Desktop server to Azure Virtual Desktop removes the shared jump-box and its custom administrative tools, giving each developer a session that terminates close to the Azure resources instead of hairpinning through Seattle. Azure Firewall restricting host pool outbound access (host pool is the AVD term for the set of session hosts) hardens that new AVD deployment's egress rather than leaving it wide open. Conditional Access with MFA and named locations then applies explicit, per-sign-in verification for a workforce connecting from France, which is the identity control a Zero Trust design substitutes for trusting the network path.","whyWrong":["A. Restricting NSGs to specific IP ranges is a network-perimeter control from the model Zero Trust is replacing, and static IP allowlisting for developers in France does nothing to reduce the latency of relaying through a single Seattle-based server.","E. Deploying a second Remote Desktop server into a French Azure region still centralises access through a jump-box with locally installed admin tools, which is the pattern the redesign is meant to retire, not relocate."],"source":{"title":"Just-in-time machine access in Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/firewall/protect-azure-virtual-desktop"}]},
{"n":119,"sec":"std","num":100,"c":"Design security solutions for infrastructure","q":"Which rule should you remove?","body":[{"p":"Your on-premises network contains an Active Directory Domain Services (AD DS) domain named corpxontoso.com and an AD DS-integrated application named App1."},{"p":"Your perimeter network contains a server named Server1 that runs Windows Server."},{"p":"You have a Microsoft Entra tenant named contoso.com that syncs with corp.contoso.com."},{"p":"You plan to implement a security solution that will include the following configurations:"},{"p":"• Manage access to App1 by using Microsoft Entra Private Access."},{"p":"• Deploy a Microsoft Entra application proxy connector to Server1."},{"p":"• Implement single sign-on (SSO) for App1 by using Kerberos constrained delegation."},{"p":"• For Server1, configure the following rules in Windows Defender Firewall with Advanced Security:"},{"p":"o Rule1: Allow TCP 443 inbound from a designated set of Azure URLs."},{"p":"o Rule2: Allow TCP 443 outbound to a designated set of Azure URLs."},{"p":"o Rule3: Allow TCP 80 outbound to a designated set of Azure URLs."},{"p":"o Rule4: Allow TCP 389 outbound to the domain controllers on corp.contoso.com."},{"p":"You need to maximize security for the planned implementation. The solution must minimize the impact on the connector."},{"p":"Which rule should you remove?"}],"o":["Rule1","Rule2","Rule3","Rule4"],"a":"A","srcA":"C","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe application proxy connector never accepts a connection from the internet at all. Microsoft describes the traffic flow as three hops, user to the application proxy cloud service, cloud service to connector, connector to the target application, and states plainly that \"connectors only send outbound requests\" and can run with no perimeter network because everything is outbound. That makes Rule1, which allows inbound TCP 443 from Azure to Server1, a rule the connector's architecture never uses: closing it removes an open inbound port to the internet-facing perimeter server with zero effect on how the connector talks to Azure. Rule3, TCP 80 outbound, is not spare capacity: connectors validate certificates by checking revocation, and Microsoft's own documentation lists port-80 destinations (mscrl.microsoft.com, crl.microsoft.com, ocsp.msocsp.com) that must stay reachable for CRL and OCSP checks. Removing that rule, the source's key, would degrade certificate validation on the very connector the change is meant to protect, which fails the requirement to minimize impact on the connector.","whyWrong":["B. Rule2, outbound 443, carries the connector's primary channel to the application proxy service and to Microsoft Entra ID. Removing it disables the connector outright.","C. Rule3 supports certificate revocation checking over port 80. It is needed, not surplus, so removing it does not maximize security and does affect the connector.","D. Rule4, outbound LDAP to the domain controllers, is required for Kerberos constrained delegation SSO to App1. Removing it breaks the single sign-on the design calls for."],"source":{"title":"Network topology considerations for Microsoft Entra application proxy","url":"https://learn.microsoft.com/en-us/entra/identity/app-proxy/application-proxy-network-topology"},"corrected":true,"originalAnswer":"C"}},
{"n":120,"sec":"std","num":101,"c":"Design security solutions for infrastructure","q":"What should you use?","body":[{"p":"Your network contains an on-premises Active Directory Domain Services (ADDS) domain that syncs with a Microsoft Entra tenant. You need to assess the domain to identify potential credential exposure risks. The solution must meet the following requirements:"},{"p":"• Provide actionable recommendations to mitigate the risks."},{"p":"• Minimize administrative effort"},{"p":"What should you use?"}],"o":["Microsoft Defender for Cloud Apps","Microsoft Secure Score","Microsoft Assessment and Planning (MAP) Toolkit","Microsoft Defender for Identity"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Credential exposure in an AD DS domain is Defender for Identity's posture territory: it identifies risky configurations and exposures, analyses lateral movement paths showing how an attacker would traverse the environment, and surfaces the findings as remediation recommendations through Microsoft Secure Score. That combination — actionable recommendations, no infrastructure to build — is what the two requirements are testing.","whyWrong":["A. Defender for Cloud Apps is a CASB for SaaS activity.","B. Secure Score is where some of these recommendations surface, but it is a score, not the product that assesses the domain.","C. The MAP Toolkit is an inventory and migration-planning tool with no security assessment role."],"source":{"title":"Microsoft Defender for Identity overview","url":"https://learn.microsoft.com/en-us/defender-for-identity/what-is"}}},
{"n":121,"sec":"std","num":102,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 E5 subscription that uses Microsoft Teams.","body":[{"p":"You have a Microsoft 365 E5 subscription that uses Microsoft Teams."},{"p":"Your company has an investment department and a research department Each department has a compliance team."},{"p":"You are designing a Microsoft Purview Information Barriers (IBs) solution to restrict communication between the departments. The solution must meet the following requirements:"},{"p":"• The employees in each department must only be able to communicate with the employees in their respective"},{"p":"department."},{"p":"• The employees on the compliance team of each department must be able to communicate with the"},{"p":"employees on the compliance team of the other department"},{"p":"What is the minimum number of segments and IB policies required? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p102_x1679.webp","w":688,"h":313}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Three segments cover this scenario with nothing left unaccounted for: one for Investment's regular employees, one for Research's regular employees, and a single combined segment for both departments' compliance-team members, so that the compliance segment is never split into two separate ones needing an explicit allow between them. Microsoft's own Information Barriers documentation shows that blocking two segments from each other takes two policies, one per direction (blocking Investment from Research and Research from Investment); with no policy at all referencing the compliance segment, its members remain free to communicate with everyone, including each other and their own department's colleagues, which is exactly \"the compliance team of each department must be able to communicate with the compliance team of the other department\" while the two departments' regular employees stay isolated from each other.","whyWrong":["Splitting the compliance team into two department-specific segments would need an explicit allow policy between them to satisfy their cross-department communication requirement, raising the segment and policy count above the minimum without changing what the solution actually accomplishes."],"source":{"title":"Get started with Information Barriers","url":"https://learn.microsoft.com/en-us/purview/information-barriers-policies"}},"ansimg":[{"img":"img/p102_x1681.webp","w":688,"h":313}],"e":[{"img":"img/p103_x1690.webp","w":763,"h":142}]},
