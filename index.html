{"n":251,"sec":"std","num":232,"c":"Design security solutions for infrastructure","q":"You have a hybrid cloud infrastructure.","body":[{"p":"You have a hybrid cloud infrastructure."},{"p":"You plan to deploy the Azure applications shown in the following table."},{"img":"img/p199_x3181.webp","w":1000,"h":124},{"p":"What should you use to meet the requirement of each app? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p199_x3187.webp","w":624,"h":238}],"ansimg":[{"img":"img/p199_x3170.webp","w":624,"h":238}],"e":[{"img":"img/p199_x3175.webp","w":798,"h":185}]},
{"n":252,"sec":"std","num":233,"c":"Design security solutions for applications and data","q":"You have an Azure subscription that contains virtual machines, storage accounts, and Azure SQL databases. All resources are backed up multiple times a day by using Azure Backup. You are developing a strategy to protect against ransomware attacks.","body":[{"p":"You have an Azure subscription that contains virtual machines, storage accounts, and Azure SQL databases. All resources are backed up multiple times a day by using Azure Backup. You are developing a strategy to protect against ransomware attacks."},{"p":"You need to recommend which controls must be enabled to ensure that Azure Backup can be used to restore the resources in the event of a successful ransomware attack."},{"p":"Which two controls should you include in the recommendation? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point."}],"o":["Use Azure Monitor notifications when backup configurations change.","Require PINs for critical operations.","Perform offline backups to Azure Data Box.","Encrypt backups by using customer-managed keys (CMKs).","Enable soft delete for backups."],"a":"B E","srcA":"A B","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe question asks which controls ensure you can still restore after an attack, and Microsoft answers it directly under “How to block intentional or unintentional deletion of backup data?” — enable soft delete, and require authorization for critical operations. Soft delete is the one that guarantees restorability: it retains deleted backup data for 14 days, and Microsoft warns that “if backups are deleted and soft delete isn't enabled, you or Microsoft can't recover the deleted backup data.” Requiring a PIN for critical operations is the authorization gate offered here. Azure Monitor notifications are a genuine best practice, but they are detective — being told that backups were disabled does not let you restore from them.","whyWrong":["A. Alerting on configuration change tells you an attack happened. It does not preserve a recovery point.","C. Offline copies to Data Box is not an Azure Backup control and is not part of Microsoft’s guidance here.","D. Customer-managed keys change who controls the encryption key. They do nothing to stop a backup being deleted."],"source":{"title":"FAQ — Protect backups from ransomware with Azure Backup","url":"https://learn.microsoft.com/en-us/azure/backup/protect-backups-from-ransomware-faq"},"corrected":true,"originalAnswer":"A B"},"e":[{"p":"https://docs.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against-ransomware"},{"p":"' You need to recommend which CONTROLS must be enabled to ENSURE that Azure Backup can be used to RESTORE the resources in the event of a successful ransomware attack. ' Whilst helpful for auditing purposes and detection of a malicious attack, monitoring configuration changes and alerting after a change is made does not represent a CONTROL which ENSURES Azure Backup can be used to RESTORE the resources."}]},
{"n":253,"sec":"std","num":234,"c":"Design solutions that align with security best practices and priorities","q":"What should you include in the recommendation?","body":[{"p":"You have a Microsoft 365 E5 subscription and an Azure subscription."},{"p":"You need to recommend a solution to enforce the Zero Trust principle of explicit verification for the subscriptions. The solution must be based on Zero Trust guidance in the Microsoft Cybersecurity Reference Architectures (MCRA)."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Defender for Cloud","Conditional Access","Microsoft Entra ID Identity Governance","Microsoft Defender for Identity"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Zero Trust has three principles, and each maps onto a control: verify explicitly, use least privilege access, assume breach. Conditional Access is the enforcement point for verify explicitly. It is the policy engine that takes the signals gathered at sign-in, user, device, location, application, risk, and decides whether to grant access, block it, or require another factor. In the MCRA, Conditional Access sits in front of resources as exactly that gate.","whyWrong":["A. Defender for Cloud gives you posture and workload protection. It is an assume-breach control rather than the verification gate.","C. Identity Governance handles entitlements and reviews, which serves least privilege, not explicit verification at access time.","D. Defender for Identity detects attacks against identity infrastructure. Detection, not verification."],"source":{"title":"What is Conditional Access in Microsoft Entra ID?","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview"}}},
{"n":254,"sec":"std","num":235,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 E5 subscription.","body":[{"p":"You have a Microsoft 365 E5 subscription."},{"p":"You are designing a solution to protect confidential data in Microsoft SharePoint Online sites that contain more than one million documents."},{"p":"You need to recommend a solution to prevent Personally Identifiable Information (Pll) from being shared."},{"p":"Which two components should you include in the recommendation? Each correct answer presents part of the solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["data loss prevention (DLP) policies","sensitivity label policies","retention label policies","eDiscovery cases"],"a":"A B","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"These two work as a pair, which is why the question asks for two components. Sensitivity labels classify the PII and carry the protection with the file; DLP policies act on that classification to stop it leaving — blocking the share, the upload, or the send. Labels decide what something is; DLP decides what may happen to it.","whyWrong":["C. Retention labels govern how long content is kept and what happens at the end of its life, not whether it can be shared.","D. eDiscovery cases search and preserve content for investigations and legal hold. They prevent nothing."],"source":{"title":"Learn about sensitivity labels","url":"https://learn.microsoft.com/en-us/purview/sensitivity-labels"}},"e":[{"p":"Data loss prevention in Office 365. Data loss prevention (DLP) helps you protect sensitive information and prevent its inadvertent disclosure. Examples of sensitive information that you might want to prevent from leaking outside your organization include financial data or personally identifiable information (PII) such as credit card numbers, social security numbers, or health records. With a data loss prevention (DLP) policy, you can identify, monitor, and automatically protect sensitive information across Office 365."},{"p":"Sensitivity labels from Microsoft Purview Information Protection let you classify and protect your organization ' s data without hindering the productivity of users and their ability to collaborate."},{"p":"Plan for integration into a broader information protection scheme. On top of coexistence with OME, sensitivity labels can be used along-side capabilities like"},{"p":"Microsoft Purview Data Loss Prevention (DLP) and Microsoft Defender for Cloud Apps."},{"p":"https://motionwave.com.au/keeping-your-confidential-data-secure-with-microsoft-office-365/https://docs. microsoft.com/en-us/microsoft- 365/solutions/information-protection-deploy-protect-information?view=o365- worldwide#sensitivity -labels"}]},
{"n":255,"sec":"std","num":236,"c":"Design security solutions for infrastructure","q":"You have a Microsoft 365 ES subscription. The subscription contains 500 devices that run Windows 11 Pro and are enrolled in Microsoft Intune You need to evaluate the use of Microsoft Defender Vulnerability Management to provide recommended configuration changes for the devices. Which Endpoint security settings should you use to review the recommended changes?","body":[{"p":"You have a Microsoft 365 ES subscription. The subscription contains 500 devices that run Windows 11 Pro and are enrolled in Microsoft Intune You need to evaluate the use of Microsoft Defender Vulnerability Management to provide recommended configuration changes for the devices. Which Endpoint security settings should you use to review the recommended changes?"}],"o":["Device compliance","Endpoint detection and response","Attack surface reduction","Security tasks"],"a":"D","srcA":"C","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nSecurity tasks is the node that carries Defender Vulnerability Management findings into Intune. Microsoft's instruction is literally the question: Sign in to the Microsoft Intune admin center, select Endpoint security > Security tasks, choose a security task to view its details. A security task states the type of vulnerability, priority, status and steps for remediation, and one of the two remediation types is Configuration, for example configuring a setting in the Microsoft Defender Antivirus profile. That is the recommended configuration change the stem asks about, and the Intune admin accepts or rejects it there.","whyWrong":["A. Device compliance evaluates devices against your own compliance policy and drives Conditional Access. It does not surface vulnerability findings.","B. Endpoint detection and response policy onboards devices to Defender for Endpoint and tunes EDR. It is a configuration you author, not a list of recommendations you review.","C. Attack surface reduction is the node where you author ASR, controlled folder access and exploit protection policies. Hardening settings you deploy, not recommendations coming back from Defender Vulnerability Management."],"source":{"title":"Use Intune to remediate vulnerabilities found by Microsoft Defender for Endpoint","url":"https://learn.microsoft.com/en-us/intune/device-security/microsoft-defender/remediate-vulnerabilities"},"corrected":true,"originalAnswer":"C"}},
{"n":256,"sec":"std","num":237,"c":"Design security operations, identity, and compliance capabilities","q":"Your company is developing an invoicing application that will use Azure Active Directory (Azure AD) B2C. The application will be deployed as an App Service web app. You need to recommend a solution to the application development team to secure the application from identity related attacks. Which two configurations should you recommend? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","body":[{"p":"Your company is developing an invoicing application that will use Azure Active Directory (Azure AD) B2C. The application will be deployed as an App Service web app. You need to recommend a solution to the application development team to secure the application from identity related attacks. Which two configurations should you recommend? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point."}],"o":["Azure AD Conditional Access integration with user flows and custom policies","Azure AD workbooks to monitor risk detections","custom resource owner password credentials (ROPC) flows in Azure AD B2C","access packages in Identity Governance","smart account lockout in Azure AD B2C"],"a":"A E","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Identity-based attacks against a B2C sign-up/sign-in flow are password spraying, credential stuffing and brute-force guessing, and B2C's built-in smart account lockout is the control aimed squarely at that: it tracks failed attempts per account and per IP and blocks further tries once a threshold is crossed, all without any code in the application. Conditional Access integration with B2C user flows and custom policies adds the second, complementary layer, letting the application team require MFA or block risky sign-ins as part of the same authentication journey rather than bolting a check on afterward.","whyWrong":["B. Workbooks visualise risk detections after the fact. They detect and report; they don't prevent an identity attack from succeeding.","C. Custom ROPC flows in B2C are a documented anti-pattern here: ROPC collects the raw username and password directly in the app and bypasses the interactive sign-in experience, which also bypasses MFA and Conditional Access. Recommending it works against securing the app, not for it.","D. Access packages in Identity Governance manage workforce entitlement requests and reviews. B2C is a consumer-identity product; there is no workforce entitlement lifecycle to govern here."],"source":{"title":"Azure AD B2C smart account lockout","url":"https://learn.microsoft.com/en-us/azure/active-directory-b2c/threat-management"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/active-directory-b2c/threat-management"},{"p":"https://docs.microsoft.com/en-us/azure/active-directory-b2c/conditional-access-user-flow?pivots=b2c-user- flow"}]},
{"n":257,"sec":"std","num":238,"c":"Design security solutions for infrastructure","q":"You plan to deploy a dynamically scaling, Linux-based Azure Virtual Machine Scale Set that will host jump servers. The jump servers will be used by support staff who connect f personal and kiosk devices via the internet. The subnet of the jump servers will be associated to a network security group (NSG)","body":[{"p":"You plan to deploy a dynamically scaling, Linux-based Azure Virtual Machine Scale Set that will host jump servers. The jump servers will be used by support staff who connect f personal and kiosk devices via the internet. The subnet of the jump servers will be associated to a network security group (NSG)"},{"p":"You need to design an access solution for the Azure Virtual Machine Scale Set. The solution must meet the following requirements:"},{"p":"• Ensure that each time the support staff connects to a jump server; they must request access to the server."},{"p":"• Ensure that only authorized support staff can initiate SSH connections to the jump servers."},{"p":"• Maximize protection against brute-force attacks from internal networks and the internet."},{"p":"• Ensure that users can only connect to the jump servers from the internet."},{"p":"• Minimize administrative effort"},{"p":"What should you include in the solution? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p203_x3233.webp","w":1000,"h":197}],"ansimg":[{"img":"img/p203_x3239.webp","w":1000,"h":197}],"e":[{"img":"img/p203_x3227.webp","w":1000,"h":106}]},
{"n":258,"sec":"std","num":239,"c":"Design solutions that align with security best practices and priorities","q":"You are designing a security operations strategy based on the Zero Trust framework.","body":[{"p":"You are designing a security operations strategy based on the Zero Trust framework."},{"p":"You need to increase the operational efficiency of the Microsoft Security Operations Center (SOC)."},{"p":"Based on the Zero Trust framework, which three deployment objectives should you prioritize in sequence? To answer, move the appropriate objectives from the list of objectives to the answer area and arrange them in the correct order."},{"img":"img/p204_x3257.webp","w":1000,"h":172}],"ansimg":[{"img":"img/p204_x3263.webp","w":1000,"h":172}],"e":[{"img":"img/p204_x3251.webp","w":1000,"h":151}]},
{"n":259,"sec":"std","num":240,"c":"Design security solutions for infrastructure","q":"You have multiple on-premises Hyper-V hosts that contain virtual machines. The virtual machines run Windows Server.","body":[{"p":"You have multiple on-premises Hyper-V hosts that contain virtual machines. The virtual machines run Windows Server."},{"p":"You have an Azure subscription"},{"p":"You need to recommend a solution to collect Security event logs from the virtual machines by using Microsoft Sentinel. The solution must meet the following requirements:"},{"p":"• Leverage the Windows Security Events via AMA data connector."},{"p":"• Ensure that only specific events are collected."},{"p":"• Minimize costs."},{"p":"What should you recommend? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p205_x3281.webp","w":916,"h":263}],"ansimg":[{"img":"img/p205_x3283.webp","w":916,"h":263}],"e":[{"img":"img/p205_x3275.webp","w":905,"h":131}]},
{"n":260,"sec":"std","num":241,"c":"Design security solutions for applications and data","q":"What should you recommend creating in contoso.com?","body":[{"p":"You have a Microsoft Entra tenant named contoso.com."},{"p":"You have a partner company that has a multi-tenant application named App1. App1 is registered to a Microsoft Entra tenant named fabnkam.com."},{"p":"You need to ensure that the users in contoso.com can authenticate to App1."},{"p":"What should you recommend creating in contoso.com?"}],"o":["a service principal","a system-assigned managed identity","an application object","a user-assigned managed identity"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"When a user in one tenant is the first to authenticate to (or consent to) an application registered in a different tenant, Microsoft Entra ID creates a local representation of that application in the consuming tenant: \"a Service Principal is automatically created in the tenant when the first user from a tenant authenticates to the app… a representation of the application called a service principal is created in the user's tenant.\" That service principal in contoso.com is what makes App1 addressable for Conditional Access, permission grants and sign-in there, so it is what you'd deliberately pre-create rather than leave to happen on a user's first sign-in.","whyWrong":["B. A system-assigned managed identity is tied to a specific Azure resource in your own tenant. It has no relationship to authenticating your users to somebody else's multi-tenant application.","C. An application object is the global definition of App1, and it lives in fabrikam.com, the tenant where App1 is registered, not in contoso.com.","D. A user-assigned managed identity is likewise a workload identity for your own resources, not a mechanism for consuming an external multi-tenant app."],"source":{"title":"Apps & service principals in Microsoft Entra ID","url":"https://learn.microsoft.com/en-us/entra/identity-platform/app-objects-and-service-principals"}}},
{"n":261,"sec":"std","num":242,"c":"Design security solutions for infrastructure","q":"You need to recommend a service to mitigate identified risks that relate to the recommendations. What should you recommend?","body":[{"p":"Your company finalizes the adoption of Azure and is implementing Microsoft Defender for Cloud."},{"p":"You receive the following recommendations in Defender for Cloud"},{"p":"• Access to storage accounts with firewall and virtual network configurations should be restricted,"},{"p":"• Storage accounts should restrict network access using virtual network rules."},{"p":"• Storage account should use a private link connection."},{"p":"• Storage account public access should be disallowed."},{"p":"You need to recommend a service to mitigate identified risks that relate to the recommendations. What should you recommend?"}],"o":["Azure Storage Analytics","Azure Network Watcher","Microsoft Sentinel","Azure Policy"],"a":"D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Every recommendation in the list — restrict network access, use virtual network rules, require a private link, disallow public access — is a resource configuration, and Azure Policy is the service that evaluates and enforces resource configuration at scale. Each of these has a built-in definition, and assigning them stops the drift returning rather than just reporting it again next week.","whyWrong":["A. Storage Analytics is metrics and logging for a storage account.","B. Network Watcher diagnoses network connectivity and traffic.","C. Sentinel is a SIEM: it would alert on the misconfiguration, not prevent it."],"source":{"title":"Overview of Azure Policy","url":"https://learn.microsoft.com/en-us/azure/governance/policy/overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/security-policy-concepthttps://docs.microsoft. com/en-us/security/benchmark/azure/baselines/storage-security-basel ine"}]},
{"n":262,"sec":"std","num":243,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the solution?","body":[{"p":"You have a Microsoft 365 subscription. You have an Azure subscription."},{"p":"You need to implement a Microsoft Purview communication compliance solution for Microsoft Teams and Yammer. The solution must meet the following requirements:"},{"p":"• Assign compliance policies to Microsoft 365 groups based on custom Microsoft Exchange Online attributes."},{"p":"• Minimize the number of compliance policies"},{"p":"• Minimize administrative effort"},{"p":"What should you include in the solution?"}],"o":["Azure AD Information Protection labels","Microsoft 365 Defender user tags","adaptive scopes","administrative units"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Adaptive scopes are built for scoping compliance policies by directory attribute rather than by static group membership, which is exactly the requirement here. They run a query against user or group attributes, including custom Exchange Online attributes, on a recurring schedule, and because one policy can carry one or several adaptive scopes at once, several groups that would otherwise need their own policy can be covered by a single communication compliance policy. That directly satisfies both minimize the number of policies and minimize administrative effort, since there is no distribution group to build and maintain either.","whyWrong":["A. Information Protection labels classify and protect content; they play no role in scoping which users a communication compliance policy covers.","B. Defender user tags group entities for filtering and reporting in Defender, an unrelated product surface from Purview communication compliance policy scoping.","D. Administrative units scope Entra ID administrative delegation. They are not a scoping mechanism communication compliance policies read from."],"source":{"title":"Adaptive scopes in Microsoft Purview","url":"https://learn.microsoft.com/en-us/purview/purview-adaptive-scopes"}}},
{"n":263,"sec":"std","num":244,"c":"Design security solutions for infrastructure","q":"You have an on-premises datacenter. The datacenter contains a server named Server1 that runs Windows Server 2022 and a firewall that prevents Server1 from connecting to the internet.","body":[{"p":"You have an on-premises datacenter. The datacenter contains a server named Server1 that runs Windows Server 2022 and a firewall that prevents Server1 from connecting to the internet."},{"p":"You have an Azure subscription named Sub1."},{"p":"You need to recommend a resiliency strategy for Server1 that incorporates a backup plan to transfer the data from Server1 to Sub1."},{"p":"What should you include in the recommendation? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p207_x3305.webp","w":681,"h":234}],"ansimg":[{"img":"img/p208_x3318.webp","w":681,"h":234}],"e":[{"img":"img/p208_x3323.webp","w":651,"h":92}]},
{"n":264,"sec":"std","num":245,"c":"Design solutions that align with security best practices and priorities","q":"You have legacy operational technology (OT) devices and loT devices.","body":[{"p":"You have legacy operational technology (OT) devices and loT devices."},{"p":"You need to recommend best practices for applying Zero Trust principles to the OT and loT devices based on the Microsoft Cybersecurity Reference Architectures (MCRA). The solution must minimize the risk of disrupting business operations."},{"p":"Which two security methodologies should you include in the recommendation? Each correct answer presents part of the solution."},{"p":"NOTE: Each correct selection is worth one point"}],"o":["passive traffic monitoring","active scanning","threat monitoring","software patching"],"a":"A C","srcA":"C D","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\n\"Minimize the risk of disrupting business operations\" is close to a direct quotation of Microsoft's own warning about the alternative: \"active monitoring runs detection activity directly in your network and may cause some downtime,\" which is precisely why Defender for IoT defaults to agentless, passive monitoring for legacy OT equipment that can crash or misbehave under direct probing. Passive traffic monitoring gets visibility without ever touching the fragile devices, and threat monitoring is the analysis layer built on that same non-intrusive traffic capture, together delivering security awareness with none of the operational risk active scanning carries.","whyWrong":["B. Active scanning is the technique Microsoft explicitly cautions against for exactly the disruption reason in the stem: \"take care when configuring active monitoring so that you only scan necessary resources,\" precisely because it can cause downtime on the devices it touches.","D. Software patching is a remediation activity, not a monitoring methodology, and for legacy OT equipment it is frequently the change most likely to cause an outage, not the one that avoids it."],"source":{"title":"Configure active monitoring for OT networks","url":"https://learn.microsoft.com/en-us/azure/defender-for-iot/organizations/configure-active-monitoring"},"corrected":true,"originalAnswer":"C D"}},
{"n":265,"sec":"std","num":246,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft Entra tenant that contains two users named User! and User2.","body":[{"p":"You have a Microsoft Entra tenant that contains two users named User! and User2."},{"p":"A recent audit reveals that User1 has a permanent assignment to the User Administrator role, even though the user account belongs to a former contractor"},{"p":"The security team at your company has the following requirements:"},{"p":"• Ensure that all privileged role assignments are periodically validated."},{"p":"• Use Privileged Identity Management (PIM) to automate and enforce the validation process"},{"p":"You need to ensure that User2 can meet the security requirements. The solution must follow the principle of least privilege. Which role should you assign to User2, and what should User2 use? To answer, select the appropriate options in the answer area."},{"img":"img/p209_x3339.webp","w":756,"h":267}],"ansimg":[{"img":"img/p209_x3341.webp","w":756,"h":267}],"e":[{"img":"img/p210_x3355.webp","w":786,"h":119}]},
{"n":266,"sec":"std","num":247,"c":"Design solutions that align with security best practices and priorities","q":"You have an Azure DevOps organization that is used to manage the development and deployment of internal apps to multiple Azure subscriptions.","body":[{"p":"You have an Azure DevOps organization that is used to manage the development and deployment of internal apps to multiple Azure subscriptions."},{"p":"You need to implement a DevSecOps strategy based on Microsoft Cloud Adoption Framework for Azure principles. The solution must meet the following requirements:"},{"p":"• All pull requests must be enforced."},{"p":"• All deployments to production must be approved."},{"p":"What should you include in the solution for each requirement? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p210_x3361.webp","w":939,"h":245}],"ansimg":[{"img":"img/p210_x3350.webp","w":939,"h":245}],"e":[{"img":"img/p211_x3374.webp","w":1000,"h":131}]},
{"n":267,"sec":"std","num":248,"c":"Design security solutions for infrastructure","q":"Your network contains an Active Directory Domain Services (AD DS) domain named Domain1.","body":[{"p":"Your network contains an Active Directory Domain Services (AD DS) domain named Domain1."},{"p":"You have a Microsoft Entra tenant."},{"p":"Domain1 syncs with the tenant by using Microsoft Entra Connect."},{"p":"You need to evaluate Microsoft Entra smart lockout by testing the following account lockout considerations:"},{"p":"The number of failed sign-in attempts that trigger a lockout."},{"img":"img/p211_x3380.webp","w":700,"h":298}],"ansimg":[{"img":"img/p212_x3393.webp","w":700,"h":298}],"e":[{"img":"img/p212_x3398.webp","w":718,"h":98}]},
{"n":268,"sec":"std","num":249,"c":"Design security solutions for applications and data","q":"What should you use?","body":[{"p":"You have an Azure subscription. The subscription contains multiple Azure App Service web apps that are distributed across multiple Azure regions and are accessed via the internet"},{"p":"You need to ensure that all incoming requests to the apps are inspected for threats based on the Core Rule Set (CRS) from the Open Web Application Security Project (OWASP). The solution must meet the following requirements:"},{"p":"• Support the use of Microsoft-managed X.509 certificates."},{"p":"• Route users to the geographically closest app."},{"p":"• Minimize administrative effort."},{"p":"What should you use?"}],"o":["Azure Firewall Premium","Azure Front Door with a web application firewall (WAF)","Azure Firewall Standard","Azure Application Gateway with a web application firewall (WAF)"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Three requirements, and only one service satisfies all three. Front Door is a global service that routes each user to the nearest healthy backend, which Application Gateway, being regional, cannot do for apps spread across regions. The WAF policy attached to Front Door uses the Default Rule Set, which is based on the OWASP Core Rule Set. And Front Door issues and renews Microsoft-managed TLS certificates for custom domains, which is where minimise administrative effort is decided.","whyWrong":["A and C. Azure Firewall, in either tier, is a network firewall. Even Premium with IDPS is not an OWASP CRS web application firewall.","D. Application Gateway with WAF does the OWASP inspection well, but it is regional, so meeting the routing requirement would mean one per region plus something in front of them. That is more administrative effort, not less."],"source":{"title":"Web Application Firewall DRS rule groups and rules (Azure Front Door)","url":"https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-drs"}}},
{"n":269,"sec":"std","num":250,"c":"Design security solutions for infrastructure","q":"What should you use?","body":[{"p":"You have an Azure subscription. The subscription contains 50 virtual machines that run Windows Server and 50 virtual machines that run Linux. You need to perform vulnerability assessments on the virtual machines. The solution must meet the following requirements:"},{"p":"• Identify missing updates and insecure configurations."},{"p":"• Use the Qualys engine."},{"p":"What should you use?"}],"o":["Microsoft Defender for Servers","Microsoft Defender Threat Intelligence (Defender Tl)","Microsoft Defender for Endpoint","Microsoft Defender External Attack Surface Management (Defender EASM)"],"a":"A","review":{"status":"OUTDATED","confidence":"HIGH","explanation":"The product in the key is still right; the requirement in the stem is not. Defender for Servers does provide vulnerability assessment, but it no longer uses the Qualys engine — “Defender for Cloud uses Microsoft Defender Vulnerability Management to scan your machines”, in agentless and agent-based modes, and the Qualys-based solution has been retired. A question that asks you to pick a product *because it uses Qualys* can no longer be answered as written. Remember the current pairing: Defender for Servers is the plan, Defender Vulnerability Management is the scanner inside it.","source":{"title":"Enable vulnerability scanning with Microsoft Defender Vulnerability Management","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/deploy-vulnerability-assessment-defender-vulnerability-management"}}},
{"n":270,"sec":"std","num":251,"c":"Design solutions that align with security best practices and priorities","q":"What should you include in the recommendation?","body":[{"p":"You have an operational model based on the Microsoft Cloud Adoption framework for Azure."},{"p":"You need to recommend a solution that focuses on cloud-centric control areas to protect resources such as endpoints, database, files, and storage accounts."},{"p":"What should you include in the recommendation?"}],"o":["security baselines in the Microsoft Cloud Security Benchmark","modern access control","business resilience","network isolation"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The phrase in the stem tracks Microsoft's own description of the benchmark almost word for word: \"The Azure Security Benchmark focuses on cloud-centric control areas.\" Those control areas map directly onto the resource types named in the question: Endpoint Security covers endpoint detection and response, and Data Protection covers protecting data at rest and in transit across storage, databases and files. Security baselines built on this benchmark are exactly the recommendation for an operational model organized around those resource-centric protections.","whyWrong":["B. Modern access control is an identity-centric Zero Trust concept (explicit verification, least privilege), not a resource-type-centric control area for endpoints, databases, files and storage accounts specifically.","C. Business resilience concerns continuity and recovery planning at the organizational level, not per-resource-type security controls.","D. Network isolation is one control among many (it would sit inside the benchmark's Network Security domain), not the umbrella that covers endpoints, databases, files and storage accounts together."],"source":{"title":"Overview of the Azure Security Benchmark v3 (\"cloud-centric control areas\")","url":"https://learn.microsoft.com/en-us/security/benchmark/azure/overview-v3"}}},
{"n":271,"sec":"std","num":252,"c":"Design security operations, identity, and compliance capabilities","q":"You have an Azure subscription and a Microsoft 365 subscription. All users are assigned Microsoft 365 E5 licenses. All computers run Windows 11 and are Microsoft Entra joined.","body":[{"p":"You have an Azure subscription and a Microsoft 365 subscription. All users are assigned Microsoft 365 E5 licenses. All computers run Windows 11 and are Microsoft Entra joined."},{"p":"You need to recommend a solution to prevent computers that run early builds of Windows 11 from connecting to Microsoft 365 services."},{"p":"Which two types of policies should you include in the recommendation? Each correct answer presents part of the solution."}],"o":["Microsoft Defender for Cloud regulatory compliance policy","Microsoft Defender for Endpoint endpoint security policy","Microsoft Entra ID Protection sign-in risk policy","Microsoft Entra Conditional Access policy","Microsoft Intune compliance policy"],"a":"D E","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Blocking a specific OS build from reaching Microsoft 365 needs two things working together: a rule that defines what counts as compliant, and a gate that enforces it at access time. An Intune device compliance policy is where you set the minimum allowed Windows 11 build number, and a device that reports an earlier build is marked noncompliant. A Conditional Access policy then requires device compliance for access to Microsoft 365 services, so a device Intune has already flagged as noncompliant is blocked at sign-in. Neither policy alone does the job: compliance evaluation with nothing reading its result changes nothing, and Conditional Access with no compliance signal to check has nothing to gate on.","whyWrong":["A. A Defender for Cloud regulatory compliance policy assesses Azure resource configuration against a standard. It has no visibility into client Windows build numbers.","B. A Defender for Endpoint endpoint security policy configures antivirus and attack-surface-reduction settings on devices; it does not report OS build compliance to Conditional Access.","C. A sign-in risk policy reacts to anomalous authentication behaviour, not to which Windows build a device is running."],"source":{"title":"Use compliance policies to set rules for devices you manage with Intune","url":"https://learn.microsoft.com/en-us/mem/intune/protect/device-compliance-get-started"}}},
{"n":272,"sec":"std","num":253,"c":"Design security solutions for infrastructure","q":"You are designing the security standards for containerized applications onboarded to Azure. You are evaluating the use of Microsoft Defender for Containers.","body":[{"p":"You are designing the security standards for containerized applications onboarded to Azure. You are evaluating the use of Microsoft Defender for Containers."},{"p":"In which two environments can you use Defender for Containers to scan for known vulnerabilities? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point."}],"o":["Linux containers deployed to Azure Container Registry","Linux containers deployed to Azure Kubernetes Service (AKS)","Windows containers deployed to Azure Container Registry","Windows containers deployed to Azure Kubernetes Service (AKS)","Linux containers deployed to Azure Container Instances"],"a":"A C","review":{"status":"AMBIGUOUS","confidence":"MEDIUM","explanation":"Flagged because the current Defender for Containers support matrix supports three of the five options, not two. Container registry vulnerability assessment for Azure Container Registry is listed as GA for both \"Linux release state\" and \"Windows release state,\" which supports both the keyed answers, Linux containers in ACR and Windows containers in ACR. But the matrix's registry-agnostic \"Runtime container VA\" feature, covering running container images across \"All\" supported resources including AKS, is also GA for Linux, which means Linux containers deployed to AKS is equally well supported by current documentation and not clearly inferior to the two keyed options. Only Windows containers on AKS (whose runtime scanning is explicitly unsupported) and Linux containers on Container Instances (which the matrix does not list among supported resources at all) are clearly excluded. With three of the five options independently well-supported by the current matrix and the question calling for exactly two, the key is left as the source has it and the item is flagged rather than adjudicated between three defensible choices.","source":{"title":"Containers support matrix in Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/support-matrix-defender-for-containers"}},"e":[{"p":"https://docs.microsoft.com/en-us/learn/modules/design-strategy-for-secure-paas-iaas-saas-services/9-specify- security-requirements-for-containers"},{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction#view- vulnerabilities-for-running-images"}]},
{"n":273,"sec":"std","num":254,"c":"Design security solutions for applications and data","q":"The company plans to share specific blobs with vendors. You need to recommend a solution to provide the vendors with secure access to specific blobs without exposing the blobs publicly. The access must be t\\me- Vim\\ted. What should you include in the recommendation?","body":[{"p":"Azure subscription that uses Azure Storage."},{"p":"The company plans to share specific blobs with vendors. You need to recommend a solution to provide the vendors with secure access to specific blobs without exposing the blobs publicly. The access must be t\\me- Vim\\ted. What should you include in the recommendation?"}],"o":["Create shared access signatures (SAS).","Share the connection string of the access key.","Configure private link connections.","Configure encryption by using customer-managed keys (CMKs)"],"a":"A","srcA":"D","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe keyed answer confuses encryption with access control. Customer-managed keys change which key encrypts data at rest; they grant nobody access and expire for no one. A shared access signature is the delegated-access mechanism, and Microsoft describes it as giving “granular control over how a client can access your data — what resources the client may access, what permissions they have to those resources, how long the SAS is valid”. Scoped to specific blobs, with an expiry, and without making the container public: that is the question restated.","whyWrong":["B. Sharing the connection string hands over the account key, granting full access to everything with no expiry.","C. Private Link makes the account reachable privately from a virtual network. External vendors on the internet cannot use it, and it grants no data permissions.","D. Customer-managed keys control encryption at rest. They neither grant nor time-limit access."],"source":{"title":"Grant limited access to data with shared access signatures (SAS)","url":"https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview"},"corrected":true,"originalAnswer":"D"}},
{"n":274,"sec":"std","num":255,"c":"Design security solutions for infrastructure","q":"You have a multi-cloud environment that contains an Azure subscription and an Amazon Web Services (AWS) account.","body":[{"p":"You have a multi-cloud environment that contains an Azure subscription and an Amazon Web Services (AWS) account."},{"p":"You need to implement security services in Azure to manage the resources in both subscriptions. The solution must meet the following requirements:"},{"p":"• Automatically identify threats found in AWS CloudTrail events."},{"p":"• Enforce security settings on AWS virtual machines by using Azure policies."},{"p":"What should you include in the solution for each requirement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p215_x3431.webp","w":1000,"h":258}],"ansimg":[{"img":"img/p216_x3449.webp","w":1000,"h":258}],"e":[{"img":"img/p216_x3454.webp","w":1000,"h":159}]},
{"n":275,"sec":"std","num":256,"c":"Design security solutions for applications and data","q":"Your company has a Microsoft 365 E5 subscription, an Azure subscription, on-premises applications, and Active Directory Domain Services (AD DS).","body":[{"p":"Your company has a Microsoft 365 E5 subscription, an Azure subscription, on-premises applications, and Active Directory Domain Services (AD DS)."},{"p":"You need to recommend an identity security strategy that meets the following requirements:"},{"p":"• Ensures that customers can use their Facebook credentials to authenticate to an Azure App Service website"},{"p":"• Ensures that partner companies can access Microsoft SharePoint Online sites for the project to which they"},{"p":"are assigned"},{"p":"The solution must minimize the need to deploy additional infrastructure components. What should you include in the recommendation? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p216_x3447.webp","w":1000,"h":287}],"ansimg":[{"img":"img/p217_x3467.webp","w":1000,"h":287}],"e":[{"img":"img/p217_x3472.webp","w":1000,"h":167},{"p":"Box 1 -- > https://docs.microsoft.com/en-us/azure/a ctive-directory-b2c/ overview"},{"p":"Box 2 -- > https://docs.micr osoft.com/en-us/azure/active-directory/external-identities/identity-providers"}]},
{"n":276,"sec":"std","num":257,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"Your company is designing an application architecture for Azure App Service Environment (ASE) web apps as shown in the exhibit. (Click the Exhibit tab.)"},{"p":"Communication between the on-premises network and Azure uses an ExpressRoute connection."},{"p":"You need to recommend a solution to ensure that the web apps can communicate with the on-premises application server. The solution must minimize the number of public IP addresses that are allowed to access the on-premises network."},{"p":"What should you include in the recommendation?"}],"o":["Azure Traffic Manager with priority traffic-routing methods","Azure Application Gateway v2 with user-defined routes (UDRs)","Azure Front Door with Azure Web Application Firewall (WAF)","Azure Firewall with policy rule sets"],"a":"D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Read against the exhibit, this is the internally consistent answer: the diagram's \"outbound traffic\" path runs from the App Service Environment's subnet back through a boundary point to the on-premises firewall and app server, and minimizing how many public IP addresses that on-premises firewall must allow means consolidating the ASE's outbound connections behind a small, fixed set of addresses. Azure Firewall does exactly that: route the ASE's egress through it and configure network and NAT rules, and the on-premises side only ever needs to allow the Firewall's own public IP addresses, no matter how the Azure-side app tier scales.","whyWrong":["A. Traffic Manager is DNS-level routing between endpoints. It has no outbound path to an on-premises network.","B. Application Gateway v2 with UDRs is built for inbound traffic to web apps; user-defined routes here steer the gateway's own traffic rather than consolidating outbound egress to on-premises.","C. Front Door with WAF is an inbound accelerator and web firewall for public internet traffic. It has no outbound connection to on-premises at all, so it cannot affect how many public IP addresses the on-premises firewall must allow."],"source":{"title":"Manage a public IP address by using Azure Firewall","url":"https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/configure-public-ip-firewall"}}},
{"n":277,"sec":"std","num":258,"c":"Design solutions that align with security best practices and priorities","q":"What should you use?","body":[{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled. You need to enforce ISO 2700V2013 standards for the subscription. The solution must ensure that noncompliant resources are remediated automatically"},{"p":"What should you use?"}],"o":["the regulatory compliance dashboard in Defender for Cloud","Azure Policy","Azure Blueprints","Azure role-based access control (Azure RBAC)"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The word that decides this is “remediated”. Azure Policy “helps to bring your resources to compliance through bulk remediation for existing resources and automatic remediation for new resources”, using the deployIfNotExists and modify effects with a remediation task. No other option here changes a resource at all.","whyWrong":["A. The regulatory compliance dashboard reports compliance; it remediates nothing on its own.","C. Azure Blueprints is deprecated and deploys artefacts rather than remediating drift.","D. Azure RBAC controls permissions, not resource configuration."],"source":{"title":"Overview of Azure Policy","url":"https://learn.microsoft.com/en-us/azure/governance/policy/overview"}},"e":[{"p":"https://azure.microsoft.com/en-us/blog/simplifying-your-environment-setup-while-meeting-compliance-needs -with-built-in-azure-blueprints/"}]},
{"n":278,"sec":"std","num":259,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution."},{"p":"After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen."},{"p":"You are designing the encryption standards for data at rest for an Azure resource."},{"p":"You need to provide recommendations to ensure that the data at rest is encrypted by using AES-256 keys. The solution must support rotating the encryption keys monthly."},{"p":"Solution: For Azure SQL databases, you recommend Transparent Data Encryption (TDE) that uses Microsoft- managed keys."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"No, for the same reason as Standalone 74. Transparent data encryption protects the database with AES-256 whichever key you use, so the algorithm requirement is met. The rotation requirement is not: with the service-managed key, Microsoft owns the key lifecycle and rotates on its own schedule, so you cannot commit to a monthly rotation. The customer-managed key variant in Standalone 276 is the one that gives you that control.","source":{"title":"Transparent data encryption with customer-managed keys (BYOK)","url":"https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview"}}},
{"n":279,"sec":"std","num":260,"c":"Design solutions that align with security best practices and priorities","q":"Your company has a multi-cloud environment that contains a Microsoft 365 subscription, an Azure subscription, and Amazon Web Services (AWS) implementation. You need to recommend a security posture management solution for the following components:","body":[{"p":"Your company has a multi-cloud environment that contains a Microsoft 365 subscription, an Azure subscription, and Amazon Web Services (AWS) implementation. You need to recommend a security posture management solution for the following components:"},{"p":"• Azure loT Edge devices"},{"p":"• AWS EC2 instances"},{"p":"Which services should you include in the recommendation? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p219_x3495.webp","w":1000,"h":358}],"ansimg":[{"img":"img/p219_x3497.webp","w":1000,"h":358}],"e":[{"img":"img/p220_x3509.webp","w":613,"h":109},{"p":"https://docs.microsoft.com/en-us/azure/defender-for-iot/organizations/architecture"},{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws?pivots=env-settings"},{"p":"https://docs.microsoft.com/en-us/azure/azure-arc/servers/overview#supported-cloud-operations"}]},
{"n":280,"sec":"std","num":261,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the solution?","body":[{"p":"You have a customer that has a Microsoft 365 subscription and an Azure subscription."},{"p":"The customer has devices that run either Windows, iOS, Android, or macOS. The Windows devices are deployed on-premises and in Azure."},{"p":"You need to design a security solution to assess whether all the devices meet the customer ' s compliance rules."},{"p":"What should you include in the solution?"}],"o":["Microsoft Information Protection","Microsoft Defender for Endpoint","Microsoft Sentinel","Microsoft Intune"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Compliance policies in Intune are the mechanism that evaluates devices against rules you define, minimum OS version, encryption, jailbreak status, antivirus health, and mark each device compliant or not. Intune covers all four platforms in the stem, Windows, iOS, Android and macOS, and the Windows devices being on-premises or in Azure makes no difference because compliance is evaluated by the device's own MDM channel. The compliance state then feeds Conditional Access.","whyWrong":["A. Information Protection classifies and protects content, not devices.","B. Defender for Endpoint reports device risk and threat detections. It contributes a signal to compliance but does not define or evaluate the customer’s rules.","C. Sentinel is a SIEM."],"source":{"title":"Use compliance policies to set rules for devices you manage with Intune","url":"https://learn.microsoft.com/en-us/mem/intune/protect/device-compliance-get-started"}},"e":[{"p":"https://docs.microsoft.com/en-us/mem/intune/protect/compliance-policy-monitor#open-the-compliance- dashboard"}]},
{"n":281,"sec":"std","num":262,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"You have to Azure subscriptions that contain 100 role-based access control (RBAC) role assignments."},{"p":"You plan to consolidate the role assignments."},{"p":"You need to recommend a solution to identify which role assignments were NOT used during the last 90 days. The solution must minimize administrative effort."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Defender for Cloud","Microsoft Entra access reviews","Microsoft Entra Privileged Identity Management (PIM)","Microsoft Entra Permissions Management"],"a":"D","review":{"status":"OUTDATED","confidence":"HIGH","explanation":"Same retired product as Standalone 96. Permissions Management was the tool that measured the gap between permissions granted and permissions used, and could automatically delete permissions unused for the past 90 days — which is why the key matched the stem so exactly. It was retired on 1 November 2025 and its documentation is archived, so treat the underlying idea (find unused entitlements, right-size them) as the examinable point rather than the product name.","source":{"title":"What's Microsoft Entra Permissions Management? (archived — retired 1 November 2025)","url":"https://learn.microsoft.com/en-us/previous-versions/entra/permissions-management/overview"}}},

{"n":284,"sec":"std","num":265,"c":"Design solutions that align with security best practices and priorities","q":"You have an on-premises network and a Microsoft 365 subscription.","body":[{"p":"You have an on-premises network and a Microsoft 365 subscription."},{"p":"You are designing a Zero Trust security strategy."},{"p":"Which two security controls should you include as part of the Zero Trust solution? Each correct answer part of the solution."},{"p":"NOTE: Each correct answer is worth one point."}],"o":["Block sign-attempts from unknown location.","Always allow connections from the on-premises network.","Disable passwordless sign-in for sensitive account.","Block sign-in attempts from noncompliant devices."],"a":"A D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Both keyed controls are the Zero Trust principles applied directly. Blocking sign-ins from unknown locations is verify explicitly, using location as a signal in the access decision. Blocking sign-ins from non-compliant devices is device health as a condition of access, which is the same principle plus assume breach. The two distractors are useful precisely because they are the pre-Zero-Trust habits the model rejects.","whyWrong":["B. Always allowing connections from the on-premises network is the network perimeter assumption that Zero Trust exists to replace. Location does not confer trust.","C. Disabling passwordless sign-in for sensitive accounts moves in the wrong direction. Zero Trust calls for stronger, phishing-resistant authentication on privileged accounts, not weaker."],"source":{"title":"What is Zero Trust?","url":"https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview"}}},

{"n":286,"sec":"std","num":267,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription and an Azure subscription. Microsoft 365 Defender and Microsoft Defender for Cloud are enabled.","body":[{"p":"You have a Microsoft 365 subscription and an Azure subscription. Microsoft 365 Defender and Microsoft Defender for Cloud are enabled."},{"p":"The Azure subscription contains a Microsoft Sentinel workspace. Microsoft Sentinel data connectors are configured for Microsoft 365, Microsoft 365 Defender, Defender for Cloud, and Azure."},{"p":"You plan to deploy Azure virtual machines that will run Windows Server."},{"p":"You need to enable extended detection and response (EDR) and security orchestration, automation, and response (SOAR) capabilities for Microsoft Sentinel."},{"p":"How should you recommend enabling each capability? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p225_x3596.webp","w":1000,"h":272}],"ansimg":[{"img":"img/p225_x3598.webp","w":1000,"h":272}],"e":[{"img":"img/p226_x3610.webp","w":732,"h":114},{"p":"For SOAR read this https://docs.microsoft.com/en-us/azure/sentinel/automate-responses-with-playbooks"},{"p":"Endpoint detection and response (EDR) and eXtended detection and response (XDR) are both part of Microsoft Defender. https://docs.microsoft.com/en-us /microsoft-36 5/security/defender/eval-overview? view=o365-worldwide"}]},
{"n":287,"sec":"std","num":268,"c":"Design security solutions for applications and data","q":"You need to ensure that users can access the web apps by connecting through the Global Secure Access application. What should you use?","body":[{"p":"You have a Microsoft Entra tenant that uses Microsoft Entra Private Access. You plan to publish a group of internal web apps by using a Global Secure Access application."},{"p":"You need to ensure that users can access the web apps by connecting through the Global Secure Access application. What should you use?"}],"o":["a Conditional Access policy that grants access from only compliant devices","a forwarding profile that directs all outbound internet traffic through the Microsoft backbone network","a connector group that contains the connectors used to access the web apps and a single endpoint for the internal fully qualified domain names (FQDNs)","an access policy that limits connections based on user groups"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Publishing internal apps through a Global Secure Access application has two required parts, and this option carries both: the connector group whose connectors sit next to the apps and broker the traffic outbound, and the application segment naming the internal FQDN or IP and ports to reach. Without them the app is an empty container and nothing routes.","whyWrong":["A. A Conditional Access policy controls who may use the app once it is published. Useful, but it publishes nothing.","B. A forwarding profile for outbound internet traffic is the Internet Access side of Global Secure Access, not Private Access.","D. An access policy limiting connections by user group is again about authorisation rather than connectivity."],"source":{"title":"Configure per-app access for Microsoft Entra Private Access","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-configure-per-app-access"}}},
