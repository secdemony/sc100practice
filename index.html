{"n":162,"sec":"std","num":143,"c":"Design security operations, identity, and compliance capabilities","q":"You need to recommend a solution to expose several accounts for attackers to exploit. When the attackers attempt to exploit the accounts, an alert must be triggered. Which Defender for Identity feature should you include in the recommendation?","body":[{"p":"Your company has a Microsoft 365 subscription and uses Microsoft Defender for Identity."},{"p":"You are informed about incidents that relate to compromised identities."},{"p":"You need to recommend a solution to expose several accounts for attackers to exploit. When the attackers attempt to exploit the accounts, an alert must be triggered. Which Defender for Identity feature should you include in the recommendation?"}],"o":["standalone sensors","honeytoken entity tags","sensitivity labels","custom user tags"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Microsoft's description of the honeytoken tag is the requirement restated: tag honeytoken accounts to set traps for malicious actors, these accounts are usually dormant, and any sign-in from a honeytoken account triggers an alert. Because the accounts have no legitimate use, any authentication at all is suspicious, which makes them a very low false-positive detection. Contrast Standalone 60, which asks for fake credentials planted on client computers: that is deception in Defender for Endpoint, and a honeytoken plants nothing on an endpoint.","whyWrong":["A. Standalone sensors are a deployment option for the sensor software, not a detection feature.","C. Sensitivity labels are a Purview classification control for content.","D. Custom user tags let you group entities for filtering and reporting. Only the Honeytoken tag creates the alerting trap."],"source":{"title":"Entity tags in Microsoft Defender for Identity","url":"https://learn.microsoft.com/en-us/defender-for-identity/entity-tags"}},"e":[{"p":"https://docs.microsoft.com/en-us/advanced-threat-analytics/suspicious-activity-guide#honeytoken-activity"},{"p":"The Sensitive tag is used to identify high value assets.(user / devices / groups)Honeytoken entities are used as traps for malicious actors. Any authentication associated with these honeytoken entities triggers an alert. and Defender for Identity considers Exchange servers as high-value assets and automatically tags them as Sensitive"}]},
{"n":163,"sec":"std","num":144,"c":"Design security operations, identity, and compliance capabilities","q":"You have an Azure subscription.","body":[{"p":"You have an Azure subscription."},{"p":"You need to use a federated model in Azure API Management to control access to your organization ' s APIs. The solution must meet the following requirements:"},{"p":"• Support the use of role-based access control (RBAC) to manage the APIs."},{"p":"• Support the use of keys to control the consumption of the APIs."},{"p":"To which scope should you associate each control method? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p133_x2098.webp","w":646,"h":255}],"ansimg":[{"img":"img/p134_x2111.webp","w":646,"h":255}],"e":[{"img":"img/p134_x2116.webp","w":646,"h":132}]},
{"n":164,"sec":"std","num":145,"c":"Design security solutions for infrastructure","q":"What should you include in the response plan?","body":[{"p":"Your company wants to optimize using Microsoft Defender for Endpoint to protect its resources against ransomware based on Microsoft Security Best Practices."},{"p":"You need to prepare a post-breach response plan for compromised computers based on the Microsoft Detection and Response Team (DART) approach in Microsoft Security Best Practices."},{"p":"What should you include in the response plan?"}],"o":["controlled folder access","application isolation","memory scanning","machine isolation","user isolation"],"a":"D","srcA":"B","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThis is a post-breach plan for computers that are already compromised, so the answer has to be a containment action, and in Defender for Endpoint that is device isolation. Microsoft's description matches the ransomware case exactly: \"Depending on the severity of the attack and the sensitivity of the device, you might want to isolate the device from the network. Device isolation can help prevent the attacker from controlling the compromised device and performing further activities such as data exfiltration and lateral movement.\" The isolated device stays connected to the Defender service so investigation continues while the attacker's path is cut. The keyed answer, application isolation, is not a Defender for Endpoint response action at all; the nearest real feature, Application Guard, is a pre-breach hardening control.","whyWrong":["A. Controlled folder access is preventive. It stops untrusted apps writing to protected folders before an attack succeeds, which is what Standalone 176 and 130 test.","B. Application isolation is not a response action in Defender for Endpoint. Application Guard hardens browsing and documents in advance.","C. Memory scanning is a detection technique, not a containment step.","E. There is no user isolation action. The identity-side equivalents are disabling the account or forcing a sign-out, which are separate controls."],"source":{"title":"Take response actions on a device in Microsoft Defender for Endpoint","url":"https://learn.microsoft.com/en-us/defender-endpoint/respond-machine-alerts"},"corrected":true,"originalAnswer":"B"}},
{"n":165,"sec":"std","num":146,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the solution?","body":[{"p":"You have a Microsoft 365 tenant that contains two groups named Group1 and Group2."},{"p":"You use Microsoft Defender XDR to manage the tenants of your company ' s customers."},{"p":"You need to ensure that the users in Group1 can perform security tasks in the tenant of each customer. The solution must meet the following requirements:"},{"p":"The Group1 users must only be assigned the Security Operator role for the customer tenants."},{"p":"The users in Group2 must be able to assign the Security Operators role to the Group1 users for the customer tenants."},{"p":"The use of guest accounts must be minimized."},{"p":"Administrative effort must be minimized."},{"p":"What should you include in the solution?"}],"o":["Privileged Identity Management (PIM)","multi-user authorization (MUA)","Microsoft Entra B2B collaboration","Azure Lighthouse"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Azure Lighthouse is purpose-built for a managing organization's users to act inside customer tenants under precisely scoped roles, using delegated resource management rather than guest accounts: Group1 can be delegated the Security Operator role directly in each customer tenant, and Group2 can be delegated a role capable of managing that assignment, both without inviting anyone as a B2B guest. Because delegation is defined once as infrastructure (typically an ARM template applied per customer), administrative effort stays low as customers are added.","whyWrong":["A. PIM manages eligible-to-active role activation within a single tenant. It has no mechanism for projecting roles into a different customer's tenant.","B. Multi-user authorization gates specific high-risk operations (like disabling backup protection) behind a second approver. It is not a cross-tenant delegation model.","C. B2B collaboration is exactly the guest-account pattern the requirement says to minimize; inviting Group1's users as guests in every customer tenant is the opposite of what Lighthouse avoids."],"source":{"title":"What is Azure Lighthouse?","url":"https://learn.microsoft.com/en-us/azure/lighthouse/overview"}}},
{"n":166,"sec":"std","num":147,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the solution?","body":[{"p":"You have a multicloud environment that contains an Azure subscription, an Amazon Web Services (AWS) subscription, and a Google Cloud Platform (GCP) subscription."},{"p":"You plan to assess data security and compliance."},{"p":"You need to design a Compliance Manager solution that meets the following requirements:"},{"p":"• Provides recommended improvement actions that include detailed implementation guidance"},{"p":"• Automatically monitors regulatory compliance"},{"p":"• Minimizes administrative effort"},{"p":"What should you include in the solution?"}],"o":["Microsoft Defender for Cloud","Microsoft Defender for Cloud Apps","Microsoft Sentinel D. Compliance Manager connectors"],"a":"A","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged for a defect in the source rather than a dispute about the answer. In the published exam dump the option list for this question is broken: what should be four options appears as three, because option D ran into option C on the page and was extracted as the single string \"Microsoft Sentinel D. Compliance Manager connectors\". The intended fourth option, Compliance Manager connectors, is very likely the answer, since it is the mechanism that brings assessment data from AWS and GCP into Compliance Manager, monitors it continuously and supplies improvement actions with implementation guidance. But because the option cannot be selected on its own, the item is not answerable as printed and the key is left untouched. This is the only merged-option defect in the whole bank; the remaining 309 questions parse cleanly."}},
{"n":167,"sec":"std","num":148,"c":"Design security solutions for applications and data","q":"You have an Azure subscription that contains Azure App Service web apps. The apps have the following characteristics:","body":[{"p":"You have an Azure subscription that contains Azure App Service web apps. The apps have the following characteristics:"},{"p":"• The apps are deployed by using continuous integration and continuous deployment (CI/CD) pipelines in"},{"p":"Azure DevOps."},{"p":"• The apps are deployed to a test environment first, and then to a production environment."},{"p":"• The source code for the apps is stored in Azure Repos."},{"p":"You plan to implement DevSecOps controls based on the Microsoft Cloud Adoption Framework for Azure. You need to recommend testing controls to meet the following requirements:"},{"p":"• All the source code must be tested for security vulnerabilities in Azure Repos before deploying the apps."},{"p":"• Once the apps are deployed to the test environment they must be tested for security vulnerabilities."},{"p":"Which testing method should you recommend for each stage? To answer, select the options in the answer area."},{"p":"NOTE: Each correct answer is worth one point."},{"img":"img/p136_x2139.webp","w":976,"h":357}],"ansimg":[{"img":"img/p137_x2148.webp","w":976,"h":357}],"e":[{"img":"img/p137_x2153.webp","w":991,"h":162}]},
{"n":168,"sec":"std","num":149,"c":"Design solutions that align with security best practices and priorities","q":"Which framework should you follow to create the design?","body":[{"p":"You are designing the security standards for a new Azure environment."},{"p":"You need to design a privileged identity strategy based on the Zero Trust model."},{"p":"Which framework should you follow to create the design?"}],"o":["Enhanced Security Admin Environment (ESAE)","Microsoft Security Development Lifecycle (SDL)","Rapid Modernization Plan (RaMP)","Microsoft Operational Security Assurance (OSA)"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Microsoft opens the RaMP article with its purpose: this rapid modernization plan will help you quickly adopt Microsoft's recommended privileged access strategy. It is a prioritised roadmap of initiatives, separate privileged accounts, turn on PIM, require phishing-resistant MFA for admins, block legacy authentication, deploy privileged access workstations, and it is the Zero Trust guidance for privileged identity specifically.","whyWrong":["A. ESAE, the red forest, is the legacy on-premises hardened forest model. Microsoft has retired it in favour of the modern privileged access strategy.","B. The Security Development Lifecycle governs how software is built.","D. Operational Security Assurance is about how Microsoft runs its own services, not a customer design framework for privileged identity."],"source":{"title":"Rapidly modernize your security infrastructure (privileged access RaMP)","url":"https://learn.microsoft.com/en-us/security/privileged-access-workstations/security-rapid-modernization-plan"}},"e":[{"p":"https://docs.microsoft.com/en-us/security/compass/security-rapid-modernization-planThisrapid modernization plan (RAMP) will help you quickly adopt Microsoft ' s recommended privileged access strategy."}]},
{"n":169,"sec":"std","num":150,"c":"Design solutions that align with security best practices and priorities","q":"Your company plans to apply the Zero Trust Rapid Modernization Plan (RaMP) to its IT environment.","body":[{"p":"Your company plans to apply the Zero Trust Rapid Modernization Plan (RaMP) to its IT environment."},{"p":"You need to recommend the top three modernization areas to prioritize as part of the plan."},{"p":"Which three areas should you recommend based on RaMP? Each correct answer presents part of the solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["data, compliance, and governance","user access and productivity","infrastructure and development","modern security operations","operational technology (OT) and loT"],"a":"A B D","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged because the specific framing this question tests no longer has a live, canonical source to check it against. Historically, Microsoft's Zero Trust Rapid Modernization Plan did group its guidance into three priority scenarios named user access and productivity, data/compliance/governance, and modernizing security operations, which is what the keyed answer selects, and archived versions of Microsoft's own RaMP documentation confirm this structure existed. But Microsoft has since reorganized this guidance: the current Zero Trust adoption content on Microsoft Learn is built around a broader set of technology pillars (identities, endpoints, data, apps, infrastructure, network and security operations) and a general adoption methodology, and no live page states this specific three-of-five prioritization in these terms any more. The underlying substance is very likely still an accurate historical answer, but because the exact claim can no longer be checked against a current Microsoft Learn source, and inventing a citation for a page that no longer says this is exactly what the review rules prohibit, the item is flagged for manual review rather than marked verified.","source":{"title":"Rapidly modernize your security posture for Zero Trust","url":"https://learn.microsoft.com/en-us/security/zero-trust/adopt/rapidly-modernize-security-posture"}}},
{"n":170,"sec":"std","num":151,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription that contains several storage accounts. The storage accounts are accessed by legacy applications that are authenticated by using access keys."},{"p":"You need to recommend a solution to prevent new applications from obtaining the access keys of the storage accounts. The solution must minimize the impact on the legacy applications."},{"p":"What should you include in the recommendation?"}],"o":["Apply read-only locks on the storage accounts.","Set the AllowSharcdKeyAccess property to false.","Set the AllowBlobPublicAcccss property to false.","Configure automated key rotation."],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The requirement that decides this is “minimize the impact on the legacy applications”. A read-only lock blocks the List Keys operation — Microsoft states plainly that “a read-only lock on a storage account prevents users from listing the account keys”, because listKeys is a POST and locks block the control plane. New applications therefore cannot obtain a key, while legacy applications already holding one keep working, since locks do not touch the data plane.","whyWrong":["B. Setting AllowSharedKeyAccess to false rejects every request authorized with an account key — it would break the legacy applications outright. Microsoft explicitly says to migrate clients to Microsoft Entra ID before doing this.","C. AllowBlobPublicAccess governs anonymous public read access, a different problem entirely.","D. Rotating keys automatically does not stop anyone from retrieving the current key, and it breaks apps holding the old one."],"source":{"title":"Lock your Azure resources - considerations before applying locks","url":"https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources"}]},
{"n":171,"sec":"std","num":152,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"You are designing a security strategy for providing access to Azure App Service web apps through an Azure Front Door instance. You need to recommend a solution to ensure that the web apps only allow access through the Front Door instance."},{"p":"Solution: You recommend access restrictions based on HTTP headers that have the Front Door ID."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Yes, and this is the strictest of the four solutions in the family. Every Front Door instance stamps requests with an X-Azure-FDID header carrying its own Front Door ID, and an App Service access restriction rule can match on that header. Because the ID is unique to your instance, this closes the gap left by the service tag in Standalone 129, which admits traffic from any customer's Front Door. Microsoft's guidance is to use both together: the service tag narrows the source to Front Door, the header pins it to yours.","source":{"title":"Set up Azure App Service access restrictions","url":"https://learn.microsoft.com/en-us/azure/app-service/app-service-ip-restrictions"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/frontdoor/front-door-faq#how-do-i-lock-down-the-access-to-my- backend-to-only-azure-front-door-"}]},
{"n":172,"sec":"std","num":153,"c":"Design security operations, identity, and compliance capabilities","q":"Domain1 syncs with the tenant by using Microsoft Entra Connect Sync. You need to monitor Domainl for privilege escalation attacks. What should you use?","body":[{"p":"Your network contains an Active Directory Domain Services (AD DS) domain named Domain! You have a Microsoft Entra tenant."},{"p":"Domain1 syncs with the tenant by using Microsoft Entra Connect Sync. You need to monitor Domainl for privilege escalation attacks. What should you use?"}],"o":["Microsoft Entra ID Protection","Microsoft Defender for Identity","Microsoft Defender for Servers","Privileged Identity Management (PIM)"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Privilege escalation against a synced on-premises domain is a core Defender for Identity detection: it monitors “privilege escalation and suspicious role or group membership changes” and domain-dominance behaviour such as DCShadow and Golden Ticket. Note the direction of travel — the domain syncs to Entra ID, but the attack happens on-premises, so a cloud identity product cannot see it.","whyWrong":["A. Entra ID Protection evaluates cloud sign-in risk, not on-premises privilege escalation.","C. Defender for Servers protects the server workload.","D. PIM governs how Entra roles are activated. It is a preventive control, not a detection for an attack already underway in AD DS."],"source":{"title":"Microsoft Defender for Identity overview","url":"https://learn.microsoft.com/en-us/defender-for-identity/what-is"}}},
{"n":173,"sec":"std","num":154,"c":"Design solutions that align with security best practices and priorities","q":"What should you recommend using to compare the baselines to the current device configurations?","body":[{"p":"Your company has devices that run either Windows 10, Windows 11, or Windows Server."},{"p":"You are in the process of improving the security posture of the devices."},{"p":"You plan to use security baselines from the Microsoft Security Compliance Toolkit."},{"p":"What should you recommend using to compare the baselines to the current device configurations?"}],"o":["Microsoft Intune","Policy Analyzer","Local Group Policy Object (LGPO)","Windows Autopilot"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Policy Analyzer is the tool in the Security Compliance Toolkit built for this comparison. It reads Group Policy Objects, including the baseline GPOs shipped in the toolkit and the effective policy on a local machine, and reports redundancies, internal inconsistencies and differences between sets, which is how you see where a device drifts from the baseline.","whyWrong":["A. Intune deploys and reports on its own security baselines. It is not what compares the Security Compliance Toolkit baselines to existing configuration.","C. LGPO is the toolkit’s companion utility for applying and exporting local policy. It writes settings; Policy Analyzer compares them.","D. Autopilot provisions new devices."],"source":{"title":"Microsoft Security Compliance Toolkit","url":"https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/windows-security-configuration-framework/security-compliance-toolkit-10"}},"e":[{"p":"https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-security-configuration- framework/security-compliance-toolkit-10"}]},
{"n":174,"sec":"std","num":155,"c":"Design security solutions for infrastructure","q":"You have 1,000 on-premises servers that run Linux.","body":[{"p":"You have 1,000 on-premises servers that run Linux."},{"p":"You have an Azure subscription that contains a Microsoft Sentinel workspace named WS1 and 1,000 virtual machines that run Linux."},{"p":"All the on-premises Linux servers are onboarded to Azure Arc"},{"p":"You plan to collect Common Event Format (CEF) logs."},{"p":"You need to design a solution for collecting specific events from the logs. The solution must meet the following requirements:"},{"p":"• Minimize the number of Microsoft Entra identities required."},{"p":"• Minimize the number of events delivered to WS1."},{"p":"• Ensure that all the required events are ingested."},{"p":"• Minimize administrative effort."},{"p":"What should you include in the solution? To answer, select the options in the answer area."},{"p":"NOTE: Each correct answer is worth one point."},{"img":"img/p140_x2189.webp","w":1000,"h":247}],"ansimg":[{"img":"img/p141_x2209.webp","w":1000,"h":247}],"e":[{"p":"C:\\Users\\Waqas Shahid\\Desktop\\Mudassir\\Untitled.jpg"},{"img":"img/p141_x2214.webp","w":1000,"h":193}]},
{"n":175,"sec":"std","num":156,"c":"Design security operations, identity, and compliance capabilities","q":"Your company wants to optimize ransomware incident investigations.","body":[{"p":"Your company wants to optimize ransomware incident investigations."},{"p":"You need to recommend a plan to investigate ransomware incidents based on the Microsoft Detection and Response Team (DART) approach."},{"p":"Which three actions should you recommend performing in sequence in the plan? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order."},{"img":"img/p141_x2198.webp","w":1000,"h":169}],"ansimg":[{"img":"img/p141_x2204.webp","w":1000,"h":169}],"e":[{"img":"img/p142_x2223.webp","w":1000,"h":189}]},
{"n":176,"sec":"std","num":157,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the solution?","body":[{"p":"You have a Microsoft 365 subscription that contains 1,000 users. Each user is assigned a Microsoft 365 E5 license."},{"p":"The subscription uses sensitivity labels to classify corporate documents. All the users have Windows 11 devices that are onboarded to Microsoft Defender for Endpoint and are configured to sync files to Microsoft OneDrive."},{"p":"You need to prevent the users from uploading the documents from OneDrive to external websites."},{"p":"What should you include in the solution?"}],"o":["Microsoft Purview Information Protection","Microsoft Purview data loss prevention (DLP)","web content filtering in Defender for Endpoint","an endpoint security policy"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The leak path in this question runs from OneDrive sync to the local device to an external website in the browser, and stopping it needs a policy that can see that browser upload. That is endpoint DLP's Devices location, whose upload-to-a-restricted-cloud-service-domain rule blocks exactly this action regardless of what label the document carries. Sensitivity labels classify and can encrypt the document, but a labeled file a user is authorized to open can still be dragged into a browser and uploaded; DLP is the control that stops the action itself.","whyWrong":["A. Information Protection creates and applies the labels. It does not enforce what a user may do with a file they are permitted to open.","C. Web content filtering blocks sites by content category (gambling, adult content, and so on); it has no concept of a specific document being uploaded.","D. A generic endpoint security policy covers device hardening, not content-aware upload blocking, which is a DLP capability specifically."],"source":{"title":"Learn about Endpoint data loss prevention","url":"https://learn.microsoft.com/en-us/purview/endpoint-dlp-learn-about"}}},
{"n":177,"sec":"std","num":158,"c":"Design security solutions for infrastructure","q":"You have an Active Directory Domain Services (AD DS) domain that contains a virtual desktop infrastructure (VDI). The VDI uses non-persistent images and cloned virtual machine templates. VDI devices are members of the domain.","body":[{"p":"You have an Active Directory Domain Services (AD DS) domain that contains a virtual desktop infrastructure (VDI). The VDI uses non-persistent images and cloned virtual machine templates. VDI devices are members of the domain."},{"p":"You have an Azure subscription that contains an Azure Virtual Desktop environment. The environment contains host pools that use a custom golden image. All the Azure Virtual Desktop deployments are members of a single Azure Active Directory Domain Services (Azure AD DS) domain."},{"p":"You need to recommend a solution to deploy Microsoft Defender for Endpoint to the hosts. The solution must meet the following requirements:"},{"p":"• Ensure that the hosts are onboarded to Defender for Endpoint during the first startup sequence."},{"p":"• Ensure that the Microsoft Defender 365 portal contains a single entry for each deployed VDI host."},{"p":"• Minimize administrative effort."},{"p":"What should you recommend? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p143_x2245.webp","w":1000,"h":220}],"ansimg":[{"img":"img/p143_x2251.webp","w":1000,"h":220}],"e":[{"img":"img/p143_x2239.webp","w":1000,"h":120}]},
{"n":178,"sec":"std","num":159,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription that contains a Microsoft SharePoint Online site named Site1. Site1 stores documents that are based on a predefined form and include confidential employee information.","body":[{"p":"You have a Microsoft 365 subscription that contains a Microsoft SharePoint Online site named Site1. Site1 stores documents that are based on a predefined form and include confidential employee information."},{"p":"You monitor access to Site1 by using a Microsoft Defender for Cloud Apps session policy."},{"p":"You need to ensure that step-up authentication is triggered when a user downloads documents that are based on the predefined form. The solution must minimize administrative effort."},{"p":"Which Microsoft Data Classification Service inspection method should you use, and which Conditional Access option should you add to the session policy? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p144_x2269.webp","w":714,"h":224}],"ansimg":[{"img":"img/p144_x2275.webp","w":714,"h":224}],"e":[{"img":"img/p144_x2263.webp","w":735,"h":135}]},
{"n":179,"sec":"std","num":160,"c":"Design security solutions for infrastructure","q":"You have an Azure subscription that has Microsoft Defender for Cloud enabled. You have an Amazon Web Services (AWS) implementation.","body":[{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled. You have an Amazon Web Services (AWS) implementation."},{"p":"You plan to extend the Azure security strategy to the AWS implementation. The solution will NOT use Azure Arc. Which three services can you use to provide security for the AWS resources? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point."}],"o":["Azure Active Directory (Azure AD) Privileged Identity Management (PIM)","Azure Active Directory (Azure AD) Conditional Access","Microsoft Defender for servers","Azure Policy","Microsoft Defender for Containers"],"a":"C D E","srcA":"B D E","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe requirement is to secure the AWS resources themselves, and Conditional Access has nothing to do with that: it is an Entra ID sign-in control that gates user access to applications, not a control that scans, hardens or protects EC2 instances, containers or resource configuration in an AWS account. The three services that actually reach into the AWS estate through Defender for Cloud's native AWS connector, without needing Azure Arc, are Defender for Servers, which Microsoft's direct-onboarding path extends to AWS EC2 instances using the Defender for Endpoint agent; Azure Policy, whose multicloud recommendations and regulatory-compliance assessments read AWS resource configuration (S3, IAM, security groups and so on) directly through the connector rather than through an Arc-enabled guest; and Defender for Containers, which Microsoft states explicitly supports \"agentless threat protection\" for AWS and GCP with no Arc dependency.","whyWrong":["A. PIM manages eligible role activation in Entra ID and Azure. It has no visibility into or effect on AWS resource security.","B. Conditional Access is a sign-in gate for applications. It does not assess or protect the configuration of AWS infrastructure."],"source":{"title":"Connect your AWS account to Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-aws"},"corrected":true,"originalAnswer":"B D E"},"e":[{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/supported-machines-endpoint-solutions-clouds- containers? tabs=aws-eks"}]},
{"n":180,"sec":"std","num":161,"c":"Design security solutions for applications and data","q":"You have an Azure subscription that contains App Service web apps in four Azure regions. Users connect to the apps from the internet.","body":[{"p":"You have an Azure subscription that contains App Service web apps in four Azure regions. Users connect to the apps from the internet."},{"p":"You plan to block requests to the apps if the requests contain security threats specified in the Core Rule Set (CRS) of the Open Web Application Security Project (OWASP)."},{"p":"You need to design a solution to block the requests. The solution must meet the following requirements:"},{"p":"• Maintain access to the apps in the event of a region outage."},{"p":"• Minimize the number of resources required."},{"p":"What should you include in the design? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p145_x2287.webp","w":895,"h":315}],"ansimg":[{"img":"img/p146_x2296.webp","w":895,"h":315}],"e":[{"img":"img/p146_x2301.webp","w":916,"h":134}]},
{"n":181,"sec":"std","num":162,"c":"Design security solutions for infrastructure","q":"You plan to deploy a dynamically scaling, Linux-based Azure Virtual Machine Scale Set that will host jump servers. The jump servers will be used by support staff who connect from personal and kiosk devices via the internet. The subnet of the jump servers will be associated to a network security group (NSG).","body":[{"p":"You plan to deploy a dynamically scaling, Linux-based Azure Virtual Machine Scale Set that will host jump servers. The jump servers will be used by support staff who connect from personal and kiosk devices via the internet. The subnet of the jump servers will be associated to a network security group (NSG)."},{"p":"You need to design an access solution for the Azure Virtual Machine Scale Set. The solution must meet the following requirements:"},{"p":"• Ensure that each time the support staff connects to a jump server; they must request access to the server."},{"p":"• Ensure that only authorized support staff can initiate SSH connections to the jump servers."},{"p":"• Maximize protection against brute-force attacks from internal networks and the internet."},{"p":"• Ensure that users can only connect to the jump servers from the internet."},{"p":"• Minimize administrative effort."},{"p":"What should you include in the solution? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p147_x2320.webp","w":1000,"h":181}],"ansimg":[{"img":"img/p147_x2326.webp","w":1000,"h":181}],"e":[{"img":"img/p147_x2314.webp","w":1000,"h":108}]},
{"n":182,"sec":"std","num":163,"c":"Design solutions that align with security best practices and priorities","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription."},{"p":"You plan to deploy Azure App Services apps by using Azure DevOps."},{"p":"You need to recommend a solution to ensure that deployed apps maintain compliance with Microsoft cloud security benchmark (MCSB) recommendations."},{"p":"What should you include in the recommendation?"}],"o":["DevOps security in Microsoft Defender for Cloud","Microsoft Defender for App Service","a branch policy in Azure DevOps","Azure Policy"],"a":"D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"The Microsoft cloud security benchmark is delivered as an Azure Policy initiative, so keeping deployed App Service apps compliant with it means assigning that initiative and letting Azure Policy evaluate each app as it is created or updated. The distractors are all about the pipeline rather than the deployed resource.","whyWrong":["A. DevOps security in Defender for Cloud assesses the repositories and pipelines, not the running App Service.","B. Defender for App Service detects threats against the running app; it does not enforce a benchmark.","C. A branch policy gates code review before merge, well before anything is deployed."],"source":{"title":"Overview of Azure Policy","url":"https://learn.microsoft.com/en-us/azure/governance/policy/overview"}}},
{"n":183,"sec":"std","num":164,"c":"Design solutions that align with security best practices and priorities","q":"You have an Azure subscription that is used as an Azure landing zone for an application. You need to evaluate the security posture of all the workloads in the landing zone. What should you do first?","body":[{"p":"You have an Azure subscription that is used as an Azure landing zone for an application. You need to evaluate the security posture of all the workloads in the landing zone. What should you do first?"}],"o":["Add Microsoft Sentinel data connectors.","Configure Continuous Integration/Continuous Deployment (CI/CD) vulnerability scanning.","Enable the Defender plan for all resource types in Microsoft Defender for Cloud.","Obtain Azure Active Directory Premium Plan 2 licenses."],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Nothing about a landing zone's workloads can be assessed until the relevant Defender for Cloud plans are switched on across the resource types in it; assessment is what those plans exist to produce. Enabling the Defender plan for all resource types is the one action that starts producing a security posture at all, for compute, storage, databases and everything else in the landing zone in one step, which is why it has to come first.","whyWrong":["A. Sentinel data connectors feed a SIEM with security events. They say nothing about the configuration posture of the landing zone's resources.","B. CI/CD vulnerability scanning checks code and images before deployment. It says nothing about the posture of resources already running in the landing zone.","D. Entra ID P2 licenses unlock ID Protection and PIM features. They have no bearing on assessing workload posture across a landing zone."],"source":{"title":"Connect on-premises machines to Microsoft Defender for Cloud (Azure Arc)","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-machines"}}},
{"n":184,"sec":"std","num":165,"c":"Design security operations, identity, and compliance capabilities","q":"You need to recommend a solution to send security events from Microsoft Sentinel to Splunk. What should you include in the recommendation?","body":[{"p":"Your company has a third-party security information and event management (SIEM) solution that uses Splunk and Microsoft Sentinel. You plan to integrate Microsoft Sentinel with Splunk."},{"p":"You need to recommend a solution to send security events from Microsoft Sentinel to Splunk. What should you include in the recommendation?"}],"o":["Azure Event Hubs","Azure Data Factor","a Microsoft Sentinel workbook","a Microsoft Sentinel data connector"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The direction of travel decides this. Data connectors bring data into Sentinel; getting data out to a third-party SIEM goes the other way, and the supported mechanism is a Log Analytics workspace data export rule with an event hub as the destination. Splunk then reads from the event hub using the Splunk Add-on for Microsoft Cloud Services. Event Hubs is the standard hand-off point between Azure Monitor and any external consumer.","whyWrong":["B. Data Factory is an ETL and data movement service for analytics workloads, not a streaming egress for security events.","C. A workbook renders data inside Sentinel. It exports nothing.","D. A data connector is inbound. This is the trap in the question: it is the right noun pointing the wrong way."],"source":{"title":"Log Analytics workspace data export in Azure Monitor","url":"https://learn.microsoft.com/en-us/azure/azure-monitor/logs/logs-data-export"}}},
{"n":185,"sec":"std","num":166,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription that contains multiple Azure Blob Storage accounts."},{"p":"You need to recommend a solution to detect threats in files after the files are uploaded to a blob container."},{"p":"What should you include in the recommendation?"}],"o":["vulnerability assessment in Microsoft Defender for Containers","runtime threat protection in Microsoft Defender for Containers","malware scanning in Microsoft Defender for Storage","sensitive data threat detection in Microsoft Defender for Storage"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Malware scanning in Defender for Storage is triggered on upload: a blob written to a container is scanned in near real time and the result is surfaced as a scan result and an alert, which is precisely detect threats in files after the files are uploaded. It is an add-on capability of the Defender for Storage plan, enabled per storage account.","whyWrong":["A and B. Both Defender for Containers capabilities protect Kubernetes and container images, not a blob container. The word container in the stem is storage terminology and this is the trap.","D. Sensitive data threat detection tells you the blob holds sensitive data and raises the severity of alerts about it. It is about the sensitivity of the content, not about the file being malicious."],"source":{"title":"Malware scanning in Microsoft Defender for Storage","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/introduction-malware-scanning"}}},
{"n":186,"sec":"std","num":167,"c":"Design solutions that align with security best practices and priorities","q":"You have a Microsoft 365 £5 subscription.","body":[{"p":"You have a Microsoft 365 £5 subscription."},{"p":"You plan to implement Microsoft Priva Subject Rights Requests for Microsoft 365 data."},{"p":"You need to streamline the creation and processing of subject rights requests. The solution must minimize development effort."},{"p":"What should you include in the solution? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p149_x2351.webp","w":800,"h":277}],"boxes":[{"label":"To streamline creation","value":"The Microsoft Graph API"},{"label":"To streamline processing","value":"Microsoft Power Automate"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Priva's subject rights request automation is built around exactly this split. Creating requests programmatically, at scale or on a schedule rather than one at a time through the portal, is done through the Microsoft Graph API, which is what \"streamline creation\" with minimal development effort points to: a small script or scheduled job against the API, not a bespoke intake application. Processing an already-created request, retrieving the relevant data, routing tasks, sending notifications, is instead automated with prebuilt Power Automate templates and connectors that Priva ships specifically for SRR workflows, requiring configuration rather than custom code.","whyWrong":["Swapping the two would mean hand-coding the workflow orchestration in Graph API calls, which is more development effort, not less, and trying to bulk-create requests through Power Automate’s connector surface, which is built for orchestrating the process rather than for request creation at scale."],"source":{"title":"Automate Subject Rights Requests in Microsoft Priva","url":"https://learn.microsoft.com/en-us/privacy/priva/subject-rights-requests-automate"}},"ansimg":[{"img":"img/p149_x2357.webp","w":800,"h":277}],"e":[{"img":"img/p150_x2369.webp","w":827,"h":174}]},
{"n":187,"sec":"std","num":168,"c":"Design security solutions for infrastructure","q":"Your network contains an on-premises Active Directory Domain Services (AO DS) domain. The domain contains a server that runs Windows Server and hosts shared folders The domain syncs with Azure AD by using Azure AD Connect Azure AD Connect has group writeback enabled.","body":[{"p":"Your network contains an on-premises Active Directory Domain Services (AO DS) domain. The domain contains a server that runs Windows Server and hosts shared folders The domain syncs with Azure AD by using Azure AD Connect Azure AD Connect has group writeback enabled."},{"p":"You have a Microsoft 365 subscription that uses Microsoft SharePoint Online."},{"p":"You have multiple project teams. Each team has an AD DS group that syncs with Azure AD Each group has permissions to a unique SharePoint Online site and a Windows Server shared folder for its project. Users routinely move between project teams."},{"p":"You need to recommend an Azure AD identity Governance solution that meets the following requirements:"},{"p":"• Project managers must verify that their project group contains only the current members of their project team"},{"p":"• The members of each project team must only have access to the resources of the project to which they are"},{"p":"assigned"},{"p":"• Users must be removed from a project group automatically if the project manager has MOT verified the"},{"p":"group s membership for 30 days."},{"p":"• Administrative effort must be minimized."},{"p":"What should you include in the recommendation? To answer select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p150_x2375.webp","w":624,"h":163}],"ansimg":[{"img":"img/p151_x2384.webp","w":624,"h":163}],"e":[{"img":"img/p151_x2389.webp","w":1000,"h":143}]},
{"n":188,"sec":"std","num":169,"c":"Design security solutions for infrastructure","q":"What is the first step in the recovery plan?","body":[{"p":"You have a Microsoft 365 subscription that syncs with Active Directory Domain Services (AD DS)."},{"p":"You need to define the recovery steps for a ransomware attack that encrypted data in the subscription The solution must follow Microsoft Security Best Practices."},{"p":"What is the first step in the recovery plan?"}],"o":["Disable Microsoft OneDnve sync and Exchange ActiveSync.","Recover files to a cleaned computer or device.","Contact law enforcement.","From Microsoft Defender for Endpoint perform a security scan."],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Order is the whole question here, and the playbook settles it. Disabling Exchange ActiveSync and OneDrive sync is a containment step, under Prevent the spread, and Microsoft explains why: pausing OneDrive sync stops cloud data being overwritten by an already infected device. Everything else on the list belongs to eradication and recovery, which comes afterwards: remove the malware by running a full antivirus scan (step 5), then recover files on a cleaned device (step 6), and only at the very end re-enable the sync you disabled (step 9). Stop the encryption spreading into the cloud copies before you try to recover anything from them.","whyWrong":["B. Recovering files to a cleaned device is step 6 of eradication and recovery, well after containment.","C. Contacting law enforcement may be right for your organisation, but it appears nowhere in Microsoft’s technical playbook and does nothing to contain the attack.","D. Running a security scan is step 5, part of removing the malware, and it comes after containment."],"source":{"title":"Responding to ransomware attacks (Microsoft Defender XDR playbook)","url":"https://learn.microsoft.com/en-us/defender-xdr/playbook-responding-ransomware-m365-defender"}}},
{"n":189,"sec":"std","num":170,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"A customer has a Microsoft 365 E5 subscription and an Azure subscription."},{"p":"The customer wants to centrally manage security incidents, analyze log, audit activity, and search for potential threats across all deployed services."},{"p":"You need to recommend a solution for the customer. The solution must minimize costs."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft 365 Defender","Microsoft Defender for Cloud","Microsoft Defender for Cloud Apps","Microsoft Sentinel"],"a":"D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Read the four requirements together: centrally manage incidents, analyse logs, audit activity, and hunt, all across every deployed service. That is a SIEM, and Sentinel is the only option that spans both the Azure subscription and the Microsoft 365 estate. The cost requirement is about not standing up several overlapping tools, not about picking the cheapest product in the list.","whyWrong":["A. Microsoft 365 Defender (now Defender XDR) correlates across the Microsoft 365 workloads, but does not cover the Azure subscription resources.","B. Defender for Cloud is CSPM and cloud workload protection for Azure resources; it is not where you audit Microsoft 365 activity.","C. Defender for Cloud Apps covers SaaS usage only."],"source":{"title":"What is Microsoft Sentinel?","url":"https://learn.microsoft.com/en-us/azure/sentinel/overview"}}},
{"n":190,"sec":"std","num":171,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription.","body":[{"p":"You have a Microsoft 365 subscription."},{"p":"You need to design a solution to block file downloads from Microsoft SharePoint Online by authenticated users on unmanaged devices."},{"p":"Which two services should you include in the solution? Each correct answer presents part of the solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["Microsoft Defender for Cloud Apps","Azure AD Application Proxy","Azure Data Catalog","Azure AD Conditional Access","Microsoft Purview Information Protection"],"a":"A D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"This needs both halves and the question says so. A Defender for Cloud Apps **session policy** with Conditional Access App Control is what inspects the live session and blocks the download — Microsoft's own example is allowing access from unmanaged devices while limiting the download of sensitive files. But a session policy cannot work alone: “in order for your session policy to work, you must also have a Microsoft Entra ID Conditional Access policy”, which routes the session through Defender for Cloud Apps in the first place.","whyWrong":["B. Application Proxy publishes on-premises web apps; SharePoint Online is already a cloud service.","C. Azure Data Catalog is a data discovery service, long superseded, and unrelated.","E. Purview Information Protection can label and encrypt the file, but it does not block the download action based on device management state."],"source":{"title":"Create session policies in Microsoft Defender for Cloud Apps","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/session-policy-aad"}}},
{"n":191,"sec":"std","num":172,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"You have a Microsoft 365 tenant that contains 5,000 users and 5,000 Windows 11 devices. All users are assigned Microsoft 365 £5 licenses and the Microsoft Defender Vulnerability Management add-on. The Windows 11 devices are managed by using Microsoft Intune and Microsoft Defender for Endpoint. The Windows 11 devices are configured during deployment to comply with Center for Internet Security (CIS) benchmarks for Windows 11."},{"p":"You need to recommend a compliance solution for the Windows 11 devices. The solution must identify devices that were modified and no longer comply with the CIS benchmarks."},{"p":"What should you include in the recommendation?"}],"o":["Authenticated scan for Windows in Microsoft Defender Vulnerability Management","Microsoft Secure Score for Devices in Defender for Endpoint","attack surface reduction (ASR) rules in Defender for Endpoint","security baselines assessments in Microsoft Defender Vulnerability Management"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Security baselines assessment is the Defender Vulnerability Management feature built for exactly this: it “helps you to continuously and effortlessly monitor your organization's security baselines compliance and identify changes in real time”, comparing devices against a base benchmark — and CIS benchmarks for Windows 10, Windows 11 and Windows Server are explicitly supported. Devices configured to CIS at deployment and later modified show up as non-compliant against the profile.","whyWrong":["A. An authenticated scan reaches unmanaged devices; these devices are already onboarded.","B. Microsoft Secure Score for Devices is an aggregate posture score, not a per-device CIS compliance result.","C. Attack surface reduction rules harden the device against specific attack techniques; they do not measure benchmark drift."],"source":{"title":"Security baselines assessment in Microsoft Defender Vulnerability Management","url":"https://learn.microsoft.com/en-us/defender-vulnerability-management/tvm-security-baselines"}}},
{"n":192,"sec":"std","num":173,"c":"Design security solutions for infrastructure","q":"What should you include in the solution?","body":[{"p":"You have an Azure subscription that contains 100 virtual machines, a virtual network named VNet1, and 20 users. The virtual machines run Windows Server and are connected to VNet1. The users work remotely and access Azure resources from Linux workstations."},{"p":"You need to ensure that the users can connect to the virtual machines from the workstations by using Secure Shell {SSH). The solution must meet the following requirements:"},{"p":"• Ensure that the users authenticate by using their Microsoft Entra credentials."},{"p":"• Prevent the users from transferring files from the virtual machines by using SSH."},{"p":"• Prevent the users from directly accessing the virtual machines by using the public IP address of the virtual"},{"p":"machines."},{"p":"What should you include in the solution?"}],"o":["Azure Bastion","Azure NAT Gateway","just-in-time (JIT) VM access","Point-to-Site (P2S) VPN"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Azure Bastion satisfies all three requirements from one service. Native client sign-in supports Microsoft Entra credentials for the connection, which meets the authentication requirement, and Microsoft documents that \"file transfer over SSH isn't supported using the native client SSH method\" at all, which is exactly the restriction the stem wants, achieved as an inherent property of the connection path rather than a setting to configure. Because Bastion is the connection point and no NSG rule permits direct access to the VMs' public IP addresses, the third requirement is met by the same design.","whyWrong":["B. A NAT gateway provides outbound internet access for a subnet; it has no bearing on inbound SSH, authentication, or file transfer.","C. Just-in-time VM access narrows when a port is open and to whom, but it does not itself authenticate with Entra credentials or block SSH file transfer.","D. A point-to-site VPN gives the user network-level reachability to the VNet, after which they could still connect directly to a VM's IP with ordinary SSH file transfer available, so it does not meet either the block-file-transfer or the block-public-IP-access requirement."],"source":{"title":"Connect to a VM using Bastion - Linux native client (file transfer over SSH)","url":"https://learn.microsoft.com/en-us/azure/bastion/connect-vm-native-client-linux"}}},
{"n":193,"sec":"std","num":174,"c":"Design solutions that align with security best practices and priorities","q":"For a Microsoft cloud environment, you need to recommend a security architecture that follows the Zero Trust principles of the Microsoft Cybersecurity Reference Architectures (MCRA).","body":[{"p":"For a Microsoft cloud environment, you need to recommend a security architecture that follows the Zero Trust principles of the Microsoft Cybersecurity Reference Architectures (MCRA)."},{"p":"Which security methodologies should you include in the recommendation? To answer, drag the appropriate methodologies to the"},{"p":"correct principles. Each methodology may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p154_x2431.webp","w":818,"h":166}],"ansimg":[{"img":"img/p154_x2437.webp","w":818,"h":166}],"e":[{"img":"img/p154_x2425.webp","w":828,"h":142}]},
{"n":194,"sec":"std","num":175,"c":"Design solutions that align with security best practices and priorities","q":"For a Microsoft cloud environment, you are designing a security architecture based on the Microsoft Cloud Security Benchmark.","body":[{"p":"For a Microsoft cloud environment, you are designing a security architecture based on the Microsoft Cloud Security Benchmark."},{"p":"What are three best practices for identity management based on the Azure Security Benchmark? Each correct answer presents a complete solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["Manage application identities securely and automatically.","Manage the lifecycle of identities and entitlements","Protect identity and authentication systems.","Enable threat detection for identity and access management.","Use a centralized identity and authentication system."],"a":"A C E","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"All three keyed options are named, numbered controls in the benchmark's Identity Management domain: IM-2 is titled \"Protect identity and authentication systems,\" IM-3 is \"Manage application identities securely and automatically,\" and IM-1 is \"Use a centralized identity and authentication system.\" The two excluded options belong to other domains: managing the lifecycle of identities and entitlements is PA-3, under Privileged Access, and there is no Identity Management control named for enabling threat detection as such, since the benchmark places threat detection under its own Logging and Threat Detection domain (LT-1).","whyWrong":["B. Managing the lifecycle of identities and entitlements is control PA-3, filed under Privileged Access, not Identity Management.","D. \"Enable threat detection for identity and access management\" does not correspond to a distinct Identity Management control; threat detection capabilities are their own benchmark domain (Logging and Threat Detection), with identity-specific detection covered as guidance under IM-2 rather than as a separate numbered control."],"source":{"title":"Microsoft cloud security benchmark - Identity Management","url":"https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-identity-management"}}},
{"n":195,"sec":"std","num":176,"c":"Design security solutions for infrastructure","q":"You are designing a ransomware response plan that follows Microsoft Security Best Practices. You need to recommend a solution to minimize the risk of a ransomware attack encrypting local user files What should you include in the recommendation?","body":[{"p":"You are designing a ransomware response plan that follows Microsoft Security Best Practices. You need to recommend a solution to minimize the risk of a ransomware attack encrypting local user files What should you include in the recommendation?"}],"o":["Controlled folder access","Azure Files","Windows Defender Device Guard","Microsoft Defender for Endpoint","BitLocker Drive Encryption (BitLocker)"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Controlled folder access exists for exactly this: “Ransomware encrypts your files and holds them hostage. CFA counters this threat by allowing only trusted apps to change files in protected folders.” It is an attack surface reduction capability in Defender for Endpoint, delivered by Microsoft Defender Antivirus, and it protects the user profile folders by default.","whyWrong":["B. Azure Files is cloud file storage, not a control on the endpoint.","C. Device Guard (now App Control for Business) controls which code may run, a different control from guarding a folder’s contents.","D. Defender for Endpoint is the platform that contains the feature. The question asks which control to use, and CFA is the specific one.","E. BitLocker encrypts the volume at rest. It does not stop a process running on the signed-in device from encrypting files."],"source":{"title":"Protect folders from ransomware with controlled folder access","url":"https://learn.microsoft.com/en-us/defender-endpoint/controlled-folders"}}},
{"n":196,"sec":"std","num":177,"c":"Design security solutions for infrastructure","q":"What should you use?","body":[{"p":"You have an on-premises datacenter and an Azure Kubernetes Service (AKS) cluster named AKS1."},{"p":"You need to restrict internet access to the public endpoint of AKS 1. The solution must ensure that AKS1 can be accessed only from the public IP addresses associated with the on-premises datacenter."},{"p":"What should you use?"}],"o":["a network security group (N5G)","a service endpoint","a private endpoint","an authorized IP range"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The AKS API server is a managed endpoint outside your virtual network, so the usual network controls do not apply to it. Authorized IP ranges is the feature made for this: you supply a list of CIDR ranges and the API server accepts requests only from them, which is exactly restricting access to your datacentre's public addresses. Remember to include the egress address of the cluster itself and of anything else that calls the API server.","whyWrong":["A. A network security group filters traffic in your virtual network. The API server endpoint is not in it.","B. A service endpoint extends a virtual network identity to a PaaS service. It is not an inbound filter on the API server.","C. A private endpoint is the private cluster answer, which removes the public endpoint altogether. The stem asks to restrict the public endpoint, not to eliminate it."],"source":{"title":"Secure access to the API server using authorized IP address ranges in AKS","url":"https://learn.microsoft.com/en-us/azure/aks/api-server-authorized-ip-ranges"}}},
{"n":197,"sec":"std","num":178,"c":"Design security solutions for applications and data","q":"You have a Microsoft Entra tenant that is linked to a Microsoft 365 subscription and an Azure subscription. The tenant contains service principals that are used to access applications in the Azure subscription.","body":[{"p":"You have a Microsoft Entra tenant that is linked to a Microsoft 365 subscription and an Azure subscription. The tenant contains service principals that are used to access applications in the Azure subscription."},{"p":"You need to recommend a solution to detect risky sign-ins and other risky activities performed by the service principals in the tenant. The solution must minimize costs."},{"p":"What should you include in the recommendation? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p156_x2468.webp","w":771,"h":275}],"ansimg":[{"img":"img/p156_x2470.webp","w":771,"h":275}],"e":[{"img":"img/p156_x2462.webp","w":723,"h":153}]},
{"n":198,"sec":"std","num":179,"c":"Design solutions that align with security best practices and priorities","q":"To which subscriptions can the Defender for Cloud standard be applied?","body":[{"p":"You have an Azure subscription that uses Microsoft Defender for Cloud."},{"p":"You have Amazon Web Services (AWS), Google Cloud Platform (GCP). and Oracle Cloud Infrastructure (OCI) subscriptions."},{"p":"You create a custom security standard in Defender for Cloud."},{"p":"To which subscriptions can the Defender for Cloud standard be applied?"}],"o":["Azure and AWS only","Azure and GCP only","Azure. AWS, and GCP only","Azure, AWS. and OCI only","Azure, AWS, GCP. and OCI"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Defender for Cloud's multicloud coverage is Azure, AWS and GCP, and custom security standards can be created and assigned across all three. Oracle Cloud Infrastructure is not a Defender for Cloud connector, which is what makes it the distractor in every option that includes it.","whyWrong":["A and B. Both omit one of the three supported clouds.","D and E. Both include OCI, which Defender for Cloud does not connect to."],"source":{"title":"Create custom security standards and recommendations in Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/custom-security-policies"}}},
{"n":199,"sec":"std","num":180,"c":"Design security operations, identity, and compliance capabilities","q":"You are designing a privileged access strategy for a company named Contoso, Ltd. and its partner company named Fabrikam, Inc. Contoso has a Microsoft Entra tenant named contoso.com. Fabrikam has a Microsoft Entra tenant named fabrikam.com. Users at Fabrikam must access the resources in contoso.com.","body":[{"p":"You are designing a privileged access strategy for a company named Contoso, Ltd. and its partner company named Fabrikam, Inc. Contoso has a Microsoft Entra tenant named contoso.com. Fabrikam has a Microsoft Entra tenant named fabrikam.com. Users at Fabrikam must access the resources in contoso.com."},{"p":"You need to provide the Fabrikam users with access to the Contoso resources by using access packages. The solution must meet the following requirements:"},{"p":"• Ensure that the Fabrikam users can use the Contoso access packages without explicitly creating guest"},{"p":"accounts in contoso.com."},{"p":"• Allow non-administrative users in contoso.com to create the access packages."},{"p":"What should you use for each requirement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p157_x2482.webp","w":1000,"h":233}],"boxes":[{"label":"Ensure Fabrikam users can use access packages without creating guest accounts","value":"A connected organization"},{"label":"Allow non-administrative users to create access packages","value":"Catalogs"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"A connected organization is the entitlement management object built for letting users from an external directory request and use access packages without first becoming individual guest accounts in your own tenant; associating Fabrikam as a connected organization is what lets its users be recognized and granted access packages while Entra ID manages the guest lifecycle behind the scenes rather than an admin manually inviting each one. Delegating access package creation to non-administrative users runs through catalogs: Microsoft's delegation model is built around catalog-scoped roles like Catalog owner and Access package manager, and a catalog is the container those roles are granted on, which is how a non-admin in contoso.com gets the ability to create and manage access packages without being handed tenant-wide Identity Governance Administrator rights.","whyWrong":["An external organization and an identity provider are not the entitlement management terms for this relationship; connected organization is the object Microsoft's documentation actually defines for it.","Administrative units scope directory role delegation over users and groups, not the ability to create access packages. Programs are not an entitlement management delegation construct."],"source":{"title":"Delegation and roles in entitlement management","url":"https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-delegate"}},"ansimg":[{"img":"img/p158_x2495.webp","w":1000,"h":233}],"e":[{"img":"img/p158_x2500.webp","w":1000,"h":125}]},
{"n":200,"sec":"std","num":181,"c":"Design security solutions for applications and data","q":"You are planning the security requirements for Azure Cosmos DB Core (SQL) API accounts. You need to recommend a solution to audit all users that access the data in the Azure Cosmos DB accounts. Which two configurations should you include in the recommendation? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","body":[{"p":"You are planning the security requirements for Azure Cosmos DB Core (SQL) API accounts. You need to recommend a solution to audit all users that access the data in the Azure Cosmos DB accounts. Which two configurations should you include in the recommendation? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point."}],"o":["Enable Microsoft Defender for Cosmos DB.","Send the Azure Active Directory (Azure AD) sign-in logs to a Log Analytics workspace.","Disable local authentication for Azure Cosmos DB.","Enable Microsoft Defender for Identity.","Send the Azure Cosmos DB logs to a Log Analytics workspace."],"a":"C E","srcA":"B C","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nAuditing who touched the data needs two things: every request must be attributable to an identity, and every request must be recorded. Disabling local authentication is the first half. While the account keys work, any caller holding a key is indistinguishable from any other, so no log can name a user. Sending the Cosmos DB diagnostic logs to a Log Analytics workspace is the second half. The DataPlaneRequests category captures every data plane operation for the Cosmos DB account, and its table carries AadPrincipalId, the AAD Principal ID of the caller issuing the data plane request, alongside the operation, the container and the client IP. Entra sign-in logs were the keyed choice but they record token issuance, not the individual reads and writes against a container, so they cannot show which users accessed the data.","whyWrong":["A. Defender for Cosmos DB detects anomalous and potentially malicious access. It is threat detection, not an audit trail of all access.","B. Entra sign-in logs show authentication events, not per-request data plane activity against the account.","D. Defender for Identity monitors Active Directory and identity infrastructure. It has no view of Cosmos DB."],"source":{"title":"Azure Monitor Logs reference: CDBDataPlaneRequests","url":"https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/cdbdataplanerequests"},"corrected":true,"originalAnswer":"B C"},"e":[{"p":"https://docs.microsoft.com/en-us/azure/cosmos-db/audit-control-plane-logs"}]},
{"n":201,"sec":"std","num":182,"c":"Design solutions that align with security best practices and priorities","q":"What should you use to start the threat modeling process?","body":[{"p":"Your company plans to follow DevSecOps best practices of the Microsoft Cloud Adoption Framework for Azure."},{"p":"You need to perform threat modeling by using a top-down approach based on the Microsoft Cloud Adoption Framework for Azure."},{"p":"What should you use to start the threat modeling process?"}],"o":["the STRIDE model","the DREAD model","OWASP threat modeling"],"a":"C","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged: no Microsoft source establishes the keyed answer, and Microsoft's own methodology points elsewhere. The threat modelling Microsoft documents is the Security Development Lifecycle approach, which starts from a data flow diagram of the system and categorises what it finds with STRIDE, and the Threat Modeling Tool generates its threats that way. That is a top-down decomposition of an architecture, which fits the wording of the stem. OWASP threat modelling is a genuine body of work, but nothing in the Cloud Adoption Framework nominates it as the way to start, and Microsoft's Well-Architected guidance on threat analysis does not name it either. The option list is also short, three choices rather than four, which suggests something was lost in the source. DREAD is a risk-rating scheme rather than a starting point, so it is not the answer whatever else is true. The key is left untouched pending a citable source.","source":{"title":"Architecture strategies for threat analysis (Well-Architected Framework)","url":"https://learn.microsoft.com/en-us/azure/well-architected/security/threat-model"}}},
{"n":202,"sec":"std","num":183,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"You have a Microsoft Sentinel deployment."},{"p":"You are developing a solution to ensure that compliance with the MITRE ATT & CK framework is maintained as the framework"},{"p":"evolves."},{"p":"You need to recommend a solution to identify which MITRE ATT & CK techniques are NOT addressed by the current Microsoft Sentinel deployment"},{"p":"What should you include in the recommendation?"}],"o":["the Microsoft Sentinel Health Summary dashboard","the MITRE analytics explorer","the MITRE coverage matrix","the Microsoft Sentinel Analytics blade"],"a":"C","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Sentinel's MITRE ATT&CK page presents the framework as a matrix and shades each technique by how many active detections you have for it, which makes the gaps the visible thing on the screen. That is what the question is asking for: not a list of your rules, but the techniques your rules do not cover. Because the matrix is refreshed as Sentinel tracks new framework versions, it also keeps answering the question as ATT&CK evolves.","whyWrong":["A. The Health Summary dashboard reports connector and rule health, not detection coverage.","B. There is no Sentinel feature by the name MITRE analytics explorer.","D. The Analytics blade lists the rules you have. It tells you what is covered, not what is missing."],"source":{"title":"View MITRE ATT&CK coverage in Microsoft Sentinel","url":"https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage"}}},
{"n":203,"sec":"std","num":184,"c":"Design security operations, identity, and compliance capabilities","q":"You are designing a ransomware mitigation strategy","body":[{"p":"You are designing a ransomware mitigation strategy"},{"p":"You perform a ransomware risk assessment and identify business-critical assets."},{"p":"You need to recommend a solution to mitigate ransomware threats. The solution must follow Microsoft security best practices."},{"p":"Which two actions should you include in the recommendation? Each correct answer presents a complete solution."},{"p":"NOTE: Each correct answer is worth one point."}],"o":["Implement immutable, offline backups that have restricted access and test restore procedures regularly.","Deploy Privileged Identity Management (PIM) that uses just-in-time (JIT) access and approval workflows.","Enable firewall logging for auditing, without restricting inbound or outbound traffic.","Use extended patching cycles to reduce the risk of update-related service disruptions."],"a":"A B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Both keyed actions map directly onto Microsoft's ransomware guidance. Immutable, access-restricted, regularly-tested backups are the core of the recovery-plan phase: \"the most immediate and effective action you can take is to make sure your organization can restore your entire enterprise from immutable storage, which neither the cybercriminal nor you can modify,\" and testing restores is what actually proves that promise. PIM with just-in-time access and approval workflows is the phase-2 privileged-access control: removing standing admin rights removes the very credentials a ransomware operator needs to disable defenses and delete backups in the first place.","whyWrong":["C. Enabling firewall logging without restricting any traffic is pure visibility with no prevention attached, and it explicitly abandons the chance to block anything, which does nothing to mitigate a threat that is already loose.","D. Extending patching cycles delays fixes for known vulnerabilities, which increases the window ransomware operators have to exploit them. This is the opposite of a Microsoft-recommended mitigation."],"source":{"title":"Backup and restore plan to protect against ransomware","url":"https://learn.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against-ransomware"}}},
{"n":204,"sec":"std","num":185,"c":"Design security solutions for infrastructure","q":"You have an Azure subscription that contains 100 virtual machines. The virtual machines are accessed by using Azure Bastion.","body":[{"p":"You have an Azure subscription that contains 100 virtual machines. The virtual machines are accessed by using Azure Bastion."},{"p":"You need to recommend a solution to ensure that only specific users in specific locations can access the virtual machines. The solution must meet the following requirements:"},{"p":"• Restrict access to the virtual machines based on an originating IP address or a connection request by using"},{"p":"just-in-time (JIT) VM access network-based controls."},{"p":"• Restrict access to the virtual machines based on role-based access control (RBAC) role assignments by"},{"p":"using JIT VM access authorization controls."},{"p":"Which Microsoft cloud services should you include in the recommendation? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p160_x2526.webp","w":928,"h":237}],"ansimg":[{"img":"img/p161_x2545.webp","w":928,"h":237}],"e":[{"img":"img/p161_x2550.webp","w":964,"h":139}]},
{"n":205,"sec":"std","num":186,"c":"Design solutions that align with security best practices and priorities","q":"You have an Azure subscription that contains multiple apps. The apps are managed by using continuous integration and continuous deployment (CI/CD) pipelines in Azure DevOps.","body":[{"p":"You have an Azure subscription that contains multiple apps. The apps are managed by using continuous integration and continuous deployment (CI/CD) pipelines in Azure DevOps."},{"p":"You need to recommend DevSecOps controls for the Commit the code and the Build and test CI/CD process stages based on the Microsoft Cloud Adoption Framework for Azure."},{"p":"Which testing method should you recommend for each stage? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p161_x2539.webp","w":896,"h":296}],"ansimg":[{"img":"img/p162_x2563.webp","w":896,"h":296}],"e":[{"img":"img/p162_x2568.webp","w":945,"h":143}]},
