{"n":122,"sec":"std","num":103,"c":"Design security solutions for infrastructure","q":"What should you include in the solution?","body":[{"p":"You have an Azure subscription. The subscription contains 100 virtual machines that run Windows Server. The virtual machines are managed by using Azure Policy and Microsoft Defender for Servers."},{"p":"You need to enhance security on the virtual machines. The solution must meet the following requirements:"},{"p":"• Ensure that only apps on an allowlist can be run."},{"p":"• Require administrators to confirm each app added to the allowlist."},{"p":"• Automatically add unauthorized apps to a blocklist when an attempt is made to launch the app."},{"p":"• Require administrators to approve an app before the app can be moved from the blocklist to the allowlist."},{"p":"What should you include in the solution?"}],"o":["a compute policy in Azure Policy","admin consent settings for enterprise applications in Azure AD","adaptive application controls in Defender for Servers","app governance in Microsoft Defender for Cloud Apps"],"a":"C","review":{"status":"OUTDATED","confidence":"HIGH","explanation":"The feature this question is built on no longer exists. Adaptive application controls in Defender for Cloud were deprecated in August 2024, alongside the Log Analytics agent they depended on — Microsoft's retirement table lists the feature with no replacement. The key is left as the source has it because it was right when written, but do not carry this into the exam as a live product: application allowlisting on Windows servers today is App Control for Business, surfaced through Microsoft Defender for Endpoint. The behaviour the stem describes — an allowlist, automatic blocking of anything not on it, and admin approval to promote an app — is what adaptive application controls used to do.","source":{"title":"Prepare for retirement of the Log Analytics agent — feature functionality table","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/prepare-deprecation-log-analytics-mma-agent"}}},
{"n":123,"sec":"std","num":104,"c":"Design security solutions for applications and data","q":"What should you implement?","body":[{"p":"You have a Microsoft 365 tenant."},{"p":"You have an Azure subscription that contains Azure App Service web apps. The apps have the following characteristics:"},{"p":"• The apps use third-party and open-source components."},{"p":"• The apps were developed by using C#, Python, and Java."},{"p":"• The app deployment process is managed by using Azure DevOps."},{"p":"• The source code for the apps is stored in GitHub Enterprise Cloud repositories and protected by using"},{"p":"GitHub Advanced Security."},{"p":"You need to reduce the risk of supply chain attacks during the application lifecycle."},{"p":"What should you implement?"}],"o":["NuGet Audit","secret scanning","Dependabot alerts","app governance in Microsoft Defender for Cloud Apps"],"a":"C","srcA":"B","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe risk named in the stem is the third-party and open-source components, and Dependabot is the control aimed at it. The Microsoft cloud security benchmark's DevOps security guidance says to \"use Dependabot to ensure that the vulnerable dependency is tracked and remediated\" and to keep the repository up to date with the latest releases of the packages it depends on. Dependabot alerts fire when a new advisory affects something in your dependency graph, and the ecosystems it covers line up with the three languages in the stem: Maven for Java, NuGet for C#, pip for Python. Secret scanning is a genuine GitHub Advanced Security capability, but it finds credentials committed into your own code, which is a different failure. That is what Standalone 76 tests.","whyWrong":["A. NuGet Audit covers .NET packages only, so it leaves the Python and Java components unwatched.","B. Secret scanning finds exposed credentials in the repository. Valuable, but not the compromised-dependency risk the stem describes.","D. App governance in Defender for Cloud Apps governs OAuth apps consented into your Microsoft 365 tenant. It has no view of your build dependencies."],"source":{"title":"Microsoft cloud security benchmark - DevOps Security","url":"https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-devops-security"},"corrected":true,"originalAnswer":"B"}},
{"n":124,"sec":"std","num":105,"c":"Design solutions that align with security best practices and priorities","q":"You have the resources shown in the following table.","body":[{"p":"You have the resources shown in the following table."},{"img":"img/p104_x1706.webp","w":602,"h":173},{"p":"You need to configure multi-user authorization (MUA) for Azure Backup to protect the Recovery Services vaults. The solution must maximize the security of the MUA configuration and follow the principle of least privilege."},{"p":"To which location should you deploy Resource Guard, and which role-based access control (RBAC) role should you assign to the team responsible for managing the backup of Resource Guard? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p105_x1725.webp","w":792,"h":354}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The exhibit's own table shows Sub1 (contoso.com) holding the Recovery Services vaults and Sub2 (fabrikam.com, a separate tenant) currently unused; Microsoft's documentation notes the Resource Guard \"can be in a different subscription or a different tenant with respect to the vault,\" and using a separate tenant is what maximizes the separation of duties MUA is built to provide, which is exactly what \"maximize the security of the MUA configuration\" calls for. For the role, Microsoft's own guidance is explicit that \"the Backup admin must have Reader role on the Resource Guard... to enable MUA on a vault\" and must specifically not hold Contributor or Backup MUA Admin/Operator permissions there, which is the least-privilege split the requirement asks for: enough access to reference the Resource Guard when configuring the vault, not enough to modify or disable it.","whyWrong":["Assigning the backup team Contributor or Owner on the Resource Guard would let the very team the guard is meant to check circumvent it by modifying or removing it themselves, defeating the separation of duties multi-user authorization exists to enforce."],"source":{"title":"Multi-user authorization using Resource Guard","url":"https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept"}},"ansimg":[{"img":"img/p105_x1727.webp","w":792,"h":354}],"e":[{"img":"img/p105_x1719.webp","w":864,"h":139}]},
{"n":125,"sec":"std","num":106,"c":"Design solutions that align with security best practices and priorities","q":"Does this meet the goal?","body":[{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled. You are evaluating the Azure Security Benchmark V3 report."},{"p":"In the Secure management ports controls, you discover that you have 0 out of a potential 8 points. You need to recommend configurations to increase the score of the Secure management ports controls."},{"p":"Solution: You recommend onboarding all virtual machines to Microsoft Defender for Endpoint."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"No. Onboarding machines to Defender for Endpoint is a real improvement, but it lands in the Enable endpoint protection control, worth 2 points, which Microsoft describes as checking \"your organization's endpoints for active threat detection and response solutions\" and recommending you deploy Defender for Endpoint if none is present. Secure management ports is a network exposure control. EDR detects an attacker who has already reached the machine; it does not reduce the brute-force surface that the control measures.","source":{"title":"Secure score in Microsoft Defender for Cloud (security controls table)","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls"}]},
{"n":126,"sec":"std","num":107,"c":"Design security operations, identity, and compliance capabilities","q":"Which effect should you use in Azure Policy?","body":[{"p":"You are evaluating an Azure environment for compliance."},{"p":"You need to design an Azure Policy implementation that can be used to evaluate compliance without changing any resources."},{"p":"Which effect should you use in Azure Policy?"}],"o":["Deny","Disabled","Modify","Append"],"a":"B","review":{"status":"AMBIGUOUS","confidence":"MEDIUM","explanation":"Flagged, because the effect that actually answers this question is not on the list. To evaluate compliance without changing resources you use the **audit** effect, which reports a resource as non-compliant and does nothing else. The keyed answer, **disabled**, does something different: Microsoft's evaluation order says “disabled is checked first to determine whether the policy rule should be evaluated” — it switches the rule off, so nothing is assessed at all. The likely source of the confusion is that a policy *assignment* also has an enforcement mode whose portal label is **Disabled** (DoNotEnforce), and that one does exactly what the question asks: the policy is evaluated and compliance reported, but the effect is not enforced. Two different settings, one shared word. On the exam, keep effect `disabled` (stop evaluating) apart from enforcement mode `Disabled` (evaluate, don't enforce), and remember `audit` is the effect for reporting without changing anything.","whyWrong":["A. Deny blocks the request outright, so it very much changes what happens.","C. Modify alters resource properties, for example adding or changing tags.","D. Append adds fields to a resource during creation, so it also changes resources."],"source":{"title":"Azure Policy definitions effect basics","url":"https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics"}},"e":[{"p":"Before looking to manage new or updated resources with your new policy definition, it ' s best to see how it evaluates a limited subset of existing resources, such as a test resource group. Use the enforcement mode Disabled (DoNotEnforce) on your policy assignment to prevent the effect from triggering or activity log entries from being created. https://docs.microsoft.com/en-us/azure/governance/policy/concepts/eva luate- impact"}]},
{"n":127,"sec":"std","num":108,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription that contains 1,000 Microsoft Exchange Online mailboxes. You need to identify which users are susceptible to phishing attacks. What should you use?","body":[{"p":"You have a Microsoft 365 subscription that contains 1,000 Microsoft Exchange Online mailboxes. You need to identify which users are susceptible to phishing attacks. What should you use?"}],"o":["spoof intelligence insight in Exchange Online Protection (EOP)","Attack path analysis in Microsoft Defender for Cloud","Attack simulation training in Microsoft Defender for Office 365","user activity reports in Microsoft Purview insider risk management"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Note the verb: identify which users are susceptible, not block the phishing. Attack simulation training in Defender for Office 365 runs benign simulated phishing campaigns against your own mailboxes and reports who clicked, who entered credentials and who reported the message, which is how you measure susceptibility and then assign training to the people who need it.","whyWrong":["A. Spoof intelligence tells you which external senders are spoofing your domain. That is about the senders, not about your users.","B. Attack path analysis models exploitable paths through Azure resources; it has nothing to do with mailboxes.","D. Insider risk management scores risky behaviour by your own users, which is a different risk from being taken in by an attacker."],"source":{"title":"Get started using Attack simulation training","url":"https://learn.microsoft.com/en-us/defender-office-365/attack-simulation-training-get-started"}}},
{"n":128,"sec":"std","num":109,"c":"Design solutions that align with security best practices and priorities","q":"What should you include in the recommendation?","body":[{"p":"You have an on-premises server named Server 1. Server1 is an FTP server that can be accessed by only the users at your company."},{"p":"You have an Azure subscription."},{"p":"You need to recommend a Zero Trust Network Access (ZTNA) solution to enforce Conditional Access policies when users access Server1 from the internet."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Entra Private Access","Microsoft Entra application proxy","Microsoft Entra Internet Access","Azure Bastion","Azure Application Gateway"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"An on-premises FTP server reached from the internet is a private resource on a non-HTTP protocol, and Private Access provides per-app access for TCP and UDP applications with Conditional Access applied per app — that is what makes it ZTNA rather than a VPN. Application proxy would be the older answer but is limited to web apps; Private Access is described as building on application proxy and extending it to any private resource, port and protocol.","whyWrong":["B. Microsoft Entra application proxy publishes web applications over HTTP/HTTPS, so it cannot publish FTP.","C. Internet Access secures outbound traffic to internet and SaaS destinations, not inbound access to your own server.","D. Azure Bastion gives RDP/SSH to Azure virtual machines through the portal; Server1 is on-premises and the protocol is FTP.","E. Application Gateway is a regional layer-7 load balancer for HTTP/HTTPS."],"source":{"title":"What is Global Secure Access? — Microsoft Entra Private Access","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access"}}},
{"n":129,"sec":"std","num":110,"c":"Design security solutions for applications and data","q":"You have an Azure subscription that contains an Azure key vault named Vault1.","body":[{"p":"You have an Azure subscription that contains an Azure key vault named Vault1."},{"p":"You plan to deploy multiple virtual machines that will host a custom app named App1. App1 will use secrets stored in Vault1. The virtual machines will be redeployed regularly based on the usage demands of App1."},{"p":"You need to recommend a solution that will enable App1 to access the secrets stored in Vault1. The solution must meet the following requirements:"},{"p":"Minimize the number of security principals that can access Vault1."},{"p":"Minimize the storage of sensitive data on the virtual machines."},{"p":"Minimize administrative effort."},{"p":"Which type of endpoint should App1 use to access the secrets, and which type of identity should App1 use? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p108_x1770.webp","w":658,"h":232}],"ansimg":[{"img":"img/p108_x1759.webp","w":658,"h":232}],"e":[{"img":"img/p108_x1764.webp","w":639,"h":93}]},
{"n":130,"sec":"std","num":111,"c":"Design solutions that align with security best practices and priorities","q":"You need to verify whether Microsoft Defender for servers is installed on all the virtual machines that run Windows. Which compliance control should you evaluate?","body":[{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled."},{"p":"You are evaluating the Azure Security Benchmark V3 report as shown in the following exhibit."},{"img":"img/p109_x1783.webp","w":1000,"h":435},{"img":"img/p110_x1793.webp","w":576,"h":734},{"p":"You need to verify whether Microsoft Defender for servers is installed on all the virtual machines that run Windows. Which compliance control should you evaluate?"}],"o":["Data Protection","Incident Response","Posture and Vulnerability Management","Asset Management","Endpoint Security"],"a":"E","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The exhibit's expanded compliance-control list is organized by Microsoft cloud security benchmark domain, and the domain that covers deployment of endpoint threat protection, the very thing \"Defender for servers is installed\" asks about, is ES, Endpoint Security. Whether Defender for Endpoint (delivered through Defender for Servers) is present on a machine is exactly the kind of assessment the ES domain's recommendations report, which is why it appears failing (red) in the exhibit alongside the actual gap the scenario describes.","whyWrong":["A. Data Protection covers encryption and data handling controls, not endpoint agent deployment.","B. Incident Response covers response plans and playbooks, not whether an endpoint agent is installed.","C. Posture and Vulnerability Management covers scanning and remediation workflows generally, not the specific presence of the Defender for Servers/Endpoint agent.","D. Asset Management covers inventory and classification of resources, not their protection status."],"source":{"title":"Microsoft cloud security benchmark - Endpoint Security","url":"https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-endpoint-security"}},"e":[{"p":"https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3-endpoint-security"}]},
{"n":131,"sec":"std","num":112,"c":"Design security solutions for infrastructure","q":"What should you include in the solution?","body":[{"p":"You have an Azure subscription that contains multiple network security groups (NSGs), multiple virtual machines, and an Azure Bastion host named bastion1."},{"p":"Several NSGs contain rules that allow direct RDP access to the virtual machines by bypassing bastion!"},{"p":"You need to ensure that the virtual machines can be accessed only by using bastion! The solution must prevent the use of NSG rules to bypass bastion1."},{"p":"What should you include in the solution?"}],"o":["Azure Virtual Network Manager connectivity configurations","Azure Virtual Network Manager security admin rules","Azure Firewall application rules","Azure Firewall network rules"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The problem is not that a rule is missing but that owners can add their own, so the fix has to sit above network security groups. Security admin rules in Azure Virtual Network Manager do exactly that: they are evaluated before NSG rules and a Deny there cannot be overridden by an NSG, so a subscription owner who adds an allow rule for RDP from the internet no longer gets one. Deny inbound 3389 from the internet at the network manager and the only remaining path to the VMs is bastion1.","whyWrong":["A. Connectivity configurations build the topology, mesh or hub and spoke. They do not filter traffic.","C and D. Azure Firewall rules only apply to traffic routed through the firewall. Direct RDP that an NSG permits never reaches it, so neither rule type closes the bypass."],"source":{"title":"Security admin rules in Azure Virtual Network Manager","url":"https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins"}}},
{"n":132,"sec":"std","num":113,"c":"Design solutions that align with security best practices and priorities","q":"What should you use?","body":[{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled."},{"p":"You need to enforce ISO 27001:2013 standards for new resources deployed to the subscription. The solution must ensure that noncompliant resources are automatically detected."},{"p":"What should you use?"}],"o":["Azure Blueprints","the regulatory compliance dashboard in Defender for Cloud","Azure role-based access control (Azure RBAC)","Azure Policy"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Azure Policy evaluates resources whenever one is created or updated in a scope with an assignment, and again on a compliance cycle every 24 hours — so a newly deployed non-compliant resource is detected automatically. ISO 27001 ships as a built-in initiative, which is a group of policy definitions assigned together. Note the pairing with Standalone 258: same standard, and Azure Policy is the answer to both, because it is the engine that does the evaluating whichever product surfaces the result.","whyWrong":["A. Azure Blueprints is deprecated and packaged artefacts for deployment rather than evaluating ongoing compliance.","B. The regulatory compliance dashboard in Defender for Cloud is where results are read. The evaluation underneath it is Azure Policy, and the question asks what to use to enforce.","C. Azure RBAC governs who may act, not whether the resulting resource is compliant."],"source":{"title":"Overview of Azure Policy","url":"https://learn.microsoft.com/en-us/azure/governance/policy/overview"}}},
{"n":133,"sec":"std","num":114,"c":"Design security solutions for applications and data","q":"What should you recommend?","body":[{"p":"You have an Azure subscription that contains an App Service web app named Appl. Appl uses a Microsoft Entra user account named SRV1 as a service account to authenticate to an Azure SQL database named DB1."},{"p":"You discover that a developer accessed DB1 directly by using SRV1."},{"p":"You need to recommend a secure authentication method that will prevent credential misuse outside of Appl. The solution must minimize administrative effort."},{"p":"What should you recommend?"}],"o":["a group managed service account (gMSA)","a managed identity","a federated identity credential","a delegated managed service account (dMSA)"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The failure here is that SRV1 is an ordinary Entra user account with a password, so anyone who knows that password, such as the developer who used it directly, can authenticate as it from anywhere. A managed identity has no extractable secret: Entra ID issues and rotates its credential internally, and only the specific Azure resource the identity is assigned to, App1's web app, can obtain a token with it. There is no password for a developer to reuse outside the app, and no administrative overhead to rotate one either.","whyWrong":["A. A group managed service account is an on-premises Active Directory construct for Windows services; it authenticates to AD DS resources, not to Azure SQL Database over Entra ID.","C. A federated identity credential lets an external workload (for example a GitHub Actions or Azure DevOps pipeline) exchange its own token for an Entra token. It solves a different problem, a workload outside Entra ID needing access, not an in-tenant user account being reused.","D. A delegated managed service account is also an on-premises AD DS feature (the modern successor to gMSA for migration scenarios). It has no role in an Azure App Service to Azure SQL Database connection."],"source":{"title":"Microsoft cloud security benchmark - Identity Management (IM-3)","url":"https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-identity-management"}}},
{"n":134,"sec":"std","num":115,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the design?","body":[{"p":"You have a Microsoft 365 tenant."},{"p":"Your company uses a third-party software as a service (SaaS) app named App1 that is integrated with an Azure AD tenant. You need to design a security strategy to meet the following requirements:"},{"p":"• Users must be able to request access to App1 by using a self-service request."},{"p":"• When users request access to App1, they must be prompted to provide additional information about their"},{"p":"request."},{"p":"• Every three months, managers must verify that the users still require access to Appl."},{"p":"What should you include in the design?"}],"o":["Azure AD Application Proxy","connected apps in Microsoft Defender for Cloud Apps","Microsoft Entra Identity Governance","access policies in Microsoft Defender for Cloud Apps"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"All three requirements are entitlement management features, and entitlement management is part of Microsoft Entra ID Governance. An access package for App1 gives users a self-service request through the My Access portal; the request policy can attach requestor questions, which is the extra information demanded at request time; and an access review on the assignments, run every three months with the manager as reviewer, is the recurring attestation.","whyWrong":["A. Application Proxy publishes on-premises web applications. App1 is already SaaS and already integrated.","B. Connected apps in Defender for Cloud Apps give you visibility and control over a SaaS app, not a request and approval lifecycle.","D. Access policies in Defender for Cloud Apps allow or block a session; they do not govern who is entitled to the app."],"source":{"title":"What is entitlement management?","url":"https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview"}}},
{"n":135,"sec":"std","num":116,"c":"Design security operations, identity, and compliance capabilities","q":"You have an Azure subscription that contains a Microsoft Sentinel workspace named MSW1. MSW1 includes 50 scheduled analytics rules.","body":[{"p":"You have an Azure subscription that contains a Microsoft Sentinel workspace named MSW1. MSW1 includes 50 scheduled analytics rules."},{"p":"You need to design a security orchestration automated response (SOAR) solution by using Microsoft Sentinel playbooks. The solution must meet the following requirements:"},{"p":"• Ensure that expiration dates can be configured when a playbook runs."},{"p":"• Minimize the administrative effort required to configure individual analytics rules."},{"p":"What should you use to invoke the playbooks, and which type of Microsoft Sentinel trigger should you use? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p113_x1825.webp","w":534,"h":193}],"ansimg":[{"img":"img/p113_x1831.webp","w":534,"h":193}],"e":[{"img":"img/p113_x1819.webp","w":534,"h":101}]},
{"n":136,"sec":"std","num":117,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 tenant. Your company uses a third-party software as a service (SaaS) app named App1. App1 supports authenticating users by using Azure AO credentials. You need to recommend a solution to enable users to authenticate to App1 by using their Azure AD credentials. What should you include in the recommendation?","body":[{"p":"You have a Microsoft 365 tenant. Your company uses a third-party software as a service (SaaS) app named App1. App1 supports authenticating users by using Azure AO credentials. You need to recommend a solution to enable users to authenticate to App1 by using their Azure AD credentials. What should you include in the recommendation?"}],"o":["an Azure AD enterprise application","a retying party trust in Active Directory Federation Services (AD FS)","Azure AD Application Proxy","Azure AD B2C"],"a":"A","srcA":"C","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe stem does the work here: App1 \"supports authenticating users by using Azure AD credentials\" already. Microsoft's guide to configuring SSO draws the line precisely at this point, distinguishing \"app registrations vs. enterprise applications\": an enterprise application \"represents instances\" of an app in your tenant, whether it comes from the gallery or is added as a custom (non-gallery) registration, and that is how you turn on Entra sign-in for an app that speaks OIDC or SAML. Application Proxy solves the opposite problem: publishing an on-premises app that does not natively support modern authentication, by putting a connector in front of it. App1 needs no connector and no publishing, only registration.","whyWrong":["B. An AD FS relying party trust is an on-premises federation mechanism, superseded here since App1 already speaks Entra ID directly.","C. Application Proxy exists to bring legacy on-premises apps into modern auth. App1 is already there; there is nothing on-premises to proxy.","D. Azure AD B2C (now Entra External ID for customers) is for consumer-facing apps needing their own separate customer directory, not for wiring an existing SaaS app into the workforce tenant."],"source":{"title":"Configure OIDC SSO for gallery and custom applications","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/add-application-portal-setup-oidc-sso"},"corrected":true,"originalAnswer":"C"}},
{"n":137,"sec":"std","num":118,"c":"Design solutions that align with security best practices and priorities","q":"What should you recommend as part of the landing zone deployment?","body":[{"p":"You need to recommend a strategy for routing internet-bound traffic from the landing zones. The solution must meet the landing zone requirements."},{"p":"What should you recommend as part of the landing zone deployment?"}],"o":["service chaining","local network gateways","forced tunneling","a VNet-to-VNet connection"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Routing a landing zone's outbound traffic through the hub firewall is precisely what Azure calls service chaining: \"Service chaining enables you to direct traffic from one virtual network to a virtual appliance or gateway in a peered network through user-defined routes.\" Microsoft's own description of the pattern is the enterprise-scale default: a hub virtual network hosts the firewall or NVA, spokes peer to it, and \"traffic flows through network virtual appliances… in the hub virtual network\", which is exactly how landing zones get centralized internet-bound inspection without every spoke needing its own edge.","whyWrong":["B. Local network gateways represent an on-premises VPN endpoint definition in Azure. They configure a site-to-site tunnel; they do not route internet traffic through a hub firewall.","C. Forced tunneling sends traffic all the way back to an on-premises edge over VPN or ExpressRoute. It is a valid but different pattern, used when policy requires on-premises inspection, not the landing zone's own hub-and-spoke routing.","D. A VNet-to-VNet connection is a gateway-based link between two networks, an older alternative to peering, and is not how UDR-based routing to a hub NVA is described or configured."],"source":{"title":"Azure Virtual Network Peering (service chaining)","url":"https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/learn/modules/configure-vnet-peering/5-determine-service-chaining-uses"}]},
{"n":138,"sec":"std","num":119,"c":"Design security operations, identity, and compliance capabilities","q":"A customer has a hybrid cloud infrastructure that contains a Microsoft 365 E5 subscription and an Azure subscription.","body":[{"p":"A customer has a hybrid cloud infrastructure that contains a Microsoft 365 E5 subscription and an Azure subscription."},{"p":"All on-premises Windows servers in the perimeter network are prevented from connecting directly to the internet."},{"p":"The customer recently recovered from a tansomware attack."},{"p":"The customer plans to deploy Microsoft Sentinel."},{"p":"You need to recommend solutions to meet the following requirements:"},{"p":"• Ensure that the security operations team can access the security logs and the operation logs."},{"p":"• Ensure that the IT operations team can access only the operations logs, including the event logs of the"},{"p":"servers in the perimeter network."},{"p":"Which two solutions should you include in the recommendation? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point."}],"o":["the Azure Monitor agent","Microsoft Entra Conditional Access policies","Windows Server event subscription","resource-based role-based access control (RBAC)"],"a":"A","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged as a defective question rather than a wrong key. The stem asks which **two** solutions to include and says each correct answer is a complete solution, but the source records a single letter. Resource-based RBAC in Microsoft Sentinel is what separates the two teams’ log access, and the Azure Monitor agent is what collects the perimeter servers’ event logs — both are needed, and the near-identical Standalone 122 keys exactly that pair. The likeliest explanation is that this copy lost an option or half its key. Answer it as Azure Monitor agent plus resource-based RBAC, and do not treat the graded result here as meaningful."}},
{"n":139,"sec":"std","num":120,"c":"Design security solutions for applications and data","q":"You have three on-premises servers that run Windows Server and contain shared folders. The folders contain 10,000 files.","body":[{"p":"You have three on-premises servers that run Windows Server and contain shared folders. The folders contain 10,000 files."},{"p":"You have a Microsoft 365 tenant that uses Microsoft Purview and includes custom sensitive information types (SITs)."},{"p":"You have an Azure subscription that contains five Azure Blob Storage accounts and multiple App Service web apps. The Blob Storage accounts contain data for the web apps."},{"p":"You need to recommend a Microsoft Purview solution to scan the storage blobs and the shared folders. The solution must use the custom SITs to identify files that contain specific data."},{"p":"What should you use for each type of storage? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p116_x1869.webp","w":768,"h":301}],"ansimg":[{"img":"img/p116_x1871.webp","w":768,"h":301}],"e":[{"img":"img/p116_x1863.webp","w":760,"h":119}]},
{"n":140,"sec":"std","num":121,"c":"Design security solutions for applications and data","q":"You have an Azure subscription that contains three Azure App Service web apps.","body":[{"p":"You have an Azure subscription that contains three Azure App Service web apps."},{"p":"You need to secure the apps by using Azure Web Application Firewall (WAF) on Azure Front Door. The solution must meet the following requirements:"},{"p":"• Block attempts to access the apps from malicious bots."},{"p":"• Rate limit incoming connections to the apps."},{"p":"The solution must minimize administrative effort."},{"p":"What should you configure for each requirement? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p117_x1883.webp","w":744,"h":291}],"boxes":[{"label":"Rate limit","value":"A custom rule"},{"label":"Block malicious bots","value":"A managed rule set"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Rate limiting on Front Door's WAF is configured as a custom rule with the rate-limit rule type and a threshold you define yourself, so there is no built-in managed option for it. Blocking malicious bots is the opposite case: Microsoft ships a managed Bot Protection rule set, maintained and updated centrally from Microsoft's own threat intelligence feed, which is what \"minimize administrative effort\" is asking you to reach for instead of hand-authoring bot-detection logic in a custom rule.","whyWrong":["Reversing the pairing would mean hand-building a custom rule to detect bot signatures, which is far more administrative effort than enabling the managed rule set, and trying to rate-limit through a managed rule set, which Front Door’s managed rule sets don’t offer since rate limiting is inherently a custom-rule capability."],"source":{"title":"Configure a Front Door bot protection rule","url":"https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-tuning"}},"ansimg":[{"img":"img/p117_x1885.webp","w":744,"h":291}],"e":[{"img":"img/p118_x1894.webp","w":775,"h":149}]},
{"n":141,"sec":"std","num":122,"c":"Design security operations, identity, and compliance capabilities","q":"A customer has a hybrid cloud infrastructure that contains a Microsoft 365 E5 subscription and an Azure subscription.","body":[{"p":"A customer has a hybrid cloud infrastructure that contains a Microsoft 365 E5 subscription and an Azure subscription."},{"p":"All the on-premises servers in the perimeter network are prevented from connecting directly to the internet."},{"p":"The customer recently recovered from a ransomware attack."},{"p":"The customer plans to deploy Microsoft Sentinel."},{"p":"You need to recommend configurations to meet the following requirements:"},{"p":"• Ensure that the security operations team can access the security logs and the operation logs."},{"p":"• Ensure that the IT operations team can access only the operations logs, including the event logs of the"},{"p":"servers in the perimeter network."},{"p":"Which two configurations can you include in the recommendation? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point."}],"o":["Configure Azure Active Directory (Azure AD) Conditional Access policies.","Use the Azure Monitor agent with the multi-homing configuration.","Implement resource-based role-based access control (RBAC) in Microsoft Sentinel.","Create a custom collector that uses the Log Analytics agent."],"a":"B C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Same requirement as Standalone 14, and the same two mechanisms answer it: resource-context RBAC scopes what IT operations can see in the workspace to the resources their own Azure role already covers, while the Azure Monitor agent, configured with multi-homing so a single install can send data to more than one destination, is the supported way to get the perimeter servers' logs into the Sentinel workspace despite no direct route to the internet, using a proxy, the Log Analytics gateway, or Private Link.","whyWrong":["A. Conditional Access controls sign-in to apps, not access to data already ingested into a Log Analytics workspace.","D. A custom collector built on the Log Analytics agent depends on an agent that Microsoft retired on 31 August 2024. It is not the current recommendation regardless of the access-scoping question."],"source":{"title":"Manage access to Microsoft Sentinel data by resource","url":"https://learn.microsoft.com/en-us/azure/sentinel/resource-context-rbac"}}},
{"n":142,"sec":"std","num":123,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"Your company has on-premises Microsoft SQL Server databases."},{"p":"The company plans to move the databases to Azure."},{"p":"You need to recommend a secure architecture for the databases that will minimize operational requirements for patching and protect sensitive data by using dynamic data masking. The solution must minimize costs."},{"p":"What should you include in the recommendation?"}],"o":["Azure SQL Managed Instance","Azure Synapse Analytics dedicated SQL pools","Azure SQL Database","SQL Server on Azure Virtual Machines"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Minimise patching effort and minimise cost together push you to the most managed, least expensive option that still supports the feature, and dynamic data masking is available in Azure SQL Database. Being a PaaS database, Microsoft handles the patching entirely, and a single database is cheaper than Managed Instance or a VM.","whyWrong":["A. Managed Instance also removes patching but costs considerably more; it is the answer when you need instance-scoped features such as SQL Agent or cross-database queries.","B. Synapse dedicated SQL pools are for data warehousing, and are neither the cheapest nor the natural landing place for a migrated OLTP database.","D. SQL Server on Azure VMs leaves the operating system and SQL patching with you, which is exactly what the stem asks you to avoid."],"source":{"title":"Dynamic data masking in Azure SQL Database","url":"https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview"}}},
{"n":143,"sec":"std","num":124,"c":"Design security operations, identity, and compliance capabilities","q":"You need to recommend a solution to classify and encrypt sensitive Microsoft Office 365 data regardless of where the data is stored. What should you include in the recommendation?","body":[{"p":"Your company has an on-premises network, an Azure subscription, and a Microsoft 365 E5 subscription. The company uses the following devices:"},{"p":"• Computers that run either Windows 10 or Windows 11"},{"p":"• Tablets and phones that run either Android or iOS"},{"p":"You need to recommend a solution to classify and encrypt sensitive Microsoft Office 365 data regardless of where the data is stored. What should you include in the recommendation?"}],"o":["eDiscovery","retention policies","Compliance Manager","Microsoft Information Protection"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The phrase that decides this is “regardless of where the data is stored”. Microsoft describes sensitivity labels as protecting content “wherever it's stored”, because the label is written into the file's metadata and the encryption travels with it — across Windows, macOS, iOS and Android, which matches the mixed device estate in the stem. Classification plus encryption in one control is Information Protection.","whyWrong":["A. eDiscovery finds and preserves content for legal matters; it neither classifies nor encrypts.","B. Retention policies decide how long content is kept, not who can open it.","C. Compliance Manager scores your posture against regulations. It is an assessment tool, not a protection control."],"source":{"title":"Learn about sensitivity labels","url":"https://learn.microsoft.com/en-us/purview/sensitivity-labels"}},"e":[{"p":"https://docs.microsoft.com/en-us/microsoft-365/compliance/information-protection"},{"p":"https://docs.microsoft.com/en-us/microsoft-365/compliance/ediscovery?view=o365-worldwide"}]},
{"n":144,"sec":"std","num":125,"c":"Design security solutions for applications and data","q":"You need to recommend a solution to test the web app for vulnerabilities such as insecure server configurations, cross-site scripting (XSS), and SQL injection. What should you include in the recommendation?","body":[{"p":"Your company is developing a new Azure App Service web app. You are providing design assistance to verify the security of the web app."},{"p":"You need to recommend a solution to test the web app for vulnerabilities such as insecure server configurations, cross-site scripting (XSS), and SQL injection. What should you include in the recommendation?"}],"o":["interactive application security testing (IAST)","static application security testing (SAST)","runtime application se/f-protection (RASP)","dynamic application security testing (DAST)"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The vulnerability list in the stem is copied almost word for word from Microsoft's definition of dynamic application security testing: DAST tools analyse programs while they are executing, to find security vulnerabilities such as memory corruption, insecure server configuration, cross-site scripting, user privilege issues, SQL injection, and other critical security concerns. Insecure server configuration in particular can only be seen at runtime, which is what settles it against SAST.","whyWrong":["A. IAST instruments the running application from the inside. It is a real technique, but Microsoft frames this exact vulnerability list as the DAST case.","B. SAST analyses source code or compiled code when it is not executing, so it cannot see how the deployed server is configured.","C. RASP defends the application at runtime; it is a protective control, not a test."],"source":{"title":"Develop secure applications on Azure","url":"https://learn.microsoft.com/en-us/azure/security/develop/secure-develop"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/security/develop/secure-develop#test-your-application-in-an-operati ng-state"}]},
{"n":145,"sec":"std","num":126,"c":"Design security operations, identity, and compliance capabilities","q":"Your company uses Microsoft Defender for Cloud and Microsoft Sentinel. The company is designing an application that will have the architecture shown in the following exhibit.","body":[{"p":"Your company uses Microsoft Defender for Cloud and Microsoft Sentinel. The company is designing an application that will have the architecture shown in the following exhibit."},{"img":"img/p120_x1920.webp","w":1000,"h":244},{"p":"You are designing a logging and auditing solution for the proposed architecture. The solution must meet the following requirements-."},{"p":"• Integrate Azure Web Application Firewall (WAF) logs with Microsoft Sentinel."},{"p":"• Use Defender for Cloud to review alerts from the virtual machines."},{"p":"What should you include in the solution? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p121_x1939.webp","w":1000,"h":269}],"boxes":[{"label":"For WAF","value":"Data connectors"},{"label":"For the virtual machines","value":"The Log Analytics agent"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"OUTDATED","confidence":"MEDIUM","explanation":"Getting Defender for Cloud alerts on the virtual machines requires a data collection agent feeding it security-relevant signal, and among the five choices actually offered here, none of which is Azure Monitor Agent, the Log Analytics agent is the only one that did that job, which is why it was the correct choice when this question was written. That agent, however, reached end of support on 31 August 2024, and Microsoft's current guidance is to use the Azure Monitor Agent for this purpose instead. Since Azure Monitor Agent isn't among the options this item offers, the key is left as the source has it and the item is flagged as outdated rather than corrected to an option that doesn't exist here.","whyWrong":["The Azure Diagnostics extension collects platform metrics and logs to storage or an Event Hub; it does not feed the endpoint and workload signal that Defender for Cloud’s VM alerting is built on.","Azure Storage Analytics is a Storage-account-specific logging feature, unrelated to VM security monitoring."],"source":{"title":"Log Analytics agent overview (retired 31 August 2024)","url":"https://learn.microsoft.com/en-us/previous-versions/azure/azure-monitor/agents/log-analytics-agent"}},"ansimg":[{"img":"img/p121_x1941.webp","w":1000,"h":269}],"e":[{"img":"img/p121_x1933.webp","w":823,"h":197}]},
{"n":146,"sec":"std","num":127,"c":"Design security operations, identity, and compliance capabilities","q":"You need to recommend a solution for the security operations team. The solution must include custom views and a dashboard for analyzing security events. What should you recommend using in Microsoft Sentinel?","body":[{"p":"You have a Microsoft 365 E5 subscription and an Azure subscription. You are designing a Microsoft Sentinel deployment."},{"p":"You need to recommend a solution for the security operations team. The solution must include custom views and a dashboard for analyzing security events. What should you recommend using in Microsoft Sentinel?"}],"o":["playbooks","workbooks","notebooks","threat intelligence"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Workbooks are Sentinel's visualisation layer: interactive reports and dashboards built from workspace data, with a library of built-in templates and full support for custom views. The words in the stem, custom views and a dashboard for analysing events, map onto workbooks and nothing else here.","whyWrong":["A. Playbooks automate a response. Compare Standalone 40, where the requirement is action rather than analysis.","C. Notebooks host Jupyter-based hunting and data science investigations, not an operational dashboard.","D. Threat intelligence brings in indicators of compromise; it is a data source, not a view."],"source":{"title":"Visualize and monitor your data by using workbooks in Microsoft Sentinel","url":"https://learn.microsoft.com/en-us/azure/sentinel/monitor-your-data"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-overview"}]},
{"n":147,"sec":"std","num":128,"c":"Design security solutions for applications and data","q":"Your company is migrating data to Azure. The data contains Personally Identifiable Information (Pll). The company plans to use Microsoft Information Protection for the Pll data store in Azure. You need to recommend a solution to discover Pll data at risk in the Azure resources.","body":[{"p":"Your company is migrating data to Azure. The data contains Personally Identifiable Information (Pll). The company plans to use Microsoft Information Protection for the Pll data store in Azure. You need to recommend a solution to discover Pll data at risk in the Azure resources."},{"p":"What should you include in the recommendation? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p122_x1953.webp","w":667,"h":373}],"ansimg":[{"img":"img/p123_x1966.webp","w":667,"h":373}],"e":[{"img":"img/p123_x1971.webp","w":664,"h":366},{"p":"Prioritize security actions by data sensitivity, https://docs.microsoft.com/en-us/azure/defender-for-cloud /information-protection. As to Azure SQL Database Azure SQL Managed Instance Azure Synapse Analytics (Azure resources as well): https://docs.microsoft.com/en-us/azure/azure-sql/database/data-discovery-and- classification-overview?view=azuresql"}]},
{"n":148,"sec":"std","num":129,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"You are designing a security strategy for providing access to Azure App Service web apps through an Azure Front Door instance."},{"p":"You need to recommend a solution to ensure that the web apps only allow access through the Front Door instance."},{"p":"Solution: You recommend access restrictions that allow traffic from the Front Door service tags."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"A","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Yes. An access restriction rule built on the AzureFrontDoor.Backend service tag allows the app to accept traffic only from Front Door's backend address ranges, and Azure keeps the tag current as those ranges change, so nothing breaks when the platform scales. One refinement is worth carrying into the exam: a service tag admits any Front Door instance, not only yours, so Microsoft's own guidance pairs the rule with a check on the X-Azure-FDID header carrying your Front Door ID. The keyed answer is the mechanism the question is testing; the header is what pins it to your instance.","source":{"title":"Set up Azure App Service access restrictions","url":"https://learn.microsoft.com/en-us/azure/app-service/app-service-ip-restrictions"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/app-service/app-service-ip-restrictions#restrict-access-to-a-specific- azure-f ront-door-instan ce"}]},
{"n":149,"sec":"std","num":130,"c":"Design solutions that align with security best practices and priorities","q":"What should you include in the recommendation?","body":[{"p":"You are designing a ransomware response plan that follows Microsoft Security Best Practices."},{"p":"You need to recommend a solution to minimize the risk of a ransomware attack encrypting local user files."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Defender for Endpoint","Windows Defender Device Guard","protected folders","Azure Files","BitLocker Drive Encryption (BitLocker)"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"“Protected folders” names the controlled folder access element that does the work — Microsoft defines them as “the folders that CFA guards. Untrusted apps can't modify or delete files in these folders.” This is the same question as Standalone 176 with the option worded differently, and the same reasoning picks it out: the specific control beats the platform it lives in.","whyWrong":["A. Defender for Endpoint is the platform; the question asks for the control.","B. Device Guard restricts which code can execute.","D. Azure Files is storage, not an endpoint control.","E. BitLocker protects data if the device is lost or stolen; it is transparent to a process running as the signed-in user."],"source":{"title":"Protect folders from ransomware with controlled folder access","url":"https://learn.microsoft.com/en-us/defender-endpoint/controlled-folders"}}},
{"n":150,"sec":"std","num":131,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"Your company has a hybrid cloud infrastructure."},{"p":"The company plans to hire several temporary employees within a brief period. The temporary employees will need to access applications and data on the company ' premises network."},{"p":"The company ' s security policy prevents the use of personal devices for accessing company data and applications."},{"p":"You need to recommend a solution to provide the temporary employee with access to company resources. The solution must be able to scale on demand."},{"p":"What should you include in the recommendation?"}],"o":["Migrate the on-premises applications to cloud-based applications.","Redesign the VPN infrastructure by adopting a split tunnel configuration.","Deploy Microsoft Endpoint Manager and Azure Active Directory (Azure AD) Conditional Access.","Deploy Azure Virtual Desktop, Azure Active Directory (Azure AD) Conditional Access, and Microsoft Defender for Cloud Apps."],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Every requirement lines up with Azure Virtual Desktop plus its access controls. Temporary staff reach full desktops or published apps through a browser or a thin client, never touching corporate data locally, so the no personal device rule is enforced by design rather than by policy alone. Microsoft's overview highlights autoscale that increases or decreases capacity based on demand, which is the scale-on-demand requirement, and Conditional Access plus Defender for Cloud Apps layer session controls and risk-based access on top of the AVD session itself.","whyWrong":["A. Migrating applications to the cloud is a multi-year undertaking, not a response to a near-term hiring need, and does not by itself solve the personal-device restriction.","B. Split tunneling changes which VPN traffic goes direct versus through the tunnel; it does not stop use of personal devices or scale independently of VPN infrastructure.","C. Endpoint Manager (Intune) with Conditional Access manages and enrolls devices, which assumes a company-issued or enrollable device. It does not remove the need for a device at all the way a remote session does."],"source":{"title":"What is Azure Virtual Desktop?","url":"https://learn.microsoft.com/en-us/azure/virtual-desktop/overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/architecture/example-scenario/wvd/windows-virtual-desktop"},{"p":"https://docs.microsoft.com/en-us/azure/virtual-desktop/security-guide"},{"p":"https://techcommunity.microsoft.com/t5/security-compliance-and-identity/announcing-microsoft-defender- for-cloud-apps/ba-p/2835842"}]},
{"n":151,"sec":"std","num":132,"c":"Design security operations, identity, and compliance capabilities","q":"Your company has offices in 10 countries.","body":[{"p":"Your company has offices in 10 countries."},{"p":"You have a Microsoft 365 subscription that contains 1,000 users. Each user is assigned a Microsoft 365 E5 license."},{"p":"You plan to deploy a compliance assessment solution. The solution must meet the following requirements:"},{"p":"• Ensure that compliance is assessed based on the regulations of the country of each office."},{"p":"• Provide improvement action guidance to ensure compliance of the subscription."},{"p":"You need to recommend the service that should be used to perform the assessments, and identify additional costs that will be incurred. What should you recommend and what should you identify? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p126_x2007.webp","w":901,"h":360}],"ansimg":[{"img":"img/p126_x2009.webp","w":901,"h":360}],"e":[{"img":"img/p126_x2001.webp","w":936,"h":147}]},
{"n":152,"sec":"std","num":133,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription"},{"p":"You plan to deploy multiple containerized microservice-based apps to Azure Kubemetes Service (AKS)"},{"p":"You need to recommend a solution that meets the following requirements:"},{"p":"• Manages secrets"},{"p":"• Provides encryption"},{"p":"• Secures service-to-service communication by using mTLS encryption"},{"p":"• Minimizes administrative effort"},{"p":"What should you include in the recommendation?"}],"o":["Flux","Envoy","Dapr","Istio"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Istio is the option that meets all four requirements from one control plane. Microsoft's AKS add-on page describes Istio as enabling “load balancing, service-to-service authentication, and monitoring – with few or no service code changes”, built around “secure service-to-service communication in a cluster with TLS encryption, strong identity-based authentication, and authorization.” That TLS layer is Istio's mesh-wide mutual TLS, turned on with a single policy rather than per-service code changes, and the add-on goes further by having Microsoft handle scaling, configuration and lifecycle of the Istio control plane itself — which is exactly the “minimizes administrative effort” half of the requirement.","whyWrong":["A. Flux is a GitOps delivery agent. It reconciles manifests against a cluster; it has no service mesh or mTLS capability.","B. Envoy is the proxy Istio itself is built on. Using it directly, without Istio's control plane, means hand-configuring TLS and certificate distribution yourself, which is far more administrative effort, not less.","C. Dapr's building blocks do support mTLS between Dapr-enabled services and a secrets API, but each service must be written against the Dapr SDK or sidecar API to get those benefits. Istio’s mesh-wide policy secures existing services transparently, which is the lower-effort path the requirement asks for."],"source":{"title":"Istio-based service mesh add-on for Azure Kubernetes Service","url":"https://learn.microsoft.com/en-us/azure/aks/istio-about"}}},
{"n":153,"sec":"std","num":134,"c":"Design security solutions for applications and data","q":"Your on-premises network contains an e-commerce web app that was developed in Angular and Nodejs. The web app uses a MongoDB database. You plan to migrate the web app to Azure. The solution architecture team proposes the following architecture as an Azure landing zone.","body":[{"p":"Your on-premises network contains an e-commerce web app that was developed in Angular and Nodejs. The web app uses a MongoDB database. You plan to migrate the web app to Azure. The solution architecture team proposes the following architecture as an Azure landing zone."},{"img":"img/p127_x2021.webp","w":1000,"h":174},{"p":"You need to provide recommendations to secure the connection between the web app and the database. The solution must follow the Zero Trust model."},{"p":"Solution: You recommend implementing Azure Key Vault to store credentials."}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"No, and this one is the most tempting of the three wrong answers. Key Vault is the right place for a secret, and storing the database credentials there is better than a config file. But it does not secure the connection: the database still listens on a public endpoint, the app still authenticates with a password, and anyone who obtains that password can connect from anywhere. The Zero Trust answer removes the credential and the public path, using a private endpoint (Standalone 218) with a managed identity for authentication.","whyWrong":["A. Yes improves secret handling rather than the connection, and Zero Trust here means eliminating the shared secret and the public route, not storing the secret more carefully."],"source":{"title":"What is Azure Private Link?","url":"https://learn.microsoft.com/en-us/azure/private-link/private-link-overview"}},"e":[{"p":"When using Azure-provided PaaS services (e.g., Azure Storage, Azure Cosmos DB, or Azure Web App, use the PrivateLink connectivity option to ensure all data exchanges are over the private IP space and the traffic never leaves the Microsoft network."}]},
{"n":154,"sec":"std","num":135,"c":"Design solutions that align with security best practices and priorities","q":"You have a Microsoft 365 subscription that contains 1,000 Microsoft Exchange Online mailboxes. Incoming email from the internet is scanned for security threats by using a third-party cloud service. You are evaluating whether to replace the third-party service with Microsoft Defender for Office 365. What should you modify to ensure that all the incoming email is scanned by Defender for Office 365 only?","body":[{"p":"You have a Microsoft 365 subscription that contains 1,000 Microsoft Exchange Online mailboxes. Incoming email from the internet is scanned for security threats by using a third-party cloud service. You are evaluating whether to replace the third-party service with Microsoft Defender for Office 365. What should you modify to ensure that all the incoming email is scanned by Defender for Office 365 only?"}],"o":["the DNS records","the Exchange Online connectors","the accepted domains in Exchange Online","the Exchange Online transport rule"],"a":"A","srcA":"B","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nWhat decides where mail is scanned is where mail is delivered, and that is the MX record. While the MX points at the third-party service, every message reaches that service first no matter how the Exchange Online connectors are configured. Microsoft's migration guidance treats the DNS change as the moment protection actually transfers: the bypass spam filtering rule is disabled \"before or during the cutover of your MX record to Microsoft 365\", which is what turns on the full Microsoft filtering stack for all recipients. Modifying the connector is a real step in the migration, but it is the earlier one: Enhanced Filtering for Connectors exists so that Defender can see the true internet source while mail is still arriving through the third party. It makes filtering accurate, not exclusive, and the question asks for scanning by Defender for Office 365 only.","whyWrong":["B. Enhanced Filtering for Connectors improves accuracy while mail still routes through the other service. It cannot stop that service receiving the mail first.","C. Accepted domains tell Exchange Online which domains it is authoritative for. They do not choose the inbound path.","D. A transport rule can bypass or force filtering inside Exchange Online, but only for mail that has already been delivered there."],"source":{"title":"Migrate to Microsoft Defender for Office 365 Phase 2: Setup","url":"https://learn.microsoft.com/en-us/defender-office-365/migrate-to-defender-for-office-365-setup"},"corrected":true,"originalAnswer":"B"}},
{"n":155,"sec":"std","num":136,"c":"Design security solutions for applications and data","q":"Which two storage workloads support authentication by using Azure Active Directory (Azure AD)?","body":[{"p":"Your company is moving a big data solution to Azure."},{"p":"The company plans to use the following storage workloads:"},{"p":"• Azure Storage blob containers"},{"p":"• Azure Data Lake Storage Gen2"},{"p":"• Azure Storage file shares"},{"p":"• Azure Disk Storage"},{"p":"Which two storage workloads support authentication by using Azure Active Directory (Azure AD)?"},{"p":"Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point."}],"o":["Azure Disk Storage","Azure Storage blob containers","Azure Storage file shares","Azure Data Lake Storage Gen2"],"a":"B D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Blob containers and Data Lake Storage Gen2 are the same service (Gen2 is Blob storage with a hierarchical namespace), and both authorize requests with an OAuth 2.0 token issued by Microsoft Entra ID, so Entra security applies directly to data operations. Disk Storage has no such data-plane identity model at all; a managed disk is reached through the VM. Worth knowing where the line has moved: Azure Files does now support identity-based access, but it works differently. Azure Files uses the Kerberos protocol to authenticate with an identity source, whether on-premises AD DS, Entra Domain Services or Entra Kerberos, rather than presenting an Entra OAuth token the way blob does. The examinable pair is still blob and Data Lake Storage Gen2; treat Azure Files as the case to think twice about.","whyWrong":["A. Azure Disk Storage is attached to a virtual machine and has no identity-based data-plane authentication.","C. Azure Files supports identity-based authentication over SMB, but through Kerberos tickets from a domain source, not direct Entra ID token authorization."],"source":{"title":"Authorize access to blobs using Microsoft Entra ID","url":"https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory"},{"p":"https://docs.microsoft.com/en-us/azure/databricks/data/data-sources/azure/adls-gen2/azure-datalake-gen2-sp- access"}]},
{"n":156,"sec":"std","num":137,"c":"Design solutions that align with security best practices and priorities","q":"What should you recommend using to enforce the governance requirement?","body":[{"p":"You have an Azure subscription."},{"p":"Your company has a governance requirement that resources must be created in the West Europe or North Europe Azure regions."},{"p":"What should you recommend using to enforce the governance requirement?"}],"o":["regulatory compliance standards in Microsoft Defender for Cloud","custom Azure roles","Azure Policy assignments","Azure management groups"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Restricting which regions resources may be created in is the textbook Azure Policy case — Microsoft lists “Ensure your team deploys Azure resources only to allowed regions” as a headline governance action, and ships a built-in **Allowed Locations** definition with a Deny effect “used to enforce your geo-compliance requirements”.","whyWrong":["A. Regulatory compliance standards in Defender for Cloud assess against published frameworks; they do not enforce a company-specific region rule.","B. A custom Azure role decides who can create a resource, not where it may live.","D. Management groups are the scope you assign a policy to, not the mechanism that enforces anything."],"source":{"title":"Overview of Azure Policy","url":"https://learn.microsoft.com/en-us/azure/governance/policy/overview"}}},
{"n":157,"sec":"std","num":138,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription that contains 500 users. Each user is assigned a Microsoft 365 E5 license and uses a Windows device. Microsoft Purview data loss prevention (DLP) policies are applied to Microsoft Exchange Online email and SharePoint Online sites. You plan to monitor the usage of third-party generative Al apps by using Microsoft Purview Data Security Posture Management for Al (DSPM for Al). What should you do first?","body":[{"p":"You have a Microsoft 365 subscription that contains 500 users. Each user is assigned a Microsoft 365 E5 license and uses a Windows device. Microsoft Purview data loss prevention (DLP) policies are applied to Microsoft Exchange Online email and SharePoint Online sites. You plan to monitor the usage of third-party generative Al apps by using Microsoft Purview Data Security Posture Management for Al (DSPM for Al). What should you do first?"}],"o":["Enable Microsoft Purview insider risk management for all the users.","Onboard all endpoint devices to Microsoft Purview.","Configure Microsoft Purview data connectors for the generative Al apps.","License all the users for Microsoft 365 Copilot."],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Monitoring what users do with third-party generative AI sites depends on Purview seeing the browser traffic in the first place, and that visibility comes from the endpoint. Microsoft's setup guidance for DSPM for AI puts device onboarding first: devices must be onboarded to Microsoft Purview, and the Purview browser extension installed, before any insider risk or DLP policy for third-party AI sites can detect a visit or a paste of sensitive content. Only after that plumbing exists does DSPM for AI have anything to alert or act on.","whyWrong":["A. Insider risk management policies for AI site visits are configured after onboarding, and depend on the device signal already being onboarded to fire at all.","C. There are no first-party data connectors for arbitrary third-party generative AI apps; visibility into them comes from endpoint/browser signals, which is exactly what device onboarding provides.","D. Licensing users for Copilot governs Microsoft's own AI assistant. It does nothing to observe usage of external generative AI sites."],"source":{"title":"Microsoft Purview Data Security Posture Management for AI","url":"https://learn.microsoft.com/en-us/purview/dspm-for-ai"}}},
{"n":158,"sec":"std","num":139,"c":"Design solutions that align with security best practices and priorities","q":"You need to recommend a solution to evaluate and remediate the alerts by using workflow automation. The solution must minimize development effort. What should you include in the recommendation?","body":[{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled. Suspicious authentication activity alerts have been appearing in the Workload protections dashboard."},{"p":"You need to recommend a solution to evaluate and remediate the alerts by using workflow automation. The solution must minimize development effort. What should you include in the recommendation?"}],"o":["Azure Monitor webhooks","Azure Logics Apps","Azure Event Hubs","Azure Functions apps"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Workflow automation in Defender for Cloud is built on Azure Logic Apps: you create a Logic App with the Defender for Cloud connector as its trigger, then an automation rule that fires it on matching alerts or recommendations. The designer is low-code with hundreds of prebuilt connectors, which is what satisfies the requirement to minimise development effort.","whyWrong":["A. Azure Monitor webhooks can carry an alert somewhere, but you still have to build the thing that receives it.","C. Event Hubs is a streaming ingestion service, useful for export to a third-party SIEM, not for remediation.","D. Functions means writing and maintaining code, which is more development effort, not less."],"source":{"title":"Automate remediation responses with workflow automation in Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/workflow-automation"}},"e":[{"p":"The workflow automation feature of Microsoft Defender for Cloud feature can trigger Logic Apps on security alerts, recommendations, and changes to regulatory compliance."},{"p":"Note: Azure Logic Apps is a cloud-based platform for creating and running automated workflows that integrate your apps, data, services, and systems. With this platform, you can quickly develop highly scalable integration solutions for your enterprise and business-to-business (B2B) scenarios."}]},
{"n":159,"sec":"std","num":140,"c":"Design security solutions for applications and data","q":"Your company plans to provision blob storage by using an Azure Storage account The blob storage will be accessible from 20 application sewers on the internet. You need to recommend a solution to ensure that only the application servers can access the storage account. What should you recommend using to secure the blob storage?","body":[{"p":"Your company plans to provision blob storage by using an Azure Storage account The blob storage will be accessible from 20 application sewers on the internet. You need to recommend a solution to ensure that only the application servers can access the storage account. What should you recommend using to secure the blob storage?"}],"o":["service tags in network security groups (NSGs)","managed rule sets in Azure Web Application Firewall (WAF) policies","inbound rules in network security groups (NSGs)","firewall rules for the storage account","inbound rules in Azure Firewall"],"a":"D","srcA":"C","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nA network security group cannot protect a storage account at all. NSGs filter traffic at a subnet or network interface inside a virtual network; a storage account is a PaaS service reached through its own public endpoint, which no NSG sits in front of. The control that does this is the storage account firewall: “Each IP network rule enables traffic from a specific public IP address range”, and Microsoft gives the identical example of allowing a client’s public IP. With the firewall configured, only the 20 application servers’ addresses get through and everything else is denied.","whyWrong":["A. Service tags are used inside NSG rules, so this fails for the same reason — NSGs do not govern access to a storage account.","B. A Web Application Firewall inspects HTTP for a web application behind Application Gateway or Front Door.","C. Inbound NSG rules govern traffic entering a subnet or NIC, not a storage account.","E. Azure Firewall filters traffic leaving or crossing your network; it is not in the path of an internet client reaching a storage endpoint."],"source":{"title":"Azure Storage firewall rules and network access","url":"https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security"},"corrected":true,"originalAnswer":"C"}},
{"n":160,"sec":"std","num":141,"c":"Design security solutions for infrastructure","q":"You have an Azure subscription and an on-premises datacenter. The datacenter contains 100 servers that run Windows Server. AJI the servers are backed up to a Recovery Services vault by using Azure Backup and the Microsoft Azure Recovery Services (MARS) agent.","body":[{"p":"You have an Azure subscription and an on-premises datacenter. The datacenter contains 100 servers that run Windows Server. AJI the servers are backed up to a Recovery Services vault by using Azure Backup and the Microsoft Azure Recovery Services (MARS) agent."},{"p":"You need to design a recovery solution for ransomware attacks that encrypt the on-premises servers. The solution must follow Microsoft Security Best Practices and protect against the following risks:"},{"p":"• A compromised administrator account used to delete the backups from Azure Backup before encrypting the"},{"p":"servers"},{"p":"• A compromised administrator account used to disable the backups on the MARS agent before encrypting the"},{"p":"servers"},{"p":"What should you use for each risk? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point"},{"img":"img/p131_x2073.webp","w":949,"h":283}],"ansimg":[{"img":"img/p131_x2079.webp","w":949,"h":283}],"e":[{"img":"img/p131_x2067.webp","w":928,"h":154}]},
{"n":161,"sec":"std","num":142,"c":"Design security operations, identity, and compliance capabilities","q":"Does this meet the goal?","body":[{"p":"Note: This section contains one or more sets of questions with the same scenario and problem. Each question presents a unique solution to the problem. You must determine whether the solution meets the stated goals. More than one solution in the set might solve the problem. It is also possible that none of the solutions in the set solve the problem."},{"p":"After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen."},{"p":"You have a Microsoft 365 subscription that uses Microsoft Defender XDR. The subscription contains 500 devices that are enrolled in Microsoft Intune. The subscription contains 500 users that connect to external software as a service (SaaS) apps by using the devices."},{"p":"You need to implement a solution that meets the following requirements:"},{"p":"• Allows user access to SaaS apps that Microsoft has identified as low risk."},{"p":"• Blocks user access to Saas apps that Microsoft has identified as high risk."},{"p":"Solution: You configure app protection policies in Intune, and you create a Conditional Access policy."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"No. Neither piece of this solution knows anything about app risk scores. Intune app protection policies are data-protection policies applied inside managed apps: they stop copy and paste to personal apps, require a PIN, and can wipe corporate data. Conditional Access can block access to a cloud app, but only to apps you name in the policy, one at a time, and it has no view of the Defender for Cloud Apps catalogue. Blocking by Microsoft's risk assessment across thousands of apps needs Cloud Discovery and the Unsanctioned tag.","whyWrong":["A. Yes would require these two controls to act on Microsoft’s risk rating of SaaS apps. Neither has access to it."],"source":{"title":"Govern discovered apps using Microsoft Defender for Endpoint","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/mde-govern"}}},
