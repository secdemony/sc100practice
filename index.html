{"n":181,"sec":"std","num":162,"c":"Design security solutions for infrastructure","q":"You plan to deploy a dynamically scaling, Linux-based Azure Virtual Machine Scale Set that will host jump servers. The jump servers will be used by support staff who connect from personal and kiosk devices via the internet. The subnet of the jump servers will be associated to a network security group (NSG).","body":[{"p":"You plan to deploy a dynamically scaling, Linux-based Azure Virtual Machine Scale Set that will host jump servers. The jump servers will be used by support staff who connect from personal and kiosk devices via the internet. The subnet of the jump servers will be associated to a network security group (NSG)."},{"p":"You need to design an access solution for the Azure Virtual Machine Scale Set. The solution must meet the following requirements:"},{"p":"• Ensure that each time the support staff connects to a jump server; they must request access to the server."},{"p":"• Ensure that only authorized support staff can initiate SSH connections to the jump servers."},{"p":"• Maximize protection against brute-force attacks from internal networks and the internet."},{"p":"• Ensure that users can only connect to the jump servers from the internet."},{"p":"• Minimize administrative effort."},{"p":"What should you include in the solution? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p147_x2320.webp","w":1000,"h":181}],"ansimg":[{"img":"img/p147_x2326.webp","w":1000,"h":181}],"e":[{"img":"img/p147_x2314.webp","w":1000,"h":108}]},
{"n":182,"sec":"std","num":163,"c":"Design solutions that align with security best practices and priorities","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription."},{"p":"You plan to deploy Azure App Services apps by using Azure DevOps."},{"p":"You need to recommend a solution to ensure that deployed apps maintain compliance with Microsoft cloud security benchmark (MCSB) recommendations."},{"p":"What should you include in the recommendation?"}],"o":["DevOps security in Microsoft Defender for Cloud","Microsoft Defender for App Service","a branch policy in Azure DevOps","Azure Policy"],"a":"D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"The Microsoft cloud security benchmark is delivered as an Azure Policy initiative, so keeping deployed App Service apps compliant with it means assigning that initiative and letting Azure Policy evaluate each app as it is created or updated. The distractors are all about the pipeline rather than the deployed resource.","whyWrong":["A. DevOps security in Defender for Cloud assesses the repositories and pipelines, not the running App Service.","B. Defender for App Service detects threats against the running app; it does not enforce a benchmark.","C. A branch policy gates code review before merge, well before anything is deployed."],"source":{"title":"Overview of Azure Policy","url":"https://learn.microsoft.com/en-us/azure/governance/policy/overview"}}},
{"n":183,"sec":"std","num":164,"c":"Design solutions that align with security best practices and priorities","q":"You have an Azure subscription that is used as an Azure landing zone for an application. You need to evaluate the security posture of all the workloads in the landing zone. What should you do first?","body":[{"p":"You have an Azure subscription that is used as an Azure landing zone for an application. You need to evaluate the security posture of all the workloads in the landing zone. What should you do first?"}],"o":["Add Microsoft Sentinel data connectors.","Configure Continuous Integration/Continuous Deployment (CI/CD) vulnerability scanning.","Enable the Defender plan for all resource types in Microsoft Defender for Cloud.","Obtain Azure Active Directory Premium Plan 2 licenses."],"a":"C"},
{"n":184,"sec":"std","num":165,"c":"Design security operations, identity, and compliance capabilities","q":"You need to recommend a solution to send security events from Microsoft Sentinel to Splunk. What should you include in the recommendation?","body":[{"p":"Your company has a third-party security information and event management (SIEM) solution that uses Splunk and Microsoft Sentinel. You plan to integrate Microsoft Sentinel with Splunk."},{"p":"You need to recommend a solution to send security events from Microsoft Sentinel to Splunk. What should you include in the recommendation?"}],"o":["Azure Event Hubs","Azure Data Factor","a Microsoft Sentinel workbook","a Microsoft Sentinel data connector"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The direction of travel decides this. Data connectors bring data into Sentinel; getting data out to a third-party SIEM goes the other way, and the supported mechanism is a Log Analytics workspace data export rule with an event hub as the destination. Splunk then reads from the event hub using the Splunk Add-on for Microsoft Cloud Services. Event Hubs is the standard hand-off point between Azure Monitor and any external consumer.","whyWrong":["B. Data Factory is an ETL and data movement service for analytics workloads, not a streaming egress for security events.","C. A workbook renders data inside Sentinel. It exports nothing.","D. A data connector is inbound. This is the trap in the question: it is the right noun pointing the wrong way."],"source":{"title":"Log Analytics workspace data export in Azure Monitor","url":"https://learn.microsoft.com/en-us/azure/azure-monitor/logs/logs-data-export"}}},
{"n":185,"sec":"std","num":166,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription that contains multiple Azure Blob Storage accounts."},{"p":"You need to recommend a solution to detect threats in files after the files are uploaded to a blob container."},{"p":"What should you include in the recommendation?"}],"o":["vulnerability assessment in Microsoft Defender for Containers","runtime threat protection in Microsoft Defender for Containers","malware scanning in Microsoft Defender for Storage","sensitive data threat detection in Microsoft Defender for Storage"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Malware scanning in Defender for Storage is triggered on upload: a blob written to a container is scanned in near real time and the result is surfaced as a scan result and an alert, which is precisely detect threats in files after the files are uploaded. It is an add-on capability of the Defender for Storage plan, enabled per storage account.","whyWrong":["A and B. Both Defender for Containers capabilities protect Kubernetes and container images, not a blob container. The word container in the stem is storage terminology and this is the trap.","D. Sensitive data threat detection tells you the blob holds sensitive data and raises the severity of alerts about it. It is about the sensitivity of the content, not about the file being malicious."],"source":{"title":"Malware scanning in Microsoft Defender for Storage","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/introduction-malware-scanning"}}},
{"n":186,"sec":"std","num":167,"c":"Design solutions that align with security best practices and priorities","q":"You have a Microsoft 365 £5 subscription.","body":[{"p":"You have a Microsoft 365 £5 subscription."},{"p":"You plan to implement Microsoft Priva Subject Rights Requests for Microsoft 365 data."},{"p":"You need to streamline the creation and processing of subject rights requests. The solution must minimize development effort."},{"p":"What should you include in the solution? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p149_x2351.webp","w":800,"h":277}],"boxes":[{"label":"To streamline creation","value":"The Microsoft Graph API"},{"label":"To streamline processing","value":"Microsoft Power Automate"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","ansimg":[{"img":"img/p149_x2357.webp","w":800,"h":277}],"e":[{"img":"img/p150_x2369.webp","w":827,"h":174}]},
{"n":187,"sec":"std","num":168,"c":"Design security solutions for infrastructure","q":"Your network contains an on-premises Active Directory Domain Services (AO DS) domain. The domain contains a server that runs Windows Server and hosts shared folders The domain syncs with Azure AD by using Azure AD Connect Azure AD Connect has group writeback enabled.","body":[{"p":"Your network contains an on-premises Active Directory Domain Services (AO DS) domain. The domain contains a server that runs Windows Server and hosts shared folders The domain syncs with Azure AD by using Azure AD Connect Azure AD Connect has group writeback enabled."},{"p":"You have a Microsoft 365 subscription that uses Microsoft SharePoint Online."},{"p":"You have multiple project teams. Each team has an AD DS group that syncs with Azure AD Each group has permissions to a unique SharePoint Online site and a Windows Server shared folder for its project. Users routinely move between project teams."},{"p":"You need to recommend an Azure AD identity Governance solution that meets the following requirements:"},{"p":"• Project managers must verify that their project group contains only the current members of their project team"},{"p":"• The members of each project team must only have access to the resources of the project to which they are"},{"p":"assigned"},{"p":"• Users must be removed from a project group automatically if the project manager has MOT verified the"},{"p":"group s membership for 30 days."},{"p":"• Administrative effort must be minimized."},{"p":"What should you include in the recommendation? To answer select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p150_x2375.webp","w":624,"h":163}],"ansimg":[{"img":"img/p151_x2384.webp","w":624,"h":163}],"e":[{"img":"img/p151_x2389.webp","w":1000,"h":143}]},
{"n":188,"sec":"std","num":169,"c":"Design security solutions for infrastructure","q":"What is the first step in the recovery plan?","body":[{"p":"You have a Microsoft 365 subscription that syncs with Active Directory Domain Services (AD DS)."},{"p":"You need to define the recovery steps for a ransomware attack that encrypted data in the subscription The solution must follow Microsoft Security Best Practices."},{"p":"What is the first step in the recovery plan?"}],"o":["Disable Microsoft OneDnve sync and Exchange ActiveSync.","Recover files to a cleaned computer or device.","Contact law enforcement.","From Microsoft Defender for Endpoint perform a security scan."],"a":"A"},
{"n":189,"sec":"std","num":170,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"A customer has a Microsoft 365 E5 subscription and an Azure subscription."},{"p":"The customer wants to centrally manage security incidents, analyze log, audit activity, and search for potential threats across all deployed services."},{"p":"You need to recommend a solution for the customer. The solution must minimize costs."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft 365 Defender","Microsoft Defender for Cloud","Microsoft Defender for Cloud Apps","Microsoft Sentinel"],"a":"D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Read the four requirements together: centrally manage incidents, analyse logs, audit activity, and hunt, all across every deployed service. That is a SIEM, and Sentinel is the only option that spans both the Azure subscription and the Microsoft 365 estate. The cost requirement is about not standing up several overlapping tools, not about picking the cheapest product in the list.","whyWrong":["A. Microsoft 365 Defender (now Defender XDR) correlates across the Microsoft 365 workloads, but does not cover the Azure subscription resources.","B. Defender for Cloud is CSPM and cloud workload protection for Azure resources; it is not where you audit Microsoft 365 activity.","C. Defender for Cloud Apps covers SaaS usage only."],"source":{"title":"What is Microsoft Sentinel?","url":"https://learn.microsoft.com/en-us/azure/sentinel/overview"}}},
{"n":190,"sec":"std","num":171,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription.","body":[{"p":"You have a Microsoft 365 subscription."},{"p":"You need to design a solution to block file downloads from Microsoft SharePoint Online by authenticated users on unmanaged devices."},{"p":"Which two services should you include in the solution? Each correct answer presents part of the solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["Microsoft Defender for Cloud Apps","Azure AD Application Proxy","Azure Data Catalog","Azure AD Conditional Access","Microsoft Purview Information Protection"],"a":"A D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"This needs both halves and the question says so. A Defender for Cloud Apps **session policy** with Conditional Access App Control is what inspects the live session and blocks the download — Microsoft's own example is allowing access from unmanaged devices while limiting the download of sensitive files. But a session policy cannot work alone: “in order for your session policy to work, you must also have a Microsoft Entra ID Conditional Access policy”, which routes the session through Defender for Cloud Apps in the first place.","whyWrong":["B. Application Proxy publishes on-premises web apps; SharePoint Online is already a cloud service.","C. Azure Data Catalog is a data discovery service, long superseded, and unrelated.","E. Purview Information Protection can label and encrypt the file, but it does not block the download action based on device management state."],"source":{"title":"Create session policies in Microsoft Defender for Cloud Apps","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/session-policy-aad"}}},
{"n":191,"sec":"std","num":172,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"You have a Microsoft 365 tenant that contains 5,000 users and 5,000 Windows 11 devices. All users are assigned Microsoft 365 £5 licenses and the Microsoft Defender Vulnerability Management add-on. The Windows 11 devices are managed by using Microsoft Intune and Microsoft Defender for Endpoint. The Windows 11 devices are configured during deployment to comply with Center for Internet Security (CIS) benchmarks for Windows 11."},{"p":"You need to recommend a compliance solution for the Windows 11 devices. The solution must identify devices that were modified and no longer comply with the CIS benchmarks."},{"p":"What should you include in the recommendation?"}],"o":["Authenticated scan for Windows in Microsoft Defender Vulnerability Management","Microsoft Secure Score for Devices in Defender for Endpoint","attack surface reduction (ASR) rules in Defender for Endpoint","security baselines assessments in Microsoft Defender Vulnerability Management"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Security baselines assessment is the Defender Vulnerability Management feature built for exactly this: it “helps you to continuously and effortlessly monitor your organization's security baselines compliance and identify changes in real time”, comparing devices against a base benchmark — and CIS benchmarks for Windows 10, Windows 11 and Windows Server are explicitly supported. Devices configured to CIS at deployment and later modified show up as non-compliant against the profile.","whyWrong":["A. An authenticated scan reaches unmanaged devices; these devices are already onboarded.","B. Microsoft Secure Score for Devices is an aggregate posture score, not a per-device CIS compliance result.","C. Attack surface reduction rules harden the device against specific attack techniques; they do not measure benchmark drift."],"source":{"title":"Security baselines assessment in Microsoft Defender Vulnerability Management","url":"https://learn.microsoft.com/en-us/defender-vulnerability-management/tvm-security-baselines"}}},
{"n":192,"sec":"std","num":173,"c":"Design security solutions for infrastructure","q":"What should you include in the solution?","body":[{"p":"You have an Azure subscription that contains 100 virtual machines, a virtual network named VNet1, and 20 users. The virtual machines run Windows Server and are connected to VNet1. The users work remotely and access Azure resources from Linux workstations."},{"p":"You need to ensure that the users can connect to the virtual machines from the workstations by using Secure Shell {SSH). The solution must meet the following requirements:"},{"p":"• Ensure that the users authenticate by using their Microsoft Entra credentials."},{"p":"• Prevent the users from transferring files from the virtual machines by using SSH."},{"p":"• Prevent the users from directly accessing the virtual machines by using the public IP address of the virtual"},{"p":"machines."},{"p":"What should you include in the solution?"}],"o":["Azure Bastion","Azure NAT Gateway","just-in-time (JIT) VM access","Point-to-Site (P2S) VPN"],"a":"A"},
{"n":193,"sec":"std","num":174,"c":"Design solutions that align with security best practices and priorities","q":"For a Microsoft cloud environment, you need to recommend a security architecture that follows the Zero Trust principles of the Microsoft Cybersecurity Reference Architectures (MCRA).","body":[{"p":"For a Microsoft cloud environment, you need to recommend a security architecture that follows the Zero Trust principles of the Microsoft Cybersecurity Reference Architectures (MCRA)."},{"p":"Which security methodologies should you include in the recommendation? To answer, drag the appropriate methodologies to the"},{"p":"correct principles. Each methodology may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p154_x2431.webp","w":818,"h":166}],"ansimg":[{"img":"img/p154_x2437.webp","w":818,"h":166}],"e":[{"img":"img/p154_x2425.webp","w":828,"h":142}]},
{"n":194,"sec":"std","num":175,"c":"Design solutions that align with security best practices and priorities","q":"For a Microsoft cloud environment, you are designing a security architecture based on the Microsoft Cloud Security Benchmark.","body":[{"p":"For a Microsoft cloud environment, you are designing a security architecture based on the Microsoft Cloud Security Benchmark."},{"p":"What are three best practices for identity management based on the Azure Security Benchmark? Each correct answer presents a complete solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["Manage application identities securely and automatically.","Manage the lifecycle of identities and entitlements","Protect identity and authentication systems.","Enable threat detection for identity and access management.","Use a centralized identity and authentication system."],"a":"A C E"},
{"n":195,"sec":"std","num":176,"c":"Design security solutions for infrastructure","q":"You are designing a ransomware response plan that follows Microsoft Security Best Practices. You need to recommend a solution to minimize the risk of a ransomware attack encrypting local user files What should you include in the recommendation?","body":[{"p":"You are designing a ransomware response plan that follows Microsoft Security Best Practices. You need to recommend a solution to minimize the risk of a ransomware attack encrypting local user files What should you include in the recommendation?"}],"o":["Controlled folder access","Azure Files","Windows Defender Device Guard","Microsoft Defender for Endpoint","BitLocker Drive Encryption (BitLocker)"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Controlled folder access exists for exactly this: “Ransomware encrypts your files and holds them hostage. CFA counters this threat by allowing only trusted apps to change files in protected folders.” It is an attack surface reduction capability in Defender for Endpoint, delivered by Microsoft Defender Antivirus, and it protects the user profile folders by default.","whyWrong":["B. Azure Files is cloud file storage, not a control on the endpoint.","C. Device Guard (now App Control for Business) controls which code may run, a different control from guarding a folder’s contents.","D. Defender for Endpoint is the platform that contains the feature. The question asks which control to use, and CFA is the specific one.","E. BitLocker encrypts the volume at rest. It does not stop a process running on the signed-in device from encrypting files."],"source":{"title":"Protect folders from ransomware with controlled folder access","url":"https://learn.microsoft.com/en-us/defender-endpoint/controlled-folders"}}},
{"n":196,"sec":"std","num":177,"c":"Design security solutions for infrastructure","q":"What should you use?","body":[{"p":"You have an on-premises datacenter and an Azure Kubernetes Service (AKS) cluster named AKS1."},{"p":"You need to restrict internet access to the public endpoint of AKS 1. The solution must ensure that AKS1 can be accessed only from the public IP addresses associated with the on-premises datacenter."},{"p":"What should you use?"}],"o":["a network security group (N5G)","a service endpoint","a private endpoint","an authorized IP range"],"a":"D"},
{"n":197,"sec":"std","num":178,"c":"Design security solutions for applications and data","q":"You have a Microsoft Entra tenant that is linked to a Microsoft 365 subscription and an Azure subscription. The tenant contains service principals that are used to access applications in the Azure subscription.","body":[{"p":"You have a Microsoft Entra tenant that is linked to a Microsoft 365 subscription and an Azure subscription. The tenant contains service principals that are used to access applications in the Azure subscription."},{"p":"You need to recommend a solution to detect risky sign-ins and other risky activities performed by the service principals in the tenant. The solution must minimize costs."},{"p":"What should you include in the recommendation? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p156_x2468.webp","w":771,"h":275}],"ansimg":[{"img":"img/p156_x2470.webp","w":771,"h":275}],"e":[{"img":"img/p156_x2462.webp","w":723,"h":153}]},
{"n":198,"sec":"std","num":179,"c":"Design solutions that align with security best practices and priorities","q":"To which subscriptions can the Defender for Cloud standard be applied?","body":[{"p":"You have an Azure subscription that uses Microsoft Defender for Cloud."},{"p":"You have Amazon Web Services (AWS), Google Cloud Platform (GCP). and Oracle Cloud Infrastructure (OCI) subscriptions."},{"p":"You create a custom security standard in Defender for Cloud."},{"p":"To which subscriptions can the Defender for Cloud standard be applied?"}],"o":["Azure and AWS only","Azure and GCP only","Azure. AWS, and GCP only","Azure, AWS. and OCI only","Azure, AWS, GCP. and OCI"],"a":"C"},
{"n":199,"sec":"std","num":180,"c":"Design security operations, identity, and compliance capabilities","q":"You are designing a privileged access strategy for a company named Contoso, Ltd. and its partner company named Fabrikam, Inc. Contoso has a Microsoft Entra tenant named contoso.com. Fabrikam has a Microsoft Entra tenant named fabrikam.com. Users at Fabrikam must access the resources in contoso.com.","body":[{"p":"You are designing a privileged access strategy for a company named Contoso, Ltd. and its partner company named Fabrikam, Inc. Contoso has a Microsoft Entra tenant named contoso.com. Fabrikam has a Microsoft Entra tenant named fabrikam.com. Users at Fabrikam must access the resources in contoso.com."},{"p":"You need to provide the Fabrikam users with access to the Contoso resources by using access packages. The solution must meet the following requirements:"},{"p":"• Ensure that the Fabrikam users can use the Contoso access packages without explicitly creating guest"},{"p":"accounts in contoso.com."},{"p":"• Allow non-administrative users in contoso.com to create the access packages."},{"p":"What should you use for each requirement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p157_x2482.webp","w":1000,"h":233}],"boxes":[{"label":"Ensure Fabrikam users can use access packages without creating guest accounts","value":"A connected organization"},{"label":"Allow non-administrative users to create access packages","value":"Catalogs"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","ansimg":[{"img":"img/p158_x2495.webp","w":1000,"h":233}],"e":[{"img":"img/p158_x2500.webp","w":1000,"h":125}]},
{"n":200,"sec":"std","num":181,"c":"Design security solutions for applications and data","q":"You are planning the security requirements for Azure Cosmos DB Core (SQL) API accounts. You need to recommend a solution to audit all users that access the data in the Azure Cosmos DB accounts. Which two configurations should you include in the recommendation? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","body":[{"p":"You are planning the security requirements for Azure Cosmos DB Core (SQL) API accounts. You need to recommend a solution to audit all users that access the data in the Azure Cosmos DB accounts. Which two configurations should you include in the recommendation? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point."}],"o":["Enable Microsoft Defender for Cosmos DB.","Send the Azure Active Directory (Azure AD) sign-in logs to a Log Analytics workspace.","Disable local authentication for Azure Cosmos DB.","Enable Microsoft Defender for Identity.","Send the Azure Cosmos DB logs to a Log Analytics workspace."],"a":"C E","srcA":"B C","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nAuditing who touched the data needs two things: every request must be attributable to an identity, and every request must be recorded. Disabling local authentication is the first half. While the account keys work, any caller holding a key is indistinguishable from any other, so no log can name a user. Sending the Cosmos DB diagnostic logs to a Log Analytics workspace is the second half. The DataPlaneRequests category captures every data plane operation for the Cosmos DB account, and its table carries AadPrincipalId, the AAD Principal ID of the caller issuing the data plane request, alongside the operation, the container and the client IP. Entra sign-in logs were the keyed choice but they record token issuance, not the individual reads and writes against a container, so they cannot show which users accessed the data.","whyWrong":["A. Defender for Cosmos DB detects anomalous and potentially malicious access. It is threat detection, not an audit trail of all access.","B. Entra sign-in logs show authentication events, not per-request data plane activity against the account.","D. Defender for Identity monitors Active Directory and identity infrastructure. It has no view of Cosmos DB."],"source":{"title":"Azure Monitor Logs reference: CDBDataPlaneRequests","url":"https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/cdbdataplanerequests"},"corrected":true,"originalAnswer":"B C"},"e":[{"p":"https://docs.microsoft.com/en-us/azure/cosmos-db/audit-control-plane-logs"}]},
{"n":201,"sec":"std","num":182,"c":"Design solutions that align with security best practices and priorities","q":"What should you use to start the threat modeling process?","body":[{"p":"Your company plans to follow DevSecOps best practices of the Microsoft Cloud Adoption Framework for Azure."},{"p":"You need to perform threat modeling by using a top-down approach based on the Microsoft Cloud Adoption Framework for Azure."},{"p":"What should you use to start the threat modeling process?"}],"o":["the STRIDE model","the DREAD model","OWASP threat modeling"],"a":"C"},
{"n":202,"sec":"std","num":183,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"You have a Microsoft Sentinel deployment."},{"p":"You are developing a solution to ensure that compliance with the MITRE ATT & CK framework is maintained as the framework"},{"p":"evolves."},{"p":"You need to recommend a solution to identify which MITRE ATT & CK techniques are NOT addressed by the current Microsoft Sentinel deployment"},{"p":"What should you include in the recommendation?"}],"o":["the Microsoft Sentinel Health Summary dashboard","the MITRE analytics explorer","the MITRE coverage matrix","the Microsoft Sentinel Analytics blade"],"a":"C","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Sentinel's MITRE ATT&CK page presents the framework as a matrix and shades each technique by how many active detections you have for it, which makes the gaps the visible thing on the screen. That is what the question is asking for: not a list of your rules, but the techniques your rules do not cover. Because the matrix is refreshed as Sentinel tracks new framework versions, it also keeps answering the question as ATT&CK evolves.","whyWrong":["A. The Health Summary dashboard reports connector and rule health, not detection coverage.","B. There is no Sentinel feature by the name MITRE analytics explorer.","D. The Analytics blade lists the rules you have. It tells you what is covered, not what is missing."],"source":{"title":"View MITRE ATT&CK coverage in Microsoft Sentinel","url":"https://learn.microsoft.com/en-us/azure/sentinel/mitre-coverage"}}},
{"n":203,"sec":"std","num":184,"c":"Design security operations, identity, and compliance capabilities","q":"You are designing a ransomware mitigation strategy","body":[{"p":"You are designing a ransomware mitigation strategy"},{"p":"You perform a ransomware risk assessment and identify business-critical assets."},{"p":"You need to recommend a solution to mitigate ransomware threats. The solution must follow Microsoft security best practices."},{"p":"Which two actions should you include in the recommendation? Each correct answer presents a complete solution."},{"p":"NOTE: Each correct answer is worth one point."}],"o":["Implement immutable, offline backups that have restricted access and test restore procedures regularly.","Deploy Privileged Identity Management (PIM) that uses just-in-time (JIT) access and approval workflows.","Enable firewall logging for auditing, without restricting inbound or outbound traffic.","Use extended patching cycles to reduce the risk of update-related service disruptions."],"a":"A B"},
{"n":204,"sec":"std","num":185,"c":"Design security solutions for infrastructure","q":"You have an Azure subscription that contains 100 virtual machines. The virtual machines are accessed by using Azure Bastion.","body":[{"p":"You have an Azure subscription that contains 100 virtual machines. The virtual machines are accessed by using Azure Bastion."},{"p":"You need to recommend a solution to ensure that only specific users in specific locations can access the virtual machines. The solution must meet the following requirements:"},{"p":"• Restrict access to the virtual machines based on an originating IP address or a connection request by using"},{"p":"just-in-time (JIT) VM access network-based controls."},{"p":"• Restrict access to the virtual machines based on role-based access control (RBAC) role assignments by"},{"p":"using JIT VM access authorization controls."},{"p":"Which Microsoft cloud services should you include in the recommendation? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p160_x2526.webp","w":928,"h":237}],"ansimg":[{"img":"img/p161_x2545.webp","w":928,"h":237}],"e":[{"img":"img/p161_x2550.webp","w":964,"h":139}]},
{"n":205,"sec":"std","num":186,"c":"Design solutions that align with security best practices and priorities","q":"You have an Azure subscription that contains multiple apps. The apps are managed by using continuous integration and continuous deployment (CI/CD) pipelines in Azure DevOps.","body":[{"p":"You have an Azure subscription that contains multiple apps. The apps are managed by using continuous integration and continuous deployment (CI/CD) pipelines in Azure DevOps."},{"p":"You need to recommend DevSecOps controls for the Commit the code and the Build and test CI/CD process stages based on the Microsoft Cloud Adoption Framework for Azure."},{"p":"Which testing method should you recommend for each stage? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p161_x2539.webp","w":896,"h":296}],"ansimg":[{"img":"img/p162_x2563.webp","w":896,"h":296}],"e":[{"img":"img/p162_x2568.webp","w":945,"h":143}]},
{"n":206,"sec":"std","num":187,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription."},{"p":"You have an on-premises datacenter. The datacenter contains 20 servers that run Windows Server. Each server is onboarded to Azure Arc and is protected by using Microsoft Defender for Servers Plan 1."},{"p":"You have a Microsoft 365 subscription."},{"p":"You need to recommend a solution to identify which servers have outdated hardware drivers or firmware."},{"p":"What should you include in the recommendation?"}],"o":["Change all the servers to Microsoft Defender for Servers Plan 2.","Add Microsoft Defender Vulnerability Management add-ons.","Onboard all the servers to Azure Update Manager.","Add the Microsoft Intune Suite add-on."],"a":"B","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Hardware and firmware assessment is a premium Defender Vulnerability Management capability, not part of the vulnerability scanning included with Defender for Servers Plan 1. Adding the Defender Vulnerability Management add-on is what turns it on for servers already covered by Plan 1 — which is also why upgrading the plan is not the minimal answer.","whyWrong":["A. Moving every server to Plan 2 is a far larger change and is not what gates firmware assessment.","C. Azure Update Manager reports and installs operating system updates; drivers and firmware are not its job.","D. The Intune Suite add-on extends endpoint management features, not server vulnerability assessment."],"source":{"title":"Enable vulnerability scanning with Microsoft Defender Vulnerability Management","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/deploy-vulnerability-assessment-defender-vulnerability-management"}}},
{"n":207,"sec":"std","num":188,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"Your on-premises network contains an e-commerce web app that was developed in Angular and Node.js. The web app uses a MongoDB database You plan to migrate the web app to Azure. The solution architecture team proposes the following architecture as an Azure landing zone."},{"img":"img/p163_x2584.webp","w":1000,"h":163},{"p":"You need to provide recommendations to secure the connection between the web app and the database. The solution must follow the Zero Trust model."},{"p":"Solution: You recommend implementing Azure Application Gateway with Azure Web Application Firewall (WAF)."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","e":[{"p":"When using Azure-provided PaaS services (e.g., Azure Storage, Azure Cosmos DB, or Azure Web App, use the PrivateLink connectivity option to ensure all data exchanges are over the private IP space and the traffic never leaves the Microsoft network."}]},
{"n":208,"sec":"std","num":189,"c":"Design solutions that align with security best practices and priorities","q":"Does this meet the goal?","body":[{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled."},{"p":"You are evaluating the Azure Security Benchmark V3 report."},{"p":"In the Secure management ports controls, you discover that you have 0 out of a potential 8 points."},{"p":"You need to recommend configurations to increase the score of the Secure management ports controls."},{"p":"Solution: You recommend enabling just-in-time (JIT) VM access on all virtual machines."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"A","e":[{"p":"https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3-privileged-access#pa-2- avoid-standing-access-for-user-accounts-and-permissions"}]},

{"n":212,"sec":"std","num":193,"c":"Design security solutions for applications and data","q":"You are designing security for a runbook in an Azure Automation account. The runbook will copy data to Azure Data Lake Storage Gen2.","body":[{"p":"You are designing security for a runbook in an Azure Automation account. The runbook will copy data to Azure Data Lake Storage Gen2."},{"p":"You need to recommend a solution to secure the components of the copy process."},{"p":"What should you include in the recommendation for each component? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p167_x2652.webp","w":843,"h":373}],"boxes":[{"label":"Data security","value":"Access keys stored in Azure Key Vault"},{"label":"Network access control","value":"Azure Private Link with network service tags"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","ansimg":[{"img":"img/p168_x2665.webp","w":843,"h":373}],"e":[{"p":"Data Security = Access Keys stored in Azure Key Vault"},{"p":"Network access control = Azure Private Link with network service tags"},{"p":"https://docs.microsoft.com/en-us/azure/automation/automation-security-guidelines#data-security"}]},
{"n":213,"sec":"std","num":194,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"You have a Microsoft 365 subscription that contains 1,000 users and a group named Group1. All the users have Windows 11 devices. The users sign in to their devices by using their Microsoft Entra account. The users do NOT have administrative rights to their devices."},{"p":"The members of Group1 remotely assist the users by taking control of user sessions. The remote control sessions run in the security context of the users they are assisting."},{"p":"You need to recommend a solution that will enable the Group1 members to run apps that require administrative rights to the users ' devices. The solution must ensure that the apps are run in the context of each signed-in standard user."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Intune Endpoint Privilege Management","Windows Local Administrator Password Solution (Windows LAPS)","Cloud Infrastructure Entitlement Management","Privileged Identity Management (PIM) in Microsoft Entra ID"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Endpoint Privilege Management lets standard users run specific approved binaries elevated without ever joining the local Administrators group. The detail the question turns on is the elevation type: EPM normally elevates using an isolated virtual account, but its “Elevate as current user” type “runs the elevated process under the signed-in user's own account” — which is precisely the stated requirement that apps run in the context of each signed-in standard user.","whyWrong":["B. Windows LAPS manages the local administrator account’s password. Using it means signing in as that separate account, not running as the signed-in user.","C. Cloud Infrastructure Entitlement Management (Entra Permissions Management) governs cloud resource permissions across clouds, not Windows elevation.","D. PIM elevates Entra ID directory roles, not processes on a device."],"source":{"title":"Endpoint Privilege Management with Microsoft Intune","url":"https://learn.microsoft.com/en-us/intune/intune-service/protect/epm-overview"}}},
{"n":214,"sec":"std","num":195,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"Your company has the virtual machine infrastructure shown in the following table."},{"img":"img/p169_x2677.webp","w":857,"h":142},{"p":"The company plans to use Microsoft Azure Backup Server (MABS) to back up the virtual machines to Azure."},{"p":"You need to provide recommendations to increase the resiliency of the backup strategy to mitigate attacks such as ransomware."},{"p":"What should you include in the recommendation?"}],"o":["Use geo-redundant storage (GRS).","Use customer-managed keys (CMKs) for encryption.","Require PINs to disable backups.","Implement Azure Site Recovery replication."],"a":"C","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"For workloads protected by the MARS agent or Azure Backup Server, the security PIN is the authorization gate on critical operations — disabling backup, deleting backup data, changing a passphrase — so a compromised administrator on the server cannot quietly stop protection before encrypting the estate. That is what “increase the resiliency of the backup strategy” means here: keep the recovery points reachable.","whyWrong":["A. Geo-redundant storage protects against a regional outage, not against someone deleting the backups.","B. Customer-managed keys change key ownership; they neither prevent deletion nor preserve recovery points.","D. Site Recovery replicates workloads for disaster recovery. Replication faithfully copies encrypted data too, so it is not a ransomware control."],"source":{"title":"FAQ — Protect backups from ransomware with Azure Backup","url":"https://learn.microsoft.com/en-us/azure/backup/protect-backups-from-ransomware-faq"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against- ransomware#azure-backup"}]},

{"n":230,"sec":"std","num":211,"c":"Design security operations, identity, and compliance capabilities","q":"The solution must follow the principle of least privilege. Which role should you assign to the team leaders?","body":[{"p":"You have a Microsoft Entra tenant that uses Microsoft Entra ID Governance."},{"p":"For each department in your company, you create a dedicated catalog and access packages to manage access to applications and data resources."},{"p":"You need to ensure that team leaders in each department can perform the following actions:"},{"p":"• Add or remove access package assignments for the users in their department"},{"p":"• Prevent the access packages from appearing in each user ' s My Access portal."},{"p":"The solution must follow the principle of least privilege. Which role should you assign to the team leaders?"}],"o":["Identity Governance Administrator","Catalog Owner","Access Package Assignment Manager","Access Package Manager"],"a":"D","srcA":"C","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe second requirement is what decides this, and it is easy to read past. Keeping an access package out of My Access is the Hidden setting: set to Yes, the access package is not listed in the user's My Access portal. Microsoft's delegation table maps both requirements onto roles precisely. Directly assign and directly remove an identity are permitted to the Access package assignment manager, but Hide an access package is not; that row is granted only to the Identity Governance Administrator, the Catalog owner and the Access package manager. So the assignment manager satisfies the first bullet and fails the second. The least privileged role that satisfies both is Access package manager, which Microsoft describes as able to create new access packages from existing resources in the catalog, and edit and manage all existing access packages within the catalog.","whyWrong":["A. Identity Governance Administrator can do all of this, but tenant-wide across every catalog, which is more privilege than a department team leader needs.","B. Catalog owner also covers both actions, but adds the ability to add and remove resources and to delegate the catalog itself. Still more than required.","C. Access package assignment manager is the tempting least-privilege answer and covers the first bullet only. It cannot change the Hidden setting."],"source":{"title":"Delegation and roles in entitlement management","url":"https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-delegate"},"corrected":true,"originalAnswer":"C"}},

{"n":233,"sec":"std","num":214,"c":"Design security operations, identity, and compliance capabilities","q":"Which identity service should you include in the recommendation?","body":[{"p":"You have an on-premises network that has several legacy applications. The applications perform LDAP queries against an existing directory service. You are migrating the on-premises infrastructure to a cloud-only infrastructure."},{"p":"You need to recommend an identity solution for the infrastructure that supports the legacy applications. The solution must minimize the administrative effort to maintain the infrastructure."},{"p":"Which identity service should you include in the recommendation?"}],"o":["Azure Active Directory Domain Services (Azure AD DS)","Azure Active Directory (Azure AD) B2C","Azure Active Directory (Azure AD)","Active Directory Domain Services (AD DS)"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Legacy applications issuing LDAP queries need a directory that speaks LDAP. Microsoft Entra Domain Services (formerly Azure AD DS) provides managed domain services — domain join, Group Policy, LDAP, and Kerberos/NTLM — without you deploying or patching domain controllers, which is also what satisfies 'minimize the administrative effort'. Microsoft names this exact scenario: cloud-only organisations with third-party apps that still require LDAP.","whyWrong":["B. Azure AD B2C is a customer identity service for consumer sign-in.","C. Azure AD (Microsoft Entra ID) is not an LDAP directory — it speaks OIDC, OAuth and SAML.","D. Running AD DS yourself on Azure VMs works but means deploying, patching and monitoring domain controllers, which is the administrative effort the question tells you to minimise."],"source":{"title":"Overview of Microsoft Entra Domain Services","url":"https://learn.microsoft.com/en-us/entra/identity/domain-services/overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/active-directory-domain-services/overview"}]},
{"n":234,"sec":"std","num":215,"c":"Design security operations, identity, and compliance capabilities","q":"Which identity service should you include in the recommendation?","body":[{"p":"You have an on-premises network that has several legacy applications. The applications perform LDAP queries against an existing directory service."},{"p":"You are migrating the on-premises infrastructure to a cloud-only infrastructure."},{"p":"You need to recommend an identity solution for the infrastructure that supports the legacy applications. The solution must minimize the administrative effort to maintain the infrastructure."},{"p":"Which identity service should you include in the recommendation?"}],"o":["Active Directory Domain Services (AD DS)","Microsoft Entra ID","Microsoft Entra Domain Services","Microsoft Entra External ID"],"a":"C","srcA":"B","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThis is word-for-word the same scenario as Standalone 214, which the source keys to Azure AD DS — so the source contradicts itself, and the Microsoft Entra ID key here is the wrong half of that contradiction. Microsoft Entra ID does not answer LDAP; it is a modern-protocol identity provider. Microsoft Entra Domain Services is the managed domain that provides LDAP, Kerberos/NTLM, Group Policy and domain join for legacy applications that cannot be modernised.","whyWrong":["A. AD DS on your own servers would work but is the maximum administrative effort, which the question rules out.","B. Microsoft Entra ID speaks OIDC, OAuth and SAML. Legacy LDAP binds and reads are not supported against it.","D. Microsoft Entra External ID is for external and customer identities."],"source":{"title":"Overview of Microsoft Entra Domain Services","url":"https://learn.microsoft.com/en-us/entra/identity/domain-services/overview"},"corrected":true,"originalAnswer":"B"}},

{"n":236,"sec":"std","num":217,"c":"Design security operations, identity, and compliance capabilities","q":"The company signs a contract with the United States government. You need to review the current subscription for NIST 800-53 compliance. What should you do first?","body":[{"p":"Your company has an Azure subscription that has enhanced security enabled for Microsoft Defender for Cloud."},{"p":"The company signs a contract with the United States government. You need to review the current subscription for NIST 800-53 compliance. What should you do first?"}],"o":["From Defender for Cloud, review the Azure security baseline for audit report.","From Defender for Cloud, review the secure score recommendations.","From Azure Policy, assign a built-in initiative that has a scope of the subscription.","From Defender for Cloud, enable Defender for Cloud plans."],"a":"D","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged: the key is left as the source has it, but it looks wrong and the documentation does not settle the wording. This is the same NIST SP 800-53 scenario as Standalone 85 and 203, except the option 'add a regulatory compliance standard' is missing from the list. The stem already states the subscription has enhanced security enabled, which means the Defender plans in the keyed answer (D) are on — so it cannot be what you do first. Assigning the built-in initiative from Azure Policy (C) is the only remaining action that produces a NIST assessment, and regulatory standards are implemented as Azure Policy initiatives. Treat C as the more defensible answer and verify before relying on this item.","source":{"title":"Assign regulatory compliance standards in Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages#what- regulatory-comp liance-standards-are-available-in-defender-for-cloud"}]},

{"n":242,"sec":"std","num":223,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"Your company has a Microsoft 365 E5 subscription."},{"p":"The company wants to identify and classify data in Microsoft Teams, SharePoint Online, and Exchange Online."},{"p":"You need to recommend a solution to identify documents that contain sensitive information."},{"p":"What should you include in the recommendation?"}],"o":["data classification content explorer","data loss prevention (DLP)","eDiscovery","Information Governance"],"a":"A","srcA":"B","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe requirement is to identify documents that contain sensitive information, and content explorer is the tool that answers it. Microsoft describes it as showing a current snapshot of the items that have a sensitivity label, a retention label, or are classified as a sensitive information type in your organization, and you can drill into Exchange, SharePoint, OneDrive and Teams locations, which is the exact scope in the stem. DLP is a preventive control: it acts when someone tries to share or move content that matches a sensitive information type. It protects, it does not inventory. Read the verb in these questions. Identify or discover points at content explorer and the data classification pages; prevent, block or restrict points at DLP.","whyWrong":["B. DLP enforces policy on sensitive content in motion. It is the answer when the requirement is to stop something, as in Standalone 224.","C. eDiscovery searches and preserves content for a legal matter or investigation. It is case-driven, not a standing inventory of sensitive data.","D. Information governance (now data lifecycle management) is about retention and disposal, not classification discovery."],"source":{"title":"Get started with content explorer","url":"https://learn.microsoft.com/en-us/purview/data-classification-content-explorer"},"corrected":true,"originalAnswer":"B"}},
{"n":243,"sec":"std","num":224,"c":"Design security operations, identity, and compliance capabilities","q":"To which location should you apply the DLP policy?","body":[{"p":"You have a Microsoft 365 tenant that uses Microsoft SharePoint Online and Microsoft Purview. Microsoft Purview has a sensitivity label named Label1 that is applied to the files stored on SharePoint Online sites."},{"p":"You need to recommend a Microsoft Purview Data Loss Prevention (DLP) policy that meets the following requirements:"},{"p":"• Prevents users from uploading the files to third-party external websites"},{"p":"• Allows users to upload the files to Microsoft OneDrive for Business"},{"p":"To which location should you apply the DLP policy?"}],"o":["Devices","OneDrive accounts","SharePoint sites","Microsoft Defender for Cloud Apps"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The action to be blocked, uploading a file to a website, happens in a browser on the device, so the policy has to reach the device. That is the Devices location, which is endpoint DLP. Its Upload to a restricted cloud service domain or access from an unallowed browser activity works from a list of service domains: allow the Microsoft OneDrive domains and block the rest, and you get exactly the pair of requirements in the stem. Applying the policy to the SharePoint location would govern the file while it sits in SharePoint, which is not where the leak happens.","whyWrong":["B. The OneDrive accounts location governs content in OneDrive itself; it does not control uploads to third-party sites.","C. The SharePoint sites location governs sharing from SharePoint. Once the file is on the endpoint, that policy no longer applies.","D. Defender for Cloud Apps can block uploads to unsanctioned cloud apps through a session policy, but the question asks which DLP location to use, and browser upload control is the Devices location."],"source":{"title":"Learn about Endpoint data loss prevention","url":"https://learn.microsoft.com/en-us/purview/endpoint-dlp-learn-about"}}},

{"n":250,"sec":"std","num":231,"c":"Design security solutions for infrastructure","q":"Your company has offices in New York City and London. The London office contains an on-premises app named Appl.","body":[{"p":"Your company has offices in New York City and London. The London office contains an on-premises app named Appl."},{"p":"You have a Microsoft Entra tenant named contoso.com that is hosted in North America."},{"p":"You plan to manage access to App1 for the users in the London office by using Microsoft Entra Private Access. You will deploy Private Access by performing the following actions in the London office:"},{"p":"• Deploy Microsoft Entra Private Network connectors."},{"p":"• Provision an ExpressRoute circuit to the closest peering location."},{"p":"You need to optimize the network for the planned deployment. The solution must meet the following requirements:"},{"p":"• Maximize redundancy for connectivity to Appl."},{"p":"• Minimize network latency when accessing Appl."},{"p":"• Maximize security."},{"p":"• Minimize costs."},{"p":"What should you include in the solution? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p198_x3156.webp","w":1000,"h":279}],"ansimg":[{"img":"img/p198_x3158.webp","w":1000,"h":279}],"e":[{"img":"img/p198_x3150.webp","w":1000,"h":142}]},

{"n":252,"sec":"std","num":233,"c":"Design security solutions for applications and data","q":"You have an Azure subscription that contains virtual machines, storage accounts, and Azure SQL databases. All resources are backed up multiple times a day by using Azure Backup. You are developing a strategy to protect against ransomware attacks.","body":[{"p":"You have an Azure subscription that contains virtual machines, storage accounts, and Azure SQL databases. All resources are backed up multiple times a day by using Azure Backup. You are developing a strategy to protect against ransomware attacks."},{"p":"You need to recommend which controls must be enabled to ensure that Azure Backup can be used to restore the resources in the event of a successful ransomware attack."},{"p":"Which two controls should you include in the recommendation? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point."}],"o":["Use Azure Monitor notifications when backup configurations change.","Require PINs for critical operations.","Perform offline backups to Azure Data Box.","Encrypt backups by using customer-managed keys (CMKs).","Enable soft delete for backups."],"a":"B E","srcA":"A B","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe question asks which controls ensure you can still restore after an attack, and Microsoft answers it directly under “How to block intentional or unintentional deletion of backup data?” — enable soft delete, and require authorization for critical operations. Soft delete is the one that guarantees restorability: it retains deleted backup data for 14 days, and Microsoft warns that “if backups are deleted and soft delete isn't enabled, you or Microsoft can't recover the deleted backup data.” Requiring a PIN for critical operations is the authorization gate offered here. Azure Monitor notifications are a genuine best practice, but they are detective — being told that backups were disabled does not let you restore from them.","whyWrong":["A. Alerting on configuration change tells you an attack happened. It does not preserve a recovery point.","C. Offline copies to Data Box is not an Azure Backup control and is not part of Microsoft’s guidance here.","D. Customer-managed keys change who controls the encryption key. They do nothing to stop a backup being deleted."],"source":{"title":"FAQ — Protect backups from ransomware with Azure Backup","url":"https://learn.microsoft.com/en-us/azure/backup/protect-backups-from-ransomware-faq"},"corrected":true,"originalAnswer":"A B"},"e":[{"p":"https://docs.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against-ransomware"},{"p":"' You need to recommend which CONTROLS must be enabled to ENSURE that Azure Backup can be used to RESTORE the resources in the event of a successful ransomware attack. ' Whilst helpful for auditing purposes and detection of a malicious attack, monitoring configuration changes and alerting after a change is made does not represent a CONTROL which ENSURES Azure Backup can be used to RESTORE the resources."}]},
{"n":253,"sec":"std","num":234,"c":"Design solutions that align with security best practices and priorities","q":"What should you include in the recommendation?","body":[{"p":"You have a Microsoft 365 E5 subscription and an Azure subscription."},{"p":"You need to recommend a solution to enforce the Zero Trust principle of explicit verification for the subscriptions. The solution must be based on Zero Trust guidance in the Microsoft Cybersecurity Reference Architectures (MCRA)."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Defender for Cloud","Conditional Access","Microsoft Entra ID Identity Governance","Microsoft Defender for Identity"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Zero Trust has three principles, and each maps onto a control: verify explicitly, use least privilege access, assume breach. Conditional Access is the enforcement point for verify explicitly. It is the policy engine that takes the signals gathered at sign-in, user, device, location, application, risk, and decides whether to grant access, block it, or require another factor. In the MCRA, Conditional Access sits in front of resources as exactly that gate.","whyWrong":["A. Defender for Cloud gives you posture and workload protection. It is an assume-breach control rather than the verification gate.","C. Identity Governance handles entitlements and reviews, which serves least privilege, not explicit verification at access time.","D. Defender for Identity detects attacks against identity infrastructure. Detection, not verification."],"source":{"title":"What is Conditional Access in Microsoft Entra ID?","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview"}}},
{"n":254,"sec":"std","num":235,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 E5 subscription.","body":[{"p":"You have a Microsoft 365 E5 subscription."},{"p":"You are designing a solution to protect confidential data in Microsoft SharePoint Online sites that contain more than one million documents."},{"p":"You need to recommend a solution to prevent Personally Identifiable Information (Pll) from being shared."},{"p":"Which two components should you include in the recommendation? Each correct answer presents part of the solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["data loss prevention (DLP) policies","sensitivity label policies","retention label policies","eDiscovery cases"],"a":"A B","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"These two work as a pair, which is why the question asks for two components. Sensitivity labels classify the PII and carry the protection with the file; DLP policies act on that classification to stop it leaving — blocking the share, the upload, or the send. Labels decide what something is; DLP decides what may happen to it.","whyWrong":["C. Retention labels govern how long content is kept and what happens at the end of its life, not whether it can be shared.","D. eDiscovery cases search and preserve content for investigations and legal hold. They prevent nothing."],"source":{"title":"Learn about sensitivity labels","url":"https://learn.microsoft.com/en-us/purview/sensitivity-labels"}},"e":[{"p":"Data loss prevention in Office 365. Data loss prevention (DLP) helps you protect sensitive information and prevent its inadvertent disclosure. Examples of sensitive information that you might want to prevent from leaking outside your organization include financial data or personally identifiable information (PII) such as credit card numbers, social security numbers, or health records. With a data loss prevention (DLP) policy, you can identify, monitor, and automatically protect sensitive information across Office 365."},{"p":"Sensitivity labels from Microsoft Purview Information Protection let you classify and protect your organization ' s data without hindering the productivity of users and their ability to collaborate."},{"p":"Plan for integration into a broader information protection scheme. On top of coexistence with OME, sensitivity labels can be used along-side capabilities like"},{"p":"Microsoft Purview Data Loss Prevention (DLP) and Microsoft Defender for Cloud Apps."},{"p":"https://motionwave.com.au/keeping-your-confidential-data-secure-with-microsoft-office-365/https://docs. microsoft.com/en-us/microsoft- 365/solutions/information-protection-deploy-protect-information?view=o365- worldwide#sensitivity -labels"}]},
{"n":255,"sec":"std","num":236,"c":"Design security solutions for infrastructure","q":"You have a Microsoft 365 ES subscription. The subscription contains 500 devices that run Windows 11 Pro and are enrolled in Microsoft Intune You need to evaluate the use of Microsoft Defender Vulnerability Management to provide recommended configuration changes for the devices. Which Endpoint security settings should you use to review the recommended changes?","body":[{"p":"You have a Microsoft 365 ES subscription. The subscription contains 500 devices that run Windows 11 Pro and are enrolled in Microsoft Intune You need to evaluate the use of Microsoft Defender Vulnerability Management to provide recommended configuration changes for the devices. Which Endpoint security settings should you use to review the recommended changes?"}],"o":["Device compliance","Endpoint detection and response","Attack surface reduction","Security tasks"],"a":"D","srcA":"C","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nSecurity tasks is the node that carries Defender Vulnerability Management findings into Intune. Microsoft's instruction is literally the question: Sign in to the Microsoft Intune admin center, select Endpoint security > Security tasks, choose a security task to view its details. A security task states the type of vulnerability, priority, status and steps for remediation, and one of the two remediation types is Configuration, for example configuring a setting in the Microsoft Defender Antivirus profile. That is the recommended configuration change the stem asks about, and the Intune admin accepts or rejects it there.","whyWrong":["A. Device compliance evaluates devices against your own compliance policy and drives Conditional Access. It does not surface vulnerability findings.","B. Endpoint detection and response policy onboards devices to Defender for Endpoint and tunes EDR. It is a configuration you author, not a list of recommendations you review.","C. Attack surface reduction is the node where you author ASR, controlled folder access and exploit protection policies. Hardening settings you deploy, not recommendations coming back from Defender Vulnerability Management."],"source":{"title":"Use Intune to remediate vulnerabilities found by Microsoft Defender for Endpoint","url":"https://learn.microsoft.com/en-us/intune/device-security/microsoft-defender/remediate-vulnerabilities"},"corrected":true,"originalAnswer":"C"}},

{"n":261,"sec":"std","num":242,"c":"Design security solutions for infrastructure","q":"You need to recommend a service to mitigate identified risks that relate to the recommendations. What should you recommend?","body":[{"p":"Your company finalizes the adoption of Azure and is implementing Microsoft Defender for Cloud."},{"p":"You receive the following recommendations in Defender for Cloud"},{"p":"• Access to storage accounts with firewall and virtual network configurations should be restricted,"},{"p":"• Storage accounts should restrict network access using virtual network rules."},{"p":"• Storage account should use a private link connection."},{"p":"• Storage account public access should be disallowed."},{"p":"You need to recommend a service to mitigate identified risks that relate to the recommendations. What should you recommend?"}],"o":["Azure Storage Analytics","Azure Network Watcher","Microsoft Sentinel","Azure Policy"],"a":"D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Every recommendation in the list — restrict network access, use virtual network rules, require a private link, disallow public access — is a resource configuration, and Azure Policy is the service that evaluates and enforces resource configuration at scale. Each of these has a built-in definition, and assigning them stops the drift returning rather than just reporting it again next week.","whyWrong":["A. Storage Analytics is metrics and logging for a storage account.","B. Network Watcher diagnoses network connectivity and traffic.","C. Sentinel is a SIEM: it would alert on the misconfiguration, not prevent it."],"source":{"title":"Overview of Azure Policy","url":"https://learn.microsoft.com/en-us/azure/governance/policy/overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/security-policy-concepthttps://docs.microsoft. com/en-us/security/benchmark/azure/baselines/storage-security-basel ine"}]},

{"n":268,"sec":"std","num":249,"c":"Design security solutions for applications and data","q":"What should you use?","body":[{"p":"You have an Azure subscription. The subscription contains multiple Azure App Service web apps that are distributed across multiple Azure regions and are accessed via the internet"},{"p":"You need to ensure that all incoming requests to the apps are inspected for threats based on the Core Rule Set (CRS) from the Open Web Application Security Project (OWASP). The solution must meet the following requirements:"},{"p":"• Support the use of Microsoft-managed X.509 certificates."},{"p":"• Route users to the geographically closest app."},{"p":"• Minimize administrative effort."},{"p":"What should you use?"}],"o":["Azure Firewall Premium","Azure Front Door with a web application firewall (WAF)","Azure Firewall Standard","Azure Application Gateway with a web application firewall (WAF)"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Three requirements, and only one service satisfies all three. Front Door is a global service that routes each user to the nearest healthy backend, which Application Gateway, being regional, cannot do for apps spread across regions. The WAF policy attached to Front Door uses the Default Rule Set, which is based on the OWASP Core Rule Set. And Front Door issues and renews Microsoft-managed TLS certificates for custom domains, which is where minimise administrative effort is decided.","whyWrong":["A and C. Azure Firewall, in either tier, is a network firewall. Even Premium with IDPS is not an OWASP CRS web application firewall.","D. Application Gateway with WAF does the OWASP inspection well, but it is regional, so meeting the routing requirement would mean one per region plus something in front of them. That is more administrative effort, not less."],"source":{"title":"Web Application Firewall DRS rule groups and rules (Azure Front Door)","url":"https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-drs"}}},
{"n":269,"sec":"std","num":250,"c":"Design security solutions for infrastructure","q":"What should you use?","body":[{"p":"You have an Azure subscription. The subscription contains 50 virtual machines that run Windows Server and 50 virtual machines that run Linux. You need to perform vulnerability assessments on the virtual machines. The solution must meet the following requirements:"},{"p":"• Identify missing updates and insecure configurations."},{"p":"• Use the Qualys engine."},{"p":"What should you use?"}],"o":["Microsoft Defender for Servers","Microsoft Defender Threat Intelligence (Defender Tl)","Microsoft Defender for Endpoint","Microsoft Defender External Attack Surface Management (Defender EASM)"],"a":"A","review":{"status":"OUTDATED","confidence":"HIGH","explanation":"The product in the key is still right; the requirement in the stem is not. Defender for Servers does provide vulnerability assessment, but it no longer uses the Qualys engine — “Defender for Cloud uses Microsoft Defender Vulnerability Management to scan your machines”, in agentless and agent-based modes, and the Qualys-based solution has been retired. A question that asks you to pick a product *because it uses Qualys* can no longer be answered as written. Remember the current pairing: Defender for Servers is the plan, Defender Vulnerability Management is the scanner inside it.","source":{"title":"Enable vulnerability scanning with Microsoft Defender Vulnerability Management","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/deploy-vulnerability-assessment-defender-vulnerability-management"}}},

{"n":273,"sec":"std","num":254,"c":"Design security solutions for applications and data","q":"The company plans to share specific blobs with vendors. You need to recommend a solution to provide the vendors with secure access to specific blobs without exposing the blobs publicly. The access must be t\\me- Vim\\ted. What should you include in the recommendation?","body":[{"p":"Azure subscription that uses Azure Storage."},{"p":"The company plans to share specific blobs with vendors. You need to recommend a solution to provide the vendors with secure access to specific blobs without exposing the blobs publicly. The access must be t\\me- Vim\\ted. What should you include in the recommendation?"}],"o":["Create shared access signatures (SAS).","Share the connection string of the access key.","Configure private link connections.","Configure encryption by using customer-managed keys (CMKs)"],"a":"A","srcA":"D","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe keyed answer confuses encryption with access control. Customer-managed keys change which key encrypts data at rest; they grant nobody access and expire for no one. A shared access signature is the delegated-access mechanism, and Microsoft describes it as giving “granular control over how a client can access your data — what resources the client may access, what permissions they have to those resources, how long the SAS is valid”. Scoped to specific blobs, with an expiry, and without making the container public: that is the question restated.","whyWrong":["B. Sharing the connection string hands over the account key, granting full access to everything with no expiry.","C. Private Link makes the account reachable privately from a virtual network. External vendors on the internet cannot use it, and it grants no data permissions.","D. Customer-managed keys control encryption at rest. They neither grant nor time-limit access."],"source":{"title":"Grant limited access to data with shared access signatures (SAS)","url":"https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview"},"corrected":true,"originalAnswer":"D"}},

{"n":277,"sec":"std","num":258,"c":"Design solutions that align with security best practices and priorities","q":"What should you use?","body":[{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled. You need to enforce ISO 2700V2013 standards for the subscription. The solution must ensure that noncompliant resources are remediated automatically"},{"p":"What should you use?"}],"o":["the regulatory compliance dashboard in Defender for Cloud","Azure Policy","Azure Blueprints","Azure role-based access control (Azure RBAC)"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The word that decides this is “remediated”. Azure Policy “helps to bring your resources to compliance through bulk remediation for existing resources and automatic remediation for new resources”, using the deployIfNotExists and modify effects with a remediation task. No other option here changes a resource at all.","whyWrong":["A. The regulatory compliance dashboard reports compliance; it remediates nothing on its own.","C. Azure Blueprints is deprecated and deploys artefacts rather than remediating drift.","D. Azure RBAC controls permissions, not resource configuration."],"source":{"title":"Overview of Azure Policy","url":"https://learn.microsoft.com/en-us/azure/governance/policy/overview"}},"e":[{"p":"https://azure.microsoft.com/en-us/blog/simplifying-your-environment-setup-while-meeting-compliance-needs -with-built-in-azure-blueprints/"}]},

{"n":281,"sec":"std","num":262,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"You have to Azure subscriptions that contain 100 role-based access control (RBAC) role assignments."},{"p":"You plan to consolidate the role assignments."},{"p":"You need to recommend a solution to identify which role assignments were NOT used during the last 90 days. The solution must minimize administrative effort."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Defender for Cloud","Microsoft Entra access reviews","Microsoft Entra Privileged Identity Management (PIM)","Microsoft Entra Permissions Management"],"a":"D","review":{"status":"OUTDATED","confidence":"HIGH","explanation":"Same retired product as Standalone 96. Permissions Management was the tool that measured the gap between permissions granted and permissions used, and could automatically delete permissions unused for the past 90 days — which is why the key matched the stem so exactly. It was retired on 1 November 2025 and its documentation is archived, so treat the underlying idea (find unused entitlements, right-size them) as the examinable point rather than the product name.","source":{"title":"What's Microsoft Entra Permissions Management? (archived — retired 1 November 2025)","url":"https://learn.microsoft.com/en-us/previous-versions/entra/permissions-management/overview"}}},

{"n":284,"sec":"std","num":265,"c":"Design solutions that align with security best practices and priorities","q":"You have an on-premises network and a Microsoft 365 subscription.","body":[{"p":"You have an on-premises network and a Microsoft 365 subscription."},{"p":"You are designing a Zero Trust security strategy."},{"p":"Which two security controls should you include as part of the Zero Trust solution? Each correct answer part of the solution."},{"p":"NOTE: Each correct answer is worth one point."}],"o":["Block sign-attempts from unknown location.","Always allow connections from the on-premises network.","Disable passwordless sign-in for sensitive account.","Block sign-in attempts from noncompliant devices."],"a":"A D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Both keyed controls are the Zero Trust principles applied directly. Blocking sign-ins from unknown locations is verify explicitly, using location as a signal in the access decision. Blocking sign-ins from non-compliant devices is device health as a condition of access, which is the same principle plus assume breach. The two distractors are useful precisely because they are the pre-Zero-Trust habits the model rejects.","whyWrong":["B. Always allowing connections from the on-premises network is the network perimeter assumption that Zero Trust exists to replace. Location does not confer trust.","C. Disabling passwordless sign-in for sensitive accounts moves in the wrong direction. Zero Trust calls for stronger, phishing-resistant authentication on privileged accounts, not weaker."],"source":{"title":"What is Zero Trust?","url":"https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview"}}},
