ate the generation of pull requests that remediate identified vulnerabilities.\"","whyWrong":["GitHub Enterprise Server would require Fabrikam to host and maintain the GitHub instance itself, which fails minimize administrative effort. GitHub Team lacks GitHub Advanced Security code scanning entirely.","Codespaces provisions cloud development environments; it does not open remediation pull requests. Dependency Tracker is not a GitHub product name."],"source":{"title":"Adopt updates for open-source software (OSS) components (Dependabot on GitHub Enterprise Cloud)","url":"https://learn.microsoft.com/en-us/security/zero-trust/prioritizing-defense/adopt-open-source-updates"}},"ansimg":[{"img":"img/p025_x574.webp","w":1000,"h":225}],"e":[{"img":"img/p026_x586.webp","w":1000,"h":128}]},
{"n":22,"sec":"std","num":3,"c":"Design security operations, identity, and compliance capabilities","q":"You have an Azure subscription.","body":[{"p":"You have an Azure subscription."},{"p":"You have a Microsoft 365 subscription."},{"p":"You need to assess regulatory compliance of the subscriptions. The solution must meet the following requirements:"},{"p":"• Identify whether data stored in Azure and Microsoft 365 complies with General Data Protection Regulation"},{"p":"(GDPR) regulations."},{"p":"• Identify whether Azure resources comply with National Institute of Standards and Technology (NIST)"},{"p":"standards."},{"p":"• Provide recommendations on controls to improve compliance."},{"p":"What should you use? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p026_x592.webp","w":828,"h":278}],"boxes":[{"label":"For NIST","value":"Microsoft Defender for Cloud","options":["Microsoft Defender for Cloud","Microsoft Defender Vulnerability Management","Microsoft Sentinel"]},{"label":"For GDPR","value":"Microsoft Purview Compliance Manager","options":["Microsoft Priva","Microsoft Purview Communication Compliance","Microsoft Purview Compliance Manager"]}],"keynote":"The choices for this item were supplied from outside the dump; the dump itself records the answer only as the picture shown above. Grading uses those choices.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Defender for Cloud's regulatory compliance dashboard assesses Azure resource configuration against standards you assign, including NIST CSF, which is exactly the \"identify whether Azure resources comply with NIST\" requirement, and its recommendations page is where the improvement guidance for those Azure resources lives. GDPR spans both Azure and Microsoft 365 data, which is outside Defender for Cloud's Azure-resource-only scope; Compliance Manager is Microsoft's cross-service compliance assessment tool, tracking an improvement action score with specific implementation guidance across both Microsoft 365 and Azure, matching \"identify whether data in Azure and Microsoft 365 complies with GDPR\" and \"provide recommendations on controls to improve compliance.\"","whyWrong":["Microsoft Defender Vulnerability Management finds and scores device vulnerabilities; it has no regulatory compliance assessment capability.","Microsoft Sentinel is a SIEM, not a compliance assessment tool.","Microsoft Priva assesses privacy risk (data minimization, oversharing), a related but distinct discipline from GDPR regulatory compliance scoring. Purview Communication Compliance monitors for inappropriate messages, unrelated to GDPR assessment."],"source":{"title":"The Microsoft cloud security benchmark in Microsoft Defender for Cloud (regulatory compliance)","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-regulatory-compliance"}},"ansimg":[{"img":"img/p027_x601.webp","w":828,"h":278}],"e":[{"img":"img/p027_x606.webp","w":874,"h":145}]},
{"n":23,"sec":"std","num":4,"c":"Design solutions that align with security best practices and priorities","q":"Does this meet the goal?","body":[{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled. You are evaluating the Azure Security Benchmark V3 report."},{"p":"In the Secure management ports controls, you discover that you have 0 out of a potential 8 points. You need to recommend configurations to increase the score of the Secure management ports controls. Solution: You recommend enabling adaptive network hardening."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"No, and the reason is worth learning because it settles all three questions in this family. Secure score is organised into controls, and a recommendation only moves the control it belongs to. Microsoft describes Secure management ports, worth 8 points, as recommendations that \"reduce your exposure with tools like just-in-time VM access and network security groups\". Adaptive network hardening belongs to a different control: Restrict unauthorized network access, worth 4 points, which Microsoft describes as where you \"manage adaptive network hardening in Defender for Cloud\". Enabling it improves that control, not this one. To move Secure management ports, close the management ports, put the VMs behind NSGs, and turn on just-in-time VM access.","source":{"title":"Secure score in Microsoft Defender for Cloud (security controls table)","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls"}},"e":[{"p":"JIT: https://d ocs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3-privileged- access#pa-2- avoid-standing-access-for-user-accounts-and-permissions"},{"p":"Adaptive Network Hardening: ht tps://docs.microsoft.com/en-us/security/benchmark/azure/security-controls- v3-network-security#ns-7-simplify-network-security-configurati on"}]},
{"n":24,"sec":"std","num":5,"c":"Design solutions that align with security best practices and priorities","q":"A customer follows the Zero Trust model and explicitly verifies each attempt to access its corporate applications.","body":[{"p":"A customer follows the Zero Trust model and explicitly verifies each attempt to access its corporate applications."},{"p":"The customer discovers that several endpoints are infected with malware."},{"p":"The customer suspends access attempts from the infected endpoints."},{"p":"The malware is removed from the end point."},{"p":"Which two conditions must be met before endpoint users can access the corporate applications again? Each correct answer presents part of the solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["Microsoft Defender for Endpoint reports the endpoints as compliant.","Microsoft Intune reports the endpoints as compliant.","A new Azure Active Directory (Azure AD) Conditional Access policy is enforced.","The client access tokens are refreshed."],"a":"B D","srcA":"C D","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe documented flow makes clear which product actually issues the compliance verdict: \"Microsoft Defender for Endpoint detects threat activity on a device and classifies it as high-risk. Intune receives the risk signal and automatically marks the device as noncompliant… when the risk is removed… the device returns to a compliant state and access to applications is granted.\" Defender for Endpoint supplies the risk signal; Intune is the one that reports compliant or noncompliant, which Conditional Access then reads. Getting back in also needs a fresh evaluation of that signal rather than reuse of a session issued while the device was still blocked, which is what refreshing the client's access tokens forces: a new token request re-evaluates Conditional Access against the device's current, now-compliant state. No new or different Conditional Access policy is required anywhere in this flow; the existing policy simply re-evaluates once it sees updated inputs.","whyWrong":["A. Defender for Endpoint reports a device risk level, not a compliance verdict. Compliant/noncompliant is Intune's determination, built from that risk signal together with the rest of the compliance policy.","C. Restoring access does not require enforcing a new Conditional Access policy. The policy that suspended access is still in force and simply needs to see the device's updated compliance state."],"source":{"title":"Enable Conditional Access to better protect users, devices, and data (Defender for Endpoint)","url":"https://learn.microsoft.com/en-us/defender-endpoint/conditional-access"},"corrected":true,"originalAnswer":"C D"},"e":[{"p":"https://www.microsoft.com/security/blog/2022/02/17/4-best-practices-to-implement-a-comprehensive-zero- trust-security-approach/"},{"p":"https://docs.microsoft.com/en-us/azure/active-directory/develop/refresh-tokens"}]},
{"n":25,"sec":"std","num":6,"c":"Design security solutions for infrastructure","q":"You need to recommend an Azure Bastion deployment to provide secure remote access to all the virtual machines. Based on the virtual network design, how many Azure Bastion subnets are required?","body":[{"p":"Your company plans to move all on-premises virtual machines to Azure. A network engineer proposes the Azure virtual network design shown in the following table."},{"img":"img/p028_x619.webp","w":533,"h":146},{"p":"You need to recommend an Azure Bastion deployment to provide secure remote access to all the virtual machines. Based on the virtual network design, how many Azure Bastion subnets are required?"}],"o":["1","2","3","4","5"],"a":"B","srcA":"C","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe five virtual networks form two separate, unconnected peering groups: Hub VNet peers with VNet1 and VNet2, and VNet3 peers only with VNet4, with no link at all between the two groups (peering is not transitive, so there is no path from the Hub group into the VNet3/VNet4 group). Microsoft states plainly that a single Bastion deployment covers this: \"when Virtual Network peering is configured, you don't have to deploy Azure Bastion in each peered VNet. If you have an Azure Bastion host configured in one virtual network, it can be used to connect to virtual machines deployed in a peered virtual network without deploying an additional bastion host.\" One Bastion host in the Hub VNet therefore reaches every VM in the Hub, VNet1 and VNet2 by peering, and a second Bastion host placed in either VNet3 or VNet4 reaches both of them the same way. Two peering groups need two Bastion subnets, not three.","whyWrong":["3, 4, 5. Each additional Bastion beyond the two peering groups is unnecessary: a peered VNet is already reachable from the Bastion host in its own group without deploying a second host into it.","1. A single Bastion cannot bridge the two groups, since VNet3/VNet4 have no peering relationship, direct or transitive, to the Hub, VNet1 or VNet2."],"source":{"title":"VNet peering and Azure Bastion architecture","url":"https://learn.microsoft.com/en-us/azure/bastion/vnet-peering"},"corrected":true,"originalAnswer":"C"},"e":[{"p":"https://docs.microsoft.com/en-us/azure/bastion/vnet-peering"},{"p":"https://docs.microsoft.com/en-us/learn/modules/connect-vm-with-azure-bastion/2-what-is-azure-bastion"}]},
{"n":26,"sec":"std","num":7,"c":"Design security solutions for applications and data","q":"Your company develops several applications that are accessed as custom enterprise applications in Azure Active Directory (Azure AD). You need to recommend a solution to prevent users on a specific list of countries from connecting to the applications. What should you include in the recommendation?","body":[{"p":"Your company develops several applications that are accessed as custom enterprise applications in Azure Active Directory (Azure AD). You need to recommend a solution to prevent users on a specific list of countries from connecting to the applications. What should you include in the recommendation?"}],"o":["activity policies in Microsoft Defender for Cloud Apps","sign-in risk policies in Azure AD Identity Protection","device compliance policies in Microsoft Endpoint Manager","Azure AD Conditional Access policies","user risk policies in Azure AD Identity Protection"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Blocking by country is a Conditional Access named location. You define a countries-and-regions named location, then write a policy that targets the enterprise applications and blocks access when the sign-in comes from that location. Standalone 12 is the identical question with the options reordered, so recognise the pattern rather than the letter.","whyWrong":["A. Activity policies in Defender for Cloud Apps act on activity in a session after access is granted, and only for connected apps.","B and E. Risk policies in ID Protection respond to a calculated risk level, not to a list of countries you choose.","C. Device compliance policies decide whether a device meets your standard; they say nothing about where the user is."],"source":{"title":"Network conditions in Conditional Access policy (named locations, countries)","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/location-condition"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/active-directory/conditional-access/howto-conditional-access-policy- locatio n"},{"p":"https://docs.microsoft.com/en-us/power-platform/admin/restrict-access-online-trusted-ip-rules"}]},
{"n":27,"sec":"std","num":8,"c":"Design security operations, identity, and compliance capabilities","q":"What is the minimum number of Resource Guard resources required?","body":[{"p":"You have two Azure subscriptions named Sub1 and Sub2 that contain the vaults shown in the following table."},{"img":"img/p030_x645.webp","w":687,"h":140},{"p":"You need to design a multi-user authorization (MUA) solution for security operations on the vaults. The solution must meet the following requirements:"},{"p":"• RSVault1 and RSVault2 must require MUA for disabling soft delete, removing MUA protection, and"},{"p":"disabling immutability."},{"p":"• BackupVault1 and BackupVault2 must require MUA for disabling soft delete and removing MUA"},{"p":"protection."},{"p":"What is the minimum number of Resource Guard resources required?"}],"o":["1","2","3","4"],"a":"B","srcA":"C","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe one hard constraint Microsoft states for Resource Guard placement is region, not subscription: \"the Resource Guard and the Recovery Services vault must be in the same Azure region\" (and the same for a Backup vault). Keeping the Resource Guard in a different subscription from the vault is explicitly a recommendation, not a requirement, and Microsoft's own usage-scenario table lists same-subscription placement as a valid, if less isolated, configuration. A single Resource Guard resource can also protect more than one vault, and can mix vault types, since \"the excluded critical operations would apply to all vaults associated with Resource Guard\" describes one Resource Guard governing several vaults at once. With only two regions in play, one Resource Guard located in East US can protect both RSVault1 and BackupVault1 there (guarding the three RS-vault operations for one and the two Backup-vault operations for the other), and a second Resource Guard in West US can likewise cover RSVault2 and BackupVault2. That is two Resource Guards, the minimum the region constraint allows, not three.","whyWrong":["3, 4. Extra Resource Guards beyond one per region add no coverage the two regional Resource Guards don't already provide, since region is the only placement constraint the vaults actually share.","1. A single Resource Guard cannot serve both regions: it is a resource with one region of its own, and it must match the region of every vault it protects, so an East US vault and a West US vault can never share the same Resource Guard."],"source":{"title":"Configure multi-user authorization using Resource Guard (region prerequisite)","url":"https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization"},"corrected":true,"originalAnswer":"C"}},
{"n":28,"sec":"std","num":9,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"You are designing the encryption standards for data at rest for an Azure resource"},{"p":"You need to provide recommendations to ensure that the data at rest is encrypted by using AES-256 keys. The solution must support rotating the encryption keys monthly."},{"p":"Solution: For blob containers in Azure Storage, you recommend encryption that uses customer-managed keys (CMKs)."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Yes, and it is the rotation requirement that makes customer-managed keys necessary rather than merely acceptable. All Azure Storage data is encrypted with 256-bit AES whichever key type you choose, so the AES-256 requirement is satisfied either way. What Microsoft-managed keys will not give you is control of the schedule: with a customer-managed key in Key Vault you own the key lifecycle and can rotate it monthly, manually or on an automated rotation policy, and Azure Storage can be set to pick up the new version automatically.","source":{"title":"Customer-managed keys for Azure Storage encryption","url":"https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview"}}},
{"n":29,"sec":"std","num":10,"c":"Design security operations, identity, and compliance capabilities","q":"What should you do?","body":[{"p":"You are designing a security operations strategy based on the Zero Trust framework."},{"p":"You need to minimize the operational load on Tier 1 Microsoft Security Operations Center (SOC) analysts."},{"p":"What should you do?"}],"o":["Enable built-in compliance policies in Azure Policy.","Enable self-healing in Microsoft 365 Defender.","Automate data classification.","Create hunting queries in Microsoft 365 Defender."],"a":"B","srcA":"A","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nRead the requirement literally: minimise the operational load on Tier 1 analysts. Microsoft's page on automated investigation and response answers it by name. \"Imagine having a virtual analyst in your Tier 1 or Tier 2 security operations team. The virtual analyst mimics the ideal steps that security operations would take to investigate and remediate threats\", working continuously and taking on \"a significant load of investigations and threat remediation\", which frees the team for other work. AIR, marketed as self-healing, triages the alert, reaches a verdict on each piece of evidence and applies remediation such as quarantining a file or isolating a device. Triage of routine alerts is precisely what Tier 1 does, which is why this and not a governance control is the answer.","whyWrong":["A. Built-in compliance policies in Azure Policy improve resource governance. They generate posture findings rather than removing analyst work, and they do not touch the SOC queue.","C. Automating data classification helps protect data and enriches investigations, but it does not triage alerts.","D. Hunting queries are proactive work done by Tier 3 hunters. They add work at the top of the SOC rather than removing it at the bottom."],"source":{"title":"Automated investigation and response in Microsoft Defender XDR","url":"https://learn.microsoft.com/en-us/defender-xdr/m365d-autoir"},"corrected":true,"originalAnswer":"A"}},
{"n":30,"sec":"std","num":11,"c":"Design security solutions for applications and data","q":"You have an Azure subscription that contains multiple storage accounts. The accounts contain Azure Files shares and Azure Blob Storage containers. The accounts have encryption scopes and infrastructure encryption enabled.","body":[{"p":"You have an Azure subscription that contains multiple storage accounts. The accounts contain Azure Files shares and Azure Blob Storage containers. The accounts have encryption scopes and infrastructure encryption enabled."},{"p":"You need to implement customer-managed key-based encryption for the shares and the containers. The solution must ensure that the encryption keys are applied at the most granular level."},{"p":"At which level should you apply the encryption keys? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p031_x661.webp","w":749,"h":250}],"review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"For Blob Storage containers, Microsoft's own documentation on encryption scopes says a scope's key \"may be scoped to a container or an individual blob,\" so the individual blob is the more granular of the two Blob-storage options, matching the requirement to apply the key \"at the most granular level.\" For Azure Files shares, the encryption-scope feature is documented as applying at the level of the file share itself; Azure Storage does not offer a documented per-individual-file encryption scope the way it offers a per-blob one, so the share is the most granular unit customer-managed-key encryption actually reaches for file data, even though \"File\" looks superficially more granular by analogy with \"Blob.\"","whyWrong":["Account-level encryption is the coarsest option for both containers and shares, the opposite of what \"most granular\" calls for. Selecting Container for the first box or the (non-existent, for this purpose) individual-file granularity for the second would each stop one step short of the most granular level Azure Storage actually documents for that data type."],"source":{"title":"Encryption scopes for Blob storage","url":"https://learn.microsoft.com/en-us/azure/storage/blobs/encryption-scope-overview"}},"ansimg":[{"img":"img/p032_x674.webp","w":749,"h":250}],"e":[{"img":"img/p032_x679.webp","w":801,"h":160}]},
{"n":31,"sec":"std","num":12,"c":"Design security operations, identity, and compliance capabilities","q":"Your company develops several applications that are accessed as custom enterprise applications in Microsoft Entra ID. You need to recommend a solution to prevent users on a specific list of countries from connecting to the applications. What should you include in the recommendation?","body":[{"p":"Your company develops several applications that are accessed as custom enterprise applications in Microsoft Entra ID. You need to recommend a solution to prevent users on a specific list of countries from connecting to the applications. What should you include in the recommendation?"}],"o":["Microsoft Entra Conditional Access policies","user risk policies in Microsoft Entra ID Protection","activity policies in Microsoft Defender for Cloud Apps","device compliance policies in Microsoft Intune","sign-in risk policies in Microsoft Entra ID Protection"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The same question as Standalone 7 with a different option order, and the same answer: a Conditional Access policy using a countries and regions named location. Watch the letters on these paired items. Reading the option text rather than remembering \"the answer was D\" is what protects you when the exam shuffles them.","whyWrong":["B and E. ID Protection risk policies react to risk signals, not to a chosen list of countries.","C. Activity policies in Defender for Cloud Apps govern in-session activity, not the initial connection.","D. Intune device compliance policies evaluate the device, not the location."],"source":{"title":"Network conditions in Conditional Access policy (named locations, countries)","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/location-condition"}}},
{"n":32,"sec":"std","num":13,"c":"Design security solutions for applications and data","q":"What should you recommend?","body":[{"p":"You have an Azure subscription."},{"p":"You have an on-premises datacenter that contains Microsoft SQL Server instances. Each instance contains multiple databases."},{"p":"You have a Microsoft 365 subscription."},{"p":"You plan to implement a solution to scan the databases for vulnerabilities that compromise data security."},{"p":"You need to recommend what to configure before the databases can be scanned."},{"p":"What should you recommend?"}],"o":["Microsoft Defender for Cloud","Microsoft Defender Vulnerability Management","Microsoft Purview data governance","Microsoft Purview data loss prevention (DLP)"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Vulnerability scanning of on-premises SQL Server needs Defender for SQL servers on machines, and that plan requires the machine to be an Azure resource first. Microsoft's onboarding guidance is explicit: a non-Azure machine has to be connected before Defender for Cloud can assess it, normally through Azure Arc-enabled servers, after which it appears in Defender for Cloud like any other resource and the SQL vulnerability assessment scanner can run against it. Configuring Microsoft Defender for Cloud is what starts that chain: enabling the Defender for SQL plan and onboarding the on-premises instances via Arc.","whyWrong":["B. Defender Vulnerability Management is the endpoint TVM engine; it does not connect SQL instances to Defender for Cloud or turn on SQL-specific scanning.","C. Purview data governance catalogues and classifies data; it has no vulnerability scanner.","D. Purview DLP prevents data leaving through defined channels. It never scans a database for security misconfigurations."],"source":{"title":"Connect on-premises machines to Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-machines"}}},
{"n":33,"sec":"std","num":14,"c":"Design security operations, identity, and compliance capabilities","q":"A customer has a hybrid cloud infrastructure that contains a Microsoft 365 E5 subscription and an Azure subscription.","body":[{"p":"A customer has a hybrid cloud infrastructure that contains a Microsoft 365 E5 subscription and an Azure subscription."},{"p":"All the on-premises servers in the perimeter network are prevented from connecting directly to the internet."},{"p":"The customer recently recovered from a ransomware attack."},{"p":"The customer plans to deploy Microsoft Sentinel."},{"p":"You need to recommend configurations to meet the following requirements:"},{"p":"• Ensure that the security operations team can access the security logs and the operation logs."},{"p":"• Ensure that the IT operations team can access only the operations logs, including the event logs of the"},{"p":"servers in the perimeter network."},{"p":"Which two configurations can you include in the recommendation? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point."}],"o":["Azure Active Directory (Azure AD) Conditional Access policies","a custom collector that uses the Log Analytics agent","resource-based role-based access control (RBAC)","the Azure Monitor agent"],"a":"C D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Splitting who sees what inside one Sentinel workspace, without giving IT operations the full security picture, is exactly what resource-context RBAC is for: it lets a team \"view logs generated by any resources they have access to, even when the logs are stored in a workspace where they don't have full access,\" scoped by the Azure RBAC role each team already holds on the resources themselves. Grant IT operations Reader on the perimeter servers and nothing more, and that is all they see; the security operations team, with broader workspace access, still sees everything. Getting logs out of a perimeter network that can't reach the internet directly is a separate, connectivity problem, and Microsoft's current path for it is the Azure Monitor Agent, which explicitly \"supports connections by using direct proxies, a Log Analytics gateway, and private links\" — so AMA works here even though the servers have no direct route out.","whyWrong":["A. Conditional Access governs interactive sign-in to Entra ID-backed apps. It has no bearing on which tables or resources a role sees inside a Log Analytics workspace.","B. A collector built on the Log Analytics (MMA) agent is built on a retired platform: the agent reached end of support on 31 August 2024. It is also simply the wrong tool for scoping access, which resource-context RBAC handles."],"source":{"title":"Manage access to Microsoft Sentinel data by resource","url":"https://learn.microsoft.com/en-us/azure/sentinel/resource-context-rbac"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/azure-monitor/agents/log-analytics-agent"}]},
{"n":34,"sec":"std","num":15,"c":"Design solutions that align with security best practices and priorities","q":"For of an Azure deployment you are designing a security architecture based on the Microsoft Cloud Security Benchmark. You need to recommend a best practice for implementing service accounts for Azure API management. What should you include in the recommendation?","body":[{"p":"For of an Azure deployment you are designing a security architecture based on the Microsoft Cloud Security Benchmark. You need to recommend a best practice for implementing service accounts for Azure API management. What should you include in the recommendation?"}],"o":["device registrations in Azure AD","application registrations m Azure AD","Azure service principals with certificate credentials","Azure service principals with usernames and passwords","managed identities in Azure"],"a":"E","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The benchmark's rule for application identities is a strict order of preference: \"Use Azure managed identities, which can authenticate to Azure services and resources that support Azure AD authentication… For services that don't support managed identities, use Azure AD to create a service principal.\" Azure API Management supports both system- and user-assigned managed identities, so under this rule a managed identity is the recommendation, not a fallback service principal.","whyWrong":["B. Device registrations represent devices, not service accounts for a PaaS resource.","C. A certificate-credentialed service principal is the benchmark's recommended fallback for services that cannot use a managed identity. API Management can, so this is a step down from best practice.","D. Password-based service principals are explicitly the least preferred option in the same guidance."],"source":{"title":"Microsoft cloud security benchmark - Identity Management (IM-3)","url":"https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-identity-management"}}},
{"n":35,"sec":"std","num":16,"c":"Design security solutions for infrastructure","q":"You ate evaluating Azure Update Manager and automatic virtual machine guest patching. Which virtual machine scale sets will automatic guest patching support?","body":[{"p":"You have an Azure subscription that contains the Azure Virtual Machine Scale Sets shown in the following table."},{"img":"img/p034_x702.webp","w":661,"h":217},{"p":"You ate evaluating Azure Update Manager and automatic virtual machine guest patching. Which virtual machine scale sets will automatic guest patching support?"}],"o":["VMSS1 only","VMSS2only","VMSS1 and VMSS3 only","VMSS2 and VMSS4 only","VMSS1.VMSS2, VMSS3, andVMSS4"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Two independent facts settle every row in the table. First, custom images are excluded outright: \"automatic VM guest patching is supported only on VMs created from images with the exact combination of publisher, offer and sku... listed in the supported OS images. Custom images... aren't supported.\" That removes VMSS2 and VMSS4 regardless of anything else. Second, Flexible orchestration mode does support automatic guest patching (with the Application Health extension installed), so VMSS1 and VMSS3, which both use platform images, are supported whether the OS is Windows or Linux.","whyWrong":["A, B, D, E (any answer omitting one of VMSS1/VMSS3 or including VMSS2/VMSS4). VMSS2 and VMSS4 fail on the custom-image exclusion alone, and both VMSS1 and VMSS3 meet every requirement, so the pair has to be exactly those two."],"source":{"title":"Automatic VM guest patching for Azure VMs and scale sets","url":"https://learn.microsoft.com/en-us/azure/virtual-machines/automatic-vm-guest-patching"}}},
{"n":36,"sec":"std","num":17,"c":"Design solutions that align with security best practices and priorities","q":"What should you use to identify which archetype-aligned management groups to create beneath the landing zones management group?","body":[{"p":"Your company has on-premises datacenters in Seattle, Chicago, and New York City."},{"p":"You plan to migrate the on-premises workloads to the East US Azure region."},{"p":"You need to design a governance solution for the management group hierarchy. The solution must be based on Microsoft Cloud Adoption Framework for Azure principles and must ensure that the hierarchy aligns with the Azure landing conceptual architecture."},{"p":"What should you use to identify which archetype-aligned management groups to create beneath the landing zones management group?"}],"o":["software development lifecycle (SDLC) environments","the internal billing chargeback structure","the hybrid connectivity requirements","geographical locations"],"a":"C","srcA":"A","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe archetype management groups beneath Landing zones are Corp and Online, and what separates them is connectivity. Microsoft defines Corp as \"for workloads that require connectivity or hybrid connectivity with the corporate network via the hub in the connectivity subscription\", and Online as \"for workloads that might require direct internet inbound or outbound connectivity or for workloads that might not require a virtual network\". The guidance states the principle generally too: create management groups under the landing zone management group \"based on the security, compliance, connectivity, and feature needs of the workloads\". What makes this correction firm is that the same article rules out all three distractors explicitly.","whyWrong":["A. “Don’t create management groups for production, testing, and development environments.” Separate those into different subscriptions in the same management group instead.","B. “Use management groups for policy assignment versus billing and RBAC purposes.” Chargeback structure is the wrong axis.","D. “Don’t create management groups solely to model different Azure regions.” Geography is only a factor where data residency or sovereignty law forces it."],"source":{"title":"Management groups - Cloud Adoption Framework","url":"https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups"},"corrected":true,"originalAnswer":"A"}},
{"n":37,"sec":"std","num":18,"c":"Design solutions that align with security best practices and priorities","q":"You have 50 Azure subscriptions.","body":[{"p":"You have 50 Azure subscriptions."},{"p":"You need to monitor resource in the subscriptions for compliance with the ISO 27001:2013 standards. The solution must minimize the effort required to modify the list of monitored policy definitions for the subscriptions."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["Assign an initiative to a management group.","Assign a policy to each subscription.","Assign a policy to a management group.","Assign an initiative to each subscription.","Assign a blueprint to each subscription.","Assign a blueprint to a management group."],"a":"A F","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged because the second half of the keyed pair does not fit the requirement, and no other option is clearly the intended second answer either. Assigning an initiative to a management group is well supported: initiatives bundle many policy definitions under one assignment, so adding or removing an ISO 27001 control from the monitored set means editing the initiative once rather than touching 50 separate subscription-level assignments, which is exactly what minimizing modification effort calls for. The keyed second answer, assigning a blueprint to a management group, does not belong alongside it: a blueprint is a packaged deployment artifact combining templates, RBAC and policy assignments, not a live monitoring construct you edit to adjust which controls are being watched, and Azure Blueprints itself is being retired, with a phased retirement beginning in 2026 and full retirement on 31 January 2027. None of the remaining four options, per-subscription policy or initiative assignments, a per-subscription policy at the management group, or a per-subscription blueprint, better completes a two-part answer either, since each either multiplies the maintenance work across 50 subscriptions or repeats the same flaw as the keyed second option. The key is left as the source has it and the item is flagged rather than guessed at.","source":{"title":"Azure Blueprints retirement","url":"https://learn.microsoft.com/en-us/azure/governance/blueprints/blueprint-retirement"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/governance/management-groups/overview"},{"p":"https://docs.microsoft.com/en-us/azure/governance/blueprints/overview"},{"p":"https://docs.microsoft.com/en-us/azure/governance/policy/samples/iso-27001"},{"p":"https://docs.microsoft.com/en-us/azure/governance/policy/tutorials/create-and-manage"}]},
{"n":38,"sec":"std","num":19,"c":"Design security solutions for applications and data","q":"What should you include during the application design phase?","body":[{"p":"You are creating an application lifecycle management process based on the Microsoft Security Development Lifecycle (SDL)."},{"p":"You need to recommend a security standard for onboarding applications to Azure. The standard will include recommendations for application design, development, and deployment"},{"p":"What should you include during the application design phase?"}],"o":["static application security testing (SAST) by using SonarQube","dynamic application security testing (DAST) by using Veracode","threat modeling by using the Microsoft Threat Modeling Tool","software decomposition by using Microsoft Visual Studio Enterprise"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The Microsoft SDL runs Requirements, Design, Implementation, Verification, Release and Response in order, and threat modeling is the signature Design-phase practice: it produces the data flow diagram and the list of threats that implementation and testing are then built to address. Microsoft's own Azure security-development guidance treats everything downstream of that, static analysis, dependency scanning, DAST, fuzzing, as Implementation or Verification activities that consume the design's threat model rather than produce it.","whyWrong":["A. SAST inspects code that already exists, which places it in implementation, after design.","B. DAST tests a running application, which is a verification-phase activity, later still.","D. Decomposing software into components is an implementation planning step, not the design-phase security activity threat modeling is."],"source":{"title":"Develop secure applications on Azure (SDL implementation/verification, DAST/SAST)","url":"https://learn.microsoft.com/en-us/azure/security/develop/secure-develop"}},"e":[{"p":"https://www.microsoft.com/en-us/securityengineering/sdl/threatmodeling"}]},
{"n":39,"sec":"std","num":20,"c":"Design security solutions for infrastructure","q":"What should you use?","body":[{"p":"You have a Microsoft 365 tenant named contoso.com."},{"p":"You need to ensure that users can authenticate only to contoso.com. The solution must meet the following requirements:"},{"p":"• Prevent the users from authenticating to other Microsoft 365 tenants."},{"p":"• Minimize administrative effort."},{"p":"What should you use?"}],"o":["Microsoft Defender for Endpoint","Microsoft Entra Internet Access","Microsoft Entra Private Access","Microsoft Defender for Cloud Apps"],"a":"B","srcA":"C","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nTenant restrictions are what stop a user signing in to any tenant other than your own, and in Global Secure Access they are delivered as Universal Tenant Restrictions on the Microsoft traffic profile — that is Microsoft Entra Internet Access. The Global Secure Access feature comparison table lists Universal Tenant Restrictions under the Entra P1/P2 Microsoft traffic profile column only; the Private Access column is blank. Remember the split: Internet Access is the secure web gateway for internet, SaaS and Microsoft traffic, so anything about controlling where users authenticate outbound lives there.","whyWrong":["A. Microsoft Defender for Endpoint is endpoint detection and response. It does not govern which Entra tenant a user may authenticate to.","C. Microsoft Entra Private Access is the ZTNA half of Global Secure Access, for reaching private on-premises apps. It has no tenant-restriction capability.","D. Microsoft Defender for Cloud Apps is a CASB. It can govern SaaS session behaviour but does not enforce tenant restrictions at authentication."],"source":{"title":"What is Global Secure Access? — feature comparison table","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/overview-what-is-global-secure-access"},"corrected":true,"originalAnswer":"C"}},
{"n":40,"sec":"std","num":21,"c":"Design security operations, identity, and compliance capabilities","q":"Your company, named Contoso. Ltd... has an Azure AD tenant namedcontoso.com. Contoso has a partner company named Fabrikam. Inc. that has an Azure AD tenant named fabrikam.com. You need to ensure that helpdesk users at Fabrikam can reset passwords for specific users at Contoso. The solution must meet the following requirements:","body":[{"p":"Your company, named Contoso. Ltd... has an Azure AD tenant namedcontoso.com. Contoso has a partner company named Fabrikam. Inc. that has an Azure AD tenant named fabrikam.com. You need to ensure that helpdesk users at Fabrikam can reset passwords for specific users at Contoso. The solution must meet the following requirements:"},{"p":"• Follow the principle of least privilege."},{"p":"• Minimize administrative effort."},{"p":"What should you do? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p037_x738.webp","w":1000,"h":290}],"boxes":[{"label":"Role to assign","value":"Password Administrator"},{"label":"To restrict the scope","value":"An administrative unit","srcValue":"A custom role"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nPassword Administrator is the right built-in role to assign for resetting a specific set of users' passwords, and the source has that half correct. Where it goes wrong is the scoping mechanism: Microsoft's documentation is explicit that \"administrative units restrict permissions in a role to any portion of your organization that you define,\" and gives this exact scenario as the example, an administrative-unit-scoped Helpdesk or Password Administrator \"can reset passwords for users in the administrative unit only.\" That is precisely \"follow least privilege\" applied to the Fabrikam helpdesk users, achieved by scoping the existing built-in role to an administrative unit containing only the specific Contoso users in question, with no new role definition to design, test or maintain, which is also what \"minimize administrative effort\" is asking for. Building a custom role does the opposite: it adds a new, bespoke permission set to create and govern when the built-in role already has the exact permissions needed and only the scope needs narrowing.","whyWrong":["A custom role would be the answer if Password Administrator’s permissions were wrong for the job, granting too much or too little. They are not; the built-in role is fine. What needs restricting is which users it applies to, which is an administrative unit’s job, not a new role’s."],"source":{"title":"Administrative units in Microsoft Entra ID","url":"https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/administrative-units"},"corrected":true,"originalAnswer":"A custom role","boxLabel":"To restrict the scope"},"ansimg":[{"img":"img/p038_x751.webp","w":1000,"h":290}],"e":[{"img":"img/p038_x756.webp","w":1000,"h":157}]},
{"n":41,"sec":"std","num":22,"c":"Design solutions that align with security best practices and priorities","q":"What should you include in the recommendation?","body":[{"p":"Your company uses Azure Pipelines and Azure Repos to implement continuous integration and continuous deployment (CI/CD) workflows for the deployment of applications to Azure."},{"p":"You are updating the deployment process to align with DevSecOps controls guidance in the Microsoft Cloud Adoption Framework for Azure."},{"p":"You need to recommend a solution to ensure that all code changes are submitted by using pull requests before being deployed by the CI/CD workflow."},{"p":"What should you include in the recommendation?"}],"o":["custom roles in Azure Pipelines","branch policies in Azure Repos","Azure policies","custom Azure roles"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Branch policies in Azure Repos are the mechanism built for exactly this: Microsoft's own summary is to \"protect important branches by requiring pull requests, reviewers, builds, and other checks before changes merge.\" Setting a branch policy on main that requires completion through a pull request stops any push, including from a CI/CD workflow's own credentials, from landing without one.","whyWrong":["A. Custom roles in Azure Pipelines shape who can run or manage pipelines, not whether a PR is required before merge.","C. Azure Policy governs Azure resource configuration, not Git workflow in Azure Repos.","D. Custom Azure roles are an RBAC construct for Azure resources, unrelated to repository branch protection."],"source":{"title":"Set and manage branch policies in Azure Repos","url":"https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies"}}},
{"n":42,"sec":"std","num":23,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription. The subscription contains five Azure App Service instances that host public web apps Each instance is deployed across three Azure regions."},{"p":"The web apps handle sensitive customer data and must be protected from common web exploits and malicious bots."},{"p":"You need to recommend a security solution that meets the following requirements:"},{"p":"• Provides centralized management and updates for protection rules"},{"p":"• Protects all the web apps without modifying the application code"},{"p":"• Minimizes costs"},{"p":"What should you include in the recommendation?"}],"o":["Azure Application Gateway","Azure Front Door","Azure DDoS Protection","Azure Firewall"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Five App Service instances spread across three regions is exactly the shape Front Door is built for: one global edge service in front of geographically distributed backends, with a single WAF policy giving centralized management and updates for protection rules across all of them. Because the inspection happens at the edge, the application code is untouched, and one global deployment costs less than replicating a regional control in every region.","whyWrong":["A. Application Gateway is regional. Protecting three regions would mean three separate gateways and three policies to keep in sync, which is the opposite of centralized management and adds cost.","C. DDoS Protection defends against volumetric and protocol attacks. It has no web application firewall rules for exploits.","D. Azure Firewall is a network firewall, not a WAF, and does not inspect HTTP(S) application traffic for web exploits."],"source":{"title":"Web Application Firewall DRS rule groups and rules (Azure Front Door)","url":"https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-drs"}}},
{"n":43,"sec":"std","num":24,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"Your network contains an on-premises Active Directory Domain Services (AD DS) domain."},{"p":"You have a Microsoft 365 subscription."},{"p":"You need to recommend a solution to evaluate the security and governance of the domains. The solution must meet the following requirements:"},{"p":"• identify configuration issues and administrative vulnerabilities."},{"p":"• Minimize effort."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Entra ID Protection","Microsoft Defender for Servers","Microsoft Defender for Identity","Microsoft Sentinel"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Defender for Identity is the only one of these that looks inside an on-premises AD DS domain. Its identity security posture assessments evaluate domain configuration and surface the weaknesses attackers exploit, which is exactly “identify configuration issues and administrative vulnerabilities”, and it does so from a lightweight sensor on the domain controllers rather than a project you have to build — that is the “minimize effort” half.","whyWrong":["A. Microsoft Entra ID Protection scores risk on cloud identities (risky sign-ins, leaked credentials). It does not assess AD DS domain configuration.","B. Defender for Servers protects the operating system as a workload, not the directory it belongs to.","D. Microsoft Sentinel is a SIEM. It could ingest the signal, but you would have to write the detections yourself, which is the opposite of minimizing effort."],"source":{"title":"Microsoft Defender for Identity overview","url":"https://learn.microsoft.com/en-us/defender-for-identity/what-is"}}},
{"n":44,"sec":"std","num":25,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft Entra tenant named contoso.com and use Microsoft Intune. Each user in contoso.com has a Microsoft Entra ID P1 license and a Windows 11 device that has the Global Secure Access client deployed.","body":[{"p":"You have a Microsoft Entra tenant named contoso.com and use Microsoft Intune. Each user in contoso.com has a Microsoft Entra ID P1 license and a Windows 11 device that has the Global Secure Access client deployed."},{"p":"You plan to deploy the following configuration of Microsoft Entra Internet Access:"},{"p":"• Enable a baseline profile."},{"p":"• Create a security profile named Profile` that has a priority of 300 and contains a single web content filtering"},{"p":"policy named WCFPolicy configure WCFPolicy1 as follows:"},{"p":"o Set Action to allow."},{"p":"o Include a single rule that has a fully qualified domain name (FQDN) destination of ‘. adatum.com."},{"p":"• Link Profile1 to a Conditional Access policy named CAPolicy1, apply CAPolicy1 to all users, and grant"},{"p":"access unless a user ' s device is noncompliant"},{"p":"You need to evaluate the impact of the planned deployment on traffic to the following resources:"},{"p":"• https://www.adatum.com:8433"},{"p":"• https://www.fabrikam.com"},{"p":"Which two traffic scenarios will occur? Each correct answer presents a complete solution."},{"p":"NOTE: Each correct selection is worth one point"}],"o":["Traffic to https://www.fabrikam.com will be allowed from all the devices.","Traffic to https://www.adatum.com:8433 will be blocked from all the devices.","Traffic to https://www.adatumxom:8433 will be allowed from all the devices.","Traffic to https://www.fabrikam.com will be allowed from compliant devices only.","Traffic to https://www.adatum.com:8433 will be allowed from compliant devices only.","Traffic to https://www.fabrikam.com will be blocked from noncompliant devices only."],"a":"A C","srcA":"A E","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nBoth of the test URLs turn out to sit outside what this deployment actually controls, which is the point of the question. fabrikam.com is never named in any rule: WCFPolicy1's only rule targets *.adatum.com, so fabrikam.com falls through to the baseline profile with no compliance gate attached to it at all, and is allowed from every device. adatum.com:8433 looks like it should be caught by the same WCFPolicy1 rule, but Microsoft documents that the platform's default web-traffic handling \"assumes standard ports for HTTP/S traffic (ports 80 and 443)\"; reaching a non-standard port such as 8433 requires a Custom Acquire configuration that this deployment never sets up. Traffic on that port is therefore never pulled into the Internet Access tunnel in the first place, never reaches WCFPolicy1's rule, and never passes through the Conditional Access check tied to Profile1 — so it, too, goes out unfiltered and is allowed from every device, compliant or not.","whyWrong":["B. adatum.com:8433 is not blocked; because it never enters the GSA tunnel at all on this non-standard port, it is simply unaffected by the deployment, which behaves as allowed rather than blocked.","D. fabrikam.com traffic is not gated by device compliance. No rule in Profile1 references fabrikam.com, and the CAPolicy1 compliance check only applies to sessions that Profile1 is invoked for.","E. The same reasoning that rules out D applies here: adatum.com:8433 traffic never reaches Profile1's rule or the Conditional Access check behind it, because the standard-ports assumption keeps it out of the tunnel altogether.","F. This restates the same wrong premise as D and E for fabrikam.com in the opposite direction; fabrikam.com is not gated on compliance in either direction."],"source":{"title":"Global Secure Access traffic forwarding profiles (default port assumptions)","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/concept-traffic-forwarding"},"corrected":true,"originalAnswer":"A E"}},
{"n":45,"sec":"std","num":26,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription and an Azure DevOps organization."},{"p":"You need to recommend a solution for connecting Azure DevOps pipelines to the resources in the subscription by using Azure Resource Manager (ARM) service connections. The solution must align with Microsoft Cloud Adoption Framework for Azure best practices, including the principle of least privilege."},{"p":"What should you include in the recommendation?"}],"o":["workload identity federation and system-assigned managed identities","service principals and secrets","workload identity federation and user-assigned managed identities","workload identity federation and service principals"],"a":"C","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"CAF's DevOps security guidance calls for \"secure and scoped service identities\": either a user-assigned managed identity or an application registration (service principal) authenticated with OpenID Connect (workload identity federation), never a secret. Between the two, it flags a concrete advantage for the managed identity: \"user-assigned managed identities more easily integrate with your subscription vending process, ensuring they're decommissioned along with your other resources when no longer needed\", where a service principal is a separate Entra ID object someone has to remember to clean up. That is the least-privilege, least-residue choice the stem asks for.","whyWrong":["A. A system-assigned identity is tied to the lifecycle of a single resource and cannot be provisioned ahead of the pipeline the way a service connection needs; CAF's guidance for service connections specifically names user-assigned identities.","B. Secrets are what workload identity federation exists to eliminate; the guidance says to avoid them wherever possible.","D. Workload identity federation with a service principal is also a documented option and is not wrong, but the source material calls out the extra subscription-vending benefit only for the user-assigned managed identity, which is what the key selects."],"source":{"title":"DevOps security considerations overview - Cloud Adoption Framework","url":"https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/considerations/security-considerations-overview"}}},
{"n":46,"sec":"std","num":27,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure AD tenant that syncs with an Active Directory Domain Services {AD DS) domain. Client computers run Windows and are hybrid-joined to Azure AD."},{"p":"You are designing a strategy to protect endpoints against ransomware. The strategy follows Microsoft Security Best Practices."},{"p":"You plan to remove all the domain accounts from the Administrators group on the Windows computers."},{"p":"You need to recommend a solution that will provide users with administrative access to the Windows computers only when access is required. The solution must minimize the lateral movement of ransomware attacks if an administrator account on a computer is compromised."},{"p":"What should you include in the recommendation?"}],"o":["Local Administrator Password Solution (LAPS)","Privileged Access Workstations (PAWs)","Azure AD Privileged Identity Management (PIM)","Azure AD identity Protection"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Windows LAPS gives every machine a different, automatically rotated local administrator password. Microsoft lists the first benefit as “protection against pass-the-hash and lateral-traversal attacks”, which is the requirement word for word: if one machine's local admin account is compromised, the credential is useless on every other machine, so the ransomware cannot spread sideways with it.","whyWrong":["B. Privileged Access Workstations harden the admin’s own device. They do not change the local administrator password on the 500 user machines.","C. PIM does just-in-time elevation for Entra ID roles, not for local Windows accounts.","D. Entra ID Protection detects risky sign-ins and has no role in local account management."],"source":{"title":"Windows LAPS overview","url":"https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview"}}},
{"n":47,"sec":"std","num":28,"c":"Design security solutions for applications and data","q":"You have an Azure SQL database named DB1 that contains customer information.","body":[{"p":"You have an Azure SQL database named DB1 that contains customer information."},{"p":"A team of database administrators has full access to DB1."},{"p":"To address customer inquiries, operators in the customer service department use a custom web app named App1 to view the customer information."},{"p":"You need to design a security strategy for D81. The solution must meet the following requirements:"},{"p":"• When the database administrators access DB1 by using SQL management tools, they must be prevented"},{"p":"from viewing the content of the Credit Card attribute of each customer record."},{"p":"• When the operators view customer records in App1, they must view only the last four digits of the Credit"},{"p":"Card attribute."},{"p":"What should you include in the design? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p042_x805.webp","w":1000,"h":279}],"review":{"status":"MANUAL_REVIEW","confidence":"HIGH","explanation":"The recorded answer for the database administrators, Always Encrypted, checks out: Microsoft's own Always Encrypted documentation names exactly this scenario, protecting sensitive data \"from those who manage the data but should have no access: on-premises database administrators, cloud database operators, or other high-privileged unauthorized users,\" since the encryption keys are never exposed to the database engine or the people who administer it. The recorded answer for the operators, Row-level security (RLS), does not check out: RLS controls which rows a user's query returns; it has no mechanism for showing part of a column's value and hiding the rest. \"They must view only the last four digits of the Credit Card attribute\" is, word for word, what Dynamic Data Masking's built-in credit-card masking function does: it \"exposes the last four digits of the designated fields and adds a constant string as a prefix,\" masking the rest of the value for anyone querying through App1 without the unmask permission. Dynamic data masking, not row-level security, is the answer this requirement calls for.","whyWrong":["Row-level security is a real Azure SQL feature, but it filters which records a query returns rather than obscuring part of a value within a visible record, so it cannot produce \"the last four digits\" of a field the operator can otherwise see. This item is left flagged rather than corrected because it is an unscored, picture-only answer-area item with no text key a correction could change."],"source":{"title":"Dynamic data masking - Azure SQL Database","url":"https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview"}},"ansimg":[{"img":"img/p042_x811.webp","w":1000,"h":279}],"e":[{"img":"img/p042_x799.webp","w":1000,"h":137}]},
{"n":48,"sec":"std","num":29,"c":"Design security solutions for infrastructure","q":"You have an Azure subscription that contains the resources shown in the following table.","body":[{"p":"You have an Azure subscription that contains the resources shown in the following table."},{"img":"img/p043_x828.webp","w":622,"h":98},{"p":"You need to recommend a network security solution for App1. The solution must meet the following requirements:"},{"p":"• Only the virtual machines that are connected to Subnet1 must be able to connect to D81."},{"p":"• DB1 must be inaccessible from the internet"},{"p":"• Costs must be minimized."},{"p":"What should you include in the recommendation? To answer, select the options in the answer area. NOTE: Each correct answer is worth one point."},{"img":"img/p043_x834.webp","w":646,"h":208}],"boxes":[{"label":"To ensure that only VM1 can access DB1","value":"A private endpoint"},{"label":"To enforce network security restrictions for DB1","value":"Network security groups (NSGs)"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"A private endpoint gives DB1 a private IP inside the VNet and lets its public endpoint be disabled entirely, which is the cheapest way to make it \"inaccessible from the internet\" without standing up an Application Gateway or a second Private Link resource. Restricting that private endpoint down to only Subnet1's VMs then needs a network security group: Microsoft documents that \"private endpoints support network policies, which enable support for network security groups,\" letting you add an inbound rule that allows only Subnet1's address range to reach the private endpoint's NIC, which is exactly \"only the virtual machines connected to Subnet1 must be able to connect to DB1.\"","whyWrong":["Azure Application Gateway is a web traffic reverse proxy for HTTP(S) applications; it isn’t how you privately expose an Azure SQL Database.","Azure Private Link is the umbrella service that private endpoints are built on; the private endpoint is the specific resource you actually create, so it is the more precise and directly actionable answer.","Azure Firewall rules and virtual network rules are both real Azure SQL access-control mechanisms, but neither is the network-security-group-based restriction on the private endpoint’s own subnet that this pairing calls for."],"source":{"title":"Manage network policies for private endpoints (NSG support)","url":"https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy"}},"ansimg":[{"img":"img/p043_x823.webp","w":646,"h":208}],"e":[{"img":"img/p044_x840.webp","w":653,"h":123}]},
{"n":49,"sec":"std","num":30,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft Entra tenant named contoso.com that is linked to an Azure subscription named Sub! and a Microsoft 365 subscription. Sub! contains a publicly accessible Azure App Service web app named App1.","body":[{"p":"You have a Microsoft Entra tenant named contoso.com that is linked to an Azure subscription named Sub! and a Microsoft 365 subscription. Sub! contains a publicly accessible Azure App Service web app named App1."},{"p":"You have an external partner that has a Microsoft Entra tenant named fabrikam.com."},{"p":"You need to recommend a solution that meets the following requirements:"},{"p":"• Ensures that the users in fabrikam.com can be granted permissions to specific Microsoft Teams channels in"},{"p":"contoso.com"},{"p":"• Ensures that the users of App1 can authenticate by using social media accounts"},{"p":"• Minimizes administrative effort"},{"p":"Which authentication method should you recommend for each requirement? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p044_x846.webp","w":1000,"h":392}],"review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Microsoft Entra B2B collaboration is the documented mechanism for letting an external partner's own users, fabrikam.com's in this case, be granted permissions to specific resources such as Teams channels in contoso.com, without contoso.com having to create or manage a separate account for each of them. Microsoft Entra External ID for customers (the current name for what was Azure AD B2C) is, by contrast, built specifically to let a customer-facing application's users authenticate with social identity providers, which is exactly what \"users of App1 can authenticate by using social media accounts\" needs, and is not something B2B collaboration, cross-tenant synchronization, or B2B direct connect provide.","whyWrong":["Cross-tenant synchronization and B2B direct connect both govern collaboration between known partner Entra tenants; neither adds social-identity-provider sign-in for an application’s own end users, which only External ID for customers is built to do."],"source":{"title":"What is Microsoft Entra External ID for customers?","url":"https://learn.microsoft.com/en-us/entra/external-id/customers/overview-customers-ciam"}},"ansimg":[{"img":"img/p045_x855.webp","w":1000,"h":392}],"e":[{"img":"img/p045_x860.webp","w":1000,"h":163}]},
{"n":50,"sec":"std","num":31,"c":"Design security operations, identity, and compliance capabilities","q":"Your company has Microsoft 365 E5 licenses and Azure subscriptions.","body":[{"p":"Your company has Microsoft 365 E5 licenses and Azure subscriptions."},{"p":"The company plans to automatically label sensitive data stored in the following locations:"},{"p":"• Microsoft SharePoint Online"},{"p":"• Microsoft Exchange Online"},{"p":"• Microsoft Teams"},{"p":"You need to recommend a strategy to identify and protect sensitive data."},{"p":"Which scope should you recommend for the sensitivity label policies? To answer, drag the appropriate scopes to the correct locations. Each scope may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p046_x873.webp","w":715,"h":284}],"boxes":[{"label":"SharePoint Online","value":"Files and emails","srcValue":"Groups and sites"},{"label":"Microsoft Teams","value":"Groups and sites"},{"label":"Exchange Online","value":"Files and emails"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nMicrosoft's own auto-labeling documentation draws a hard line on this: \"if the scope doesn't include email, you can't select the label for an auto-labeling policy that includes the Exchange location. If the scope doesn't include files, you can't select the label for an auto-labeling policy that includes the SharePoint and OneDrive locations.\" Since the requirement is to automatically label sensitive data stored in SharePoint Online (files), the label's scope for that location has to be Files and emails, not Groups and sites. Groups and sites is a different capability entirely, labeling the SharePoint site or Microsoft 365 Group container itself (setting things like its default sharing link type), and \"doesn't label the items in them,\" which is why it is the correct scope for Microsoft Teams here (governing the team as a container) but not for auto-labeling documents inside a SharePoint site.","whyWrong":["Groups and sites is the container-level scope, correct for Teams in this same question, but it does not apply labels to individual files, so it cannot be the scope for an auto-labeling policy targeting SharePoint content.","Schematized data assets is the scope for structured data sources catalogued in Microsoft Purview’s data map (databases, Power BI), not for document libraries in SharePoint Online."],"source":{"title":"Learn about sensitivity labels (label scopes: Files & emails vs. Groups & sites)","url":"https://learn.microsoft.com/en-us/purview/sensitivity-labels"},"corrected":true,"originalAnswer":"Groups and sites","boxLabel":"SharePoint Online"},"ansimg":[{"img":"img/p046_x879.webp","w":715,"h":284}],"e":[{"p":"Box 1: Groups and sites"},{"p":"Box 2: Groups and sites"},{"p":"Box 3: Files and emails –"},{"p":"https://docs.microsoft.com/en-us/microsoft-365/compliance/sensitivity-labels?view=o365-worldwideGoto label scopes"}]},
{"n":51,"sec":"std","num":32,"c":"Design security operations, identity, and compliance capabilities","q":"You need to recommend a solution to add a watermark to email attachments that contain sensitive data. What should you include in the recommendation?","body":[{"p":"You have a Microsoft 365 E5 subscription."},{"p":"You need to recommend a solution to add a watermark to email attachments that contain sensitive data. What should you include in the recommendation?"}],"o":["Microsoft Defender for Cloud Apps","insider risk management","Microsoft Information Protection","Azure Purview"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Watermarks are a content marking, and content markings are a sensitivity label setting in Microsoft Purview Information Protection: a label can “mark the content … by adding watermarks, headers, or footers”. Note the scope detail worth remembering — watermarks apply to documents, not to the body of an email, which is why the question asks about attachments.","whyWrong":["A. Defender for Cloud Apps is a CASB. It can apply labels to files in third-party services, but it is not what defines the watermark.","B. Insider risk management scores risky user behaviour; it marks nothing.","D. Azure Purview (now the Microsoft Purview Data Map) discovers and catalogues data estates. Content marking belongs to Information Protection."],"source":{"title":"Learn about sensitivity labels","url":"https://learn.microsoft.com/en-us/purview/sensitivity-labels"}},"e":[{"p":"https://docs.microsoft.com/en-us/microsoft-365/compliance/sensitivity-labels?view=o365-worldwide"},{"p":"You can use sensitivity labels to: Provide protection settings that include encryption and content markings. For example, apply a \" Confidential \" label to a document or email, and that label encrypts the content and applies a \" Confidential \" watermark. Content markings include headers and footers as well as watermarks, and encryption can also restrict what actions authorized people can take on the content. Protect content in Office apps across different platforms and devices. Supported by Word, Excel, PowerPoint, and Outlook on the Office desktop apps and Office on the web. Supported on Windows, macOS, iOS, and Android. Protect content in third-party apps and services by using Microsoft Defender for Cloud Apps. With Defender for Cloud Apps, you can detect, classify, label, and protect content in third-party apps and services, such as SalesForce, Box, or DropBox, even if the third-party app or service does not read or support sensitivity labels."}]},
{"n":52,"sec":"std","num":33,"c":"Design security solutions for applications and data","q":"What should you include in the recommendation?","body":[{"p":"Your company plans to deploy several Azure App Service web apps. The web apps will be deployed to the West Europe Azure region. The web apps will be accessed only by customers in Europe and the United States."},{"p":"You need to recommend a solution to prevent malicious bots from scanning the web apps for vulnerabilities. The solution must minimize the attach surface."},{"p":"What should you include in the recommendation?"}],"o":["Azure Firewall Premium","Azure Application Gateway Web Application Firewall (WAF)","network security groups (NSGs)","Azure Traffic Manager and application security groups"],"a":"B","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Microsoft's bot protection ruleset, which blocks or logs requests from IP addresses on the Microsoft Threat Intelligence feed, ships specifically for Application Gateway WAF v2, so it is the control built for \"malicious bots scanning for vulnerabilities.\" It also fits the stated scope: a single-region deployment serving only Europe and US customers has no need for Front Door's global point-of-presence footprint, and attaching a regional Layer-7 firewall directly in front of the app keeps the exposed surface to one edge rather than a globally anycast one.","whyWrong":["A. Azure Firewall Premium inspects network and TLS traffic; it has no bot management ruleset for HTTP requests.","C. NSGs filter by IP and port. They cannot recognize a bot's request pattern against known-bad IP intelligence.","D. Traffic Manager is DNS-based routing, and application security groups tag NICs for NSG rules. Neither inspects HTTP traffic for bots."],"source":{"title":"WAF on Azure Application Gateway bot protection overview","url":"https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/bot-protection-overview"}}},
{"n":53,"sec":"std","num":34,"c":"Design security solutions for infrastructure","q":"You have 500 Windows 11 devices and 200 macOS devices. The devices are managed by using Microsoft Intune and are subject to compliance policies.","body":[{"p":"You have 500 Windows 11 devices and 200 macOS devices. The devices are managed by using Microsoft Intune and are subject to compliance policies."},{"p":"You plan to deploy the following Intune features:"},{"p":"• Security baselines"},{"p":"• Remote lock of noncompliant devices"},{"p":"Which feature will be supported by each platform? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p048_x901.webp","w":815,"h":322}],"boxes":[{"label":"Security baselines","value":"Windows only"},{"label":"Remote lock","value":"Windows and macOS"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Intune's built-in security baseline templates (the MDM security baseline, the Microsoft Defender for Endpoint baseline, the Edge baseline) exist for Windows only; there is no macOS equivalent baseline template in Intune. Remote lock, by contrast, is one of Intune's general cross-platform device actions, available for Windows, macOS, iOS and Android alike, so it covers both platforms in this device estate.","whyWrong":["macOS-only or neither answer would be wrong in either direction: Intune security baselines are Windows-specific, and remote lock is not restricted to a single platform."],"source":{"title":"Intune remote actions and security baselines platform support","url":"https://learn.microsoft.com/en-us/mem/intune/protect/security-baselines"}},"ansimg":[{"img":"img/p048_x903.webp","w":815,"h":322}],"e":[{"img":"img/p049_x923.webp","w":827,"h":135}]},
{"n":54,"sec":"std","num":35,"c":"Design security solutions for applications and data","q":"Your company wants to optimize using Azure to protect its resources from ransomware.","body":[{"p":"Your company wants to optimize using Azure to protect its resources from ransomware."},{"p":"You need to recommend which capabilities of Azure Backup and Azure Storage provide the strongest protection against ransomware attacks. The solution must follow Microsoft Security Best Practices."},{"p":"What should you recommend? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p049_x929.webp","w":1000,"h":252}],"review":{"status":"MANUAL_REVIEW","confidence":"HIGH","explanation":"The recorded answer for Azure Storage, immutable storage, checks out: Microsoft positions immutable (WORM) blob storage as its flagship ransomware defense for Azure Storage, since a ransomware actor who compromises an account still cannot alter or delete data locked under an immutable policy. The recorded answer for Azure Backup, encryption by using platform-managed keys, does not check out as the strongest ransomware-specific protection: platform-managed-key encryption is the account's default at-rest encryption, applied automatically regardless of any ransomware scenario, and it does nothing to stop an attacker with compromised admin credentials from deleting or disabling backups, which is what ransomware actually threatens. Microsoft's own documentation on protecting Azure Backup from ransomware centers on requiring a security PIN (generated from the Recovery Services vault) before critical, potentially destructive operations, such as stopping protection with data deletion or changing the passphrase, can be carried out, which is exactly the kind of protection \"strongest protection against ransomware attacks\" is asking for.","whyWrong":["Encryption by using platform-managed keys is always on by default and is not a ransomw
