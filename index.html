{"n":206,"sec":"std","num":187,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"You have an Azure subscription."},{"p":"You have an on-premises datacenter. The datacenter contains 20 servers that run Windows Server. Each server is onboarded to Azure Arc and is protected by using Microsoft Defender for Servers Plan 1."},{"p":"You have a Microsoft 365 subscription."},{"p":"You need to recommend a solution to identify which servers have outdated hardware drivers or firmware."},{"p":"What should you include in the recommendation?"}],"o":["Change all the servers to Microsoft Defender for Servers Plan 2.","Add Microsoft Defender Vulnerability Management add-ons.","Onboard all the servers to Azure Update Manager.","Add the Microsoft Intune Suite add-on."],"a":"B","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Hardware and firmware assessment is a premium Defender Vulnerability Management capability, not part of the vulnerability scanning included with Defender for Servers Plan 1. Adding the Defender Vulnerability Management add-on is what turns it on for servers already covered by Plan 1 — which is also why upgrading the plan is not the minimal answer.","whyWrong":["A. Moving every server to Plan 2 is a far larger change and is not what gates firmware assessment.","C. Azure Update Manager reports and installs operating system updates; drivers and firmware are not its job.","D. The Intune Suite add-on extends endpoint management features, not server vulnerability assessment."],"source":{"title":"Enable vulnerability scanning with Microsoft Defender Vulnerability Management","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/deploy-vulnerability-assessment-defender-vulnerability-management"}}},
{"n":207,"sec":"std","num":188,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"Your on-premises network contains an e-commerce web app that was developed in Angular and Node.js. The web app uses a MongoDB database You plan to migrate the web app to Azure. The solution architecture team proposes the following architecture as an Azure landing zone."},{"img":"img/p163_x2584.webp","w":1000,"h":163},{"p":"You need to provide recommendations to secure the connection between the web app and the database. The solution must follow the Zero Trust model."},{"p":"Solution: You recommend implementing Azure Application Gateway with Azure Web Application Firewall (WAF)."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"No. Application Gateway with WAF is a sound control, but it sits in front of the web app and inspects inbound requests from users. The question asks about the connection between the web app and the database, which is behind it. A WAF never sees that traffic and does nothing to remove the database's public endpoint. Standalone 209 makes the same mistake with a different product, and Standalone 218 has the answer.","whyWrong":["A. Yes confuses protecting the front door of the application with protecting the link behind it."],"source":{"title":"What is Azure Private Link?","url":"https://learn.microsoft.com/en-us/azure/private-link/private-link-overview"}},"e":[{"p":"When using Azure-provided PaaS services (e.g., Azure Storage, Azure Cosmos DB, or Azure Web App, use the PrivateLink connectivity option to ensure all data exchanges are over the private IP space and the traffic never leaves the Microsoft network."}]},
{"n":208,"sec":"std","num":189,"c":"Design solutions that align with security best practices and priorities","q":"Does this meet the goal?","body":[{"p":"You have an Azure subscription that has Microsoft Defender for Cloud enabled."},{"p":"You are evaluating the Azure Security Benchmark V3 report."},{"p":"In the Secure management ports controls, you discover that you have 0 out of a potential 8 points."},{"p":"You need to recommend configurations to increase the score of the Secure management ports controls."},{"p":"Solution: You recommend enabling just-in-time (JIT) VM access on all virtual machines."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Yes, and this is the one solution in the family that works. Microsoft's own description of the Secure management ports control names the tool: these recommendations \"reduce your exposure with tools like just-in-time VM access and network security groups\". Just-in-time access keeps RDP and SSH closed in the network security group by default and opens them only for an approved user, from an approved source IP, for a limited window, which is exactly the brute-force exposure the control measures. Compare Standalone 4, 61 and 106, which propose adaptive network hardening, the VMAccess extension and Defender for Endpoint onboarding: all real controls, all counted under a different control.","source":{"title":"Just-in-time machine access in Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3-privileged-access#pa-2- avoid-standing-access-for-user-accounts-and-permissions"}]},
{"n":209,"sec":"std","num":190,"c":"Design solutions that align with security best practices and priorities","q":"You are planning the security levels for a security access strategy.","body":[{"p":"You are planning the security levels for a security access strategy."},{"p":"You need to identify which job roles to configure at which security levels. The solution must meet security best practices of the Microsoft Cybersecurity Reference Architectures (MCRA)."},{"p":"Which security level should you configure for each job role? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p164_x2597.webp","w":626,"h":238}],"ansimg":[{"img":"img/p164_x2603.webp","w":626,"h":238}],"e":[{"img":"img/p165_x2615.webp","w":691,"h":158}]},
{"n":210,"sec":"std","num":191,"c":"Design security solutions for infrastructure","q":"You open Microsoft Defender for Cloud as shown in the following exhibit.","body":[{"p":"You open Microsoft Defender for Cloud as shown in the following exhibit."},{"img":"img/p165_x2621.webp","w":845,"h":607},{"p":"Use the drop-down menus to select the answer choice that complete each statements based on the information presented in the graphic."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p166_x2634.webp","w":999,"h":274}],"boxes":[{"label":"Selection 1","value":"NSG"},{"label":"Selection 2","value":"Microsoft Defender for servers"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Both answers match the secure score control table directly. \"Restrict unauthorized network access\" is the control that covers network security groups among its recommendations, alongside adaptive network hardening and Private Link, so implementing NSGs is what raises that control's score. \"Enable endpoint protection\" is explicitly the control where, \"if no EDR solution is enabled, use these recommendations to deploy Microsoft Defender for Endpoint,\" and Defender for Endpoint is delivered through the Defender for Servers plan, which is exactly what \"Microsoft Defender for servers\" supplies.","whyWrong":["Conditional Access policies are an identity sign-in control with no effect on Defender for Cloud's network-access-restriction recommendations for resources.","Azure WAF protects a specific published web application and belongs to a different control category than general network access restriction.","Microsoft Defender for Resource Manager detects suspicious ARM API activity, a different capability from endpoint threat detection. Private endpoints restrict network reachability; they are not what the endpoint protection control specifically measures."],"source":{"title":"Secure score in Microsoft Defender for Cloud (security controls table)","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls"}},"ansimg":[{"img":"img/p166_x2640.webp","w":999,"h":274}],"e":[{"p":"Selection 1: NSG Selection"},{"p":"Selection 2: Microsoft Defender for servers"},{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls"}]},
{"n":211,"sec":"std","num":192,"c":"Design security solutions for infrastructure","q":"What should you configure?","body":[{"p":"Your network contains an Active Directory Domain Services (AD DS) domain."},{"p":"You need to ensure that the built-in administrator account for the domain can be used only for interactive sign- ins to domain controllers."},{"p":"What should you configure?"}],"o":["the Protected Users group","authentication policies","the User Rights Assignment security policy settings","an authentication policy silo"],"a":"C","srcA":"B","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe stem names the built-in Administrator account specifically, and that is what rules out the keyed answer: \"the builtin domain Administrator (S-1-5-<domain>-500) is always exempt from Authentication Policies, even when they are assigned to an Authentication Policy Silo.\" A control the account is documented to ignore cannot be the mechanism that restricts it. Microsoft's own guidance for this exact account instead points to Appendix D's User Rights Assignment approach: modify the Default Domain Controllers GPO to add the domain's Administrator account to Deny access to this computer from the network, Deny log on as a batch job, Deny log on as a service, and Deny log on through Remote Desktop Services. Microsoft states directly what this produces: \"these settings will ensure that the domain's Built-in Administrator account cannot be used to connect to a domain controller [remotely], although the account can log on locally to domain controllers\" - interactive sign-in at the DC console remains available, every remote path does not.","whyWrong":["A. The Protected Users group changes which authentication protocols and ticket lifetimes an account may use; it does not restrict which hosts an account can sign in to, and offers no exemption-free path for this specific account either.","B. Authentication policies are the mechanism the account is expressly excluded from, which is the crux of this correction.","D. An authentication policy silo is a container for accounts governed by authentication policies. Since the built-in Administrator is exempt from those policies, being placed in a silo built on them changes nothing for this account."],"source":{"title":"Guidance about how to configure protected accounts (built-in Administrator exemption)","url":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/how-to-configure-protected-accounts"},"corrected":true,"originalAnswer":"B"}},
{"n":212,"sec":"std","num":193,"c":"Design security solutions for applications and data","q":"You are designing security for a runbook in an Azure Automation account. The runbook will copy data to Azure Data Lake Storage Gen2.","body":[{"p":"You are designing security for a runbook in an Azure Automation account. The runbook will copy data to Azure Data Lake Storage Gen2."},{"p":"You need to recommend a solution to secure the components of the copy process."},{"p":"What should you include in the recommendation for each component? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p167_x2652.webp","w":843,"h":373}],"boxes":[{"label":"Data security","value":"Access keys stored in Azure Key Vault"},{"label":"Network access control","value":"Azure Private Link with network service tags"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Storing the storage account access keys the runbook uses in Azure Key Vault, rather than embedded in the runbook's own code or variables, keeps the actual secret out of the automation asset and lets it be rotated and access-controlled centrally, which is the standard pattern for data security. For network access control on the copy path into Data Lake Storage Gen2, restricting traffic to a private path recognized as coming from the Automation service, using Private Link together with the storage account's network rules, is the mechanism available among the choices here for keeping that path off the open internet.","whyWrong":["The Automation Contributor built-in role governs who may manage the Automation account itself; it says nothing about how the runbook protects a secret or restricts network paths.","Azure WAF rules protect HTTP(S) web applications from web exploits. A runbook writing to a storage backend is not HTTP traffic to a web application, so a WAF has no role here."],"source":{"title":"Azure Automation security guidelines","url":"https://learn.microsoft.com/en-us/azure/automation/automation-security-guidelines"}},"ansimg":[{"img":"img/p168_x2665.webp","w":843,"h":373}],"e":[{"p":"Data Security = Access Keys stored in Azure Key Vault"},{"p":"Network access control = Azure Private Link with network service tags"},{"p":"https://docs.microsoft.com/en-us/azure/automation/automation-security-guidelines#data-security"}]},
{"n":213,"sec":"std","num":194,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"You have a Microsoft 365 subscription that contains 1,000 users and a group named Group1. All the users have Windows 11 devices. The users sign in to their devices by using their Microsoft Entra account. The users do NOT have administrative rights to their devices."},{"p":"The members of Group1 remotely assist the users by taking control of user sessions. The remote control sessions run in the security context of the users they are assisting."},{"p":"You need to recommend a solution that will enable the Group1 members to run apps that require administrative rights to the users ' devices. The solution must ensure that the apps are run in the context of each signed-in standard user."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Intune Endpoint Privilege Management","Windows Local Administrator Password Solution (Windows LAPS)","Cloud Infrastructure Entitlement Management","Privileged Identity Management (PIM) in Microsoft Entra ID"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Endpoint Privilege Management lets standard users run specific approved binaries elevated without ever joining the local Administrators group. The detail the question turns on is the elevation type: EPM normally elevates using an isolated virtual account, but its “Elevate as current user” type “runs the elevated process under the signed-in user's own account” — which is precisely the stated requirement that apps run in the context of each signed-in standard user.","whyWrong":["B. Windows LAPS manages the local administrator account’s password. Using it means signing in as that separate account, not running as the signed-in user.","C. Cloud Infrastructure Entitlement Management (Entra Permissions Management) governs cloud resource permissions across clouds, not Windows elevation.","D. PIM elevates Entra ID directory roles, not processes on a device."],"source":{"title":"Endpoint Privilege Management with Microsoft Intune","url":"https://learn.microsoft.com/en-us/intune/intune-service/protect/epm-overview"}}},
{"n":214,"sec":"std","num":195,"c":"Design security solutions for infrastructure","q":"What should you include in the recommendation?","body":[{"p":"Your company has the virtual machine infrastructure shown in the following table."},{"img":"img/p169_x2677.webp","w":857,"h":142},{"p":"The company plans to use Microsoft Azure Backup Server (MABS) to back up the virtual machines to Azure."},{"p":"You need to provide recommendations to increase the resiliency of the backup strategy to mitigate attacks such as ransomware."},{"p":"What should you include in the recommendation?"}],"o":["Use geo-redundant storage (GRS).","Use customer-managed keys (CMKs) for encryption.","Require PINs to disable backups.","Implement Azure Site Recovery replication."],"a":"C","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"For workloads protected by the MARS agent or Azure Backup Server, the security PIN is the authorization gate on critical operations — disabling backup, deleting backup data, changing a passphrase — so a compromised administrator on the server cannot quietly stop protection before encrypting the estate. That is what “increase the resiliency of the backup strategy” means here: keep the recovery points reachable.","whyWrong":["A. Geo-redundant storage protects against a regional outage, not against someone deleting the backups.","B. Customer-managed keys change key ownership; they neither prevent deletion nor preserve recovery points.","D. Site Recovery replicates workloads for disaster recovery. Replication faithfully copies encrypted data too, so it is not a ransomware control."],"source":{"title":"FAQ — Protect backups from ransomware with Azure Backup","url":"https://learn.microsoft.com/en-us/azure/backup/protect-backups-from-ransomware-faq"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/security/fundamentals/backup-plan-to-protect-against- ransomware#azure-backup"}]},
{"n":215,"sec":"std","num":196,"c":"Design solutions that align with security best practices and priorities","q":"You have an Azure subscription.","body":[{"p":"You have an Azure subscription."},{"p":"You have a subscription to a third-party cloud provider. The subscription contains 100 virtual machines."},{"p":"You manage cloud security for both subscriptions from the Azure subscription."},{"p":"You need to recommend a solution to validate the security posture of the virtual machines."},{"p":"Which two services should you include in the recommendation? Each correct answer presents part of the solution."}],"o":["Microsoft Defender for Cloud","Microsoft Defender for Endpoint","Azure Lighthouse","Microsoft Sentinel","Azure Arc"],"a":"A E","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Third-party cloud VMs have no native path into an Azure-based security posture tool until they become Azure resources, and Azure Arc is what does that: connecting the machines with Azure Arc-enabled servers makes each one \"become an Azure resource\" that then \"appears in Defender for Cloud, like your other Azure resources.\" Once Arc has bridged them in, Defender for Cloud is the service that actually assesses and reports their security posture, which is the validation the requirement asks for.","whyWrong":["B. Defender for Endpoint protects the device at the EDR layer. It does not evaluate configuration posture the way Defender for Cloud does, and it is not what connects a non-Azure VM into Defender for Cloud's assessment.","C. Azure Lighthouse delegates management of resources across a different Microsoft Entra tenant. It has no role in bringing a third-party cloud provider's machines into an Azure security assessment.","D. Sentinel is a SIEM for analyzing security events already being collected; it is not the mechanism that establishes posture assessment for these machines in the first place."],"source":{"title":"Connect on-premises machines to Microsoft Defender for Cloud (Azure Arc)","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-machines"}}},
{"n":216,"sec":"std","num":197,"c":"Design security operations, identity, and compliance capabilities","q":"Your company is preparing for cloud adoption.","body":[{"p":"Your company is preparing for cloud adoption."},{"p":"You are designing security for Azure landing zones."},{"p":"Which two preventative controls can you implement to increase the secure score? Each NOTE: Each correct selection is worth one point."}],"o":["Azure Firewall","Azure Web Application Firewall (WAF)","Microsoft Defender for Cloud alerts","Azure Active Directory (Azure AD Privileged Identity Management (PIM)","Microsoft Sentinel"],"a":"A D","srcA":"D E","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nOnly recommendations from the Microsoft cloud security benchmark, surfaced through Defender for Cloud, count toward secure score at all, and Sentinel sits entirely outside that mechanism: it is a separate SIEM/SOAR product, not a Defender for Cloud plan, so nothing it does can move the score. Azure Firewall, by contrast, is named directly in the score's own control table under \"Restrict unauthorized network access\", the preventative control that covers Azure Firewall, Private Link and network hardening, worth 4 of the available points. Pairing it with PIM, which reduces standing privileged access under the \"Manage access and permissions\" control, gives two genuinely preventative controls that both move the number the question asks about.","whyWrong":["B. A WAF protects a specific published web application. It is a real preventative control, but it is scoped to internet-facing web apps rather than to landing zones generally, which is what the stem describes.","C. Defender for Cloud alerts are detective, not preventative: an alert fires after suspicious activity is already observed, which is the opposite of preventing it.","E. Sentinel is a SIEM outside the secure score's control set entirely. Enabling it changes nothing in the score."],"source":{"title":"Secure score in Microsoft Defender for Cloud (security controls table)","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls"},"corrected":true,"originalAnswer":"D E"},"e":[{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls"}]},
{"n":217,"sec":"std","num":198,"c":"Design security solutions for applications and data","q":"You have an Azure subscription. The subscription contains 20 App Service web apps that provide services to external customers.","body":[{"p":"You have an Azure subscription. The subscription contains 20 App Service web apps that provide services to external customers."},{"p":"Each web app has a unique certificate and key."},{"p":"You need to recommend a solution to manage the keys and certificates of the web apps. The solution must meet the follow requirements:"},{"p":"Provide a single tenancy to store the keys and certificates."},{"p":"Maintain FIPS 140-2 Level 3 compliance."},{"p":"Follow the principle of least privilege."},{"img":"img/p171_x2714.webp","w":684,"h":251}],"ansimg":[{"img":"img/p171_x2703.webp","w":684,"h":251}],"e":[{"img":"img/p171_x2708.webp","w":856,"h":116}]},
{"n":218,"sec":"std","num":199,"c":"Design solutions that align with security best practices and priorities","q":"For a Microsoft cloud environment, you are designing a security architecture based on the Microsoft Cybersecurity Reference Architectures (MCRA). You need to protect against the following external threats of an attack chain:","body":[{"p":"For a Microsoft cloud environment, you are designing a security architecture based on the Microsoft Cybersecurity Reference Architectures (MCRA). You need to protect against the following external threats of an attack chain:"},{"p":"• An attacker attempts to exfiltrate data to external websites."},{"p":"• An attacker attempts lateral movement across domain-joined computers."},{"p":"What should you include in the recommendation for each threat? To answer, select the appropriate options in the answer area."},{"img":"img/p172_x2733.webp","w":1000,"h":230}],"ansimg":[{"img":"img/p172_x2735.webp","w":1000,"h":230}],"e":[{"img":"img/p172_x2727.webp","w":1000,"h":156}]},
{"n":219,"sec":"std","num":200,"c":"Design solutions that align with security best practices and priorities","q":"What should you include in the recommendation?","body":[{"p":"You are designing a new Azure environment based on the security best practices of the Microsoft Cloud Adoption Framework for Azure. The environment will contain one subscription for shared infrastructure components and three separate subscriptions for applications."},{"p":"You need to recommend a deployment solution that includes network security groups (NSGs) Azure Key Vault, and Azure Bastion. The solution must minimize deployment effort and follow security best practices of the Microsoft Cloud Adoption Framework for Azure."},{"p":"What should you include in the recommendation?"}],"o":["the Azure landing zone accelerator","the Azure Will-Architected Framework","Azure Security Benchmark v3","Azure Advisor"],"a":"A","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Deploying network security groups, Key Vault and Bastion consistently across four subscriptions by hand is exactly the repeated, error-prone work the landing zone accelerators exist to remove. Microsoft describes them as infrastructure-as-code templates that \"deploy Azure environments based on recommended practices\" and give \"the fastest path to deployment that aligns with Microsoft's recommended practices\", covering the shared platform components as well as the per-application landing zone resources in one consistent, repeatable deployment.","whyWrong":["B. The Well-Architected Framework is guidance and a review methodology, not something you deploy; it does not itself provision NSGs, Key Vault or Bastion.","C. Azure Security Benchmark v3 is a set of security recommendations assessed after resources exist. It is not a deployment mechanism.","D. Azure Advisor analyzes already-deployed resources and suggests improvements. It has no role in the initial deployment."],"source":{"title":"Landing zone accelerator - Cloud Adoption Framework","url":"https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/app-platform/app-services/landing-zone-accelerator"}}},

{"n":222,"sec":"std","num":203,"c":"Design security operations, identity, and compliance capabilities","q":"What should you do first?","body":[{"p":"Your company has an Azure subscription that has enhanced security enabled for Microsoft Defender for Cloud."},{"p":"The company signs a contract with the United States government."},{"p":"You need to review the current subscription for NIST 800-53 compliance."},{"p":"What should you do first?"}],"o":["From Defender for Cloud, review the secure score recommendations.","From Microsoft Sentinel, configure the Microsoft Defender for Cloud data connector.","From Defender for Cloud, review the Azure security baseline for audit report.","From Defender for Cloud, add a regulatory compliance standard."],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Adding the regulatory compliance standard in Defender for Cloud is the first step: the standard has to be assigned to the scope before Defender for Cloud will assess the subscription against it or show anything on the regulatory compliance dashboard. Compare this with Standalone 85, which asks the same thing with 'turn on a security standard' as the wording.","whyWrong":["A. Secure score reflects the Microsoft Cloud Security Benchmark, not NIST SP 800-53.","B. A Sentinel data connector moves alerts into a SIEM; it does not assess compliance.","C. The Azure security baseline audit report is a different artefact and is not how a regulatory standard is assessed."],"source":{"title":"Assign regulatory compliance standards in Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages#what- regulatory-compli ance-standards-are-available-in-defender-for-cloud"}]},
{"n":223,"sec":"std","num":204,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription that is protected by using Microsoft 365 Defender","body":[{"p":"You have a Microsoft 365 subscription that is protected by using Microsoft 365 Defender"},{"p":"You are designing a security operations strategy that will use Microsoft Sentinel to monitor events from Microsoft 365 and Microsoft 365 Defender"},{"p":"You need to recommend a solution to meet the following requirements:"},{"p":"• Integrate Microsoft Sentinel with a third-party security vendor to access information about known malware"},{"p":"• Automatically generate incidents when the IP address of a command-and control server is detected in the"},{"p":"events"},{"p":"What should you configure in Microsoft Sentinel to meet each requirement? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p176_x2801.webp","w":1000,"h":317}],"ansimg":[{"img":"img/p176_x2807.webp","w":1000,"h":317}],"e":[{"img":"img/p177_x2827.webp","w":993,"h":160}]},

{"n":225,"sec":"std","num":206,"c":"Design security solutions for applications and data","q":"Your company has an Azure App Service plan that is used to deploy containerized web apps. You are designing a secure DevOps strategy for deploying the web apps to the App Service plan. You need to recommend a strategy to integrate code scanning tools into a secure software development lifecycle. The code must be scanned during the following two phases:","body":[{"p":"Your company has an Azure App Service plan that is used to deploy containerized web apps. You are designing a secure DevOps strategy for deploying the web apps to the App Service plan. You need to recommend a strategy to integrate code scanning tools into a secure software development lifecycle. The code must be scanned during the following two phases:"},{"p":"Uploading the code to repositories Building containers"},{"p":"Where should you integrate code scanning for each phase? To answer, select the appropriate options in the answer area."},{"img":"img/p178_x2855.webp","w":1000,"h":228}],"ansimg":[{"img":"img/p178_x2857.webp","w":1000,"h":228}],"e":[{"img":"img/p178_x2849.webp","w":615,"h":95},{"p":"https://docs.github.com/en/enterprise-cloud@latest/get-started/learning-about-github/about-github-advanced- security"},{"p":"https://microsoft.github.io/code-with-engineering-playbook/automated-testing/tech-specific-samples/azdo- container-d e v-test-release/"}]},
{"n":226,"sec":"std","num":207,"c":"Design security solutions for applications and data","q":"You are designing an auditing solution for Azure landing zones that will contain the following components:","body":[{"p":"You are designing an auditing solution for Azure landing zones that will contain the following components:"},{"p":"• SQL audit logs for Azure SQL databases"},{"p":"• Windows Security logs from Azure virtual machines"},{"p":"• Azure App Service audit logs from App Service web apps"},{"p":"You need to recommend a centralized logging solution for the landing zones. The solution must meet the following requirements:"},{"p":"• Log all privileged access."},{"p":"• Retain logs for at least 365 days."},{"p":"• Minimize costs."},{"p":"What should you include in the recommendation? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p179_x2869.webp","w":1000,"h":457}],"ansimg":[{"img":"img/p180_x2879.webp","w":1000,"h":457}]},
{"n":227,"sec":"std","num":208,"c":"Design security solutions for infrastructure","q":"You need to design a solution to provide administrators with secure remote access to the virtual machines. The solution must meet the following requirements:","body":[{"p":"You need to design a solution to provide administrators with secure remote access to the virtual machines. The solution must meet the following requirements:"},{"p":"• Prevent the need to enable ports 3389 and 22 from the internet."},{"p":"• Only provide permission to connect the virtual machines when required."},{"p":"• Ensure that administrators use the Azure portal to connect to the virtual machines."},{"p":"Which two actions should you include in the solution? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point."}],"o":["Enable Azure Active Directory (Azure AD) Privileged Identity Management (PIM) roles as virtual machine contributors.","Configure Azure VPN Gateway.","Enable Just Enough Administration (JEA).","Enable just-in-time (JIT) VM access.","Configure Azure Bastion."],"a":"D E","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The three requirements map onto one pairing. Just-in-time VM access keeps RDP and SSH closed by default in the network security group and opens them only for an approved request, for a limited window, which is what \"only provide permission to connect… when required\" means and what removes the need to leave 3389 and 22 open to the internet at all. Azure Bastion is the piece that makes the connection happen \"by using the Azure portal\": it is a browser-based, TLS-tunnelled RDP/SSH client built into the portal, with no public IP needed on the target VM and no client software to install.","whyWrong":["A. PIM as VM Contributor grants standing role eligibility. It manages who may act, not when a network port is open or how the connection is made.","B. A VPN Gateway gives broad network-level reachability into the virtual network, the opposite of a narrowly scoped, portal-based connection, and does nothing to gate when 3389/22 are reachable.","C. Just Enough Administration scopes PowerShell remoting to specific cmdlets for specific roles. It has no bearing on RDP/SSH port exposure or portal-based connections."],"source":{"title":"Just-in-time machine access in Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/powershell/scripting/learn/remoting/jea/overview?view=powershell-7.2 https://docs.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-usagehttps://docs.microsoft. com/en-us/azure/role-based-access-contro l/built-in-roles"}]},
{"n":228,"sec":"std","num":209,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"Your on-premises network contains an e-commerce web app that was developed in Angular and Node.js. The web app uses a MongoDB database. You plan to migrate the web app to Azure. The solution architecture team proposes the following architecture as an Azure landing zone."},{"img":"img/p181_x2891.webp","w":1000,"h":163},{"p":"You need to provide recommendations to secure the connection between the web app and the database. The solution must follow the Zero Trust model."},{"p":"Solution: You recommend implementing Azure Front Door with Azure Web Application Firewall (WAF)."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"No, for the same reason as Standalone 188: Front Door with WAF is an inbound edge control for user traffic to the web app, not a control on the app-to-database connection. Worth noticing how this family is built. Three of its four solutions name genuinely good security products, and all three are wrong because they act somewhere else in the architecture. Read the sentence that states the requirement, not the product names.","whyWrong":["A. Yes protects the wrong leg of the architecture."],"source":{"title":"What is Azure Private Link?","url":"https://learn.microsoft.com/en-us/azure/private-link/private-link-overview"}},"e":[{"p":"https://www.varonis.com/blog/securing-access-azure-webapps"}]},
{"n":229,"sec":"std","num":210,"c":"Design security operations, identity, and compliance capabilities","q":"You have three Microsoft Entra tenants named Tenant 1. Tenant2. and Tenant3.","body":[{"p":"You have three Microsoft Entra tenants named Tenant 1. Tenant2. and Tenant3."},{"p":"You have three Azure subscriptions named Sub1, Sub2, and Sub3. Each tenant is associated with multiple Azure subscriptions."},{"p":"Each subscription contains a single Microsoft Sentinel workspace as shown in the following table."},{"img":"img/p181_x2897.webp","w":253,"h":74},{"p":"You need to recommend a solution that meets the following requirements:"},{"p":"• Ensures that the users in Tenant1 can manage the resources in Sub2 and Sub3 without having to switch"},{"p":"subscriptions or sign in to a different tenant"},{"p":"• Implements multiple workspace view for Sentinel2 and Sentinel3"},{"p":"What should you use to delegate permissions, and which Microsoft Sentinel feature will users be able to manage in multiple workspace view? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p182_x2919.webp","w":631,"h":192}],"ansimg":[{"img":"img/p182_x2921.webp","w":631,"h":192}],"e":[{"img":"img/p182_x2913.webp","w":618,"h":98}]},
{"n":230,"sec":"std","num":211,"c":"Design security operations, identity, and compliance capabilities","q":"The solution must follow the principle of least privilege. Which role should you assign to the team leaders?","body":[{"p":"You have a Microsoft Entra tenant that uses Microsoft Entra ID Governance."},{"p":"For each department in your company, you create a dedicated catalog and access packages to manage access to applications and data resources."},{"p":"You need to ensure that team leaders in each department can perform the following actions:"},{"p":"• Add or remove access package assignments for the users in their department"},{"p":"• Prevent the access packages from appearing in each user ' s My Access portal."},{"p":"The solution must follow the principle of least privilege. Which role should you assign to the team leaders?"}],"o":["Identity Governance Administrator","Catalog Owner","Access Package Assignment Manager","Access Package Manager"],"a":"D","srcA":"C","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe second requirement is what decides this, and it is easy to read past. Keeping an access package out of My Access is the Hidden setting: set to Yes, the access package is not listed in the user's My Access portal. Microsoft's delegation table maps both requirements onto roles precisely. Directly assign and directly remove an identity are permitted to the Access package assignment manager, but Hide an access package is not; that row is granted only to the Identity Governance Administrator, the Catalog owner and the Access package manager. So the assignment manager satisfies the first bullet and fails the second. The least privileged role that satisfies both is Access package manager, which Microsoft describes as able to create new access packages from existing resources in the catalog, and edit and manage all existing access packages within the catalog.","whyWrong":["A. Identity Governance Administrator can do all of this, but tenant-wide across every catalog, which is more privilege than a department team leader needs.","B. Catalog owner also covers both actions, but adds the ability to add and remove resources and to delegate the catalog itself. Still more than required.","C. Access package assignment manager is the tempting least-privilege answer and covers the first bullet only. It cannot change the Hidden setting."],"source":{"title":"Delegation and roles in entitlement management","url":"https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-delegate"},"corrected":true,"originalAnswer":"C"}},
{"n":231,"sec":"std","num":212,"c":"Design security operations, identity, and compliance capabilities","q":"You are designing the security architecture for a cloud-only environment.","body":[{"p":"You are designing the security architecture for a cloud-only environment."},{"p":"You are reviewing the integration point between Microsoft 365 Defender and other Microsoft cloud services based on Microsoft Cybersecurity Reference Architectures (MCRA)."},{"p":"You need to recommend which Microsoft cloud services integrate directly with Microsoft 365 Defender and meet the following requirements:"},{"p":"• Enforce data loss prevention (DLP) policies that can be managed directly from the Microsoft 365 Defender"},{"p":"portal."},{"p":"• Detect and respond to security threats based on User and Entity Behavior Analytics (UEBA) with unified"},{"p":"alerting."},{"p":"What should you include in the recommendation for each requirement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p184_x2946.webp","w":1000,"h":226}],"ansimg":[{"img":"img/p184_x2952.webp","w":1000,"h":226}],"e":[{"img":"img/p184_x2940.webp","w":1000,"h":123}]},
{"n":232,"sec":"std","num":213,"c":"Design solutions that align with security best practices and priorities","q":"What should you include in the recommendations?","body":[{"p":"You are designing a ransomware response plan that follows Microsoft Security Best Practices-"},{"p":"You need to recommend a solution to limit the scope of damage of ransomware attacks without being locked out."},{"p":"What should you include in the recommendations?"}],"o":["Privileged Access Workstations (PAWs)","emergency access accounts","device compliance policies","Customer Lockbox for Microsoft Azure"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"\"Limit the scope of damage… without being locked out\" is almost a direct paraphrase of the benchmark's emergency access control: \"set up emergency access to ensure that you are not accidentally locked out of your critical cloud infrastructure… in an emergency\", using break-glass accounts reserved for exactly the scenario where normal administrative accounts have been compromised or disabled by an attacker. It is the safety net that lets an organization respond to and recover from a ransomware attack on its identity plane without permanently losing the ability to administer the tenant.","whyWrong":["A. Privileged access workstations reduce the chance of compromise; they are a prevention control, not the answer to being locked out once an incident is under way.","C. Device compliance policies gate access by device health. They neither limit blast radius during an active incident nor provide a way back in if administrators are locked out.","D. Customer Lockbox governs Microsoft support's access to customer data. It has no role in an organization's own ransomware recovery access."],"source":{"title":"Microsoft cloud security benchmark - Privileged Access (PA-5 emergency access)","url":"https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-privileged-access"}}},
{"n":233,"sec":"std","num":214,"c":"Design security operations, identity, and compliance capabilities","q":"Which identity service should you include in the recommendation?","body":[{"p":"You have an on-premises network that has several legacy applications. The applications perform LDAP queries against an existing directory service. You are migrating the on-premises infrastructure to a cloud-only infrastructure."},{"p":"You need to recommend an identity solution for the infrastructure that supports the legacy applications. The solution must minimize the administrative effort to maintain the infrastructure."},{"p":"Which identity service should you include in the recommendation?"}],"o":["Azure Active Directory Domain Services (Azure AD DS)","Azure Active Directory (Azure AD) B2C","Azure Active Directory (Azure AD)","Active Directory Domain Services (AD DS)"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Legacy applications issuing LDAP queries need a directory that speaks LDAP. Microsoft Entra Domain Services (formerly Azure AD DS) provides managed domain services — domain join, Group Policy, LDAP, and Kerberos/NTLM — without you deploying or patching domain controllers, which is also what satisfies 'minimize the administrative effort'. Microsoft names this exact scenario: cloud-only organisations with third-party apps that still require LDAP.","whyWrong":["B. Azure AD B2C is a customer identity service for consumer sign-in.","C. Azure AD (Microsoft Entra ID) is not an LDAP directory — it speaks OIDC, OAuth and SAML.","D. Running AD DS yourself on Azure VMs works but means deploying, patching and monitoring domain controllers, which is the administrative effort the question tells you to minimise."],"source":{"title":"Overview of Microsoft Entra Domain Services","url":"https://learn.microsoft.com/en-us/entra/identity/domain-services/overview"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/active-directory-domain-services/overview"}]},
{"n":234,"sec":"std","num":215,"c":"Design security operations, identity, and compliance capabilities","q":"Which identity service should you include in the recommendation?","body":[{"p":"You have an on-premises network that has several legacy applications. The applications perform LDAP queries against an existing directory service."},{"p":"You are migrating the on-premises infrastructure to a cloud-only infrastructure."},{"p":"You need to recommend an identity solution for the infrastructure that supports the legacy applications. The solution must minimize the administrative effort to maintain the infrastructure."},{"p":"Which identity service should you include in the recommendation?"}],"o":["Active Directory Domain Services (AD DS)","Microsoft Entra ID","Microsoft Entra Domain Services","Microsoft Entra External ID"],"a":"C","srcA":"B","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThis is word-for-word the same scenario as Standalone 214, which the source keys to Azure AD DS — so the source contradicts itself, and the Microsoft Entra ID key here is the wrong half of that contradiction. Microsoft Entra ID does not answer LDAP; it is a modern-protocol identity provider. Microsoft Entra Domain Services is the managed domain that provides LDAP, Kerberos/NTLM, Group Policy and domain join for legacy applications that cannot be modernised.","whyWrong":["A. AD DS on your own servers would work but is the maximum administrative effort, which the question rules out.","B. Microsoft Entra ID speaks OIDC, OAuth and SAML. Legacy LDAP binds and reads are not supported against it.","D. Microsoft Entra External ID is for external and customer identities."],"source":{"title":"Overview of Microsoft Entra Domain Services","url":"https://learn.microsoft.com/en-us/entra/identity/domain-services/overview"},"corrected":true,"originalAnswer":"B"}},
{"n":235,"sec":"std","num":216,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"Your company has a hybrid cloud infrastructure that contains an on-premises Active Directory Domain Services (AD DS) forest, a Microsoft B65 subscription, and an Azure subscription."},{"p":"The company ' s on-premises network contains internal web apps that use Kerberos authentication. Currently, the web apps are accessible only from the network."},{"p":"You have remote users who have personal devices that run Windows 11."},{"p":"You need to recommend a solution to provide the remote users with the ability to access the web apps. The solution must meet the following requirements:"},{"p":"• Prevent the remote users from accessing any other resources on the network."},{"p":"• Support Azure Active Directory (Azure AD) Conditional Access."},{"p":"• Simplify the end-user experience."},{"p":"What should you include in the recommendation?"}],"o":["Azure AD Application Proxy","Azure Virtual WAN","Microsoft Tunnel","web content filtering in Microsoft Defender for Endpoint"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Application Proxy is built for exactly this: an internal, Kerberos-authenticated web app reached remotely, with no VPN client, full Conditional Access, and access to that app only, nothing else on the network. A connector inside the corporate network makes the outbound connection and performs Kerberos constrained delegation to the app, so remote users on unmanaged personal devices reach the published application through the proxy service without ever gaining a route onto the internal network, and every request passes through Entra ID sign-in first, where Conditional Access applies.","whyWrong":["B. Azure Virtual WAN is a networking backbone service for connecting sites and virtual networks; it is not a per-application publishing or access-control layer for remote users.","C. Microsoft Tunnel is a full VPN gateway. Even configured as a per-app VPN, it still requires deploying a Linux VPN server, ExpressRoute if hosted in the cloud, and a VPN client experience for users, which is more moving parts and a less simplified end-user experience than Application Proxy's connector model.","D. Web content filtering in Defender for Endpoint controls which sites a managed device may browse to. It has no mechanism for publishing an internal app to remote users at all."],"source":{"title":"Network topology considerations for Microsoft Entra application proxy","url":"https://learn.microsoft.com/en-us/entra/identity/app-proxy/application-proxy-network-topology"}},"e":[{"p":"https://docs.microsoft.com/en-us/learn/modules/configure-azure-ad-application-proxy/2-explore"}]},
{"n":236,"sec":"std","num":217,"c":"Design security operations, identity, and compliance capabilities","q":"The company signs a contract with the United States government. You need to review the current subscription for NIST 800-53 compliance. What should you do first?","body":[{"p":"Your company has an Azure subscription that has enhanced security enabled for Microsoft Defender for Cloud."},{"p":"The company signs a contract with the United States government. You need to review the current subscription for NIST 800-53 compliance. What should you do first?"}],"o":["From Defender for Cloud, review the Azure security baseline for audit report.","From Defender for Cloud, review the secure score recommendations.","From Azure Policy, assign a built-in initiative that has a scope of the subscription.","From Defender for Cloud, enable Defender for Cloud plans."],"a":"D","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged: the key is left as the source has it, but it looks wrong and the documentation does not settle the wording. This is the same NIST SP 800-53 scenario as Standalone 85 and 203, except the option 'add a regulatory compliance standard' is missing from the list. The stem already states the subscription has enhanced security enabled, which means the Defender plans in the keyed answer (D) are on — so it cannot be what you do first. Assigning the built-in initiative from Azure Policy (C) is the only remaining action that produces a NIST assessment, and regulatory standards are implemented as Azure Policy initiatives. Treat C as the more defensible answer and verify before relying on this item.","source":{"title":"Assign regulatory compliance standards in Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages#what- regulatory-comp liance-standards-are-available-in-defender-for-cloud"}]},
{"n":237,"sec":"std","num":218,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"Your on-premises network contains an e-commerce web app that was developed in Angular and Nodejs. The web app uses a MongoDB database. You plan to migrate the web app to Azure. The solution architecture team proposes the following architecture as an Azure landing zone."},{"img":"img/p187_x2984.webp","w":1000,"h":174},{"p":"You need to provide recommendations to secure the connection between the web app and the database. The solution must follow the Zero Trust model."},{"p":"Solution: You recommend creating private endpoints for the web app and the database layer."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Yes, and it is the only solution in this family that touches the connection the question asks about. A private endpoint gives the database a private IP inside your virtual network, so the web app reaches it over the Microsoft backbone and the database's public endpoint can be switched off entirely. Microsoft frames Private Link exactly this way: traffic between your virtual network and the service travels the Microsoft backbone, eliminating exposure to the public internet. Removing the public path is the Zero Trust move here.","whyWrong":["B. No would require some other mechanism in the family to secure the app-to-database link, and none of the others do."],"source":{"title":"What is Azure Private Link?","url":"https://learn.microsoft.com/en-us/azure/private-link/private-link-overview"}},"e":[{"p":"When using Azure-provided PaaS services (e.g., Azure Storage, Azure Cosmos DB, or Azure Web App, use the PrivateLink connectivity option to ensure all data exchanges are over the private IP space and the traffic never leaves the Microsoft network."},{"p":"https://docs.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints"}]},
{"n":238,"sec":"std","num":219,"c":"Design security solutions for applications and data","q":"You are creating the security recommendations for an Azure App Service web app named App1.","body":[{"p":"You are creating the security recommendations for an Azure App Service web app named App1."},{"p":"App1 has the following specifications:"},{"p":"• Users will request access to App1 through the My Apps portal. A human resources manager will approve the"},{"p":"requests."},{"p":"• Users will authenticate by using Azure Active Directory (Azure AD) user accounts."},{"p":"You need to recommend an access security architecture for App1."},{"p":"What should you include in the recommendation? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p188_x3000.webp","w":624,"h":160}],"boxes":[{"label":"Box 1","value":"Azure AD Application"},{"label":"Box 2","value":"Access Package in Identity Governance"}],"keynote":"The dump records this answer as a picture, shown above. The values below come from a text export of the same dump, which spelled them out. No list of alternatives survives anywhere, so each drop-down offers this item’s own values — match each one to its box.","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Enabling Entra ID authentication for App1 in the first place means registering it as an application in Entra ID, the standard app-registration/enterprise-application object that lets users authenticate with their Entra credentials, which is what \"Azure AD application\" refers to here. The access request workflow described, users request through the My Apps portal and an HR manager approves, is entitlement management's core scenario: an access package with a request-and-approval policy is exactly this self-service-with-approval pattern, configured once and requiring no custom development.","whyWrong":["Application Proxy and Application Gateway both publish and route to on-premises or internal apps; App1 is an Azure App Service web app that needs Entra sign-in enabled directly, not on-premises publishing.","A managed identity authenticates a resource to other Azure services; it is not how end users sign in to a web app. Microsoft Defender for App is not a Microsoft product name.","An access policy or an OAuth app policy in Defender for Cloud Apps govern session behavior and third-party app consent respectively; neither implements a request-and-approval workflow. An access review recertifies existing access periodically; it does not process the initial request."],"source":{"title":"Configure OIDC SSO for gallery and custom applications","url":"https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/add-application-portal-setup-oidc-sso"}},"ansimg":[{"img":"img/p188_x3002.webp","w":624,"h":160}],"e":[{"p":"Box 1 is the Azure AD Application https://docs.microsoft.com/en-u s/azure/active-directory/develop /quickstart-register-app"},{"p":"Box 2 is Access Package in Identity Governance"},{"p":"https://docs.microsoft.com/en-us/azure/active-directory/governance/entitlement-management-access-package- create"}]},
{"n":239,"sec":"std","num":220,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription that contains a Microsoft SharePoint Online site named Site1.","body":[{"p":"You have a Microsoft 365 subscription that contains a Microsoft SharePoint Online site named Site1."},{"p":"You have a Conditional Access policy named Policy1 that only allows workload identities from trusted locations to access SharePoint Online."},{"p":"You plan to move all business-sensitive information to Site1."},{"p":"You need to ensure that Policy1 applies to Site1 only."},{"p":"Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order."},{"p":"NOTE: More than one order of answer choices is correct. You will receive credit for any of the correct orders you select."},{"img":"img/p189_x3020.webp","w":1000,"h":264}],"ansimg":[{"img":"img/p189_x3022.webp","w":1000,"h":264}],"e":[{"img":"img/p189_x3014.webp","w":983,"h":224}]},
{"n":240,"sec":"std","num":221,"c":"Design solutions that align with security best practices and priorities","q":"You use Azure Pipelines with Azure Repos to implement continuous integration and continuous deployment (O/CD) workflows for the deployment of applications to Azure. You need to recommend what to include in dynamic application security testing (DAST) based on the principles of the Microsoft Cloud Adoption Framework for Azure. What should you recommend?","body":[{"p":"You use Azure Pipelines with Azure Repos to implement continuous integration and continuous deployment (O/CD) workflows for the deployment of applications to Azure. You need to recommend what to include in dynamic application security testing (DAST) based on the principles of the Microsoft Cloud Adoption Framework for Azure. What should you recommend?"}],"o":["unit testing","penetration testing","dependency testing","threat modeling"],"a":"C","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Microsoft's own account of DAST folds penetration testing directly into it: perform DAST \"preferably with the assistance of a security professional (a penetration tester or vulnerability assessor)\", and CAF's DevSecOps guidance for the release phase likewise pairs the two, describing automated penetration testing with manual assisted validation as part of dynamic testing in the CI/CD pipeline. Of the four options, penetration testing is the only one that operates the same way DAST does, against a running, deployed instance of the application, which is why it is the one folded into the same pipeline stage.","whyWrong":["A. Unit testing runs against code, typically before the application is even built into a deployable artifact, which is earlier and unrelated to DAST’s runtime scope.","C. Dependency testing (SCA) inspects the declared package graph for known-vulnerable versions. It requires no running application and belongs with SAST-adjacent static checks.","D. Threat modeling is a design-phase activity, conducted before code exists to run at all, and is the answer to Standalone 19, not this one."],"source":{"title":"Develop secure applications on Azure (SDL implementation/verification, DAST/SAST)","url":"https://learn.microsoft.com/en-us/azure/security/develop/secure-develop"}}},
{"n":241,"sec":"std","num":222,"c":"Design security solutions for infrastructure","q":"Your company has a Microsoft 365 E5 subscription.","body":[{"p":"Your company has a Microsoft 365 E5 subscription."},{"p":"The company plans to deploy 45 mobile self-service kiosks that will run Windows 10. You need to provide recommendations to secure the kiosks. The solution must meet the following requirements:"},{"p":"• Ensure that only authorized applications can run on the kiosks."},{"p":"• Regularly harden the kiosks against new threats."},{"p":"Which two actions should you include in the recommendations? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point."}],"o":["Onboard the kiosks to Azure Monitor.","Implement Privileged Access Workstation (PAW) for the kiosks.","Implement Automated Investigation and Remediation (AIR) in Microsoft Defender for Endpoint.","Implement threat and vulnerability management in Microsoft Defender for Endpoint.","Onboard the kiosks to Microsoft Intune and Microsoft Defender for Endpoint."],"a":"D E","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Both requirements need the devices under Microsoft's endpoint stack before anything else can happen, and threat and vulnerability management is what keeps them hardened afterward. Onboarding the kiosks to Intune and Defender for Endpoint is the prerequisite step: Intune is what lets you apply an application control policy restricting the kiosks to only authorized executables, and Defender for Endpoint onboarding is what turns on the endpoint security stack, including TVM, in the first place. TVM then continuously surfaces new misconfigurations and missing updates across the fleet, which is the \"regularly harden against new threats\" half of the requirement, ongoing rather than one-time.","whyWrong":["A. Azure Monitor collects telemetry and metrics. It neither restricts what runs on a device nor recommends hardening changes.","B. A Privileged Access Workstation is a hardened admin endpoint for people performing sensitive administrative tasks. A public self-service kiosk running as a fixed, locked-down front-end is a different problem, restricting untrusted end users, not protecting a privileged operator.","C. Automated investigation and response triages and remediates alerts after a threat is detected. It does not restrict which applications may run or surface hardening recommendations."],"source":{"title":"Microsoft Defender Vulnerability Management overview","url":"https://learn.microsoft.com/en-us/defender-vulnerability-management/defender-vulnerability-management"}},"e":[{"p":"( https://docs.microsoft.com/en-us/microsoft-365/security/defender-vulnerability-management/defende r- vulnerability-management?view=o365-worldwide )"}]},
{"n":242,"sec":"std","num":223,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"Your company has a Microsoft 365 E5 subscription."},{"p":"The company wants to identify and classify data in Microsoft Teams, SharePoint Online, and Exchange Online."},{"p":"You need to recommend a solution to identify documents that contain sensitive information."},{"p":"What should you include in the recommendation?"}],"o":["data classification content explorer","data loss prevention (DLP)","eDiscovery","Information Governance"],"a":"A","srcA":"B","review":{"status":"CORRECTED","confidence":"HIGH","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe requirement is to identify documents that contain sensitive information, and content explorer is the tool that answers it. Microsoft describes it as showing a current snapshot of the items that have a sensitivity label, a retention label, or are classified as a sensitive information type in your organization, and you can drill into Exchange, SharePoint, OneDrive and Teams locations, which is the exact scope in the stem. DLP is a preventive control: it acts when someone tries to share or move content that matches a sensitive information type. It protects, it does not inventory. Read the verb in these questions. Identify or discover points at content explorer and the data classification pages; prevent, block or restrict points at DLP.","whyWrong":["B. DLP enforces policy on sensitive content in motion. It is the answer when the requirement is to stop something, as in Standalone 224.","C. eDiscovery searches and preserves content for a legal matter or investigation. It is case-driven, not a standing inventory of sensitive data.","D. Information governance (now data lifecycle management) is about retention and disposal, not classification discovery."],"source":{"title":"Get started with content explorer","url":"https://learn.microsoft.com/en-us/purview/data-classification-content-explorer"},"corrected":true,"originalAnswer":"B"}},
{"n":243,"sec":"std","num":224,"c":"Design security operations, identity, and compliance capabilities","q":"To which location should you apply the DLP policy?","body":[{"p":"You have a Microsoft 365 tenant that uses Microsoft SharePoint Online and Microsoft Purview. Microsoft Purview has a sensitivity label named Label1 that is applied to the files stored on SharePoint Online sites."},{"p":"You need to recommend a Microsoft Purview Data Loss Prevention (DLP) policy that meets the following requirements:"},{"p":"• Prevents users from uploading the files to third-party external websites"},{"p":"• Allows users to upload the files to Microsoft OneDrive for Business"},{"p":"To which location should you apply the DLP policy?"}],"o":["Devices","OneDrive accounts","SharePoint sites","Microsoft Defender for Cloud Apps"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"The action to be blocked, uploading a file to a website, happens in a browser on the device, so the policy has to reach the device. That is the Devices location, which is endpoint DLP. Its Upload to a restricted cloud service domain or access from an unallowed browser activity works from a list of service domains: allow the Microsoft OneDrive domains and block the rest, and you get exactly the pair of requirements in the stem. Applying the policy to the SharePoint location would govern the file while it sits in SharePoint, which is not where the leak happens.","whyWrong":["B. The OneDrive accounts location governs content in OneDrive itself; it does not control uploads to third-party sites.","C. The SharePoint sites location governs sharing from SharePoint. Once the file is on the endpoint, that policy no longer applies.","D. Defender for Cloud Apps can block uploads to unsanctioned cloud apps through a session policy, but the question asks which DLP location to use, and browser upload control is the Devices location."],"source":{"title":"Learn about Endpoint data loss prevention","url":"https://learn.microsoft.com/en-us/purview/endpoint-dlp-learn-about"}}},
{"n":244,"sec":"std","num":225,"c":"Design security operations, identity, and compliance capabilities","q":"You have a Microsoft 365 subscription","body":[{"p":"You have a Microsoft 365 subscription"},{"p":"You need to recommend a security solution to monitor the following activities:"},{"p":"• User accounts that were potentially compromised"},{"p":"• Users performing bulk file downloads from Microsoft SharePoint Online"},{"p":"What should you include in the recommendation for each activity? To answer, drag the appropriate components to the correct activities. Each component may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content."},{"p":"NOTE: Each Correct selection is worth one Point."},{"img":"img/p192_x3060.webp","w":1000,"h":196}],"ansimg":[{"img":"img/p192_x3062.webp","w":1000,"h":196}],"e":[{"img":"img/p192_x3054.webp","w":989,"h":232},{"p":"https://docs.microsoft.com/en-us/azure/active-directory/identity-protection/concept-identity-protection-risks"},{"p":"https://docs.microsoft.com/en-us/defender-cloud-apps/policies-threat-protection#detect-mass-download-data- exfiltration"},{"p":"https://docs.microsoft.com/en-us/microsoft-365/security/defender/investigate-users"}]},
{"n":245,"sec":"std","num":226,"c":"Design security solutions for applications and data","q":"Your company plans to follow DevSecOps best practices of the Microsoft Cloud Adoption Framework for Azure to integrate DevSecOps processes into continuous integration and continuous deployment (Cl/CD) DevOps pipelines","body":[{"p":"Your company plans to follow DevSecOps best practices of the Microsoft Cloud Adoption Framework for Azure to integrate DevSecOps processes into continuous integration and continuous deployment (Cl/CD) DevOps pipelines"},{"p":"You need to recommend which security-related tasks to integrate into each stage of the DevOps pipelines."},{"p":"What should recommend? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p193_x3080.webp","w":888,"h":295}],"ansimg":[{"img":"img/p193_x3086.webp","w":888,"h":295}],"e":[{"img":"img/p193_x3074.webp","w":915,"h":141}]},
{"n":246,"sec":"std","num":227,"c":"Design security solutions for infrastructure","q":"You plan to deploy Azure Kubernetes Service (AKS) clusters that will be used to host web services. You need to recommend an ingress controller solution that will protect the hosted web services. What should you include in the recommendation?","body":[{"p":"You have an Azure subscription."},{"p":"You plan to deploy Azure Kubernetes Service (AKS) clusters that will be used to host web services. You need to recommend an ingress controller solution that will protect the hosted web services. What should you include in the recommendation?"}],"o":["Azure Load Balancer","Azure Front Door","Azure Firewall","Azure Application Gateway"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Only one option here is an ingress controller. Application Gateway Ingress Controller runs in the AKS cluster, watches Kubernetes ingress resources and configures an Application Gateway in front of them, and because that gateway can carry a WAF policy the hosted services get OWASP rule inspection, TLS termination and path-based routing from one component.","whyWrong":["A. Load Balancer is layer 4. It distributes connections and inspects nothing.","B. Front Door is a global edge service, not a cluster ingress controller. It can sit in front of an ingress, but it is not one.","C. Azure Firewall filters network traffic; it does not terminate and route HTTP ingress for Kubernetes services."],"source":{"title":"What is Application Gateway Ingress Controller?","url":"https://learn.microsoft.com/en-us/azure/application-gateway/ingress-controller-overview"}}},
{"n":247,"sec":"std","num":228,"c":"Design security solutions for infrastructure","q":"You have an Azure subscription that contains a virtual network named VNet1. VNet1 contains a 10-node virtual machine scale set that hosts a web search app named App1. Customers access App1 from the internet. The nodes establish outbound HTTP and HTTPS connections to the internet.","body":[{"p":"You have an Azure subscription that contains a virtual network named VNet1. VNet1 contains a 10-node virtual machine scale set that hosts a web search app named App1. Customers access App1 from the internet. The nodes establish outbound HTTP and HTTPS connections to the internet."},{"p":"You need to recommend a network security solution for App1. The solution must meet the following requirements:"},{"p":"• Inbound connections to App1 that contain security threats specified in the Core Rule. Set (CRS) from the"},{"p":"Open Web Application Security Project (OWASP) must be blocked."},{"p":"• Outbound HTTP and HTTPS connections from the virtual machine scale set that contain security threats"},{"p":"identified by the Microsoft Defender Threat Intelligence (Defender Tl) feed must be blocked."},{"p":"What should you include in the recommendation? To answer, select the options in the answer area,"},{"p":"NOTE: Each correct answer is worth one point."},{"img":"img/p194_x3098.webp","w":811,"h":297}],"ansimg":[{"img":"img/p195_x3111.webp","w":811,"h":297}],"e":[{"img":"img/p195_x3116.webp","w":841,"h":116}]},
{"n":248,"sec":"std","num":229,"c":"Design security operations, identity, and compliance capabilities","q":"What should you include in the recommendation?","body":[{"p":"Your company has a Microsoft 365 E5 subscription."},{"p":"The Chief Compliance Officer plans to enhance privacy management in the working environment. You need to recommend a solution to enhance the privacy management. The solution must meet the following requirements:"},{"p":"• Identify unused personal data and empower users to make smart data handling decisions."},{"p":"• Provide users with notifications and guidance when a user sends personal data in Microsoft Teams."},{"p":"• Provide users with recommendations to mitigate privacy risks."},{"p":"What should you include in the recommendation?"}],"o":["Microsoft Viva Insights","Advanced eDiscovery","Privacy Risk Management in Microsoft Priva","communication compliance in insider risk management"],"a":"C","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"All three requirements are Priva Privacy Risk Management policies. Its data minimisation policy finds personal data kept longer than needed, which is the unused personal data requirement; its data transfer and oversharing policies detect personal data moving where it should not, and can show the user a policy tip in Teams and Outlook at the moment they send it; and the solution surfaces recommendations for reducing privacy risk rather than only reporting it. The user-facing nudge is the detail that rules the alternatives out.","whyWrong":["A. Viva Insights reports on productivity and wellbeing patterns.","B. eDiscovery finds and preserves content for legal matters.","D. Communication compliance detects inappropriate messages against a policy, and is aimed at conduct risk rather than personal-data handling. Priva is the privacy solution."],"source":{"title":"Privacy Risk Management in Microsoft Priva","url":"https://learn.microsoft.com/en-us/privacy/priva/risk-management"}},"e":[{"p":"Privacy Risk Management in Microsoft Priva gives you the capability to set up policies that identify privacy risks in your Microsoft 365 environment and enable easy remediation. Privacy Risk Management policies are meant to be internal guides and can help you:"},{"p":"Detect overexposed personal data so that users can secure it."},{"p":"Spot and limit transfers of personal data across departments or regional borders."},{"p":"Help users identify and reduce the amount of unused personal data that you store."},{"p":"https://www.microsoft.com/en-us/security/business/privacy/microsoft-priva-risk-management"}]},
{"n":249,"sec":"std","num":230,"c":"Design security solutions for infrastructure","q":"Your company has a hybrid cloud infrastructure.","body":[{"p":"Your company has a hybrid cloud infrastructure."},{"p":"Data and applications are moved regularly between cloud environments."},{"p":"The company ' s on-premises network is managed as shown in the following exhibit."},{"img":"img/p196_x3129.webp","w":862,"h":523},{"p":"You are designing security operations to support the hybrid cloud infrastructure. The solution must meet the following requirements:"},{"p":"Govern virtual machines and servers across multiple environments."},{"p":"Enforce standards for all the resources across all the environment across the Azure policy."},{"p":"Which two components should you recommend for the on-premises network? Each correct answer presents part of the solution."},{"p":"NOTE Each correct selection is worth one point."}],"o":["Azure VPN Gateway","guest configuration in Azure Policy","on-premises data gateway","Azure Bastion","Azure Arc"],"a":"B E","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Both keyed components are what the exhibit is already depicting: a Windows Server and a Linux Server on-premises being reached by Azure Monitor, Azure Policy and Azure Update Management. None of those services can see a non-Azure machine until it becomes an Azure resource, and Azure Arc-enabled servers is exactly what does that, making an on-premises server appear in Azure like any other resource. Guest configuration in Azure Policy is then what actually enforces standards inside that server's operating system once it is Arc-connected, which is the \"enforce standards for all the resources across all the environments across Azure Policy\" requirement.","whyWrong":["A. A VPN Gateway builds network-level connectivity between networks. It doesn't turn a server into a governable Azure resource or enforce configuration standards inside it.","C. The on-premises data gateway bridges Power Platform and Logic Apps services to on-premises data sources. It has no role in governing servers with Azure Policy.","D. Azure Bastion provides remote access to VMs. It plays no part in extending Azure Policy governance to on-premises machines."],"source":{"title":"Connect on-premises machines to Microsoft Defender for Cloud (Azure Arc)","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-machines"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/governance/machine-configuration/overview"}]},
{"n":250,"sec":"std","num":231,"c":"Design security solutions for infrastructure","q":"Your company has offices in New York City and London. The London office contains an on-premises app named Appl.","body":[{"p":"Your company has offices in New York City and London. The London office contains an on-premises app named Appl."},{"p":"You have a Microsoft Entra tenant named contoso.com that is hosted in North America."},{"p":"You plan to manage access to App1 for the users in the London office by using Microsoft Entra Private Access. You will deploy Private Access by performing the following actions in the London office:"},{"p":"• Deploy Microsoft Entra Private Network connectors."},{"p":"• Provision an ExpressRoute circuit to the closest peering location."},{"p":"You need to optimize the network for the planned deployment. The solution must meet the following requirements:"},{"p":"• Maximize redundancy for connectivity to Appl."},{"p":"• Minimize network latency when accessing Appl."},{"p":"• Maximize security."},{"p":"• Minimize costs."},{"p":"What should you include in the solution? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point."},{"img":"img/p198_x3156.webp","w":1000,"h":279}],"ansimg":[{"img":"img/p198_x3158.webp","w":1000,"h":279}],"e":[{"img":"img/p198_x3150.webp","w":1000,"h":142}]},
