{"n":292,"sec":"std","num":273,"c":"Design security solutions for infrastructure","q":"Your company has offices in New York City and Los Angeles.","body":[{"p":"Your company has offices in New York City and Los Angeles."},{"p":"The New York City office contains an on-premises app named App1."},{"p":"You have an Azure subscription. The subscription is linked to a Microsoft Entra tenant that is hosted in North America."},{"p":"You plan to manage access to App1 for the users in the Los Angeles office by using Microsoft Entra Private Access. You will deploy Private Access by performing the following actions:"},{"p":"• Provision an ExpressRoute circuit from the New York City office to the closest peering location."},{"p":"• Create an Azure virtual network named VNet1 in the East US Azure region."},{"p":"• Deploy a Microsoft Entra application proxy connector to VNet1."},{"p":"You need to optimize the network for the planned deployment The solution must meet the following requirements:"},{"p":"• Maximize redundancy for connectivity to App1."},{"p":"• Minimize network latency when accessing App1"},{"p":"• Minimize complexity."},{"p":"• Minimize costs."},{"p":"What should you include in the solution? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p232_x3720.webp","w":959,"h":209}],"ansimg":[{"img":"img/p232_x3722.webp","w":959,"h":209}],"e":[{"img":"img/p232_x3718.webp","w":979,"h":145}]},
{"n":293,"sec":"std","num":274,"c":"Design security solutions for infrastructure","q":"A customer is deploying Docker images to 10 Azure Kubernetes Service (AKS) resources across four Azure subscriptions. You are evaluating the security posture of the customer.","body":[{"p":"A customer is deploying Docker images to 10 Azure Kubernetes Service (AKS) resources across four Azure subscriptions. You are evaluating the security posture of the customer."},{"p":"You discover that the AKS resources are excluded from the secure score recommendations. You need to produce accurate recommendations and update the secure score."},{"p":"Which two actions should you recommend in Microsoft Defender for Cloud? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point."}],"o":["Configure auto provisioning.","Assign regulatory compliance policies.","Review the inventory.","Add a workflow automation.","Enable Defender plans."],"a":"A E","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"AKS resources dropping out of secure score recommendations almost always trace back to the Defender for Containers plan, or the components it depends on, not being active on every one of the four subscriptions, and the fix is to turn both back on rather than merely observe the gap. Enabling the Defender plan for containers on the affected subscriptions is what restores the recommendations for those clusters, and configuring auto provisioning ensures the extensions and agents the plan needs to actually assess each cluster (the Azure Policy add-on, the Defender sensor, and related components) are deployed automatically going forward rather than depending on someone remembering to add them by hand to each of the ten clusters.","whyWrong":["B. Assigning regulatory compliance policies maps existing assessments to a compliance standard. It doesn't restore recommendations that are missing because the plan or its components aren't enabled.","C. Reviewing the inventory is a diagnostic step that can help find the gap, but it changes nothing by itself and doesn't fix the exclusion.","D. Workflow automation triggers an action when a recommendation or alert fires. With no recommendations being generated for these clusters, there is nothing yet for a workflow automation to act on."],"source":{"title":"Configure auto provisioning of agents and extensions in Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-data-collection"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/update-regulatory-compliance-packages https://docs.microsoft.com/en-us/azure/defender-for-cloud/workflow-automation"}]},
{"n":294,"sec":"std","num":275,"c":"Design security solutions for infrastructure","q":"Which security control should you recommend?","body":[{"p":"You have a Microsoft 365 subscription and an Azure subscription. Microsoft 365 Defender and Microsoft Defender for Cloud are enabled."},{"p":"The Azure subscription contains 50 virtual machines. Each virtual machine runs different applications on Windows Server 2019."},{"p":"You need to recommend a solution to ensure that only authorized applications can run on the virtual machines. If an unauthorized application attempts to run or be installed, the application must be blocked automatically until an administrator authorizes the application."},{"p":"Which security control should you recommend?"}],"o":["Azure Active Directory (Azure AD) Conditional Access App Control policies","OAuth app policies in Microsoft Defender for Cloud Apps","app protection policies in Microsoft Endpoint Manager","application control policies in Microsoft Defender for Endpoint"],"a":"D","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Application control policies in Defender for Endpoint (App Control for Business, formerly WDAC) enforce an allowlist on the machine: anything not explicitly allowed is blocked until an administrator authorizes it. Note the contrast with Standalone 103 and 283, which key adaptive application controls in Defender for Cloud — the historically expected answer for this exact scenario, but deprecated in August 2024. Defender for Endpoint's application control is the surviving mechanism, and it is the only option here that controls what executes on a server.","whyWrong":["A. Conditional Access App Control proxies SaaS sessions through Defender for Cloud Apps. It governs web sessions, not processes on a virtual machine.","B. OAuth app policies govern third-party apps consented into your tenant, not executables on a server.","C. Intune app protection policies protect corporate data inside mobile apps. They do not allowlist software on Windows Server."],"source":{"title":"Prepare for retirement of the Log Analytics agent — feature functionality table","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/prepare-deprecation-log-analytics-mma-agent"}},"e":[{"p":"https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control /select-types-of-rules-to-create#windows-defender-application-control-policy-rules"}]},
{"n":295,"sec":"std","num":276,"c":"Design security solutions for applications and data","q":"Does this meet the goal?","body":[{"p":"You are designing the encryption standards for data at rest for an Azure resource"},{"p":"You need to provide recommendations to ensure that the data at rest is encrypted by using AES-256 keys. The solution must support rotating the encryption keys monthly."},{"p":"Solution: For Azure SQL databases, you recommend Transparent Data Encryption (TDE) that uses customer- managed keys (CMKs)."},{"p":"Does this meet the goal?"}],"o":["Yes","No"],"a":"A","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Yes. TDE with a customer-managed key, also called Bring Your Own Key, puts the TDE protector in your own Azure Key Vault, and Microsoft documents both manual and automatic key rotation for it, so a monthly schedule is yours to set. The encryption itself is AES-256. Read this family as a pair with Standalone 259: the algorithm never changes, only who controls the key lifecycle, and that is what a rotation requirement is testing.","source":{"title":"Transparent data encryption with customer-managed keys (BYOK)","url":"https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview"}}},
{"n":296,"sec":"std","num":277,"c":"Design solutions that align with security best practices and priorities","q":"What should you recommend?","body":[{"p":"You have an Azure AD tenant that syncs with an Active Directory Domain Services (AD DS) domain."},{"p":"You are designing an Azure DevOps solution to deploy applications to an Azure subscription by using continuous integration and continuous deployment (CI/CD) pipelines."},{"p":"You need to recommend which types of identities to use for the deployment credentials of the service connection. The solution must follow DevSecOps best practices from the Microsoft Cloud Adoption Framework for Azure."},{"p":"What should you recommend?"}],"o":["an Azure AD user account that has a password stored in Azure Key Vault","a group managed service account (gMSA)","an Azure AD user account that has role assignments in Azure AD Privileged Identity Management (PIM)","a managed identity in Azure"],"a":"D","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"A managed identity has no credential you can leak, because Azure issues and rotates the token and nothing is stored in the pipeline or a vault. That is the DevSecOps position on deployment credentials: remove the secret rather than protect it better. Azure DevOps supports managed identity and workload identity federation for Azure Resource Manager service connections precisely so pipelines stop holding secrets.","whyWrong":["A. A user account with a password in Key Vault still has a password, which can be extracted, replayed and used interactively.","B. A group managed service account is an Active Directory construct for on-premises Windows services. It cannot authenticate a pipeline to an Azure subscription.","C. PIM adds approval and time limits to a human account, but a pipeline needs unattended access, and this is still a user identity with a credential."],"source":{"title":"Connect to Azure by using an Azure Resource Manager service connection","url":"https://learn.microsoft.com/en-us/azure/devops/pipelines/library/connect-to-azure"}}},
{"n":297,"sec":"std","num":278,"c":"Design solutions that align with security best practices and priorities","q":"Which service should you recommend?","body":[{"p":"You have an Azure subscription and a Microsoft 365 subscription."},{"p":"Your company uses several software as a service (SaaS) applications."},{"p":"To align with Microsoft cloud security benchmark (MCSB) and Microsoft Cybersecurity Reference Architectures (MCRA), you plan to design a solution to provide visibility into user activity across the applications and detect potentially risky behavior in real time."},{"p":"Which service should you recommend?"}],"o":["Microsoft Purview Information Protection","Microsoft Defender for Cloud Apps","Microsoft Defender for Endpoint","Microsoft Sentinel"],"a":"B","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Defender for Cloud Apps is Microsoft's CASB and the MCRA component for SaaS visibility and control. Its session policies “provide granular visibility into cloud apps with real-time, session-level monitoring”, which is the “in real time” part of the requirement, and its activity policies and anomaly detections cover risky behaviour across connected apps.","whyWrong":["A. Purview Information Protection classifies and protects content; it does not monitor user activity across apps.","C. Defender for Endpoint sees the device, not the SaaS session.","D. Sentinel could ingest and correlate the signal, but it is the SIEM downstream. The question asks which service provides the visibility, and for SaaS that is Defender for Cloud Apps."],"source":{"title":"Create session policies in Microsoft Defender for Cloud Apps","url":"https://learn.microsoft.com/en-us/defender-cloud-apps/session-policy-aad"}}},
{"n":298,"sec":"std","num":279,"c":"Design security solutions for infrastructure","q":"You have a Microsoft 365 E5 subscription.","body":[{"p":"You have a Microsoft 365 E5 subscription."},{"p":"You need to recommend a security solution that meets the following requirements:"},{"p":"• Automatically identifies and stops external, brute force attacks against accounts in the subscription"},{"p":"• Automatically identifies and stops external attacks that use an internal account to exfiltrate data from"},{"p":"Microsoft SharePoint Online sites in the subscription"},{"p":"What should you include in the recommendation for each requirement? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p235_x3754.webp","w":1000,"h":391}],"ansimg":[{"img":"img/p236_x3763.webp","w":1000,"h":391}],"e":[{"img":"img/p236_x3768.webp","w":1000,"h":162}]},
{"n":299,"sec":"std","num":280,"c":"Design security solutions for applications and data","q":"What should you recommend?","body":[{"p":"You have an Azure subscription that is linked to a Microsoft Entra tenant."},{"p":"You plan deploy an enterprise application named Appl. App1 requires LDAP to look up attributes related to Microsoft Entra users."},{"p":"You need to recommend a solution to support the LDAP requirement."},{"p":"What should you recommend?"}],"o":["Configure a Conditional Access policy that has a trusted network location.","Deploy Microsoft Entra Domain Services.","Deploy Microsoft Entra Private Access.","Implement pass-through authentication."],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"An enterprise application that needs LDAP to look up attributes about Entra users needs a managed domain in front of Entra ID. Domain Services synchronises users, groups and credentials one way from Microsoft Entra ID and exposes them over LDAP and Kerberos/NTLM, giving the legacy app what it expects without any domain controllers to run.","whyWrong":["A. A Conditional Access trusted location is an access-policy condition and adds no directory protocol.","C. Private Access is network access to private apps; it does not make Entra ID answer LDAP.","D. Pass-through authentication validates passwords against on-premises AD DS during sign-in and is unrelated to LDAP lookups against Entra."],"source":{"title":"Overview of Microsoft Entra Domain Services","url":"https://learn.microsoft.com/en-us/entra/identity/domain-services/overview"}}},
{"n":300,"sec":"std","num":281,"c":"Design security operations, identity, and compliance capabilities","q":"Which Microsoft 365 resources are protected by using continuous access evaluation?","body":[{"p":"You have on-premises Windows 11 devices that have the Global Secure Access client deployed."},{"p":"You have a Microsoft 365 subscription that uses Microsoft SharePoint Online and Exchange Online."},{"p":"You deploy Microsoft Entra Internet Access from the on-premises network to Microsoft 365. The deployment has the Microsoft 365 profile enabled and contains the following:"},{"p":"• Default traffic policies for Microsoft 365 services"},{"p":"• A linked Conditional Access policy that performs compliant network checks with continuous access"},{"p":"evaluation and is applied to all users"},{"p":"• An assignment to all the devices"},{"p":"• An assignment to a remote network associated with the on-premises network"},{"p":"Which Microsoft 365 resources are protected by using continuous access evaluation?"}],"o":["SharePoint Online only","Exchange Online only","both SharePoint Online and Exchange Online"],"a":"A","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged: the key says SharePoint Online only, and no Microsoft source supports excluding Exchange Online. Microsoft describes continuous access evaluation as implemented by services that subscribe to critical Microsoft Entra events, and names Exchange Online, SharePoint Online and Teams together. The Global Secure Access compliant network article says data plane enforcement \"works with services integrated with Global Secure Access that support Continuous Access Evaluation (CAE)\" without singling out one workload, and the known limitations page lists nothing that removes Exchange Online from this scenario. Note also that Standalone 282 in this same bank keys continuous access evaluation for Exchange Online as supported, so the two items contradict each other. Something in the source is wrong here, but which of the two cannot be settled from documentation, so both keys are left untouched and both are flagged. One real limitation is worth carrying away: Conditional Access for Microsoft and internet traffic is enforced only when the user has the Global Secure Access client, not through a remote network alone, which matters because this stem mentions both.","source":{"title":"Known limitations for Global Secure Access","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/reference-current-known-limitations"}}},
{"n":301,"sec":"std","num":282,"c":"Design security solutions for infrastructure","q":"Your company has a main office and a branch office.","body":[{"p":"Your company has a main office and a branch office."},{"p":"The main office contains 20 on-premises servers that run Windows Server and host apps that are published by using Microsoft Entra application proxy. The main office contains 500 on-premises computers that run Windows 11. The branch office contains 100 on-premises computers that run Windows 11."},{"p":"All the main office computers are enrolled in Microsoft Intune. The branch office computers are NOT enrolled in Intune."},{"p":"You have a Microsoft 365 E5 subscription."},{"p":"You have a Microsoft Entra tenant. You have a third-party software as a service (SaaS) app that is registered in the Microsoft Entra tenant."},{"p":"You plan to implement Global Secure Access."},{"p":"You are evaluating the use of compliant network check and Conditional Access."},{"p":"Which two scenarios are supported by compliant network check? Each correct answer presents a complete solution."},{"p":"NOTE: Each correct selection is worth one point"}],"o":["connections from the branch office computers","Continuous Access Evaluation for Microsoft Exchange Online","connections to the third-party SaaS app","connections to the on-premises apps"],"a":"B C","review":{"status":"AMBIGUOUS","confidence":"MEDIUM","explanation":"Two of the keyed options are well supported and one distractor is not clearly excluded, so this is flagged rather than confirmed. Option C is documented outright: compliant network check protects \"Microsoft apps, third-party SaaS apps, and private line-of-business (LoB) apps\" that use Microsoft Entra single sign-on. Option B fits the data plane enforcement description, since Exchange Online is a continuous access evaluation service. Option D is genuinely excluded, because the known limitations state that \"compliant network check is currently not supported for Private Access applications\". The problem is option A. Compliant network is not compliant device: it depends on the user connecting through the Global Secure Access client or a configured remote network, not on Intune enrolment, so the branch office computers being unenrolled does not by itself rule them out. The stem never says whether they have the client, which leaves A defensible on the text as printed. The key is left as the source has it.","source":{"title":"Enable compliant network check with Conditional Access","url":"https://learn.microsoft.com/en-us/entra/global-secure-access/how-to-compliant-network"}}},
{"n":302,"sec":"std","num":283,"c":"Design security solutions for infrastructure","q":"Which security control should you recommend?","body":[{"p":"You have a Microsoft 365 subscription and an Azure subscription. Microsoft 365 Defender and Microsoft Defender for Cloud are enabled."},{"p":"The Azure subscription contains 50 virtual machines. Each virtual machine runs different applications on Windows Server 2019."},{"p":"You need to recommend a solution to ensure that only authorized applications can run on the virtual machines. If an unauthorized application attempts to run or be installed, the application must be blocked automatically until an administrator authorizes the application."},{"p":"Which security control should you recommend?"}],"o":["app discovery anomaly detection policies in Microsoft Defender for Cloud Apps","adaptive application controls in Defender for Cloud","Azure Security Benchmark compliance controls m Defender for Cloud","app protection policies in Microsoft Endpoint Manager"],"a":"B","review":{"status":"OUTDATED","confidence":"HIGH","explanation":"Same retired feature as Standalone 103, and the two are the same question with different option lists. Adaptive application controls in Defender for Cloud were deprecated in August 2024 with no replacement in that product. The key stands as the source recorded it, but the current answer to this scenario is application control in Microsoft Defender for Endpoint — which is exactly what Standalone 275 keys, and why those two apparently contradictory items are both defensible on their own option lists.","source":{"title":"Prepare for retirement of the Log Analytics agent — feature functionality table","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/prepare-deprecation-log-analytics-mma-agent"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/defender-for-cloud/recommendations-reference#compute- recommendations"}]},
{"n":303,"sec":"std","num":284,"c":"Design security operations, identity, and compliance capabilities","q":"You have the Azure subscriptions shown in the following table.","body":[{"p":"You have the Azure subscriptions shown in the following table."},{"img":"img/p239_x3812.webp","w":878,"h":117},{"p":"The tenants contain the groups shown in the following table."},{"img":"img/p239_x3818.webp","w":813,"h":97},{"p":"You perform the following actions:"},{"p":"• Configure multi-user authorization (MUA) for Vault1 by using a resource guard deployed to Sub2."},{"p":"• Enable all available MUA controls for Vault1."},{"p":"• In contoso.com, create a Privileged Identity Management (PIM) assignment named Assignment1."},{"p":"• Configure Assignment1 to enable Group! to activate the Contributor role for Vault1."},{"p":"For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point."},{"img":"img/p239_x3801.webp","w":1000,"h":240}],"ansimg":[{"img":"img/p239_x3807.webp","w":1000,"h":240}],"e":[{"img":"img/p240_x3828.webp","w":1000,"h":240}]},
{"n":304,"sec":"std","num":285,"c":"Design security solutions for applications and data","q":"You have an Azure subscription.","body":[{"p":"You have an Azure subscription."},{"p":"You plan to deploy a storage account named storage1 that will store confidential data. You will assign tags to the confidential data."},{"p":"You need to ensure that access to storage1 can be defined by using the assigned tags."},{"p":"Which authorization mechanism should you enable, and which type of resource should you use to store the data? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p240_x3834.webp","w":591,"h":209}],"ansimg":[{"img":"img/p241_x3843.webp","w":591,"h":209}],"e":[{"img":"img/p241_x3848.webp","w":595,"h":123}]},
{"n":305,"sec":"std","num":286,"c":"Design security solutions for applications and data","q":"At which level should you recommend the encryption be applied?","body":[{"p":"You have an Azure subscription that contains multiple Azure Data Lake Storage accounts."},{"p":"You need to recommend a solution to encrypt the content of the accounts by using service-side encryption and customer-managed keys. The solution must ensure that individual encryption keys are applied at the most granular level."},{"p":"At which level should you recommend the encryption be applied?"}],"o":["account","folder","file","container"],"a":"C","srcA":"D","review":{"status":"CORRECTED","confidence":"MEDIUM","explanation":"THIS ANSWER WAS CORRECTED BY AI\n\nThe mechanism here is an encryption scope, and Microsoft states its two levels plainly: encryption scopes enable you to manage encryption with a key that is scoped to a container or an individual blob. The question asks for the most granular level, and the individual blob, which in a Data Lake Storage Gen2 account is a file, is more granular than the container. A scope set on a container is only the default for blobs uploaded into it, and unless the container prohibits overrides, an individual blob can be uploaded with a different scope. Encryption scopes are fully supported on accounts with a hierarchical namespace, so the Data Lake Gen2 detail in the stem does not push the answer back up to the container.","whyWrong":["A. The account level is where the default key applies. It is the least granular option, not the most.","B. A folder is a hierarchical namespace construct. It is not an encryption boundary; encryption scopes know about containers and blobs.","D. The container is the keyed answer and is a real level, but it is the default for the blobs inside it rather than the finest one available."],"source":{"title":"Encryption scopes for Blob storage","url":"https://learn.microsoft.com/en-us/azure/storage/blobs/encryption-scope-overview"},"corrected":true,"originalAnswer":"D"}},
{"n":306,"sec":"std","num":287,"c":"Design solutions that align with security best practices and priorities","q":"You have an Azure subscription.","body":[{"p":"You have an Azure subscription."},{"p":"You need to create an Azure policy to ensure that all the resources in the subscription have tags assigned. The solution must ensure that the policy can remediate noncompliant resources automatically."},{"p":"How should you configure the policy? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p242_x3870.webp","w":671,"h":260}],"ansimg":[{"img":"img/p242_x3872.webp","w":671,"h":260}],"e":[{"img":"img/p242_x3864.webp","w":668,"h":138}]},
{"n":307,"sec":"std","num":288,"c":"Design security operations, identity, and compliance capabilities","q":"What should you use?","body":[{"p":"You have multiple Azure subscriptions that each contains multiple resource groups."},{"p":"You need to identify the privileged role assignments in each subscription and any associated security risks. The solution must minimize administrative effort."},{"p":"What should you use?"}],"o":["The Analytics dashboard in Microsoft Entra Permissions Management","access reviews in Microsoft Entra ID Identity Governance","access reviews in Privileged Identity Management (PIM)","Microsoft Defender External Attack Surface Management (Defender EASM) discovery"],"a":"C","review":{"status":"VERIFIED","confidence":"MEDIUM","explanation":"Access reviews in Privileged Identity Management are the surviving answer. PIM covers Azure resource roles as well as directory roles, so it can enumerate who holds privileged assignments across subscriptions and drive a recurring review of whether they still need them. Note the distractor: option A names the Permissions Management analytics dashboard, which would have been a reasonable answer historically but was retired on 1 November 2025 — so on the current exam this pair is no longer a close call.","whyWrong":["A. Microsoft Entra Permissions Management was retired on 1 November 2025.","B. Access reviews in ID Governance cover group and application access; privileged role assignments are reviewed through PIM.","D. Defender EASM discovers your internet-facing attack surface. It has nothing to do with role assignments."],"source":{"title":"What's Microsoft Entra Permissions Management? (archived — retired 1 November 2025)","url":"https://learn.microsoft.com/en-us/previous-versions/entra/permissions-management/overview"}}},
{"n":308,"sec":"std","num":289,"c":"Design solutions that align with security best practices and priorities","q":"What should you implement?","body":[{"p":"You have a Microsoft 365 subscription that contains a group named Group1. The subscription contains 1,000 Windows devices that are joined to a Microsoft Entra tenant and managed by using Microsoft Intune. All users sign in to the devices by using standard user accounts."},{"p":"You plan to deploy a new app named App1 to the members of Group1. The Group1 members must have administrative rights to install new versions of App1."},{"p":"You need to ensure that the Group1 members can install new versions of App1. The solution must follow the principles of Zero Trust."},{"p":"What should you implement?"}],"o":["Microsoft Local Administrator Password Solution (Microsoft LAPS)","Endpoint Privilege Management (EPM)","Privileged Identity Management (PIM)","Microsoft Entra entitlement management"],"a":"B","review":{"status":"VERIFIED","confidence":"HIGH","explanation":"Installing an application needs administrative rights, and EPM grants exactly that for exactly that binary — elevation is scoped by rules to specific files, logged per elevation, and leaves the user a standard user the rest of the time. Microsoft frames it as supporting Zero Trust by “enabling least privilege access and minimizing lateral movement risks”, which is the phrase the question is pointing at.","whyWrong":["A. LAPS would hand Group1 a working local administrator credential — broad standing privilege, the opposite of Zero Trust.","C. PIM covers Entra roles, not application installation on a device.","D. Entitlement management governs access packages for resources, not local elevation."],"source":{"title":"Endpoint Privilege Management with Microsoft Intune","url":"https://learn.microsoft.com/en-us/intune/intune-service/protect/epm-overview"}}},
{"n":309,"sec":"std","num":290,"c":"Design security operations, identity, and compliance capabilities","q":"You have Microsoft Defender for Cloud assigned to Azure management groups.","body":[{"p":"You have Microsoft Defender for Cloud assigned to Azure management groups."},{"p":"You have a Microsoft Sentinel deployment."},{"p":"During the triage of alerts, you require additional information about the security events, including suggestions for remediation. Which two components can you use to achieve the goal? Each correct answer presents a complete solution."},{"p":"NOTE: Each correct selection is worth one point."}],"o":["workload protections in Defender for Cloud","threat intelligence reports in Defender for Cloud","Microsoft Sentinel notebooks","Microsoft Sentinel threat intelligence workbooks"],"a":"B D","review":{"status":"MANUAL_REVIEW","confidence":"LOW","explanation":"Flagged: half of this key is well supported and half is not. Threat intelligence reports in Defender for Cloud (option B) are exactly what the stem describes. Microsoft's page says they help you learn more about the threat that triggered an alert and give incident response teams information about the detected threat, including how to remediate it. No Microsoft source, however, establishes that Sentinel threat intelligence workbooks (option D) supply remediation guidance for an alert; a threat intelligence workbook visualises indicators of compromise. Option A, workload protections in Defender for Cloud, arguably has a better claim, since the alert detail there carries remediation steps. Because the question says each correct answer is a complete solution, and only one of the keyed pair can be defended from documentation, the key is left as the source has it and the item is flagged rather than guessed at.","source":{"title":"Threat intelligence report in Microsoft Defender for Cloud","url":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/threat-intelligence-reports"}},"e":[{"p":"https://docs.microsoft.com/en-us/azure/sentinel/understand-threat-intelligencehttps://docs.microsoft.com/en- us/azure/defender-for-cloud/defender-for-cloud-introduction https://docs.microsoft.com/en-us/azure/defende r- for-cloud/threat-intelligence-reports https://docs.microsoft.com/en-us/azure/sentinel/note books"}]},
{"n":310,"sec":"std","num":291,"c":"Design security solutions for infrastructure","q":"You have an Azure subscription that contains an Azure Kubernetes Service (AKS) cluster named AKS1. AKS1 hosts a Windows node pool named Pool1 and a Linux node pool named Pool2.","body":[{"p":"You have an Azure subscription that contains an Azure Kubernetes Service (AKS) cluster named AKS1. AKS1 hosts a Windows node pool named Pool1 and a Linux node pool named Pool2."},{"p":"You are designing a pool update strategy for AKS1."},{"p":"You need to recommend how often to replace the operating system images deployed to the nodes. The solution must meet the following requirements:"},{"p":"• Minimize how long it takes to apply operating system updates once the updates are released."},{"p":"• Minimize administrative effort."},{"p":"What should you recommend for each pool? To answer, select the appropriate options in the answer area."},{"p":"NOTE: Each correct selection is worth one point."},{"img":"img/p245_x3907.webp","w":634,"h":288}],"ansimg":[{"img":"img/p245_x3909.webp","w":634,"h":288}],"e":[{"img":"img/p245_x3901.webp","w":654,"h":120},{"img":"img/p246_x250.webp","w":775,"h":1015},{"p":"About dumpspedia.com"},{"p":"dumpspedia.com was founded in 2007. We provide latest & high quality IT / Business Certification Training Exam Questions, Study Guides, Practice Tests."},{"p":"We help you pass any IT / Business Certification Exams with 100% Pass Guaranteed or Full Refund. Especially Cisco, CompTIA, Citrix, EMC, HP, Oracle, VMware, Juniper, Check Point, LPI, Nortel, EXIN and so on."},{"p":"View list of all certification exams: All vendors"},{"p":"We prepare state-of-the art practice tests for certification exams. You can reach us at any of the email addresses listed below."},{"p":"Sales: sales@dumpspedia.com Feedback: feedback@dumpspedia.com Support: support@dumpspedia.com"},{"p":"Any problems about IT certification or our products, You can write us back and we will get back to you within // ---------------------------------------------------------------------------
// DOMAIN WEIGHTING (for the 50-question weighted practice exam)
//
// The bank's `c` field already holds the four official SC-100 skill-area names
// exactly as Microsoft words them, so the mapping is identity — but it is kept
// explicit so a future edit that adds a differently-worded label falls through
// to domain 1 rather than silently vanishing from every weighted draw.
//
// Target counts are pre-computed from the midpoint of each published weight
// range against a fixed 50-question exam (22.5/27.5/27.5/22.5% of 50 =
// 11.25/13.75/13.75/11.25, rounded to 11/14/14/11 — which sums to exactly 50)
// rather than computed at draw time, so the breakdown shown on the setup
// screen always matches what actually gets drawn.
// ---------------------------------------------------------------------------
const DOMAIN_WEIGHTS = [
  {num:1, name:'Design solutions that align with security best practices and priorities', pct:'20–25%', target:11},
  {num:2, name:'Design security operations, identity, and compliance capabilities',        pct:'25–30%', target:14},
  {num:3, name:'Design security solutions for infrastructure',                             pct:'25–30%', target:14},
  {num:4, name:'Design security solutions for applications and data',                      pct:'20–25%', target:11}
];

const CATEGORY_DOMAIN = {};
DOMAIN_WEIGHTS.forEach(d => { CATEGORY_DOMAIN[d.name] = d.num; });
function domainOf(q){ return CATEGORY_DOMAIN[q.c] || 1; }

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Draws a 50-question set proportioned to DOMAIN_WEIGHTS, from scorable items
// only — a weighted exam is a score, so unscorable items have no place in it.
// Returns the shuffled order plus a per-domain {picked, target} tally so the UI
// can say so plainly if a skill area's pool ever runs short.
function buildWeightedOrder(){
  const tally = [];
  let combined = [];
  DOMAIN_WEIGHTS.forEach(d=>{
    const pool = QUESTIONS.filter(q => isScorable(q) && domainOf(q) === d.num).map(q => q.n);
    const picked = shuffled(pool).slice(0, d.target);
    tally.push({num:d.num, name:d.name, target:d.target, picked:picked.length});
    combined = combined.concat(picked);
  });
  return {order: shuffled(combined), tally};
}

function letterOf(i){ return String.fromCharCode(65+i); }

function rangeLabelFor(s){
  if(s.isWrongPool) return `All-time missed · ${s.total} question${s.total===1?'':'s'}`;
  if(s.isRetake) return `Retake · ${s.total} question${s.total===1?'':'s'} (incorrect & skipped)`;
  if(s.isWeighted) return `Weighted exam · ${s.total} questions (by skill-area %)`;
  if(s.secKey === 'all') return `All sections · ${s.total} questions`;
  const sec = sectionOf(s.secKey);
  const label = sec ? sec.label : 'Questions';
  return `${label} ${s.rangeStart}–${s.rangeEnd}`;
}

// History rows and live sessions describe their range with the same fields, so
// both go through rangeLabelFor via this shim.
function rangeLabelOf(o){
  return rangeLabelFor({
    isWrongPool:o.isWrongPool, isRetake:o.isRetake, isWeighted:o.isWeighted,
    secKey:o.secKey, rangeStart:o.rangeStart, rangeEnd:o.rangeEnd,
    total:(o.total != null ? o.total : (o.order ? o.order.length : 0))
  });
}

function parseAnswerLetters(a){
  if(!a) return [];
  return a.split(/[,\s]+/).filter(Boolean);
}

// Formats a millisecond duration as H:MM:SS (or M:SS under an hour).
function formatDuration(ms){
  const totalSec = Math.max(0, Math.round(ms/1000));
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  const pad = n => String(n).padStart(2,'0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

// ---------------------------------------------------------------------------
// GRADING
//
// Three question shapes exist:
//   choice - q.o + q.a, an ordinary multiple-choice item
//   match  - q.boxes, a Microsoft "answer area" item. The source gives a label
//            and correct value per drop-down but never the option list, so each
//            drop-down offers that item's own values shuffled.
//   info   - neither. The source PDF records no gradeable question for it, so
//            it is shown for reading and never scored.
// Every place that asks "was this answered?" or "was this right?" goes through
// these helpers so the three shapes can never drift apart.
// ---------------------------------------------------------------------------

function isMatch(q){ return !!(q && q.boxes && q.boxes.length); }
function isChoice(q){ return !!(q && q.o && q.o.length); }
// An item counts towards a score only if there is something to get right.
function isScorable(q){ return isChoice(q) || isMatch(q); }
function isInfo(q){ return !!q && !isScorable(q); }

// Does every drop-down on this item carry its own real choice list? Items whose
// options were supplied from outside the PDF do; ones recovered from the PDF
// alone do not, because the source never recorded the alternatives.
function hasRealOptions(q){
  return isMatch(q) && q.boxes.every(b => b.options && b.options.length);
}

// The choices for one drop-down. A supplied option list is used as given — that
// is the list the exam shows, in the order it shows it. Otherwise the item falls
// back to a matching exercise over its own correct values (see matchOptions).
function boxOptions(q, idx){
  const box = q.boxes[idx];
  return (box.options && box.options.length) ? box.options : matchOptions(q);
}

// Fallback for items recovered from the PDF: every drop-down offers the same
// list, the correct values of all of that item's own boxes. The source never
// supplies distractors, so inventing them would mean inventing exam content —
// instead the item becomes a self-contained matching exercise built only from
// what the source states.
//
// The order is shuffled but STABLE: seeded off the internal id so the same item
// always presents its choices in the same order, across re-renders and across a
// save/resume, and never in the giveaway order of the answer key.
function matchOptions(q){
  // A few items give two boxes the same correct value; listing it twice in the
  // drop-down would look like a rendering fault, and grading compares values
  // rather than positions, so one entry serves both boxes.
  const vals = [...new Set(q.boxes.map(b => b.value))];
  // Small deterministic PRNG (mulberry32) seeded from the question's id.
  let t = (q.n * 2654435761) >>> 0;
  const rnd = ()=>{
    t = (t + 0x6D2B79F5) >>> 0;
    let x = Math.imul(t ^ (t >>> 15), 1 | t);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
  for(let i=vals.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    [vals[i],vals[j]] = [vals[j],vals[i]];
  }
  return vals;
}

// Matching responses live in rec.boxes as {boxIndex: value}.
function matchResponse(rec){ return (rec && rec.boxes) ? rec.boxes : {}; }

function matchCellCorrect(q, idx, rec){
  const picked = matchResponse(rec)[idx];
  return !!picked && picked === q.boxes[idx].value;
}

// Number of drop-downs answered correctly, and the total number of drop-downs.
function matchScore(q, rec){
  let got = 0;
  q.boxes.forEach((b, i)=>{ if(matchCellCorrect(q, i, rec)) got++; });
  return {got, total: q.boxes.length};
}

// Did the candidate put anything down at all? Blank counts as skipped, not
// wrong. An info item has nothing to put down, so it is never "answered".
function hasResponse(q, rec){
  if(isInfo(q)) return false;
  if(isMatch(q)){
    const resp = matchResponse(rec);
    return q.boxes.some((b, i) => !!resp[i]);
  }
  return !!(rec && rec.selected && rec.selected.length > 0);
}

// Matching items are all-or-nothing: every drop-down must be right, which is
// how Microsoft scores its own answer-area items.
function isCorrectAnswer(q, rec){
  if(isInfo(q)) return false;
  if(!hasResponse(q, rec)) return false;
  if(isMatch(q)){
    const {got, total} = matchScore(q, rec);
    return got === total;
  }
  return arraysEqualAsSets(rec.selected, parseAnswerLetters(q.a));
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs){
    for(const k in attrs){
      const v = attrs[k];
      if(v === null || v === undefined) continue; // don't set attributes explicitly passed as null/undefined
      if(k === 'class') e.className = v;
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
  }
  (children||[]).forEach(c => {
    if(c === null || c === undefined) return;
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

// Question text, explanations and case narratives all arrive as an ordered list
// of nodes — {p: text} for a paragraph, {img: file} for a diagram — so prose and
// exhibits render in the order the exam presents them.
function renderNodes(target, nodes, imgClass){
  (nodes||[]).forEach(node=>{
    if(node.img){
      // Scaled to the column by default. Many exhibits are screenshots of
      // tables whose text is unreadable at that size, so clicking shows the
      // image at full resolution and lets the figure scroll sideways.
      const fig = el('figure',{class:'exhibit-wrap ' + (imgClass||'')});
      const cap = el('figcaption',{},['Click to enlarge']);
      fig.appendChild(el('img',{
        class:'exhibit', src:node.img, alt:'Exhibit from the question', loading:'lazy',
        width: node.w ? String(node.w) : null, height: node.h ? String(node.h) : null,
        onclick: ()=>{
          const on = fig.classList.toggle('zoomed');
          cap.textContent = on ? 'Full size · scroll sideways · click to fit' : 'Click to enlarge';
        }
      }));
      fig.appendChild(cap);
      target.appendChild(fig);
    } else if(node.p){
      // A bullet keeps its own line; the source writes requirement lists this way.
      const cls = node.p.startsWith('•') ? 'qpara bullet' : 'qpara';
      target.appendChild(el('div',{class:cls}, linkify(node.p)));
    }
  });
}

// Explanations in the source are often nothing but Microsoft Learn links, so
// they are turned into real anchors. Built with DOM nodes rather than innerHTML
// so nothing in the bank can be interpreted as markup.
function linkify(text){
  const out = [];
  (text||'').split(/(\s+)/).forEach(part=>{
    if(/^https?:\/\/\S+$/.test(part)){
      out.push(el('a',{href:part, target:'_blank', rel:'noopener noreferrer'},[part]));
    } else if(part){
      out.push(document.createTextNode(part));
    }
  });
  return out;
}


// Persistence layer: uses Claude.ai's window.storage when running inside an
// artifact, and transparently falls back to the browser's own localStorage
// when this file is hosted anywhere else (GitHub Pages, Netlify, a local
// file://), so "save progress" keeps working either way.
const storageBackend = (typeof window !== 'undefined' && window.storage)
  ? window.storage
  : {
      async get(key){
        const v = localStorage.getItem(key);
        return v !== null ? {key, value: v} : null;
      },
      async set(key, value){
        localStorage.setItem(key, value);
        return {key, value};
      },
      async delete(key){
        localStorage.removeItem(key);
        return {key, deleted: true};
      }
    };

async function loadSession(){
  try{
    const r = await storageBackend.get(SESSION_KEY, false);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveSession(session){
  try{
    await storageBackend.set(SESSION_KEY, JSON.stringify(session), false);
  }catch(e){ console.error('save session failed', e); }
}
async function clearSession(){
  try{ await storageBackend.delete(SESSION_KEY, false); }catch(e){}
}
async function loadHistory(){
  try{
    const r = await storageBackend.get(HISTORY_KEY, false);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveHistory(list){
  try{
    await storageBackend.set(HISTORY_KEY, JSON.stringify(list.slice(0,100)), false);
  }catch(e){ console.error('save history failed', e); }
}

// ---------------------------------------------------------------------------
// ALL-TIME MISSED-QUESTION POOL
//
// The pool is CUMULATIVE and ADDITIVE. Every question answered incorrectly or
// left unanswered — in any run, across any number of runs, including runs that
// are abandoned part-way through — is added and STAYS in the list. Nothing is
// ever removed automatically; the only things that take a question out are the
// explicit user actions ("Clear list", or "Remove correct from missed list"
// on the results screen). Items that cannot be scored never enter it.
// ---------------------------------------------------------------------------

function normalizeWrongPool(arr){
  const seen = new Set();
  const out = [];
  (Array.isArray(arr) ? arr : []).forEach(v => {
    const n = Number(v);
    if(!Number.isFinite(n) || seen.has(n)) return;
    if(!isScorable(QMAP[n])) return;
    seen.add(n);
    out.push(n);
  });
  return out.sort((a,b)=>a-b);
}

async function loadWrongPool(){
  try{
    const r = await storageBackend.get(WRONG_POOL_KEY, false);
    return normalizeWrongPool(r ? JSON.parse(r.value) : []);
  }catch(e){ return []; }
}
async function saveWrongPool(arr){
  try{
    await storageBackend.set(WRONG_POOL_KEY, JSON.stringify(arr), false);
  }catch(e){ console.error('save wrong pool failed', e); }
}

// Merge question ids into the persistent pool. Never removes. Writes to storage
// only when something actually changed, so this is cheap enough to call once
// per graded question. Returns true if the pool grew.
async function addToWrongPool(qns){
  const list = Array.isArray(qns) ? qns : [qns];
  const merged = normalizeWrongPool((state.wrongPool || []).concat(list));
  if(merged.length === (state.wrongPool || []).length) return false;
  state.wrongPool = merged;
  await saveWrongPool(state.wrongPool);
  return true;
}

// The only removal path other than a full clear — driven by an explicit click.
async function removeFromWrongPool(qns){
  const drop = new Set((Array.isArray(qns) ? qns : [qns]).map(Number));
  const kept = (state.wrongPool || []).filter(n => !drop.has(n));
  if(kept.length === (state.wrongPool || []).length) return false;
  state.wrongPool = kept;
  await saveWrongPool(state.wrongPool);
  return true;
}

// Is this recorded answer a miss (wrong OR never answered)? Empty selection
// counts as a miss for pool purposes even though it scores as "skipped".
// Unscorable items are never misses.
function isMissedAnswer(qn, rec){
  const q = QMAP[qn];
  return isScorable(q) && !isCorrectAnswer(q, rec);
}

}
async function setAuthed(){
  try{ await storageBackend.set(AUTH_KEY, '1', false); }catch(e){}
}

// Handle for the exam screen's live-ticking clock. It updates its own DOM node
// on a 1s interval rather than going through the full render() cycle, since a
// full re-render every second would rebuild dropdowns and could disturb
// in-progress selections. Every render() pass clears it first: if the exam
// screen is being (re)drawn, renderExam() starts a fresh one pointed at the
// new node; if we've navigated away, the old node is simply gone.
let examTimerInterval = null;

function render(){
  if(examTimerInterval){ clearInterval(examTimerInterval); examTimerInterval = null; }
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.screen === 'loading'){
    app.appendChild(el('div',{class:'card'},[el('div',{class:'pad empty-note'},['Loading…'])]));
    return;
  }
  if(state.screen === 'gate') return renderGate(app);
  if(state.screen === 'setup') return renderSetup(app);
  if(state.screen === 'exam') return renderExam(app);
  if(state.screen === 'finished') return renderFinished(app);
  if(state.screen === 'review') return renderReview(app);
  if(state.screen === 'history') return renderHistory(app);
}

function renderGate(app){
  const card = el('div',{class:'card'});
  const pad = el('div',{class:'pad'});
  pad.appendChild(el('div',{class:'top-title'},['Microsoft SC-100 · Cybersecurity Architect Expert']));
  pad.appendChild(el('h1',{},['Access Required']));
  pad.appendChild(el('div',{class:'subtitle'},['Enter the access code to continue.']));

  pad.appendChild(el('label',{},['Access code']));

  pad.appendChild(codeInput);

  const errDiv = el('div',{class:'err', style:'display:none;'},['Incorrect code — try again.']);
  pad.appendChild(errDiv);

  const tryEnter = async ()=>{
    if(codeInput.value === ACCESS_CODE){
      await setAuthed();
      state.session = await loadSession();
      state.historyList = await loadHistory();
      state.wrongPool = await loadWrongPool();
      state.screen = 'setup';
      render();
    } else {
      errDiv.style.display = 'block';

    }
  };

  codeInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') tryEnter(); });

  pad.appendChild(el('div',{class:'btn-row'},[
    el('button',{class:'btn btn-primary btn-block', onclick: tryEnter},['Enter'])
  ]));

  card.appendChild(pad);
  app.appendChild(card);
  if(codeInput.focus) codeInput.focus();
}

// The ids of every question in a chosen section and source-number range, in
// document order. `secKey` of 'all' spans the whole bank.
function idsInRange(secKey, start, end, includeUnscored){
  return QUESTIONS.filter(q=>{
    if(secKey !== 'all'){
      if(q.sec !== secKey) return false;
      if(q.num < start || q.num > end) return false;
    }
    return includeUnscored || isScorable(q);
  }).map(q => q.n);
}

    rangeNote.textContent = `${sectionOf(key).label} is numbered 1–${max} in the source PDF, and those are the numbers used here.`;
    const presets = [[`All (1–${max})`, 1, max]];
    for(let a=1; a<=max; a+=50){

        errDiv.textContent = 'Not enough scored questions in: ' +

  app.appendChild(el('div',{class:'card'},[

        el('h2',{style:'margin-bottom:2px;'},['Past results']),
